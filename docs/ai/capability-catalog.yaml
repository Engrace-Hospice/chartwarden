# ChartWarden AI capability catalog.
# Source of truth required by docs/architecture/CHARTWARDEN_AI_GOVERNANCE_v0.2.md section 4.1.
# All entries are disabled until their owning module and governance lifecycle state explicitly advance.
#
# `capability_key` is the join into Module 32's registry: `ai_capability.capability_key`, which
# `ai_kill_switch_state.capability_id` references by foreign key. It replaced a `kill_switch_flag`
# field naming `ai.<x>_kill` strings, because KILLING A CAPABILITY IS NOT A FLAG FLIP. It is an
# `ai_kill_switch_state` row, platform-wide (`organization_id IS NULL`) or per-tenant, and the two
# OR together — neither overrides the other.
#
# There ARE two kill mechanisms in this architecture and only one of them is wired to AI:
# M1 Foundation ships a real `feature_flag` table with a `kill_switch` flag type (its spec even
# gives `ai.copilot_kill` / `ai.doclens_kill` as examples), but no `ai.*_kill` flag has ever been
# seeded, and M32's routing gate does not consult feature flags at all. Flipping an M1 flag would
# stop nothing. Kill a capability through its `ai_kill_switch_state` row.
#
# `capability_key: null` means M32's section 2.4 inventory registers no row for that capability —
# it cannot be killed because it cannot be invoked.

