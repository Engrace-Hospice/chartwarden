# WardenX — Plan→Implement→Validate harness (deterministic module build)
# ---------------------------------------------------------------------------
# Drives an AI coding agent through a WardenX task plan ONE task at a time, gating
# every task on the WardenX fitness suite. The workflow structure controls flow.
#
# ⚠ SCHEMA NOTE: Archon's workflow YAML is young/evolving. This follows the documented
# node grammar (id / prompt / bash / depends_on / loop{prompt,until,fresh_context} /
# interactive). After `archon` install, reconcile keys against the bundled defaults
# (.archon/workflows/defaults/archon-plan-to-pr.yaml, archon-piv-loop.yaml). The
# maintained bundled workflows are a fine alternative — point their plan input at the
# same plan file and set their validate step to the WardenX gate command below.

name: wardenx-piv
description: >
  Execute a WardenX module task plan end-to-end: implement each task in a fresh context,
  validate against the full fitness suite, self-fix on failure, then human-approve a PR.
version: 0.1.0

inputs:
  plan:
    description: Path to the task plan the implement-loop consumes.
    default: docs/plans/M01-M02_VERTICAL_SLICE_PLAN.md

nodes:
  - id: setup
    bash: |
      set -euo pipefail
      git rev-parse --abbrev-ref HEAD
      bun install --frozen-lockfile
      bun run build && bun run arch:fitness && bun run test   # confirm a GREEN baseline first

  - id: confirm-plan
    depends_on: [setup]
    prompt: |
      Read the plan at {{ inputs.plan }} and the spec sections it cites under docs/modules/.
      Identify the NEXT unstarted task, its exact files (manifest codePaths), and its
      acceptance gate(s). Restate the task's scope and STOP if anything is ambiguous.
      Authority: architecture docs + ADRs win over module specs (ADR-0005). The manifest
      (architecture/module-manifest.ts) is the single source of truth for ownedTables,
      dependsOn, and codePaths.

  - id: implement
    depends_on: [confirm-plan]
    loop:
      fresh_context: true
      until: ALL_TASKS_COMPLETE
      prompt: |
        Implement the NEXT unstarted task from {{ inputs.plan }} — that task ONLY, nothing
        beyond its scope. Follow the cited spec section. Hard rules (the gates enforce them):
          • Tables exactly per the manifest ownedTables; schema in packages/db/src/schema.
          • Every PHI table: organization_id (+ provider_entity_id + location_id), RLS keyed
            ONLY on app.org_id, an M4 audit trigger.
          • Cross-module access ONLY via a boot-registered seam or an mN.<resource>.<verb>
            outbox event — never a direct cross-module schema import (no dependsOn edge).
          • PHI routes go through withOrgContext + requirePermission/requireAbac; call audit()
            with the field denylist; register an eraser.
          • packages/foundation is BANNED — use packages/types | shared | tenancy | audit.
        Then run the validate gate and do not mark the task complete unless it is GREEN.

  - id: validate
    depends_on: [implement]
    bash: |
      set -euo pipefail
      bun run build
      bun run arch:fitness
      bun run test

  - id: fix
    depends_on: [validate]
    loop:
      until: GATE_GREEN
      prompt: |
        If `bun run build && bun run arch:fitness && bun run test` is red, fix the ROOT CAUSE
        (never weaken a gate or a fixture) and re-run it. Repeat until green.

  - id: approve
    depends_on: [fix]
    interactive: true
    prompt: |
      Present for human review: the diff, the green gate output, the tasks completed from
      {{ inputs.plan }}, and any deny-stubs/forward-seams left for a later wave. Address
      feedback, then proceed.

  - id: pr
    depends_on: [approve]
    bash: |
      set -euo pipefail
      git push -u origin HEAD
      gh pr create --fill --base "$(git symbolic-ref --short HEAD | sed 's#feat/.*#main#')" || gh pr create --fill
