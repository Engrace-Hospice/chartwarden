# .trivyignore.yaml — time-boxed suppressions for the release image scan (F-040 / #100).
#
# The release job fails on HIGH and CRITICAL findings in the published images. Some findings cannot be
# fixed on our side today — an unpatched base-image package, or a CVE in a transitive dependency with no
# upstream release. Those go here, and ONLY here: `trivy-action` is configured with `exit-code: 1`, so a
# finding not listed in this file fails the release. There is no severity threshold to quietly raise.
#
# EVERY ENTRY MUST CARRY `expired_at` AND `statement`, and `scripts/check-vuln-allowlist.ts`
# (`arch:vuln-allowlist`, in `arch:fitness`) fails the build otherwise. That is the whole design: an
# allowlist without expiry is not a suppression, it is a decision to stop looking. Trivy itself stops
# honouring an entry the day after `expired_at`, so a forgotten entry re-breaks the release rather than
# protecting a vulnerability forever — and the gate refuses an already-expired entry so the file cannot
# accumulate dead rows that read as active suppressions.
#
# `expired_at` is a DATE the finding must be re-examined by, not a guess at when upstream will patch.
# Ninety days is the default ceiling the gate enforces; a longer one needs the gate's constant changed,
# deliberately and in review.
#
# Format (Trivy's own schema — https://trivy.dev/latest/docs/configuration/filtering/):
#
#   vulnerabilities:
#     - id: CVE-2026-12345
#       # optional: paths: ["usr/local/bin/thing"]
#       expired_at: 2026-11-24
#       statement: >
#         What it is, why it cannot be fixed here yet, and what removes it. Name the upstream issue.
#
# The entries below are exceptional and time-boxed. Remove one as soon as its upstream package ships a
# fixed runtime binary.
vulnerabilities:
  - id: CVE-2026-56862
    paths: ["app/node_modules/@esbuild/linux-x64/bin/esbuild"]
    expired_at: 2026-12-31
    statement: >
      The backend image contains esbuild through Better Auth's optional Drizzle Kit peer; esbuild 0.25.12
      is compiled with Go 1.23.12. The current upstream esbuild 0.28.2 binary is still compiled with Go
      1.26.5, below Go's fixed 1.26.6 release. Remove this entry when evanw/esbuild publishes a binary
      built with Go 1.26.6 or newer, and re-examine it by this expiry.
