name: ${INTAKE_COMPOSE_PROJECT:?set an isolated cw-intake-oa-* project}

services:
  postgres:
    command: ["postgres", "-c", "max_locks_per_transaction=1024"]
    ports: !override
      - "127.0.0.1:${INTAKE_POSTGRES_PORT:?}:5432"

  redis:
    ports: !override
      - "127.0.0.1:${INTAKE_REDIS_PORT:?}:6379"

  rustfs:
    ports: !override
      - "127.0.0.1:${INTAKE_OBJECT_PORT:?}:9000"
    environment:
      RUSTFS_CORS_ALLOWED_ORIGINS: http://127.0.0.1:${INTAKE_API_PORT:?}

  api:
    ports: !override
      - "127.0.0.1:${INTAKE_API_PORT:?}:3000"
    environment:
      APP_VERSION: ${INTAKE_STACK_ID:?set a unique cw-intake-oa-* marker}
      OBJECT_STORE_PUBLIC_ENDPOINT: http://127.0.0.1:${INTAKE_OBJECT_PORT:?}
      BETTER_AUTH_URL: http://127.0.0.1:${INTAKE_API_PORT:?}
      TRUSTED_ORIGINS: http://127.0.0.1:${INTAKE_API_PORT:?}
      M35_PSEUDONYM_KEY_KEK: ${M35_PSEUDONYM_KEY_KEK:?set an ephemeral isolated-test KEK}
      DOCUMENT_UPLOAD_SCAN_REQUIRED: "true"
      MESSAGING_ATTACHMENT_SCANNER: clamd
      ALLOW_BUILTIN_ATTACHMENT_SCANNER: ""
  worker:
    ports: !override
      - "127.0.0.1:${INTAKE_WORKER_PORT:?}:3001"
    environment:
      APP_VERSION: ${INTAKE_STACK_ID:?set a unique cw-intake-oa-* marker}
      BETTER_AUTH_URL: http://api:3000
      TRUSTED_ORIGINS: http://127.0.0.1:${INTAKE_API_PORT:?}
      M35_PSEUDONYM_KEY_KEK: ${M35_PSEUDONYM_KEY_KEK:?set an ephemeral isolated-test KEK}
      DOCUMENT_UPLOAD_SCAN_REQUIRED: "true"
      MESSAGING_ATTACHMENT_SCANNER: clamd
      ALLOW_BUILTIN_ATTACHMENT_SCANNER: ""
