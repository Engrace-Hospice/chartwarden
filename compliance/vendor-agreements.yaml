# Vendor-agreement register (CW-BA-01). Checked by `bun run arch:vendor-agreements`
# (scripts/check-vendor-agreements.ts; the rules and what the gate cannot prove are in its header).
#
# METADATA ONLY: vendor, scope, status, dates and an opaque reference to where the owner keeps the signed
# document. Never contract text, a signature, a person's name or an email, URL or phone number.
#
# phi:       receives = the vendor stores or processes PHI. adjacent = no PHI by rule (the code keeps it out of
#            the payload) but metadata or delivery state passes through, and a BAA is kept as defence in depth.
#            none = no PHI; the scope says why.
# status:    pending = no executed agreement is recorded. signed = the owner has confirmed an executed agreement
#            (needs signedOn, documentRef, confirmedBy as a ROLE, confirmedOn; the gate refuses it without them).
#            tenant-held = the agreement is the tenant's own, recorded per tenant in the database and tracked by
#            the control named in trackedBy. not-required = phi none.
# inventory: the numbers of the CHARTWARDEN_INTEGRATIONS_v0_1.md section 2 rows the row covers. The gate fails
#            when a section 2 integration that needs a BAA is claimed by no row.
# evidence:  repo files that show where the PHI flow or the hosting is declared (the reviewer's trail).
#
# An agent never sets `signed`: a person confirms the executed agreement, then flips the row.
# A signed row is judged as valid, not only as filed (CW-AC-14, CW-AC-17):
#   effectiveOn  required; the day the agreement took effect; not in the future.
#   expiresOn    optional; the last day it is in force. The gate warns within 90 days of it and FAILS the day after
#                (an ended agreement is not a signed one); absent = open-ended, the review date is its only clock.
#   covers       what the executed agreement covers (phi, zero-data-retention); must include `phi` for a vendor that
#                receives PHI and everything the row's `requires` names. Never set by an agent.
# A row that is not signed carries none of these: a pending row must not look signed.
owner: privacy-officer
review_by: 2027-01-31
