    title: >-
      M24 prices a hospice routine home care claim line only from stored, source-backed evidence, and keeps what it priced. Payer rate
      rows (migrations 1539 and 1550) and the patient's billing evidence (1551, 1552) are append-only and corrected only by a later row
      of the same identity, and a verified rate row must carry a complete methodology (1550). A priced claim line carries an
      append-only pricing snapshot. The snapshot insert guard (1551) refuses a rate or evidence row that is not verified, that has a
      successor, that does not match the line's payer, program, state, locality or category, or that disagrees with the snapshot on the
      quality-reporting variant or the rate methodology, and it refuses an assessment time that differs from the one inside the snapshot
      or lies more than five minutes ahead of the database clock. A missing or ambiguous rate, an unresolved election day, a pending evidence correction or a service window over
      366 days is refused with a code and nothing is priced. Assembly, manual validation and the nightly revalidation derive the price
      again from current scoped facts and refuse a claim whose stored snapshot no longer matches them. Every other service category
      stays unpriced on a claim line (a narrow home continuous care hour is only ever a local, append-only preparation, 1557). A routine home care day lived in a facility is priced only for an assisted-living facility (billing code Q5002,
      snapshot version 2): the planner and the snapshot trigger (1554) require the patient's effective M5 residence and an active,
      unmerged M40 assisted-living facility, which M40's SECURITY DEFINER read function (1553) returns under a row lock without giving
      the application role any write capability on canonical rows. Any other facility kind is refused.
