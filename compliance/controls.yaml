      reason: Vendor facts are unverified until a DoseSpot sandbox run (the token endpoint, the clinician-add field names, whether the Subscription-Key is per clinic, DoseSpot's dedupe of a clinician by NPI, the production host), so the connection test proves the credential was accepted and nothing about the payload shapes. A vendor rejection of a rotated key at runtime still fails the order permanently (no hold-and-alert guard like the clearinghouse's). EPCS stays deferred (ADR-0019), so controlled-substance e-prescribing is not live. A crash between the vendor clinician create and its record, or a registration move while the call runs (the id is then dropped, 409 DOSESPOT_REGISTRATION_MOVED), can leave an orphan clinician at DoseSpot, and a prescription created under the old clinic and never sent stays there as an unsent draft. A move A to B to A inside one vendor round trip reads as unchanged (harmless for the ids the trip itself writes, which are valid under A; a transmit payload whose vendor ids were read under B in an A to B to A sequence with a re-enrolment between, all inside the milliseconds between the payload and the stamp, would also read as unchanged and be refused by DoseSpot). Whether DoseSpot dedupes an idempotency key across clinics is unverified; a waiting transmission gets a fresh key at a move either way, a begun call's worker replaces its key when it sees the move (a held call keeps it), and the patient upsert's key is scoped to the clinic. The shape of that key changed, so a patient upsert that DoseSpot accepted but whose answer was lost, and that is retried across that deploy, will not dedupe against its earlier attempt, so one duplicate DoseSpot chart is possible, once. A tenant served by an entry in DOSESPOT_TENANT_CONFIGS (no registration row) is always the clinic "env" to these checks, so an operator's edit of that entry's clinic in the deployment's own configuration is invisible to every one of them, and the key's digest is the same for any such clinic (operator-controlled, not triggerable by a tenant). A registration change that took its lock and is stuck makes a guarded write give up after five seconds and treat the registration as moved, so the settle drops an old id that the change may never have invalidated and an unsent draft can remain at DoseSpot.
