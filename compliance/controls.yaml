    title: >-
      Platform operators enter a tenant's onboarding data (provider entity and EIN, locations, MAC and state Medicaid credentials, the tenant's clearinghouse choice (tenant_clearinghouse.write_platform), and its connection verification (the same key; a connection test for Claim.MD, an attestation with an evidence note for Stedi, which has no safe probe); not its activation, which only the tenant's own billing administrator performs (CW-AC-17: the platform lane has no activate route and the service refuses it with 403 CLEARINGHOUSE_ACTIVATION_TENANT_ONLY)) only inside that tenant's own row-level-security scope (the NOBYPASSRLS app pool under the target organization's app.org_id, never a bypass write), behind a platform-ops role, the tenant_onboarding_data.write_platform key, a fresh step-up, a human (non-AI) actor, an Idempotency-Key and a recorded reason that is screened for SSN- and MBI-shaped identifiers only (422 EVIDENCE_LOOKS_LIKE_PHI; a name or a date of birth is not recognized); only while the tenant is provisioning or onboarding (409 TENANT_NOT_ONBOARDING once active; the status is checked under the shared onboarding advisory lock, so a go-live approval cannot overtake the check), with five named exceptions: the operator's clearinghouse switch out of `outside` that names a billing service mode (the one write on the clearinghouse PUT route accepted outside onboarding; it needs the pricing key subscription.onboard_platform as well, and it is accepted only in an explicit allowlist of statuses, provisioning, onboarding, active, at_risk and suspended, so a tenant that is offboarding, has its final export pending, is retained, is being destroyed, is destroyed or has only a sign-up intent is refused with 409; the status is read before the billing mode is written, where the refusal is audited as a write_refused row in its own short transaction and fails closed (a refusal that cannot be audited is 503 ONBOARDING_AUDIT_UNAVAILABLE, with the cause logged and nothing changed), and judged again under the lock, where the refusal is audited in the write's own transaction), the vendor-BAA verification, the withdrawal of a tenant's external-filing record and the release of the clearinghouse credentials a tenant still holds (`anyTenantStatus: true` in the service; refused while the tenant's vendor responses may still arrive; CW-AC-17), which a live tenant needs and which are not status-gated (each still takes the lock and leaves its audit row), and the operator's upload of the tenant's signed BAA (CW-AC-22), accepted in its own explicit allowlist of statuses (BAA_DOCUMENT_UPLOAD_STATUSES: provisioning, onboarding, active, at_risk and suspended) so a live tenant's renewed agreement is filed, under the same lock, with the refusal of any other status audited in the write's own transaction; every successful write, and every refusal because the tenant is no longer onboarding, leaves an audit row naming the operator, the target organization and the reason in the same transaction as the check or write (the one exception is the switch's early refusal above, audited in its own short transaction), and the same transaction revokes a pending go-live attestation that the write makes stale; a failed write (404, 409, 422, 5xx) rolls back and is audited afterwards as a denied write_failed row in a separate best-effort transaction whose failure is logged, except that a failure of the COMMIT itself with no definite answer from the database (a lost connection, or a connection-class or server-error SQLSTATE) may have landed: that row carries commitOutcomeUnknown: true, says the outcome is unknown rather than rolled back, and can sit beside the write's success row; every read is audited in its own transaction after the data is read and is withheld (the request fails) if that audit row cannot be written, and the reads under tenant_onboarding_data.read_platform include the tenant's active staff for assigning its compliance officer (membership id, display name, email and the role keys held, nothing more; capped at 500) but NOT the notices the tenant recorded as filed outside ChartWarden: that list is a PHI path (a notice id with its window and filing dates identifies a patient's record, 45 CFR 164.514(b)(2)), so it takes the notice-filing key tenant_notice_filing.withdraw_platform (the key family's only key, so whoever may withdraw a record may see the list it is withdrawn from) and no longer the generic onboarding read key, its audit row records the number of NOEs and NOTRs shown and never which records, and it shows notice kind and id, its state and dates, no patient, admission or control number, capped at 200; the EIN and credential secrets are sealed and never returned; after a write commits the onboarding advance runs best effort (a failure is warned with the error redacted); the advance pass itself does nothing for a tenant past provisioning and onboarding (it reads the status in its own transaction under the shared onboarding advisory lock, taken before the read, so a go-live approval, which holds the exclusive lock, cannot commit between that read and the pass's writes; every caller runs the pass after its own write has committed, and every caller, the BAA register's create and update included, goes through it), so a live tenant's write, such as a BAA renewal, settles no step and emits no onboarding event such as m34.tenant.onboarding_overdue. The same platform lane registers and connection-tests the tenant's DoseSpot clinic under tenant_dosespot.write_platform, but cannot activate it; activation is tenant-admin-only and is refused with 403 DOSESPOT_ACTIVATION_TENANT_ONLY (CW-AC-21).
