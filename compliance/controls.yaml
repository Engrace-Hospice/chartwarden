    gap:
      reason: The passkey requirement is policy that the server enforces only when CHARTWARDEN_MFA_ENFORCEMENT=true (opt-in today, see mfa-policy.ts), so with it off a superadmin can hold the role with a password alone. It was found on in production on 2026-11-25 and verified in the running api container, with the passkey RP id moved to chartwarden.cloud so one passkey works on the web app and the console (audit/wardenlens-v3-2/PRIVILEGED_FACTOR_DEPLOYMENT.md; the browser checks are operator-reported, for the platform account only), and the example env sets it, but it stays opt-in in code, so a deployment that omits it enforces nothing. Production has no superadmin holder yet, so a superadmin's passkey sign-in and passkey-protected support-session start are not yet proven. ADR-0112 was accepted by the owner on 2026-11-25, but no holder is named and none exists in production. Do not grant it in production before the holders are named and the grant is ticketed (OPS_RUNBOOK section 16.5). Detection depends on CW-MON-01, which is a gap, so granting or using superadmin raises no alert today, and the grant is a database-owner CLI call attributed only to a change-ticket string. Isolation is asserted live on tenant-scoped rows (role catalog, memberships) as chartwarden_app; the M34 WardenLens read adapter is proven live against the consented support session (actor binding, scope, expiry, revocation, ledger and critical audit; CW-AC-40), but the exact human-superadmin role gate sits in the route and is covered only by unit tests, no test drives a superadmin against break-glass (CW-AC-03 is unchanged and carries that proof) and patient-table isolation was checked by hand. Also unverified, so not claimed - how the background fan-outs that enumerate active organizations behave for the platform org, which has no tenant_account or key ring.
