  - id: CW-PI-05
    title: >-
      The facts behind a Medicare hospice Service Intensity Add-on (SIA) are recorded by a person, never invented, and the claim's SIA figure keeps a history. How a visit was delivered (in person, telephonic or video) and its documented start and end are written at sign by the signing clinician, or by the M18 EVV bracket, which wins whenever M18 answers at sign and no EVV state is already stored on the encounter. A delivery mode is never defaulted to in person (a Medicare-countable discipline cannot be signed without one, 422 MODALITY_CONFIRMATION_REQUIRED; a value seeded from the M17 visit setting is stored only as an unconfirmed hint and is never counted until the clinician confirms it). A typed time is stored only when no EVV bracket exists (an explicit UTC offset, ordered, at most 8 hours, not in the future, starting on the service date and ending on it or the next day; 422 VISIT_TIME_INVALID), is refused while the M18 lookup is unreachable (503 EVV_BRACKET_UNAVAILABLE, so it cannot stand in for a bracket M18 holds at sign) and is refused when an in-person or video bracket overlaps another the same author documented (422 VISIT_TIME_OVERLAP; one author's typed signs are serialised on an advisory lock, so two racing in the same instant cannot both pass); its source is stored in time_source and carried into every SIA revision. A visit signed before this existed stays unconfirmed (NULL) until its own author confirms it once through POST /encounters/:id/visit-modality (409 MODALITY_ALREADY_CONFIRMED afterwards, the guard repeated in the UPDATE). Against a write through the application the database then holds the line: after sign a single UPDATE cannot change the documented times, their source or a confirmed delivery mode (trg_encounter_delivery_freeze, M8_ENCOUNTER_DELIVERY_FROZEN), and CHECK constraints keep the confirmation columns and time_source coherent, so an application write cannot flip a confirmed telephonic visit to in person to unlock the add-on. Claim validation compares both ways: sia_calculation_correct fails a claim whose visit lines carry more SIA units than the engine counts from confirmed in-person RN and MSW visits in the last 7 days of life, as well as one that omits units it counts. The SIA calculation is append-only and revisioned (UNIQUE claim_id + revision, appended under the claim row lock and only when the evaluation moved, an explicit zero revision when a promised add-on no longer applies); trg_sia_calculation_insert_guard accepts a revision only as the next one and only while the claim is DRAFT, VALIDATING or READY, so the add-on a claim was billed with cannot be superseded later (a validation that loses the race to a submit gets 409 CLAIM_SIA_IMMUTABLE, decided under the claim row lock), and UPDATE is always refused. The sign UPDATE carries the signer as the audit actor and the sia_calculation write-audit function (1511) scrubs visit_outcomes, and the sign ceremony asks for the attestation and the delivery choice afresh every time it opens.
    hipaa: ["164.312(c)(1)", "164.312(b)"]
    soc2: ["PI1.2", "PI1.3"]
    status: partial
