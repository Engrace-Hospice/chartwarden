  - id: CW-AC-36
    title: >-
      A failed request frees its Idempotency-Key for a retry only when it provably wrote nothing, and a duplicate of a request that is still running, or that never finished, is told so by its own code. A mutating request that carries the header and has an organization claims (organization, key) atomically in the Postgres idempotency_key table before its handler runs (a different body under the key is 409 IDEMPOTENCY_CONFLICT; a completed response is replayed; a route marked noIdempotencyCapture takes no claim). A 5xx, the deadlock/serialization 409 CONCURRENT_UPDATE, M10's lock-wait 409 M10_RECORD_BUSY, M8's state-dependent 409 NOTE_CLOSURE_SUBJECT_NOT_BLOCKED or a 401/403 refusal (the claim is made before the route's own guards, so a refusal that a later step-up or grant would reverse must not be replayed to a same-key retry) RELEASES the claim only if the per-request commit tracker proves that nothing committed after the claim, and is otherwise cached and replayed like any other response. The tracker is fed by every query of the one pool builder, createDbClient (a test fails if a runtime source builds another pg Pool or Client), and counts a COMMIT of a transaction that ran a write, an autocommit write, a write transaction still open (its first write counts until its COMMIT or ROLLBACK) and a COMMIT or autocommit write the server has not answered yet; a server error with a 5-character SQLSTATE and severity ERROR (other than classes 08, 58 and XX) clears that count, a lost connection or a FATAL leaves it counted. It lexes the statement text (a string literal, a quoted identifier and a line comment are each one opaque token) and treats as a write any text with a block comment, any text with both a semicolon and a line comment, any text it cannot lex cleanly, any compound text with a statement that is not a SET/SHOW-style statement or a read, any SELECT, WITH, VALUES, TABLE or EXPLAIN that carries DML or calls anything but a short allowlist of read-only builtins (a user-defined function counts as a write, readers included), EXPLAIN ANALYZE of anything but a plain SELECT-style statement, DECLARE and FETCH. When the request's tracker is not the ambient one at the claim or at onSend, a retryable failure is cached (and a warning is logged with the key and no payload). A duplicate whose first request is still pending gets 409 IDEMPOTENCY_IN_FLIGHT (keep the key and retry), and once that claim has been pending for more than 15 minutes (the database's clock, from created_at) 409 IDEMPOTENCY_KEY_STUCK (the first request's outcome is unknown: do not retry with the key, read the resource); the stuck row is never reclaimed, released or re-run, and a row whose release or completion failed stays pending until its 24-hour expiry. In the browser, the one shared API client gives every keyless POST, PUT, PATCH and DELETE a key per method, URL, If-Match and bounded JSON-body intent; the shared attempt-key keeper covers routes whose contract requires the caller to name the header, retains only a salted opaque digest of a caller fingerprint, never evicts an active request, and keeps a key across no answer, a gateway page and IDEMPOTENCY_IN_FLIGHT while renewing it after every final answer including IDEMPOTENCY_KEY_STUCK. Held client keys have a 15-minute unanswered idle limit, a one-hour hard cap and a 64-idle-intent bound, and are cleared where web, admin and portal decide the session ended. A validate, refresh, probe or regenerate action that deliberately means run against current state sends a fresh key per click and has a pinning test. The residuals are stated, not hidden: the lost-context check holds only at those two checkpoints and does not see a context lost inside a handler; a route that answers a 5xx while its handler keeps running and has not yet issued its first write can be released and still commit; a route that hijacks its reply (the M33 CSV exports) never completes its claim, so its duplicates are IN_FLIGHT and then STUCK; an effect outside Postgres (an outbound call, a queue or object-store write made directly in a route) is not counted; a non-JSON, oversized or too-slow-to-read browser request body receives a fresh key on each call; a deliberate fresh-per-run action gives up lost-reply replay safety because rerunning is its purpose; and the client temporarily recognizes the older server's exact in-flight message until that server compatibility window closes
    hipaa: ["164.312(c)(1)"]
    soc2: ["PI1.3", "PI1.4"]
    status: partial
    evidence:
      - script: test:gap007:idempotency-claim:live
      - script: test:f073:idempotency-bodiless:live
      - script: test:m36:idempotent-send:live
      - ci: "Unit + integration suite (bun run test)"
      - file: packages/db/src/commit-tracker.ts
      - file: apps/backend/src/bootstrap/plugins/idempotency.ts
      - file: apps/backend/src/bootstrap/plugins/idempotency-store-db.ts
      - file: packages/shared/src/idempotency/idempotency.ts
      - file: packages/db/__tests__/commit-tracker.test.ts
      - file: apps/backend/__tests__/idempotency-commit-tracker.test.ts
      - file: apps/backend/__tests__/idempotency-release.test.ts
      - file: apps/backend/__tests__/idempotency-in-flight.test.ts
      - file: apps/backend/__tests__/idempotency-real-socket.test.ts
      - file: packages/ui/src/core/api/idempotency-middleware.ts
      - file: packages/ui/src/core/ops-write/idempotency-key.ts
      - file: packages/ui/src/core/ops-write/use-attempt-key.ts
      - file: apps/web/src/main.tsx
      - file: apps/admin/src/shell/session.tsx
      - file: apps/portal/src/session-guard.ts
      - file: packages/ui/src/core/api/__tests__/idempotency-middleware.test.ts
      - file: packages/ui/src/core/ops-write/__tests__/use-attempt-key.test.ts
      - file: scripts/__tests__/attempt-key-guard.test.ts
      - file: scripts/__tests__/idempotency-in-flight-contract.test.ts
      - file: apps/web/src/modules/24-billing-medicaid/fresh-key-actions.dom.test.tsx
      - file: apps/web/src/modules/33-reporting/fresh-key-actions.dom.test.tsx
    gap:
      reason: The release rule cannot prove what it cannot see. The lost-context check runs only at the claim and at onSend, so a context lost inside a handler leaves a later write unattributed; a route that answers a 5xx while its handler keeps running (a Promise.race deadline or timeout wrapper) and has not yet written can be released and still commit afterwards (the routes in apps/backend/src that answer before their work ends were reviewed on 2026-11-09 and each writes its ledger or in-doubt row, which is tracked, before it answers, or only abandons an outbound call or a read); and an outbound call, a queue write or an object-store write made directly in a route is not counted (the platform's convention puts those behind the outbox, after the commit). The browser cannot stably fingerprint non-JSON, oversized or too-slow-to-read bodies, and deliberately fresh-per-run actions trade replay safety for a current-state rerun; both receive fresh keys. During the server deployment window the client also recognizes the legacy exact in-flight message. A new route that answers early or hijacks its reply, and a new client write whose body is not bounded JSON or whose action is classified fresh-per-run, must be reviewed against this row. A cached 2xx is replayed before the route's guards run, so a same-user, same-key retry within 24 hours gets the earlier response even after a permission or caseload revocation (the fingerprint binds organization, user and actor kind; the plugin documents it and it is unchanged).
      owner: engineering
      review_by: 2027-03-31

  - id: CW-AC-37
    title: >-
      Operator and tenant free text that is STORED (on a row a tenant can read, in the audit trail or in a job receipt) is screened for an SSN- or MBI-shaped value before the service runs: a 422 EVIDENCE_LOOKS_LIKE_PHI that names the field and never echoes the value (names use a name-specific refusal text). Screened in M34, platform: the tenant status-transition, offboard and shred reasons, the feature-flag rationale and every string and object key of the flag value (a value nested deeper than 8 levels, with more than 500 strings or more than 20,000 characters is refused with 422 VALIDATION_FAILED, not left partly unscreened), the signup-intent rejection reason, the oversized-export approval reason, the onboarding-template title and description, the provision legal business name and first-admin name, the qualify first-admin name, the onboarding-data reason, and the wizard's text and the org profile display name (CW-AC-15); in M34, tenant: the support-consent grant and revocation reasons, the tenant-export justification, the DSAR requestor identity-verification evidence and the DSAR denial narrative; the public self-serve signup legal business name; in M35: the refund detail and refund-denial reason, the claims-billing add-on grant reason and the plan name and description; in M23: the NPI-verification evidence; in M12: the administrator's held-transmission resolution reason, before its transaction stores it on the transmission row; and in M10: the late-deadline override justification (`adminOverrideJustification`), at the route guard and again at the service, before it is kept on the critical, immutable `hope.late_deadline_override` audit event; the two operator-typed submission references, the result report reference (`reportReference`) and the mark-uploaded iQIES reference (`iqiesSubmissionReference`), which the request schema restricts to letters, digits and the characters `. _ : # / -` and spaces after a non-space first character (1 to 128 characters); and the operator-typed fields of a CMS result row. The `code`, `itemCode` and `iqiesRecordId` tokens are one word (letters, digits and `. _ : # -`, no space and no slash, at most 64 characters, empty allowed); `severity` is a closed set (fatal, error or warning, in any case), so it cannot carry free text; the `status`, `result` and `outcome` phrases take the reference character set plus commas, semicolons and parentheses and reach only the scrubbed raw-result columns. Each reference and token takes its character set and then this identifier screen, in the route and again in the service (`assertSubmissionReferenceIsClean` and `assertResultRowsAreClean` in hope-reference-screen.ts: 422 EVIDENCE_LOOKS_LIKE_PHI, the field name built from a fixed key list and the row index, a static text, never the value). The three one-word tokens are also refused when they hold a calendar date (YYYY-MM-DD, DD.MM.YYYY or MM-DD-YYYY, years 1800 to 2099) or a US phone number (3-3-4 digits) set apart by any of `- . _ : #`, mixed allowed, and a uuid `iqiesRecordId` is exempt from the identifier screen. An `assessmentId` is limited to the characters of a uuid (hex digits, hyphens, braces and whitespace, `HOPE_RESULT_ASSESSMENT_ID_PATTERN`) and is stored trimmed; one that is not a uuid is still screened for SSN and MBI shapes, and the read API never returns a non-uuid id. A result-row `message` (up to 1000 characters) is screened for SSN and MBI shapes too, and a control character or a lone surrogate in either field is refused with 422 INVALID_CHARACTERS (it used to surface as a 500); the message is also scrubbed from audit images (CW-AU-01). A non-uuid `assessmentId` is screened for SSN and MBI shapes and, like a code, for a calendar date or a US phone number set apart by hyphens, blanks (a space, a no-break space), braces or any run of them (for example "1990 05 17", "555 867 5309", "{555}{867}{5309}" or "555 - 867 - 5309"), with 422 EVIDENCE_LOOKS_LIKE_PHI on the field `results.<row>.assessmentId`; only the shape test sees the normalised string, the stored value is unchanged, and compact digit forms stay a residual. A result import has a text budget of at most 2000 rows and 100,000 UTF-16 units of text the screen reads in all (each `message` and each non-uuid `assessmentId`; a canonical uuid is free), else a static 422 VALIDATION_FAILED with code TOO_LARGE, checked before any screen runs, so real capacity is about 660 rows at 150-character messages and about 330 at 300 (hope-result-report-limits.test.ts proves the screen is not invoked). The route takes a body of at most 3 MiB (a 413 in the standard error envelope, before parsing) and its request parser reads only the first schema error. The shared identifier screen (`normalise` in packages/shared/src/text/patient-identifier.ts) drops combining marks and format characters before the NFKD as well as after it, because NFKD reorders a run of combining marks quadratically and that stalled the shared event loop for seconds (a 100-row report of stacked marks about 1.9 s a request, one 20,000-character string about 2.6 s, now milliseconds); M10, M23, M34, M35 and DoseSpot all use the screen. For every well-formed string the result is identical to dropping only after the NFKD, as patient-identifier.test.ts pins against an inline copy of the previous function. It is not identical for an ill-formed string, since a lone high and a lone low surrogate with only marks or format characters between them are joined before the NFKD, so the pair is decomposed as the character it spells, as if typed whole; that is accepted because keeping the marks between the halves would bring the stall back, and M10 refuses lone surrogates before the screen. A known limit outside this change and untouched by it: the same normalise-before-bound pattern exists in M23 billing (apps/backend/src/modules/23-billing-medicare/routes/mac-credential-body.ts and tenant-clearinghouse/screening.ts) and in packages/billing/src/dde/notes.ts, so a billing administrator holding a second factor could send a long mark-stacked string to the MAC-credentials route and stall the event loop. The service rebuilds each row from the schema's keys only, refuses an unknown key, a non-object row or a non-string value with a static 422, and stores only the rebuilt row (the in-memory twin applies the same screens); a blank `code` or `itemCode` is stored as NULL, not an empty string, which used to collide in the unique import index and silently drop a second row. Residuals: a single-word surname or hyphenated name fits the `code`, `itemCode` and `iqiesRecordId` character set, and so do a date written as eight digits (YYYYMMDD, MMDDYYYY), a month-name date (12-Mar-1945) and ten unbroken digits. `code` and `itemCode` are copied unscrubbed into the append-only audit images of `hope_submission_result_event` (`cms_edit_code`, `item_code`) and into the `m10.hope.submission_rejected` outbox payload (`findings[].ruleId`), and `iqiesRecordId` into those of `hope_submission_item` and `hope_assessment` (`iqies_record_id`), so a name that fits the one-word rule stays in the audit trail and the outbox for their retention, with no eraser. Open human decisions: the CMS edit-code and record-id formats, and the closed severity set (fatal, error, warning; a row with `Info` or `Informational` makes an import 422), are unverified against real iQIES output and need confirming against a CMS sample. The override justification measures its 20-character minimum after collapsing each run of Unicode White_Space to one space (so runs of non-breaking spaces or U+2028 and U+2029 cannot pad it), and the route guard REJECTS, never strips, control and format characters and lone surrogates with 422 INVALID_CHARACTERS (Hangul fillers and the Braille blank still pass, a residual). A documented residual (the owner chose to restore the justification text with the SSN and MBI screen): the override justification is free text screened for SSN and MBI shapes only (a name or free narrative passes), and it stays in the immutable trail for the organization's audit retention with no eraser (the override modal tells the admin not to enter patient identifiers). The web client repeats the justification and reference rules only as a UX layer (hope-override-justification.ts and hope-report-reference.ts, copies of the server's rules; hope-mirror-parity.test.ts fails when a copy and the server rule diverge); the server is the control. The audit scrubs of the reference columns are prospective only, so earlier immutable audit rows keep any reference value (CW-AU-01). The request-body parser no longer echoes a client-chosen property name in a 422 (a static "(unexpected property)"). Related M10 inputs are closed or bounded instead of screened: the schedule skip reason is a closed code list (CW-AC-02), a refused coded answer is no longer echoed into the 24-hour idempotency cache, and a string answer is length-bounded (64 characters). The screen reads the text NFKD-folded with combining marks and format characters dropped and each run of horizontal whitespace collapsed to one separator, judges characters of the other-number class (superscripts, subscripts, circled digits) both as the digits they fold to and as separators, and refuses nine digits as 3-2-4 groups, as 3-3-3 groups standing alone (only one separator that is not a line break continues a chain of groups), or as nine single digits, with up to ten characters that are neither letters nor numbers between groups, and any MBI-shaped window. It is a best-effort guard against an accident, not a defence against someone hiding a value; its known gaps (an unbroken run of ten to twelve digits, digits written as words, CJK numerals or enclosed forms, other groupings or encodings, more than ten non-whitespace separators, a 3-3-3 value with one separator and another number on either side, lookalike letters) are listed in packages/shared/src/text/patient-identifier.ts. NOT screened: fields the service accepts and discards (the DEK-rotation reason, the support-session close note, the DSAR extension reason), because refusing them would block an action for text nothing keeps and a change that starts storing one must screen it; the invitation-accept display name (the invitee's own name); the structured business data in the onboarding-data bodies owned by M2 and M23 (legal name, DBA, addresses, phone, NPI, CCN, tax id, MAC credential identifiers and secret), where digits are legitimate; catalogue codes, slugs, keys, ids and email addresses
    hipaa: ["164.312(b)", "164.502(b)"]
    soc2: ["CC6.1", "C1.1"]
    status: implemented
    evidence:
      - script: test
      - ci: "Unit + integration suite (bun run test)"
      - file: packages/shared/src/text/patient-identifier.ts
      - file: packages/shared/__tests__/patient-identifier.test.ts
      - file: apps/backend/src/modules/34-saas-tenant-platform/routes/free-text.ts
      - file: apps/backend/__tests__/operator-free-text-fields-phi-screen.test.ts
      - file: apps/backend/__tests__/operator-free-text-phi-screen.test.ts
