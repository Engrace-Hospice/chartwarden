  - id: CW-AC-17
    title: >-
      A tenant's clearinghouse credential is sealed per tenant (AES-256-GCM under a per-organization key derived from the custodied KEK, the envelope bound to its organization, vendor and mode) and never returned. A tenant-held Stedi or Claim.MD configuration goes live only when all of these hold: the tenant has recorded the vendor BAA (holder, date, document reference; by the tenant's own lane only, the service refuses the platform lane with 403 CLEARINGHOUSE_BAA_TENANT_ONLY); a platform operator has verified it (tenant_clearinghouse.verify_baa_platform, a fresh step-up, a human (non-AI) actor, If-Match pinned to the BAA record the operator read, an audit row; by the platform lane only, the service refuses the tenant lane with 403 FORBIDDEN); the connection has been checked (a connection test for Claim.MD, an attestation for Stedi, which has no safe probe, so for Stedi this is one administrator's own attestation with an evidence note, not a vendor-side proof); and the tenant billing admin activates it with a fresh step-up. The order of the first three is not enforced: activation needs only a verified connection and a verified BAA. Activation is the tenant's alone (the platform lane has no activate route, and the service refuses an activation by the platform lane with 403 CLEARINGHOUSE_ACTIVATION_TENANT_ONLY). A database CHECK ties a live configuration to a BAA recorded for its own vendor; a credential, vendor or mode change returns the configuration to draft at once until a fresh connection check re-verifies it and the tenant re-activates it, and its claims, NOE, NOTR and transfer notices are held meanwhile (CW-AC-24); re-recording a changed BAA (a document-reference typo fix included) voids its verification and takes a live configuration to verified, held the same way until an operator re-verifies the record and the tenant re-activates it; a rejected credential holds only that tenant's work. Vendor and mode cannot be changed while any production attempt is in flight (reserved) or was sent in the last 90 days (409 CLEARINGHOUSE_VENDOR_LOCKED; test-mode, released and voided attempts do not lock), so a tenant that sends continuously stays locked for as long as it does, with one exception: while a platform operator has revoked the configuration's vendor BAA, the tenant's own lane (never the operator's) may change vendor or mode or switch to outside although production traffic is recent, and the tenant's own audit row records that the lock was set aside. The exception is granted on a positive tenant lane (every actor's lane is a required value, never a default) and is not one-shot: once the tenant has left the revoked vendor (a vendor change or outside) the lock counts only production attempts reserved after the departure (attempt rows carry no vendor, so the departure time is the cut), so the vendor it left does not lock the next one for 90 days while the new configuration's own traffic locks as before; the credential release still counts the whole window. The operator's choice write stays onboarding-only and gets no such exception, so no operator can move a live tenant to another vendor. When a vendor ends the BAA, a platform operator revokes the recorded BAA (POST /api/v1/platform/tenants/:orgSlug/clearinghouse/baa/revoke: tenant_clearinghouse.revoke_baa_platform, a fresh step-up, a human (non-AI) actor, an Idempotency-Key, If-Match pinned to the BAA record the operator read, a closed reason code (vendor_terminated, account_closed, baa_expired or other) and a ticket reference of a fixed pattern, with no free text anywhere; not limited to an onboarding tenant; at most 10 revokes per operator across tenants and 20 in all per ten minutes, failing open when the limiter's store is down; the service refuses the tenant lane with 403 FORBIDDEN). In one transaction under the tenant's own RLS scope it writes the BAA and status columns only (never the credential, so the revoke does not depend on the KEK or the credential reservation; a row sealed before migration 1434 loses its credential with the BAA), records who, the code and the ticket, voids the BAA verification, takes a live configuration to verified, writes its audit row (m34.tenant_onboarding.clearinghouse_baa_revoked) and publishes the outbox event m23.tenant_clearinghouse.baa_revoked; if either the audit row or the event cannot be written, nothing is revoked. M23's consumer of that event raises an alert to the tenant's billing manager, compliance officer and org administrators and a platform-ops notice on every revoke (ids, the closed code and counts of attempts in flight, attempts sent in the response window and queued work; never the ticket or any text), and the claims gate then answers 402 clearinghouse_baa_revoked. The tenant's claims, NOE, NOTR and transfer notices are held (CW-AC-24): no new job or tick starts after the commit, an M41 commercial drain re-checks the binding before each row and stops at the next, and an M23 claim or notice job already past its pre-flight finishes (at most one per worker slot per queue), so nothing is sent after the commit except what was already running. While the revocation stands the BAA cannot be verified again and the configuration cannot be activated (409 CLEARINGHOUSE_BAA_REVOKED), and the tenant clears it by recording a new BAA, which starts again at unverified (re-recording the identical document counts: the operator's verification, not the document, is the gate), or by leaving the vendor (a vendor change or outside voids the record and the revocation together; a same-vendor mode change keeps it). The history of the last revocation (when, and the document) survives either and is shown to the platform lane only, never the tenant: the operator's verification of a record whose document matches it is refused (409 CLEARINGHOUSE_BAA_PREVIOUSLY_REVOKED) unless the request carries an explicit acknowledgement, and the audit row then records the supersession. Database CHECKs keep a revoked record from holding a verification and fix the reason to the closed set and the ticket to its pattern, and a guard trigger (migration 1468, the 1437 pattern) refuses any change to the revocation columns outside a transaction carrying a setting only the configuration store sets; the database does not otherwise enforce who may revoke or clear (the service and the routes do), and a session that can run arbitrary SQL as the application role can set that setting. A revoke is not an expiry: a BAA verification is otherwise still a point in time, nothing ends a BAA by itself, and no vendor-side signal reaches ChartWarden, so an operator revokes only when told. While revoked, the configuration is not active, so its acknowledgment (M23 999 and 277CA) and 835 (M25) pulls are skipped like any non-active configuration's: in-flight acknowledgments and remittances stay with the vendor and are not pulled, and are not pulled after the tenant leaves that vendor either. Both pulls raise a once-a-day alert per organization while production attempts are in flight or were sent in the response window (the attempt set the lock uses, a proxy: M23 records no per-claim adjudication state), and M41 commercial submissions stay queued and raise their own alert. The BAA verification, the BAA revocation and the credential release are their own permission keys, but one platform_ops role holds every platform clearinghouse key: the separation is of keys, not of roles, and no second approver is required for a revoke. The free text a clearinghouse record carries (a BAA document reference, an attestation's evidence note) is screened for SSN- and MBI-shaped identifiers only and can still hold a name or a date of birth. A BAA revocation carries no free text: its closed reason code is shown in the tenant's view and the ticket reference is not, but both are on the tenant's own audit trail, which the tenant can read. One credential belongs to one organization: every credential a tenant seals is reserved to it by a keyed fingerprint (HMAC-SHA256 under a key derived from the KEK, never a plain hash, never returned or audited) that a database unique index holds across organizations, so a second organization saving the same key, or a tenant saving the platform's own key, is refused with 409 CLEARINGHOUSE_ACCOUNT_IN_USE that never names the holder, and the refused attempt is audited. The reservation stays through a key rotation and a switch to `outside`; only a platform operator releases it (tenant_clearinghouse.release_credential_platform, a fresh step-up, a human (non-AI) actor, a reason, an audit row), never the tenant's current credential, and not while the tenant has a production submission in flight or sent one in the last 90 days. A database trigger (migration 1437) refuses setting a reservation's release time unless the transaction carries a transaction-local setting that only that release path sets; it stops other application code paths from releasing one, not a session that can run arbitrary SQL as the application role. A save of a credential the organization holds under none of the configured fingerprint keys is refused (409 CLEARINGHOUSE_CREDENTIAL_LIMIT) once the organization already holds 20 × (the number of fingerprint keys configured at that save) unreleased reservation rows; re-reserving the organization's own current credential is never refused by this cap. The tenant credential PUT, and the platform operator's onboarding PUT (counted per operator and target tenant), are rate-limited per user and per organization, and refused with 503 when the limiter's store is unavailable. Each fingerprint records the public id of the key it was computed under; a row with no key id (recorded before migration 1436, or re-reserved when the credential could not be opened) cannot be attributed to a key. After a KEK change, a save also fingerprints under each retired fingerprint key an operator configures (M23_CLEARINGHOUSE_RETIRED_FINGERPRINT_KEYS: the old KEK's HKDF-derived fingerprint subkey, never a KEK; it computes fingerprints only and opens no credential), so a credential reserved under the old key stays refused. Any other write to a configuration whose credential opens re-reserves it under every configured key, repairing a missing reservation and refusing (409 CLEARINGHOUSE_ACCOUNT_IN_USE) when another organization holds it; when the credential does not open, its stored fingerprint alone is re-reserved, with no key id. A retired credential cannot be recomputed (its plaintext is no longer stored), so its reservation stops matching once its retired subkey is removed (ops runbook §8.3). When the platform database and the credential KEK are both configured (both required in production), an audited platform-context check (the platform role reads only the reservation's id, fingerprint, key id and release time) runs at boot and logs an error when a tenant holds the platform's own key, when a held reservation is under a key that is neither current nor retired, and with the count of held reservations that have no key id (these do not block saves). Until that check has completed and found every held key id configured, and while it is failing, every save carrying a credential, on the tenant and the platform onboarding lanes, is refused with 503 CLEARINGHOUSE_FINGERPRINT_KEYS_INCOMPLETE; a refused save re-runs the check at most once a minute, and a clean result holds until restart. Where either is not configured the check does not run and saves are not gated by it. Acknowledgments and remittances for a tenant-held account are pulled only through that tenant's own binding, never through the platform account's Claim.MD capture (CW-AC-10). A NOE or NOTR on a tenant's own Claim.MD account is sent only while M23_CLAIMMD_NOTICE_UPLOAD_ENABLED=true, a deployment-wide switch that is off by default; otherwise it is refused NOT_WIRED and not filed, activation does not check the switch, and the backend logs one warning per organization the first time its own Claim.MD account is bound with it off. Every Claim.MD send on a tenant-held account (M23 claims and notices, M41 commercial claims) first commits the same immutable submission evidence the platform account does (the exact X12 identity, its hash and the sealed billing TIN), under that tenant's own organization and its own account reference (tenant:<organization id>, a namespace the platform's account reference is refused at boot), never the platform account's; a tenant send with no such store, or whose evidence cannot be written, is not sent.
