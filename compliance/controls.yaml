# ChartWarden — compliance control register (claim → evidence)
# -----------------------------------------------------------------------------------------------
# Each row ties a HIPAA Security Rule standard and/or SOC 2 Trust Services Criterion to the thing in
# THIS repo that proves it: a package.json script (a gate or live suite), a CI workflow string, or a
# file. `bun run arch:compliance` (part of arch:fitness) fails when:
#   - an evidence script/file/CI reference no longer exists (the claim outlived its proof);
#   - an `implemented` row has no AUTOMATED evidence (a script or CI reference) — a control proven
#     only by a document is a control on paper;
#   - a `partial`/`gap` row has no reason, or its review_by date is past or more than 180 days out;
#   - a required HIPAA standard or SOC 2 criterion has no row at all.
#
# This is engineering traceability for auditors and for the agent harness. It is NOT a legal opinion
# and does not by itself make ChartWarden "HIPAA compliant" or "SOC 2 certified": those need the
# administrative program (policies, training, risk analysis sign-off, BAAs) and, for SOC 2, an
# independent auditor's report over an observation window. Edits to this file ask for human approval
# (.claude/settings.json).
#
# status: implemented | partial | gap | not-applicable

