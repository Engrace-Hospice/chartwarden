  - id: CW-AC-05B
    title: >-
      Clearinghouse webhook payloads (which may carry provider tax ids and vendor free text) are AES-256-GCM encrypted at rest in a platform-only, RLS-forced table with no tenant grant, and the ciphertext of EVERY receipt, settled or not, is cleared 90 days after it was received (a receipt that never settled is first made terminal `failed` and alerted, so a stuck row cannot hold ciphertext for longer); tenants receive ids and one bounded status word only. Each row records the key id it was sealed under (payload_key_ref) and the sweep decrypts only rows sealed under the key id this process holds: a row under another id is refused before any decrypt (outcome payload_key_mismatch), a row that will not open under the right id is outcome payload_undecryptable, both spend no attempt and raise one ops alert per sweep, rows that already failed sort after fresh receipts so they cannot starve new ones, and a row still unreadable 7 days after receipt goes terminal `failed` with an ops alert (alerts are raised only after the sweep's transaction commits, so a rollback never repeats one and a throwing alert sink is logged and cannot fail a row; the price is that they are AT MOST ONCE: if the process dies between the commit and the alerts, a terminal `failed` row is never selected again and its alert is lost. Two backstops count the receipts that went `failed` in the last 24 hours, in a savepoint so that a failing count cannot abort the sweep or roll back its settlements (a failure is logged at warn level with the 5-character SQLSTATE when the database raised one, else the error's class name, never its message: as claimmd.webhook.recent_failed_count_failed for the 24-hour count, whose warn line and summary that sweep then skips, and as claimmd.webhook.unsettled_count_failed for the other-key count, whose every-minute claimmd.webhook.unsettled_under_other_key warning that sweep then skips): a warn LOG LINE, claimmd.webhook.recent_failed_receipts (a count and the oldest time only), on every sweep while the count is above zero, which pages nobody; and ONE summary through the ops alert sink (an error-level log line, plus the OPS_ALERT_WEBHOOK_URL webhook when that is configured; a count and a time only) the first sweep of a process that sees any and again only after the count has returned to zero, the latch being in process memory so that a restarted process alerts once more and a sink that fails is not retried). The retention clear and that count are served by partial indexes (migrations 1462 and 1463). KEY ROTATION IS NOT GUARDED BY THE CODE, ONLY BY THIS PROCEDURE AND A WARNING: CLAIMMD_WEBHOOK_KEY_ID is a code constant paired with the CLAIMMD_WEBHOOK_PAYLOAD_KEY secret and the process holds ONE key (a cipher never carries a previous one), so rotate both together ONLY when no receipt is unsettled (no row with processed_at NULL that still holds a cipher; an awaiting_entitlement row counts, it can wait 90 days), because rows sealed under the old id are never decrypted again, go payload_key_mismatch and then terminal `failed` after 7 days, and Claim.MD will not resend them. While any exist the sweep logs claimmd.webhook.unsettled_under_other_key at warn level every minute (a count and the oldest receipt time only; a sweep whose count failed skips it) so ops can act before the 7 days run out; settled rows lose their ciphertext at 90 days regardless
    hipaa: ["164.312(a)(2)(iv)", "164.312(a)(1)", "164.502(b)"]
    soc2: ["CC6.1", "C1.1", "C1.2"]
    status: implemented
    evidence:
      - script: test:m23:claimmd-webhook:live
      - script: arch:tenancy
      - file: packages/db/migrations/1322_m23_claimmd_webhook_event.sql
      - file: apps/backend/src/modules/23-billing-medicare/claimmd-webhook/sweep.ts
      - file: apps/backend/src/modules/23-billing-medicare/claimmd-webhook/sweep-recent-failed.test.ts
      - file: packages/db/migrations/1462_m23_claimmd_webhook_event_cipher_age_index.sql
      - file: packages/db/migrations/1463_m23_claimmd_webhook_event_failed_index.sql
      - file: packages/shared/src/crypto/webhook-payload-cipher.ts
      - ci: "M23 Claim.MD webhook"

