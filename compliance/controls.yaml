    gap:
      reason: As of 2026-11-09 the executed-BAA document link is verified as a filed row, not as content. What the code enforces (the onboarding-wizard slice, live-asserted in test:m34:onboarding-wizard:live). BAA_DOCUMENT_REQUIRED (baa-guards.ts) checks only that documentId is non-null; the register then links only a document that is a tenant_baa row of the record's own organization that is not a destroyed tombstone (422 BAA_DOCUMENT_INVALID for another tenant's document, another kind, an unknown id or a tombstone), judged in the write's own transaction when a record is created with a link or an update changes the link or makes the record executed (an update that does neither, such as a new expiry on an executed legacy row, is not re-judged). Go-live approval, the status route's activation event and onboarding step 3 judge the governing record's document the same way (documentFiled is a required input of the activation guard, and an input that does not say is not an executed BAA), so an executed status over a link that does not verify, or over no link, does not satisfy go-live. Go-live approval also refuses the operator who uploaded that document, not only the one who wrote the register row (CW-AC-22). Still UNVERIFIED. (1) The document's content is not machine-checked; nothing confirms that the stored file is an executed agreement, names this tenant or matches an expected hash (the upload pipeline checks type, magic bytes, size and computes a SHA-256, and a platform operator chooses the file filed as the signed agreement), so the row proves that a file was filed for the tenant, not what it says. (2) The rule that the go-live approver did not write the BAA (409 GO_LIVE_APPROVER_WROTE_BAA) cannot judge by the register columns the rows written before migration 1332, whose filer and last-writer columns are NULL; the uploader comparison applies only where the document's creator membership is recorded. This row stays partial until the content can be checked and a live assertion proves it.
      owner: engineering
      review_by: 2027-01-31

  - id: CW-AC-15
    title: >-
      Tenant onboarding steps are strictly ordered on the server (409 ONBOARDING_STEP_OUT_OF_ORDER on both the platform and tenant routes), and a human settles a step only with required evidence (a note, plus an optional reference) recorded on the task with the attester and time and audited by the row trigger; a tenant actor must hold the step's owner role; go-live cannot be skipped or attested as an ordinary step, and a platform operator's skip settles only a non-canonical catalog step (added by platform ops) or a canonical step on the server's own skippable list (MAC credentials, payer enrollment, DoseSpot kickoff, sample data): a skip of any other canonical step, the plan, the BAA and the provider entity included, is refused with 409 ONBOARDING_STEP_NOT_SKIPPABLE, so the console's Skip button is not the control; the tenant's own org_admin may skip only MAC credentials, payer enrollment and DoseSpot kickoff, never sample data, go-live or a step an operator added (409 ONBOARDING_STEP_NOT_TENANT_SKIPPABLE; CW-AC-42), and a skip records its actor kind (tenant, platform_ops or system) with the rationale in the task's completion evidence (a skip written before the kind was recorded is read as platform_ops, or as system when it names the system membership); canonical templates are migration-owned, and the catalog route refuses a POST naming a canonical template's key with 409 ONBOARDING_TEMPLATE_CANONICAL, so a canonical step cannot be made non-canonical (and so skippable) through it; on the platform carrier the catalog table grants INSERT (table-wide) and UPDATE only on the upsert's columns (display label, description and order; migration 1425, whose column grant on the canonical flag migration 1476 revokes because the route never writes it), so platform ops can add a non-canonical step and re-edit it but cannot rewrite an existing step's key, owner role or settings, and the carrier holds no DELETE on it; a role-checking trigger (migration 1476, the precedent of the destruction-role triggers: a non-superuser member of the carrier) also refuses the carrier any INSERT or UPDATE that makes a catalog row canonical or changes one that is, so a canonical step, which gates go-live for every tenant, changes by migration only whatever shape the statement takes. A change to the catalog is a named operator's decision like every other ops write: POST /platform/onboarding-templates takes the catalog key, the platform-ops predicate, a fresh step-up, an Idempotency-Key, a reason screened for patient identifiers and no AI actor, and leaves an m34.onboarding_template.upserted audit event naming the operator and membership, the reason and the step (the catalog table's own row trigger records no actor whatever the session says, so that event is the record). An `either` step may be attested by its owner (the tenant's org_admin or platform ops) even when its automatic fact does not hold: the go-live approver reviews that evidence; platform reassignment of the compliance officer revokes a pending go-live attestation in the same transaction, while tenant reassignment attempts a best-effort post-commit revocation and go-live approval fails closed if the attester is stale; a write to the org profile, a provider entity, a location or the organization's names, an NPI verification, the BAA register, an operator's onboarding-data write on the tenant's behalf or the tenant's own skip of a step revokes one in the same transaction; an attestation of a step, an operator's skip of a step and the system's clearinghouse skip do not. Every free text the wizard stores (evidence, reasons, skip rationale, blocker reason, go-live note, the operator's onboarding-data reason) is cleaned and screened for patient identifiers.
