  - id: CW-SEC-02
    title: >-
      The Idempotency-Key request fingerprint that the shared middleware stores for every authenticated mutating request that carries an
      Idempotency-Key (routes returning a one-time secret opt out) is a keyed hash, so a credential
      in a request body is not testable against guesses by someone who can read the table. idempotency_key.request_hash holds "h1:" +
      a short key id (8 hex characters: an HMAC of a fixed, public label under the server key, the same for every row; it reveals nothing
      about a request body, but it does let a reader of the table test CANDIDATE SERVER SECRETS offline, 32 bits at a time) + ":" +
      HMAC-SHA-256 over the organization, user, actor kind, method, route, path parameters, query string, If-Match,
      key and body (the actor kind and the query string are in the fingerprint because replay is answered before the route guards: an
      ai_* principal that shares a user id with a human must not be handed the human's cached success body (no HTTP authentication path
      stamps an ai_* kind today, as authenticate.ts stamps only user or system, so the separation is bound ahead of the M32 principals;
      an absent kind counts as user), and another query string selects other handler behaviour), under a server key that is a
      domain-separated subkey, HMAC-SHA-256(BETTER_AUTH_SECRET, a fixed purpose label), so the session-signing root never keys the
      fingerprint itself (configuration the platform already requires; no key in code). The secret is trimmed, like
      the production env gate, and must be at least 32 characters after the trim and contain no RFC 2606 reserved host (the production
      env gate's placeholder rule; it is a host check, so a non-host placeholder such as the production example's
      REPLACE_WITH_AT_LEAST_32_CHARACTERS is not recognised by it, and bootstrap-vps.sh generating the value is operating practice, not a
      machine check); an injected empty key is refused. Production refuses to boot without a valid secret; a non-production process with
      no valid secret (absent, under 32 characters after the trim, or a reserved-host placeholder) uses a process-local random key (one
      warning is logged); records written by another process or before a restart are then IDEMPOTENCY_KEY_STALE (409), never replayed or
      re-run. Across a deploy a record stored under the earlier plain SHA-256 (the one origin/main's middleware wrote, over the
      organization, user, key and body only, with no method, route, path parameters, query string or If-Match) still matches the same
      request by that legacy hash (computed, never written, for the 24 h TTL), so a retry of a pre-deploy request replays rather than
      re-executes, while another body or another user stays a 409; this legacy arm is weaker than the keyed one: the plain fingerprint
      binds no actor kind, method, route, path parameters, query string or If-Match, so for the 24 h window a pre-deploy row replays for a
      same-user, same-key, same-body request whatever route, query or actor kind it names (origin/main's own behaviour); the wider scope
      and the actor-kind separation apply only to rows written after the deploy; the legacy arm is chosen from the STORED record having
      no "h1:" prefix, never from anything the request says. Removal: the arm and legacyIdempotencyHash go once every environment has
      passed one idempotency TTL (24 h) after the keyed fingerprint deployed there; 2026-12-15 is the calendar proxy for that (chosen with about five weeks of margin, to be moved if the stack deploys after early December), enforced by
      a test that fails after it while the arm still exists (LEGACY_ARM_REMOVE_AFTER), and this row is partial, with review_by on the same
      date, until then. The arm recognises only origin/main's plain hash: a row an intermediate release wrote (the tenant-clearinghouse
      release writes a different plain SHA-256, over the JSON scope of organization, user, actor kind, method, route, path parameters,
      query string and If-Match) is not recognised, so if that release deploys first, a retry of its row within the TTL answers 409
      IDEMPOTENCY_CONFLICT (safe: never a replay, never a re-run); no further weak arm is added. A record written before the deploy keeps its plain, unkeyed SHA-256
      fingerprint in idempotency_key until the hourly idempotency.cleanup sweep removes it after its 24 h TTL (about 25 h; longer for an
      organization with more than 50 000 expired rows, which drain over successive runs), because it is never rewritten, so for that
      window a reader of the table can still test guesses against it. The idempotency.cleanup sweeper purges expired rows in every
      organization status (created, active, suspended and closed). origin/main swept active organizations only, so expired rows of the
      other statuses (plain-SHA-256 fingerprints and cached response bodies, which can be PHI-bearing) were never deleted; the sweep
      selects by expires_at alone, so its first runs after deploy also remove those, bounding their retention. No remediation script or
      migration is used, and no row is deleted before its TTL (the delete re-checks expires_at, so a key a retry reclaimed since the
      select survives; a missing row would re-run the handler). During a rolling deploy or a rollback inside the TTL, a replica running
      origin/main code answers an h1: record with 409 IDEMPOTENCY_CONFLICT, never a replay or a re-run. A same-user replay within 24 h is
      answered before the route guards, so a revoked permission or a stale step-up does not stop a replay of the user's own earlier
      response (existing design, not a regression). A record under another key (a rotated secret, told by its key id) is a 409 of its own,
      IDEMPOTENCY_KEY_STALE, whose message says the first request may or may not have taken effect and to retry with a new key (the same
      key with another body stays IDEMPOTENCY_CONFLICT), never a replay or a re-run. Because of the key id, this control's strength against
      someone who can read idempotency_key rests on BETTER_AUTH_SECRET being high-entropy: it must be generated (at least 32 random bytes),
      never chosen. Production boot enforces that the secret is present and at least 32 characters long, not its entropy, so this is
      operating policy and not a machine check. The subkey does not change that: its derivation is public, so a reader of the table can
      apply it to a candidate secret and test the result against the key id (and, for a request whose body is guessable, the tag).
      Routes that return a one-time secret opt out of response capture (noIdempotencyCapture). Scope: the request fingerprint, not the
      cached response body.
    hipaa: ["164.312(a)(2)(iv)", "164.312(c)(1)"]
    soc2: ["CC6.1", "CC6.7"]
    status: partial
    evidence:
      - script: test:gap007:idempotency-claim:live
      - script: test:f073:idempotency-bodiless:live
      - script: test:idempotency:cleanup:live
      - file: packages/shared/src/idempotency/idempotency.ts
      - file: apps/backend/src/bootstrap/plugins/idempotency.ts
      - file: apps/backend/src/bootstrap/jobs/idempotency-cleanup.ts
      - file: apps/backend/src/bootstrap/jobs/__tests__/idempotency-cleanup-safety.test.ts
      - file: apps/backend/__tests__/idempotency-keyed-fingerprint.test.ts
      - file: apps/backend/__tests__/idempotency-scope.test.ts
      - file: packages/shared/__tests__/idempotency.test.ts
    gap:
      reason: The legacy plain-SHA-256 arm (weaker than the keyed fingerprint, see the text) must be removed, with legacyIdempotencyHash, once every environment has passed one idempotency TTL (24 h) after the keyed fingerprint deployed there. The row is partial until then because the checker enforces review_by only on partial and gap rows; 2026-12-15 is the calendar proxy for the trigger (chosen with about five weeks of margin; move it if the stack deploys after early December), and a test in packages/shared fails after it while the arm exists, so the arm cannot be forgotten (move the date, with this review_by, if the deploy slips).
      owner: platform
      review_by: 2026-12-15

