    gap:
      reason: >-
        The eraser is driven live only for the shred half until the tombstone fix merges. M22 has no Part 2 document path (no compliance_42cfr_part2 class and no gated read), so a rendered signed note for an encounter with a Part 2 section shows markers where that text is; lifting it needs that path and a per-event Part 2 signal from M8. A section amended by an entitled author stays withheld whole for a viewer without disclosure even when its latest text holds no Part 2 content. A withheld section keeps its position in the note, so a reader can place it between visible neighbours. An addendum's own signedAt is shown whatever it amended. The audit read path (audit.read) is not Part 2 gated, so the m8.encounter.draft_section_resolved events and the row-trigger rows of a Part 2 section carry the Part 2 retention class and tell an audit reader which sections hold Part 2 (the same recorded gap as CW-AC-49). The cosignature queue and the cosignature routes still show an amendment awaiting cosign whatever it names. An LPN or aide note signed from a draft (slice S3) is sealed the same way, with ids and kinds only, and its cosigner without Part 2 disclosure reads the sections withheld; they cosign the redacted view, with the same attestation text and no record on the signature or the event that the view was redacted. A pin INSERT does not compare the siting pair. Slice S4: a social-work or chaplain note is sealed the same way, its sections citing module 15 goal and intervention ids and kinds only; neither discipline needs a cosigner. A goal's wording, which may be sensitive though only Part 2 is flagged, is sealed into a note readable by every holder of encounter.read. Slice S5: a face-to-face or IDG follow-up note is sealed the same way, with the order wording (drug, strength, form, route) and the recorded vitals sealed into a note readable by every holder of encounter.read, only Part 2 being flagged; a physician's or nurse practitioner's note needs no cosigner. Slice S5b: an IDG follow-up note's idg_followup section is sealed with its action item's id and kind as the only reference; that the visit followed up an item, a meeting date, a decision-kind label and a due date are sealed into a note readable by every holder of encounter.read, only Part 2 being flagged (CW-AC-49).
      owner: clinical-platform
      review_by: 2027-04-30

  - id: CW-AC-52
    title: >-
      An amendment of a signed note that needs a cosigner is not final until a qualified RN who authored neither the note nor the addendum cosigns it (ADR-0114 VN-D30). The cosignature workflow of the note (acknowledge, sign, supervisor release past the 48-hour cap) runs for addendum_cosignature_request, a sibling table with RLS enabled and FORCEd, over one state machine generalised by subject. Acknowledge and sign need an RN who is neither the note's author nor the addendum's author, enforced by the m8.cosigner_role_match predicate and again in the service; sign needs a fresh step-up and writes an encounter_signature of kind addendum_cosignature with attestation and method and leaves the encounter's status alone; release needs a supervisor, a reason of 40 or more characters and a fresh step-up, and records the releasing supervisor (the note's own release too). Acknowledge and release are audited under the acting user, not the system. The amendment's cosigner is never the note's author, so a sign with no other eligible RN is 422 NO_ELIGIBLE_COSIGNER before any write. Migration 1525 guards the request on INSERT and UPDATE (organization, encounter, addendum and siting fixed, supervisor_released_by checked) and allows exactly one addendum_cosignature signature per addendum, by an advisory lock and a trigger. Every request is read FOR UPDATE before a decision, so a concurrent second sign is 409 ILLEGAL_TRANSITION. The cosignature queue lists both kinds, told apart by cosign.subject, and the 12-hour, 24-hour and 48-hour sweep covers both tables, its alerts and events naming the addendum. Signing publishes m8.encounter.addendum_cosigned and never m8.encounter.cosigned, so no billing consumer sees it.
