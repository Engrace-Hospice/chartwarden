    gap:
      reason: >-
        The director of nursing holds both keys and is bound by the clock like any supervisor, so the separation (the policy is set by the tenant-level owners, not by the field supervisors) covers clinical_supervisor and clinical_lead only; a DON or tenant administrator can set off or a long threshold with step-up and a warn-severity audit event but no second person and no alert (CW-MON-01 is a gap). Nothing caps or alerts on repeated grants either: once a grant expires (up to 24 h) the same supervisor can grant the same clinician again, each grant step-up gated, rate limited and audited, so a pattern of chained overrides is visible only to a reader of the audit trail until CW-MON-01 lands. The override reason is free text screened for SSN and MBI shapes only, so a name or date of birth passes, and it sits in two append-only places (the override row and the grant event), capped at 500 characters; no route returns it. The denied-attempt event is best effort on its own transaction (a failure to write it is logged by error class and never changes the refusal), and the routine nothing-to-lift refusal writes none. The platform-operator database fallback in the runbook writes only the row-trigger event, not m8.encounter.closure_policy_changed, so the change ticket and correlation id are the record of why. Migration 1515 gives the policy key to every existing org_admin and administrator role on deploy (the default mode stays warn), and superadmin derives it through the full catalog, which is inert because superadmin is refused inside a tenant (CW-AC-45).
