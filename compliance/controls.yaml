      # Assemble re-judges status, spec, ISC, record id, items AND unresolved ERROR findings under the FOR SHARE lock, so a
      # record that gained an ERROR finding after validation, or was superseded meanwhile, is not packaged (the live case
      # for the ERROR finding is in m10-hope-submission-result.live.test.ts). The ZIP is built before the share locks are
      # taken, and built again only when the re-judgement dropped a record, so the package holds exactly the records
      # packaged. A result import
      # rolls back with a 409 when its bulk item UPDATE misses a row (an item gone, settled or moved meanwhile), so a batch
      # never ends with fewer stored verdicts than its status assumes; the message asks for a reload and a NEW
      # Idempotency-Key. The result events of one batch are append-only audit evidence. A batch holds at most 20,000
      # recorded report rows for reports that settle no item (MAX_RESULT_EVENTS_PER_SUBMISSION in hope-submission-result.ts):
      # an import that settles no pending item and would pass it is answered a static 409 and records nothing. The count is
