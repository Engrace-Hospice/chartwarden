      - file: packages/dosespot/src/client/circuit-breaker.ts
      - file: packages/dosespot/__tests__/dosespot-adapter.test.ts
      - file: packages/db/migrations/1432_m12_transmission_call_token.sql
      - file: apps/backend/src/modules/12-dosespot/jobs/episode-store.ts
      - file: apps/backend/src/modules/12-dosespot/prescription-id.ts
      - file: packages/dosespot/src/lifecycle/medication-order-machine.ts
      - file: apps/backend/__tests__/m12-tenant-dosespot-routes.test.ts
      - file: apps/web/src/modules/12-dosespot/held-transmission-modal.tsx
    gap:
      reason: The resolution is an administrator's attestation. ChartWarden cannot read the prescriber's DoseSpot account (its status read needs a prescription id, which an answer that carried none leaves nothing to read, and the id a worker persisted at the create is not shown to the administrator). The prescription id is taken as typed and is refused only when it duplicates another order of the organization, so a mistyped id that matches nothing is recorded and the status poll watches a prescription that does not exist until it times out after 24 hours. DoseSpot shows drafts alongside sent prescriptions, so an administrator can read a draft as sent, or miss a draft when resolving "not sent", after which the retransmit duplicates it; the modal asks for "sent to the pharmacy (not a draft)" and, for "not sent", a confirmation that no prescription of any status exists, but that stays the administrator's judgement. DoseSpot's dedupe by Idempotency-Key is unverified until a sandbox run. A send DoseSpot answers with a 429 or a 503 is taken as not accepted and is re-sent by the worker (with the same Idempotency-Key and prescription id); if DoseSpot had in fact acted on it despite that status, that re-send relies on the unverified dedupe. Telling a connection that was never made from a lost answer depends on the runtime's error codes (ConnectionRefused, ECONNREFUSED, ENOTFOUND, EAI_AGAIN); an unrecognised code is held, the safe side. The breaker bounds a send-only outage only loosely, because any successful DoseSpot call for the organization (a status poll or a history pull included) resets its count and closes an open breaker, so an outage that other calls interleave with can hold more than five orders, each needing an administrator; the breaker is per process, so each replica counts its own; and a send whose 2xx does not echo the prescription id counts as a success, while the create's id-less hold is not counted at all. An order whose worker died after the call began is held only at the next recovery drain (the 10-minute stale window, now measured from the call, plus the 5-minute drain, so up to about 15 minutes, and longer when more than 100 such claims are waiting), and its alert is that late. The 24-hour reminder is one per episode, not one per order. The prescription-id rule is enforced by the two writers, not by the database (the partitioned table cannot carry a UNIQUE index on the id). If an administrator resolves an order while its original call is still in flight, what that call does next decides the outcome. A call that has not yet reached the send is stopped before it (a call that creates the prescription after the resolution does not record the id it created and may leave a draft at DoseSpot, and a call resumed with a persisted id is stopped just before the send). A send already in flight is not stopped. If it succeeds, nothing is recorded and only a warning log with ids signals it, so after "not sent" the prescription is then live at DoseSpot while the order says failed, and the retransmit duplicates it (the replacement carries its own Idempotency-Key, so dedupe by Idempotency-Key cannot suppress the duplicate). The transmission row keeps the prescription id the worker stored when it was created. A late definitive failure after a drain hold is not kept held, so a retryable one requeues the order and re-sends the same Idempotency-Key and, when one was persisted, the created prescription id, whose dedupe at DoseSpot is unverified, and an administrator mid-resolution gets a 409. If recording the created-but-unsent prescription id fails, the send is not attempted and the order spends a retry (bounded at five); a retry on another replica can then create the prescription again. An order that the earlier enqueue bug left queued without a transmission row is alerted after an hour but not repaired, and is never sent (reseed it). M12 has no duplicate-order check, so two orders with identical content that a clinician signs both transmit.
      owner: engineering
      review_by: 2027-01-31

