  - id: CW-AC-14
    title: >-
      The platform BAA register is written only by a platform operator holding platform_tenant_baa.write_platform with a fresh step-up and a human (non-AI) actor; the read key no longer permits writes. An executed BAA must carry a document reference (422 BAA_DOCUMENT_REQUIRED, on create and update; that check is only that a documentId is present: the link is judged separately, 422 BAA_DOCUMENT_INVALID unless it is a tenant_baa document of the record's own organization that is not a destroyed tombstone, CW-AC-22; the file's content is not machine-checked, see the gap). Each row records the user who filed it and the user who last changed it, and go-live approval refuses an approver who wrote the governing record or uploaded its signed agreement (409 GO_LIVE_APPROVER_WROTE_BAA; CW-AC-22). The platform carrier's INSERT and UPDATE on the register are column-level (INSERT: tenant, organization, version, status, dates, breach contacts, document, filer; UPDATE: status, dates, breach contacts, document link, last writer), so it can never rewrite tenant, organization, version, filer, the subcontractor disclosure set or the tenant officer's attestation; the repository inserts through a narrow table object so the column grant is usable. A write names the operator as audit actor and revokes a pending go-live attestation in the same transaction. A duplicate (tenant, addendum version) is a 409.
