  - id: CW-PI-03
    title: >-
      M25 835 remittance intake keeps its integrity before money is recorded: a non-zero payment without BPR16 (its payment effective
      date) is refused at receive, never stored with NULL dates; an advice's envelope identity (ISA13 with ISA06, ISA08, GS06 and ST02)
      is part of the dedupe key, and an advice posted from a staged Claim.MD ERA carries the same identity (a stage staged before
      migration 1508 stays executable; a recorded identity that disagrees with the sealed set is refused); the payee must be the
      tenant's by NPI and, when the 835 sends one, by the sealed TIN, and the evidence kept holds no NPI or TIN value; a file the pull
      cannot ingest is quarantined after a bounded number of refusals under a durable, audited reason code, and a well-formed NPI or
      TIN that is not the tenant's is never quarantined (it keeps the cursor pinned and loud); and the pull cron reports a held file
      on the tick that receives it and every standing quarantine on each tick that completes a pull for the provider entity until an
      operator releases or dismisses it, by id and code only. Claim.MD controlled posting needs a stored plan, an approver other than
      its creator and an executor other than the approver, each with a step-up, re-derives and re-compares the plan digest under a
      stage row lock before inserting, and is refused at boot when enabled under NODE_ENV=production.
