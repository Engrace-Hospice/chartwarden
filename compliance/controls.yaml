      and never a cosignature - and never the system keys (IDG revise, read internal), a supervisor, the director of nursing
      or an external role. Coverage is the roles a tenant already has when migration 1526 runs; none of the roles is a
      template, so a new tenant gets nothing until an administrator creates the roles, a role created later receives
      nothing, and a tenant may still remove a key from a role it owns. Limits stated on purpose - the key is not scoped by
      plan kind, so an RN reads every kind of discipline plan (MSW, spiritual, volunteer, Aide POC) of a patient on their
