      visit that is unknown, another patient's or another author's (one 404 for all three, so the check is no existence oracle for a visit), one
      whose note is no longer a draft (409 ENCOUNTER_NOT_DRAFT) and, for a wound observation, one whose note template has no wounds section
      (422 WOUND_NOT_IN_NOTE). The seam fails closed. Its registry entry is a deny stub that throws until the real reader is registered (the
      composition root registers it only when a database is wired), and a reader error refuses the write. A visit that closes between the check and
      the commit is reconciled after the commit (a proposal is released or withdrawn with its visit, an observation is taken out of the closed note
