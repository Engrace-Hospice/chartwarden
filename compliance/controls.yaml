      - file: apps/backend/src/modules/12-dosespot/tenant-config/transmission-resolve.test.ts
      - file: apps/backend/src/modules/10-hope/routes/hope-route-guards.ts
      - file: apps/backend/__tests__/hope-route-guards.test.ts
      - file: apps/backend/__tests__/hope-routes.test.ts
