  - id: CW-CM-01
    title: Change management — fitness gates before main, signed release images, no committed conflicts
    hipaa: ["164.308(a)(8)"]
    soc2: ["CC8.1"]
    status: partial
    evidence:
      - script: arch:fitness
      - file: .githooks/pre-push
      - ci: "cosign sign"
      - script: arch:merge-artifacts
    gap:
      reason: deploy.yml's `verify` job calls the full ci.yml and `release` needs it (#846; arch:release-gate fails if that is removed), so CI gates the deploy path — EXCEPT while deploy.yml carries a ci-waived release-gate line (owner decision 2026-10-30, `verify` is commented out so main deploys without tests or live suites, but release still needs the `quality` job running typecheck and lint, which arch:release-gate pins; lift the waiver by restoring `verify`). What is still open is that main has no branch protection and the `production` Environment has no required reviewers (#16, needs a paid plan and an owner decision), so a workflow edit or a re-run can bypass the gate, and the pre-push hook is opt-in per clone. Close with branch protection (required check plus code-owner review) and Environment reviewers, then flip to implemented.
      owner: engineering
      review_by: 2026-12-15

  - id: CW-CM-02
    title: AI coding agents operate inside the change-management and minimum-necessary controls
    hipaa: ["164.308(a)(3)(ii)(A)", "164.308(a)(4)(ii)(B)", "164.502(b)"]
    soc2: ["CC8.1", "CC6.1"]
    status: partial
    evidence:
      - script: arch:compliance
      - script: harness:phi-scan
      - file: .claude/settings.json
      - file: scripts/harness/pre-tool-guard.ts
      - file: docs/compliance/AGENT_HARNESS.md
      - file: scripts/__tests__/harness-hooks.test.ts
      - file: scripts/__tests__/harness-bypasses.test.ts
      - file: .github/CODEOWNERS
    gap:
      reason: The PreToolUse guard is a set of shell-text heuristics for a cooperative agent, not a sandbox (a determined process can read a file through a construct the rules do not anticipate), and the local ledger is an unkeyed hash chain that catches accidents, not tampering. Closes with a filesystem sandbox or secrets kept outside the working tree, plus the ledger head published somewhere the agent cannot write, and code-owner review enforced on .claude/, scripts/harness/ and compliance/ (needs the branch protection in CW-CM-01).
      owner: engineering
      review_by: 2027-01-31

  - id: CW-SEC-01
    title: Secrets never committed — secret scanning on commit and in CI
    hipaa: ["164.312(a)(2)(iv)", "164.308(a)(5)(ii)(D)"]
    soc2: ["CC6.1", "CC6.7"]
    status: partial
