      - file: apps/backend/__tests__/hope-g2-route-service.test.ts
      # Known limit: the upload to the CMS portal is a manual step outside ChartWarden, so a copy of the ZIP downloaded before
      # the cancel is not recalled by it; the control stops ChartWarden itself from serving, recording or resulting a
      # cancelled batch. Policy choice: cancelling an `exported` batch NULLs the ZIP even if the operator already uploaded it
      # to CMS but had not yet clicked Mark uploaded; the package SHA-256 and size stay in the batch row and in the cancel
      # audit event. Known limit: the submission list caps at 500 batches (SUBMISSION_LIST_LIMIT in hope-route-service-db.ts,
