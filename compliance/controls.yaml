  - id: CW-AC-40
    title: >-
      A ChartWarden support session opens only against an active consent grant of the same organization: the grant is unrevoked and unexpired, its tenant id is bound to the session by a composite foreign key, patient-scoped grants resolve every patient through the tenant-bound M5 reader before storage, and a database trigger independently refuses a mismatched, revoked, expired, over-eight-hour or otherwise invalid session envelope. The service reads the grant under a share lock, fails closed when the grantor membership cannot be resolved to a user, and requires the operator to be a different membership and person (403 SUPPORT_SESSION_ACTOR_NOT_DISTINCT); one operator can hold at most one open session on a grant. Start requires support_session.start, the distinct-actor ABAC predicate and a fresh step-up. Elevation requires the session's own operator, resolved server-side from the session id, a fresh step-up and a PHI-bearing scope; an assist session is non-PHI and cannot be elevated (403 SUPPORT_SESSION_NON_PHI). Started and elevated outbox payloads do not carry the operator membership, and the seeded M36 rules alert the grantor when a session starts, is elevated or ends. A session ends at the earliest of its eight-hour ceiling, the grant expiry, a manual or forced close, or grant revocation. Revoke and close transitions are immutable at the database; a grant-revoked transition appends the one unique session.close ledger row through a security-definer trigger, while manual, expiry and forced closes append that row through the service, so the tenant role has no INSERT privilege on the ledger and cannot forge close or ops.write evidence. Revoking a grant closes every open session, publishes the revoke and close events, and permanently prevents another start; linked help-request bookkeeping runs only after the security transaction commits and is best effort, so a collaborator failure cannot restore consent or reopen a window and emits an ids-only reconciliation warning. Consent issue is bounded at the RLS policy to a near-current issued_at, a future expiry and at most 72 hours. A confined organization may inspect its grants and sessions and revoke access, but the production onboarding gate denies direct grant issuance before activation; the service's assist-only rule is defense in depth for a future explicitly allowlisted integration. The session and ledger are stored in the grant tenant's organization. Tenant consent-grant, session and ledger reads are read-audited; their session and ledger lists use real SQL keyset pagination and omit the operator identity and address, and generic audit-trigger before/after projections also scrub actor_membership_id and actor_ip. Platform session and event-list reads are read-audited, the platform session list is SQL-paginated, expiry processing is bounded to 200 rows per pass, and every ledger query supplies the organization as well as the session id. The support-session ledger hook has a narrower scope than the support session itself: while an operator holds an open session, it appends one best-effort ops.write row only for a successful, non-GET, non-replayed request whose resolved route template is under /api/v1/platform/tenants/:orgSlug/*; it stores method, template and status, never request data, and a failure is logged with ids only without failing the platform write. Other platform routes are not represented by that hook. A support session authorizes no platform write: the existing permission, ABAC, step-up, reason, audit and tenant-status controls still decide every operation, with or without a session, and ending help does not block those independently authorized operations. A platform superadmin reads WardenLens intake evidence of a tenant only through two dedicated read-only platform routes: M34 holds the actor-bound open support session and its unrevoked, unexpired consent grant under a share lock on those two rows while the response is prepared, then appends an ops.read ledger event and a critical support_session.wardenlens_read audit before disclosure, and a wrong actor, another organization or patient, a closed, expired or revoked session or a revoked grant is refused. A patient-scoped grant reads a batch only when the filed patient is proven (the identity check has run and is positive on every document or a reviewer confirmed it (a page the splitter marked a re-sent copy counts only once a reviewer confirmed it, since that mark is a fuzzy text match), no records-request code names another patient, and a requested page lies inside a classified document); missing or unverified identity evidence is a refusal. The target-tenant M4 read event deliberately records the platform actor, source IP and user agent, unlike the ledger and session lists; reads carry no Part 2 marker and no per-read grantor alert. That target-tenant read event is fail-closed on the two platform routes and is proven by a unit suite over a fake database, not yet live as chartwarden_app. A refusal raised inside the authorization read (a 403, a 404 or a 409) writes its own support_session.wardenlens_read_denied audit (identifiers and a reason code only) because the authorization transaction rolls back; an unknown batch under a patient-scoped grant reads as the same 403, a server error is not recorded as a refusal, and a refusal at the route guard (a missing role, permission or human actor) writes no such audit, the platform read writes no intake or clinical row (only its support-session ledger and audit rows), and a batch re-filed to another patient between authorization and read fails as a retryable 409.
