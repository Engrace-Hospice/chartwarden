      reason: The CI job gates the release path through deploy.yml's `verify`, but the pre-commit hook is opt-in per clone and skips gitleaks when it is not installed, and the gate itself is bypassable until branch protection exists (see CW-CM-01). Closes with CW-CM-01 plus an enforced hook install.
      owner: engineering
      review_by: 2026-12-15
    evidence:
      - file: .gitleaks.toml
      - file: .githooks/pre-commit
      - ci: "secret-and-phi-scan:"
      - ci: "gitleaks dir . --config .gitleaks.toml"
