      # (trg_audit_encounter, real actor) but raises no alert to billing; the runbook has billing review those audit events.
      # The guards are ordinary triggers and CHECK constraints: the table owner or a superuser can disable or bypass them
      # (ALTER TABLE ... DISABLE TRIGGER, session_replication_role = replica), so the control holds against the application's
      # own write paths, not against a database administrator. It does not hold against arbitrary SQL as the application role
      # either: nothing in the database guards status or signed_at, so such a session could un-sign an encounter (an audited
      # write), edit its delivery columns and sign it again. The live suites cited above run only when CI is
      # dispatched on the branch (gh workflow run ci.yml --ref <branch>; a pull request into main does not trigger it), and
      # while verify is waived on main (CW-CM-01) a deploy is gated by typecheck and lint only, so they gate nothing there.
      # The test:rls:live:m23 isolation suite is not cited: this change adds no table and its assertions do not cover the
      # revisions; it must still pass in a dispatched CI run before this merges.
    gap:
      reason: Documented defaults pending compliance sign-off (the 7.5-minute tie-break, visit dating by service date and the CHC labor-share wage basis); a video visit still emits an in-person RN line; nothing alerts billing when a legacy visit is confirmed after its claim was billed; cross-author overlap and an EVV bracket that overlaps an earlier typed one are not detected; a stored EVV state is not re-asked at sign; and the database guards stop a single application write, not arbitrary SQL as the application role (nothing guards status or signed_at). Each is described with its reason in the comments above.
      owner: engineering
      review_by: 2027-02-28

  - id: CW-AC-19
    title: >-
      Auditors are never billed or provisioned as staff: the role key external_auditor is reserved for the system auditor role (a tenant role under that key is refused with 422 RESERVED_ROLE at the route and by a trigger in the database; because the application role can write every column the system row's facts rest on, the trigger also requires the transaction-local marker only the auditor grant sets before it writes that row, which stops other application code paths from writing it, not a session that can run arbitrary SQL as the application role), so a real auditor always lands on the system role. An organisation that still holds a legacy tenant-created external_auditor role is refused at auditor redemption (role_over_privileged, 403 AUDITOR_ROLE_MISCONFIGURED, fail-closed): an administrator must remove that role before an auditor can be onboarded (CW-AU-02). Family-portal, auditor magic-link and ChartWarden support sessions never enter the staff meter at all: its ledger is fed by m2.session.created, which fires only when a staff session binds to an organisation at select-organization, so those sessions write no ledger row. The meter excludes the system auditor role and platform-owned operator roles (non_staff_observed), decided when each sign-in is observed, not from today's grants; and a month that spans a pseudonym-key rotation counts its busiest single epoch and flags the statement needs_review.
