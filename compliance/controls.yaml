    gap:
      reason: >-
        The routine visit's sources are real seams in production but fakes in the live suite (their own live suites cover them); the recertification and face-to-face drafts' M6 readers are driven live over the real admission store, but the draft itself is not wired end to end over it. Nothing measures the latency the recompute adds at finalize and sign. Other note types (the later slices) get no draft gate until their slices. The admission visit's M12 orders are a fake in its live suite (M12's own suite covers the as-of read); M5's roster and M39's evaluator are driven live over real rows. M39's historical argument is opt-in on the shared evaluator, and one test pins the single server source file that sets, forwards or declares it in the forms the scan matches (a literal, variable, shorthand, quoted key, destructuring default, bracket access, forwarded field or optional declaration; a computed key, Reflect.set or a spread of an untyped object is not seen), so a later caller has to be argued there; a separate method would remove the risk of misuse altogether. Slice S3 (LPN and aide notes): the primary sign opens the cosignature request in the same transaction and the cosigner reads the note through the per-viewer view, but a cosigner without Part 2 disclosure signs a note whose Part 2 sections they cannot read (VN-D13, VN-D43), an amendment by such a viewer being refused; the attestation text they sign is the same unconditional sentence, and nothing on the signature or in the m8.encounter.cosigned event records that the view they cosigned was redacted; and the aide's drafted adl states a care-plan intervention performed for EVERY active intervention tagged for the aide on an active problem of the plan in effect at the visit, except those the author removed from the visit: nothing is linked before the confirmation (the confirmation links them), so the aide cannot leave an item out beforehand and the control is the per-section, hash-bound confirmation (confirm, deselect the section, or unlink an item and confirm again), not a pre-selection. A source read abandoned at the timeout is cut off at its next query by a transaction lease that ends with the unit of work (slice S5; a query already sent when the lease closes finishes ahead of the commit or rollback and its result is discarded), and a computation waits for all its reads before it answers, so a failing request can wait up to 5 s; before slice S5 a read that failed at once could leave the others running on a pooled connection the next request then owned, and the 5 s bound is untuned against production latency. The section PUT and the sign hold their connection across the source reads because they must hold the row lock, so a pool that cannot hand out a connection in time fails closed with a 503 (M8_DR_INT_INVENTORY.md). Some PHI writes are still filed by their row trigger as system, not the acting user (note and addendum selection saves, mileage capture and edit, EVV reconcile; recorded in M8_DR_INT_INVENTORY.md). Slice S4: the social-work and chaplain drafts read module 15's sealed plan (the latest version the clinicians signed at or before the visit; the system-built discharge version, made from unsigned working rows, is never read), and an outage of that read blocks signing as the other sources' do. Part 2 is decided per viewer by module 15's own rule (resolveSudAllowed: M39 per actor, then the RN case manager carve-out, redacting on an M39 failure) and cross-checked by the draft against its own verdict, which refuses with 503 a plan module 15 withheld from a viewer the draft clears. Limits: M39 is a fake in the new live suites (test:m7:consent-wiring:live does not mount the new seam read); no live case signs an amendment of a social-work or chaplain note (S1's path, unchanged); the cross-check catches one direction only, and a consent change between the two calls the other way is a race both calls share; the seam asks the rule with the staff session class, as the draft does for module 7 and for M39's acknowledgment read, so module 15's restricted-session refusal does not apply on this path and the route key gate carries it; finalize, sign and an addendum's recompute do not ask discipline_plan.read (S1), so a signer without it who is refused 422 or 409 for interventions or plan learns that open goals or interventions exist for the patient; a goal or intervention carries no family-violence flag (only assessments do), so the draft never consults that rule. Slice S5 (the face-to-face visit's vitals and orders, and the IDG follow-up): M7, M9, M12, M6's benefit period and M39 are fakes in the new live suite, which drives only M15's plan reader over real rows; a physician's or nurse practitioner's note needs no cosigner; finalize, sign and an addendum's recompute of an IDG note do not ask the scale key, care_plan.read or discipline_plan.read (the S3 and S4 limit, extended), and the M39 verdict is asked only when some order could be Part 2, so during an M39 outage a viewer without disclosure learns, from a 503 DRAFT_UNAVAILABLE on a face-to-face draft, that the patient has a SUD or unflagged order (left as it is, on purpose; asking it of every draft would make each depend on M39). Slice S5b (the IDG follow-up's linked action item): the new live suite drives M14's real reader over real action item, meeting, packet and decision rows as the application role, and M39 stays a fake; a signer who lost idg.act since confirming the idg_followup section signs a note without that sentence and is refused nothing (VN-D66), and a signer WITH the key who is refused DRAFT_SECTION_STALE learns that a link stands whose item no longer drafts for them (CW-AC-49); the Part 2 verdict rests on the meeting packet's snapshot (a recorded limit, CW-AC-49).
      owner: clinical-platform
      review_by: 2027-04-30

  - id: CW-AC-51
    title: >-
      The signed text of a drafted note is frozen per section (ADR-0114 §3.1). At sign, in the sign transaction, for a template that has a drafted section and with the tenant switch on, one hearthnote_signed_section row is written per section of the final note (none for any other template): the section block sealed under the tenant key (text_cipher), its SHA-256, the Part 2 flag the compiler set, and the source references of a confirmed section. The rows joined in order by a blank line equal the plaintext of the encounter's final_cipher, pinned by a test, and a failed seal rolls the sign back. The RN admission visit (slice S2b) is sealed the same way, and the source references of a confirmed section there are kinds and ids only (an order, a caregiver or an acknowledgment id), never a name, a contact detail or the content of a directive; the admission live suite pins that the sealed rows equal final_cipher. A face-to-face note by a physician or nurse practitioner and an IDG follow-up note (slice S5) are sealed the same way: a confirmed section cites a source kind and id only (the visit's vitals, a medication order), never a drug name or a sentence, a Part 2 order section cites none, and the new live suite pins that the sealed rows equal final_cipher. An IDG follow-up note's confirmed idg_followup section (slice S5b) is one fixed sentence (a meeting date, a decision-kind label and a due date) and cites its one source, the linked action item, by kind and id only (idg_action_item), never its title, body or decision payload; a Part 2 row's audit image withholds the reference like any other (the sealed row keeps it), and its live suite pins the sealed section's text, content hash and reference, that the sealed rows joined in order equal final_cipher, and that a reader without Part 2 disclosure gets a Part 2 section withheld whole. The application role holds SELECT and INSERT only on the table (append-only), the guard trigger refuses a cross-tenant row and a row whose output belongs to another encounter or whose siting differs from the encounter's, the destruction role holds UPDATE on text_cipher only, the audit image scrubs the sealed text and the content hash (and, for a Part 2 derived row, withholds the source references and files it under compliance_42cfr_part2), and the encounter eraser shreds the text before it deletes the rows. Sign re-writes final_cipher and layer1_cipher from the signer's own recomputed draft in the same transaction, and refuses when Layer 2 took part in the pinned output. The note is read per viewer (the only path to final_cipher is readPinnedNote): a viewer with Part 2 disclosure, or a note with no Part 2 section, gets final_cipher byte for byte; any other viewer gets the sealed rows with each part2_derived section replaced by one generic marker that names no section or content, and a withheld row is never decrypted. The disclosure verdict is M39's as caller module m8 with onError throw, asked only when the note has a Part 2 section and once per read, and an outage is 503 NOTE_VIEW_UNAVAILABLE, never a view. A finalized, unsigned pin carries part2_derived (migration 1522) and is withheld whole from a viewer without disclosure, since it has no rows to cut by. The readers are GET /api/v1/encounters/:encounterId (finalDocumentation) and the M22 render payload (EncounterReaderStore.renderPayload, seams/drizzle-store-ops.ts; the seam itself reads no narrative); the M22 render payload is always the withheld view for a note with a Part 2 section, the entitled author included. A signed note is amended only on the addendum path (VN-D30), and the original rows are never rewritten: an amendment adds a hearthnote_signed_section row carrying addendum_id and amends_section_id (always set together; the guard trigger checks that the section and position match the original, that the encounter and pin are the same and that the addendum is still finalized), written in the addendum's sign transaction before its status flips and sealed under the tenant key like the originals. The current view of a section is its latest amendment; the history keeps every version for a viewer with disclosure; for a viewer without it a section that has a Part 2 version at any time is withheld whole by one rule everywhere: the current view shows its position, a withheld flag and the generic marker only, with no section id, amending addendum, author or date, the history omits it, and addenda[].amendsSectionIds drops its id; an addendum whose named sections are all withheld reads as a free addendum (cosignStatus not_required). m8.encounter.section_amended is an outbox event naming ids only (a flag would tell a subscriber which section holds Part 2 content) and an audit event, one per signed addendum that amended a section, written in the addendum's sign transaction with `after` {addendumId, sectionCount} only (no section id, no Part 2 flag, standard retention class, because audit.read is not Part 2 gated); the per-section trail is the row-trigger audit of hearthnote_signed_section (actor attributed, text and hash scrubbed, a Part 2 row filed under compliance_42cfr_part2); no patient, text, content hash or source id is in either event. An author without Part 2 disclosure cannot add an amendment row to a note that holds Part 2 content (CW-AC-50). Migration 1525 refuses to re-parent a pin or change its kind, organization or Part 2 flag once the note is signed, refuses a pin INSERT over a signed, cosign_pending, cosigned or voided encounter and accepts original sealed rows only while the encounter is finalized. A narrative with a Part 2 section is never handed to Layer 2 (layer2OutcomeFor).
    hipaa: ["164.312(c)(1)", "164.312(b)", "164.312(a)(2)(iv)"]
    soc2: ["CC6.1", "CC7.2"]
    status: partial
