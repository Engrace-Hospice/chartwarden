  - id: CW-AC-21
    title: >-
      A tenant's DoseSpot clinic key is sealed per tenant (AES-256-GCM under the tenant's own key-ring DEK, the envelope bound to its organization, environment and clinic) and never returned, logged or audited in the clear; the audit trigger records only that it changed. The registration is written only by the tenant's organization administrators (prescribing.clinic.admin: org-level, a fresh step-up, a human (non-AI) actor and an Idempotency-Key on every write; If-Match, a version precondition, is read by the save (PUT) alone: verify, activate and deactivate do not read it) or by a platform operator for a tenant that is still onboarding (tenant_dosespot.write_platform on the platform_ops role, a fresh step-up, a recorded reason; a deactivation is the one write a live tenant also needs), both under the tenant's own row-level-security scope. It goes live only in order: saved, a no-PHI connection test passed, then activated by the tenant's own administrator alone (the platform lane has no activate route, and the service refuses an activation by the platform lane with 403 DOSESPOT_ACTIVATION_TENANT_ONLY, even over an already-active registration and before it checks the registration exists; the platform lane may still deactivate, which only stops e-prescribing, and wizard step 10 settles from the tenant's own activation or by attestation, so go-live never waits on an operator); any change to the environment, clinic, clinician or a key returns it to registered, clears what the old key earned and pauses e-prescribing (newly signed orders activate locally, queued ones wait); when the registration was active (or an organization the env fallback was serving first saves a row of its own), the tenant's administrators are alerted, and a change to a registration that was not active pauses nothing and alerts no one. A change of environment or clinic also clears, in the same transaction, every id DoseSpot issued under the old clinic: the roster's vendor prescriber ids, enrolment markers and NPIs, the patients' vendor patient ids and the created-prescription id of every transmission still waiting, which also gets a fresh idempotency key so the new clinic never sees the old one (a finished transmission, one whose vendor call has begun and one held for a person keep their id and key: a worker that is alive clears its own created id when it sees the move, and a dead one's is what the administrator looks for), because those ids are scoped to one clinic of one environment and DoseSpot refuses them for good under another; the adapter's in-process memory of a created-but-unsent prescription is keyed by the clinic it was created under and never served under another; the prescribers are then re-enrolled and the patients re-synced under the new target, a queued order whose prescriber is on the roster, not revoked and not yet re-enrolled is not claimed (it costs no write and cannot starve other orders; a revoked prescriber's order still fails), and a prescriber enrolled in the sandbox cannot carry that enrolment into production, whose NPPES gate applies at the re-enrolment. A vendor round trip that began under the old clinic (a prescriber enrolment, a patient upsert, a prescription create and its send) never writes its id after the move: each captures the registration's clinic before the call and, in the transaction that writes the id, takes a shared advisory lock that the reset holds exclusively and compares the clinic again, so a write that began first commits first and is then cleared, and a write that starts later waits and is refused; a refused write is dropped and logged with ids and a class only (an enrolment answers 409 DOSESPOT_REGISTRATION_MOVED, leaving an orphan clinician at the old clinic). A tenant names an environment, never a URL (the host is platform configuration), and production is refused unless the platform enables it. That DOSESPOT_PRODUCTION_ENABLED is set only once the ChartWarden / DoseSpot BAA is executed and a sandbox run has confirmed the wire shapes is operating policy, not a machine check (CW-BA-01): the flag is the operator's declaration, and the boot warns once per process when it is true. A sandbox registration can be tested anywhere, but its activation is refused, and an already active one stops being live, unless the platform sets DOSESPOT_SANDBOX_ENABLED to exactly true. That flag is likewise the operator's declaration of what the deployment is, not a machine check of it (nothing detects a production deployment, as CW-SEC-02 does not check a secret's entropy): keeping it unset on a production deployment is operating policy, and a deployment that sets it on a production build sends its sandbox registrations' prescriptions to DoseSpot's test environment and not to a pharmacy, so the boot warns once per process when it is true under NODE_ENV=production; there is no hard refusal (a demo deployment legitimately runs the sandbox on a production build). The resolver, the sign-time gate and the onboarding wizard's settled fact all answer "is this registration live?" with the same predicate. The flag governs database registrations: a tenant served by an entry in the operator's DOSESPOT_TENANT_CONFIGS fallback (an organization with no registration row) is outside it, because the operator names that entry's host and credentials in the deployment's own configuration. Prescriber enrolment and the connection test reach the sandbox host whether or not the flag is set; they send only public provider data (an NPPES-sourced NPI and name) or none at all, never a prescription or any PHI. A database registration is served by itself alone (an env entry never serves a row that is not active). No route can set EPCS (a registration resolves epcsCertified false, so the D18 certification gate stands). An order queues for e-prescribing only when the org's DoseSpot is live and the signing prescriber is linked to DoseSpot. A prescriber is enrolled with DoseSpot under the NPI and legal name of the NPPES-sourced physician record the prescriber roster links the member to, never under values a person types (the request carries none), cross-checked against NPPES's public directory: an active individual NPI whose surname matches, and an NPI NPPES does not list is refused on a production registration and flagged on a sandbox one. The link from the member to that record is made by a roster administrator (prescribing.admin.roster, a fresh step-up, a human actor and an Idempotency-Key, on the link and the revoke routes alike), who is recorded as the link's maker (another administrator re-saving a link the member made themself becomes its maker and clears any confirmation made under it); the linker and the confirmer must be different members: a member cannot confirm a link they made themself (409 DOSESPOT_LINK_SELF_CONFIRM, re-checked in the statement that writes the confirmation), and the enrolment gate refuses a link whose recorded maker is its confirmer (an application rule: the column carries no constraint). A link with no recorded maker (made before the column existed, or written outside the roster route, for example a seed) cannot be confirmed (409 DOSESPOT_LINK_MAKER_UNKNOWN, also required by the statement that writes the confirmation) and cannot pass the enrolment gate (the gate and the statement that records the vendor id both require a recorded maker who is not the confirmer) until an administrator re-saves it, which records that administrator as its maker and clears any confirmation made while the maker was unknown. The link is confirmed by the PRESCRIBER from their own account before any enrolment (the signed-in member is shown the record's name and NPI by a read that is not step-up gated, and confirms with a fresh step-up, a human actor and an Idempotency-Key, pinned to the link and NPI they were shown): the enrolment is refused on the tenant lane and the operator lane alike until a confirmation made by the roster row's own member matches the current link and the record's current NPI, and the vendor's id is recorded only while that confirmation still stands (re-checked in the statement that records it); a re-link or a revoke clears it. Who can confirm is enforced in three layers of different strength. In code, no operator or administrator route confirms, and the prescriber's own session (never a typed member id) selects the row. In the table, a CHECK requires every confirmation column to be set together and the recorded confirmer to be the row's own member. A trigger refuses a write that sets or changes a confirmation unless the transaction's declared actor (app.user_id) is that member's own user; clearing is open to any actor. The trigger is a backstop on the declared actor, not authentication: code that can set that variable could declare any user, so the control relies on the application declaring only the session's user. The service's own audit entry for a confirmation carries ids only (the roster row, the physician record, the actor); the table's write-audit trigger also records the row's columns, so the confirmed NPI (public provider data) is in that record.
