  - id: CW-AC-20
    title: >-
      For a tenant that bills outside ChartWarden, ChartWarden transmits no NOE or NOTR: queued notices are parked, the worker refuses to send a notice recorded as filed outside, and a transfer notice is refused at submit (409 CLAIMS_FILE_WITH_YOUR_BILLER). The tenant records the filed date; a record after the CMS deadline raises a critical alert to the tenant's billing and compliance roles and an ops notice. A tenant's record never clears a breach stamp the watchdog set, and a record that contradicts one raises the alert with both dates. Only a platform operator (tenant_notice_filing.withdraw_platform on the platform_ops role, a fresh step-up, a human (non-AI) actor, an Idempotency-Key, If-Match on the record, a required reason) can withdraw a mistaken record; the audit row names the operator, the tenant, the reason and the withdrawn date, a breach stamp the watchdog set is kept, and one written by the withdrawn late record itself is cleared. The filed date is the tenant's own word: ChartWarden does not check that CMS accepted the notice, recording it takes the notice out of the window watch's scan (the watchdog stops scanning a filed notice, and no DDE work item is queued for an outside tenant at all), and a recorded NOTR clears the prior-election gate.
