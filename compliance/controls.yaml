      - file: apps/backend/src/modules/08-encounters/M8_DR_INT_INVENTORY.md
    gap:
      reason: The object-store second copy (compose.object-copy.yml, a RustFS replica; NOT enabled in production) would receive a D12 shred only on its next hourly run, a large erasure is held by its mass-delete guard until an operator names the bucket, a bucket dropped on the primary is never removed there, and a --restore after a shred brings destroyed objects back (objects are plaintext, so crypto-erasure does not cover them). Before enabling it, propagate D12 shreds to the copy target and add a replica step to the destruction runbook. The retired MinIO volume (`<prefix>_minio-data`) kept after the SeaweedFS cutover is also a full copy of every document, in plaintext, outside the backups, outside compose (compose.yml no longer declares it) and, beyond a warning, outside preflight.sh, until an operator removes it (deploy/production/README.md, the section on removing the retired MinIO data; the removal deadline is the owner's decision and none is recorded here). A closed tenant's sealed clearinghouse credential (tenant_clearinghouse_config) and its held credential fingerprints (tenant_clearinghouse_credential_reservation) have no purge path (neither table grants DELETE to the application or the destruction role, both reference the organization row with ON DELETE RESTRICT, the M23 billing eraser run by the M34 tenant shred has no step for them, and the credential is sealed under the platform KEK rather than the tenant's DEK, so destroying that DEK does not make it unreadable), so they stay, and the fingerprints keep reserving the credentials, until a database-level procedure removes them. Tenant-pricing financial records are retained records that an eraser must not delete. Published plan versions and final statements cannot be deleted through the application or platform credential (guard triggers, CW-PI-01). The signed contract, the statement and the statement review tables reference `subscription` with ON DELETE RESTRICT, and the billing-mode history references the contract, which itself restricts onto `subscription`, so deleting a subscription that has them fails. patient_census_daily has no foreign key to protect it (it is keyed by organization), and it is the input a final statement's census figure was computed from. Any future M35 offboarding eraser must therefore treat all of these as retained financial records, and decide on the census rows deliberately, not as tenant data to shred. M10 iQIES submission packages are still not reached by any retention scan, eraser or purge in two cases, and no eraser or purge owner is named, which is a human decision. (a) The package ZIP (`hope_submission.acceptance_report`) of every batch that was not cancelled (a packaged or exported batch nobody cancelled, a marked-uploaded batch, which is kept for the CMS 10-year hold, and a resulted batch). (b) The per-item column `hope_submission_item.iqies_validation_result` of a patient whose `hope_record` was destroyed (`hope_submission` carries no patient id, spec §4.8); it holds the record's XML (name, date of birth, MBI or SSN) until a CMS result is recorded for that item, after which it holds the CMS report row that replaced it (assessment id and free-text message). The package ZIP in (a) still holds the XML either way, and the HOPE eraser reaches neither. The design that would close (b) is a purge keyed through `hope_submission_item.hope_assessment_id` to the patient; it is not built. Bytes that a legal hold, or an unreadable hold scope, kept at cancel are purged only when an operator REPEATS the cancel after the hold is released, by a manual, API-only step (the web offers Cancel only on a batch that was never uploaded) that needs a NEW Idempotency-Key, because a same-key repeat replays the cached 2xx for 24 hours and never reaches the purge, and that re-reads the scope, purges and writes one repeatCancel audit event. There is no automatic purge on release and M4's hold release does not signal M10, so until an operator repeats the cancel the bytes stay (the runbook paragraph is in apps/backend/src/modules/10-hope/M10_DR_INT_INVENTORY.md). The cancel reads the hold scope as one statement after the batch row lock, and nothing locks legal_hold, so a hold committed after that statement and before the cancel commits is missed (a statement-sized window), and the cancel can purge bytes that hold would have kept. The cancel purge is a logical deletion, so the NULLed jsonb leaves dead tuples until vacuum, and the old values stay in the WAL, replicas and backups until their retention expires. The M8 encounter eraser reads no legal hold and relies on the M34 shred preflight, which refuses the tenant while any hold is active; that check is not in the eraser's transaction, so a hold committed after it is missed. The audit_event before and after images from the M8 write-audit triggers (migration 0031) keep clinical values their denylists do not name (vitals numbers, hearthnote_selection.selections, encounter_signature.attestation_text, mileage figures), and the eraser's own deletes add more; this is retention by design (retention class compliance), not erased. M8 outbox payloads carry reason text, and failed dead letters are never purged. The eraser refuses, before any write, a connection that is not chartwarden_destruction. WF09 erasers (the M8 ADL and nutrition rows and encounter tombstone, the M9 wound and observation rows, the M7 change proposals) are proven only over a privileged connection that bypasses RLS and grants. No suite deletes those five tables as chartwarden_destruction, so the SELECT and DELETE grant and the org-pinned policy that migrations 1528 to 1532 give that role are declared but unexercised, and the M9 wound step is driven directly through eraseWoundSubtree, not through the registered assessment eraser under a destruction certificate. The off-site Object-Lock backup mirror (cw-backup.sh, DR_BCP sections 4.2 and 4.8.7; enabled in production per the owner (statement of 2026-11-23), with no evidence in the repo) is out of reach of a D12 shred or DEK destruction. Its objects are SSE-C encrypted under one platform backup key, not the tenant's DEK, so destroying a DEK does not make them unreadable. The sync uses no --remove and the backup key's policy template (offsite-policies/backup.json, attached by the operator) allows no delete under objects/; the operator-set lifecycle (DR_BCP section 4.8.3, not checked by the script) expires noncurrent versions and delete markers only, so nothing is shown to delete an erased object afterwards. The operator creates the COMPLIANCE lock and the script verifies only its mode and a BACKUP_OFFSITE_MIN_LOCK_DAYS minimum; the lock blocks even the bucket owner until it expires, and lock and key-policy behaviour is proven only against a MinIO stand-in. A restore from the second copy (not enabled) would bring back the erased objects it still holds, and a restore-objects restore from the mirror brings back objects erased after the chosen snapshot's manifest was taken (a hand load of objects/ brings back all of them); nothing replays the erasures automatically, and DR_BCP section 6.3 step 5 has the operator re-run them. The M24 and M25 payer-readiness tables (migrations 1535, 1538, 1543) are reached by no eraser. medicaid_program_assignment (a writer exists, so rows accumulate) and medicaid_payer_authorization_event are patient-keyed (patient, coverage and admission ids; the authorization event also carries an encrypted authorization reference), and medicaid_era_review_history is append-only for every role, so none can be deleted or de-identified through the destruction path (the M24 eraser covers three older tables), and medicaid_era_review.safe_summary holds claim and submission ids with per-claim paid and patient-responsibility cents. The two hospice pricing tables of migration 1551 (medicaid_hospice_billing_evidence and medicaid_claim_line_pricing_snapshot) and the continuous home care preparation table of migration 1557 (medicaid_chc_pricing_preparation) are append-only too and carry patient, admission and address ids and the stored price, so they have the same gap. The erasure design (a destruction grant with a guard that admits only that role's DELETE, or crypto-shredding of the references) is an open owner decision, to be made before the first patient-erasure request touches M24 or M25.
      owner: platform
      review_by: 2027-01-31

