  - id: CW-AC-10
    title: >-
      Shared Claim.MD responses on the platform's own Claim.MD account require current immutable tenant ownership before
      acknowledgment application, and while that account's capture or dispatcher runs no per-provider poll reads it. Scope comes from
      the immutable submission evidence's account reference and usage, not from an organization list, so an organization that later
      moves off the platform account still receives the platform account's responses for the claims it sent through it. The capture
      never reads a tenant's own sealed Claim.MD account: that tenant's acknowledgments come only from its own per-tenant poll, under
      its own binding, capture on or off, and are stored under keys and cursors of its own (never the platform account's).
    hipaa: ["164.312(a)(1)", "164.312(c)(1)"]
    soc2: ["CC6.1", "PI1.4"]
    status: partial
    evidence:
      - script: arch:tenancy
      - script: arch:tables
      - file: packages/db/migrations/1354_m23_claimmd_ack_application.sql
      - file: apps/backend/src/modules/23-billing-medicare/claimmd-ack/service.ts
      - file: apps/backend/src/modules/23-billing-medicare/claimmd-ack/service.test.ts
      - file: apps/backend/src/modules/23-billing-medicare/claimmd-capture/config.ts
      - file: apps/backend/__tests__/m23-claimmd-ack-account-scope.test.ts
      - file: apps/backend/src/modules/41-billing-commercial/jobs/ack-worker.org-binding.test.ts
      - file: apps/backend/__tests__/m23-clearinghouse-injection.test.ts
      - file: apps/backend/__tests__/m25-clearinghouse-pull.test.ts
    gap:
      reason: The dispatcher is disabled by default and source-level ownership checks exist, but private PostgreSQL NOBYPASSRLS and platform-role transaction tests, synthetic account response certification, and BIL-1.1 capture runtime wiring are still required before activation. A tenant's own Claim.MD account is polled by the legacy provider poller, which main judged unable to label Claim.MD's normalized events as X12; M23 records those acknowledgments as ack_999 / ack_277ca and M41 records them as unknown_legacy (owner decision 2026-11-08). The database blocks reuse of a credential, not of a vendor account. Where a vendor issues several keys for one account (Stedi may; not confirmed against its documentation), a second organization could connect that account with a different key.
      owner: platform
      review_by: 2027-01-31

  - id: CW-AC-09
    title: Portal admission-document signing — a fail-closed authority matrix (who may sign which document, under which role), a signature request that tenant-isolates and audits the signer without PHI in the audit trail, and an append-only status lifecycle
    hipaa: ["164.312(a)(1)", "164.312(c)(1)", "164.312(d)", "164.312(b)"]
    soc2: ["CC6.1", "CC6.3", "PI1.4"]
    status: partial
    evidence:
      - script: arch:tenancy
      - script: arch:migration-compat
      - file: apps/backend/src/modules/31-portal/portal-signing-authority.ts
      - file: apps/backend/src/modules/31-portal/__tests__/portal-signing-authority.test.ts
      - file: packages/db/migrations/1304_m31_portal_signature_request.sql
      - file: apps/backend/src/modules/31-portal/routes/signature.routes.ts
      - file: apps/backend/src/modules/31-portal/write-paths/sign-admission-document.ts
      - file: apps/backend/src/modules/31-portal/routes/signature-staff.routes.ts
      - file: apps/backend/src/modules/31-portal/routes/signature-staff-store.ts
      - file: apps/backend/src/modules/31-portal/write-paths/accept-uploaded-copy.ts
      - file: packages/db/migrations/1308_m31_portal_signature_request_upload_review.sql
      - file: packages/db/migrations/1309_m31_portal_push_endpoint_reader.sql
      - file: apps/backend/src/modules/31-portal/outbox-consumers/signature-request-push.ts
      - file: apps/backend/src/modules/31-portal/seams/signature-push-recipients.ts
      - file: apps/backend/__tests__/m31-signature-requests.live.test.ts
    gap:
      reason: The portal list / detail / sign routes (TOTP step-up, Idempotency-Key, session-class permissions, grant ABAC, the per-grant matrix, the DPOA source-consent check through M39's ConsentEvaluator) the uploaded signed-copy attach (same authority matrix as signing, parked for review, never signed by the upload) and the staff create / list / void / review routes (portal.signature_request.create/read/void/review, caseload-or-scope patient guard, one open request per document, no signer text in staff views, read audit) are proven on a real database as chartwarden_app, including the M06 Election Statement and Notice of Rights seam against a real admission. The outbox events carry ids only (proven against the catalog-validating publisher). Accepting an uploaded copy records M39 as an uploaded signed PDF by the reviewer (NPP and Consent to Treat only; an election or notice-of-rights copy is recorded in the M06 admission workflow). The push to the people who can sign (a fixed generic line through M36's sanitizer, eligible people only - a live grant that may sign the document, an active portal account and a verified push device) and the daily reminder are built; the portal classes now hold notifications.endpoint.manage so a signer can register their own phone (self-only routes). The M36 recipient filter and default preferences admit only ACTIVE portal accounts, through a port M31 supplies. Delivery to a real phone through FCM, APNs or Web Push is not proven here (the plan and delivery rows are proven on a real database). Portal sessions may register only a phone's native push token (fcm or apns), never an sms, email or web-push target, and attaching a signed copy needs the same fresh step-up as signing. The staff signature-request keys are held by default only by the two full-catalog roles (administrator, org_admin; migration 1312 backfills existing tenants); every other role gets them only as an admin assigns them. Accepting an uploaded copy signs an M39 consent, so it also needs M39's own sign gate (consent.sign plus a fresh step-up, proven live); rejecting needs the review permission alone. Every document has wording the portal shows before signing; the Election Statement, Notice of Rights and Consent to Treat wording is a pending-legal-review placeholder, and one rule (portalSigningBlocker, keyed on the request's version and the current wording) keeps draft wording from being sent, signed, accepted as a paper copy or reminded unless PORTAL_ALLOW_UNREVIEWED_TEMPLATES is set, which is refused at a production boot (proven live). A paper copy staff reject is marked rejected and cannot be attached again, and one upload backs at most one request (unique index, proven live). A consent an accept signs but cannot record, because the request was voided, rejected or accepted with another consent meanwhile, is revoked by the accept itself (proven live). A review names the copy the reviewer was shown, so a copy replaced since is neither accepted nor refused unseen (409, proven live). A consent left active by an accept that failed after M39 signed (a crash between the two transactions) records the copy it came from, is never reused for another copy, and is revoked by a reject of that copy, a withdrawal of the request or the next accept (proven live). That revoke happens under the review or void permission alone, not M39's revoke gate, because it can only reach a consent a failed accept of the same request left behind. If it fails after a reject or withdrawal has committed it is logged; after a reject the next accept revokes it, after a withdrawal nothing retries it, and a patient e-signing the reopened request does not revoke it. An accepted signed row must name its signer role, grant kind and the record it signed into (migration 1311). Push delivery re-checks the same draft-wording rule, so an event queued before a gate applied sends nothing. The signer is recorded as the audit actor. Accepted for now - a paper copy uploaded by a caregiver or agent is accepted without the relationship and patient-unable reason the portal sign path collects, a portal person's push endpoints are not yet removed when the account is deactivated, the web-push target for staff sessions is not host-allowlisted (an existing M36 behavior), signer evidence columns are plaintext (scrubbed from audit images), there is no retention or legal-hold link for the table yet, and staff create / void do not require step-up (permission + patient scope + idempotency only) - so the control stays partial.
      owner: engineering
      review_by: 2026-12-31

