  - id: CW-AC-15
    title: >-
      Tenant onboarding steps are strictly ordered on the server (409 ONBOARDING_STEP_OUT_OF_ORDER on both the platform and tenant routes), and a human settles a step only with required evidence (a note, plus an optional reference) recorded on the task with the attester and time and audited by the row trigger; a tenant actor must hold the step's owner role; go-live cannot be skipped or attested as an ordinary step, and a skip settles only a non-canonical catalog step (added by platform ops) or a canonical step on the server's own skippable list (MAC credentials, payer enrollment, DoseSpot kickoff, sample data): a skip of any other canonical step, the plan, the BAA and the provider entity included, is refused with 409 ONBOARDING_STEP_NOT_SKIPPABLE, so the console's Skip button is not the control; canonical templates are migration-owned, and the catalog route refuses a POST naming a canonical template's key with 409 ONBOARDING_TEMPLATE_CANONICAL, so a canonical step cannot be made non-canonical (and so skippable) through it; on the platform carrier the catalog table grants INSERT (table-wide) and UPDATE only on the upsert's columns (display label, description and order; migration 1425, whose column grant on the canonical flag migration 1476 revokes because the route never writes it), so platform ops can add a non-canonical step and re-edit it but cannot rewrite an existing step's key, owner role or settings, and the carrier holds no DELETE on it; a role-checking trigger (migration 1476, the precedent of the destruction-role triggers: a non-superuser member of the carrier) also refuses the carrier any INSERT or UPDATE that makes a catalog row canonical or changes one that is, so a canonical step, which gates go-live for every tenant, changes by migration only whatever shape the statement takes. A change to the catalog is a named operator's decision like every other ops write: POST /platform/onboarding-templates takes the catalog key, the platform-ops predicate, a fresh step-up, an Idempotency-Key, a reason screened for patient identifiers and no AI actor, and leaves an m34.onboarding_template.upserted audit event naming the operator and membership, the reason and the step (the catalog table's own row trigger records no actor whatever the session says, so that event is the record). An `either` step may be attested by its owner (the tenant's org_admin or platform ops) even when its automatic fact does not hold: the go-live approver reviews that evidence, and any later change to the onboarding data revokes a pending go-live attestation. Every free text the wizard stores (evidence, reasons, skip rationale, blocker reason, go-live note, the operator's onboarding-data reason) is cleaned and screened for patient identifiers.
      Tenant onboarding steps are strictly ordered on the server (409 ONBOARDING_STEP_OUT_OF_ORDER on both the platform and tenant routes), and a human settles a step only with required evidence (a note, plus an optional reference) recorded on the task with the attester and time and audited by the row trigger; a tenant actor must hold the step's owner role; go-live cannot be skipped or attested as an ordinary step. An `either` step may be attested by its owner (the tenant's org_admin or platform ops) even when its automatic fact does not hold: the go-live approver reviews that evidence, and any later change to the onboarding data revokes a pending go-live attestation. The wizard's free text that goes through its text cleaning (the evidence note and reference, reasons, the skip rationale, the blocker reason and the go-live note) is cleaned and screened: NUL is refused (422 ONBOARDING_TEXT_INVALID), every other control character except tab and newline is stripped, so are the zero-width and bidi format characters U+200B, U+200E, U+200F, U+202A to U+202E, U+2060 to U+2064, U+2066 to U+2069 and U+FEFF (U+200C and U+200D are kept), and the text is screened for an SSN- or MBI-shaped value (422 EVIDENCE_LOOKS_LIKE_PHI, which never echoes the value) as typed, before any stripping, and again as stored. The org profile display name is trimmed and screened once, with its own refusal text and no control-character cleaning. The operator's onboarding-data reason has its own cleaning (whitespace runs become one space and every control and format character is removed) and the same screen, as typed and again as stored. The screen is a best-effort guard against an accident, not a defence against someone hiding a value: an unbroken run of ten to twelve digits, digits written as words and more than ten non-whitespace separators between groups are not refused (packages/shared/src/text/patient-identifier.ts lists its known gaps).
