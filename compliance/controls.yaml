  - id: CW-AC-22
    title: >-
      A platform operator can upload a tenant's signed BAA and file nothing else in the tenant's documents. The key tenant_baa_document.upload_platform (platform_ops alone; it is not documents.upload, and the role holds no documents.* key) opens one route, POST /api/v1/platform/tenants/:orgSlug/baa-document, behind the tenant_lifecycle_platform_ops predicate, a fresh step-up, a human (non-AI) actor, an Idempotency-Key and a required reason that is screened for a patient identifier. The body is the bytes, their type and the reason; it names no kind, patient or title, and the route files exactly one kind (tenant_baa), which the generic upload route refuses (422). The file passes the documents pipeline's own gate (size at most 10 MiB, a declared Content-Length over the limit refused with 413 before the body is read, type allowlist, magic bytes, a server-computed SHA-256, the production-required M22 clamd malware scan, which fails closed when scanning is unavailable) and is filed on the target tenant's own RLS scope (app.org_id) in its own bucket, only while the tenant is being set up or live (an explicit allowlist: provisioning, onboarding, active, at_risk, suspended, so a live tenant's renewed agreement is filed the same way; 409 for a tenant that is offboarding or later, audited). The route is rate-limited per user per target tenant (fail-open, an availability control), and the platform vhost raises nginx's 1 MiB body cap to 16m for this one route only (with a 30 s client body timeout and a 90 s upstream read timeout; in the repo vhost both API locations take their proxy headers, the stripped X-CW-Actor-Assertion included, from one shared snippet; the snippet also REPLACES X-Forwarded-Host with the matched host, which the API trusts from that peer, as the tenant vhost does; the operator procedure in deploy/production/README.md installs that snippet and the limit zones first and edits the certbot-edited live vhost in place rather than overwriting it (it no longer offers to copy the repo vhost over the live one), a procedure, not an enforced property; the BAA location also takes a per-address nginx request limit (6 a minute, burst 3) and connection limit (2), refused with 429, from zones defined in an http-context file (chartwarden-platform-limits.conf, installed to conf.d; `nginx -t` fails on a vhost that names a zone that is not there), because the application limiter runs only after nginx has buffered the body; pre-auth buffering is therefore bounded in size by the 16m cap per request, in count per client address by those limits (the connecting address: behind a terminator they share one bucket until the real client address is restored) and kept off the staff hostname by the dedicated platform hostname, but not in time: the 30 s client_body_timeout limits only the gap between two reads, so a slow sender that keeps trickling bytes is bounded in how many connections it may hold open, not in total time); the malware scan and the object store's put share one 30 s deadline, and the clean-up of an object after a failure gets its own 30 s bound (the scanner, the put and the delete are handed an abort signal and are raced against it, so a call that ignores the signal is abandoned rather than awaited, and a scan or put that does not answer is a 503), because the upload runs while the write's transaction and the onboarding lock are held; the worst case that hold lasts is therefore about 60 s. The clean-up is best effort: a delete that fails or times out leaves an orphan object, and an abandoned put (it may still land) is always warned about and deleted again if it settles late; every such warning is written by the production logger (the upload service takes it as a required dependency, so an unwired service does not compile) and names the objectKey. No sweep exists yet, so an orphan is reconciled by objectKey. The route reads and lists no document: the generic document reads stay 403 for the role. A filed BAA is immutable to the tenant's own routes: every generic write path (a new version, a metadata edit, a link, a tag) refuses the kind with 409 DOCUMENT_IMMUTABLE whatever documents.* keys the tenant's user holds. The BAA register links only a document that is a tenant_baa row of the record's own organization (422 BAA_DOCUMENT_INVALID for another tenant's document, another kind or an unknown id, judged in the write's transaction whenever a record is created with a link, an update changes the link or makes the record executed; an update that does neither, such as a new expiry on an executed legacy row, is not re-judged, and that row's document is still judged by go-live and step 3; the platform credential reads five columns of document for it (its id, organization, kind, lifecycle status and the creator's membership id; migration 1477), never a title, patient or object key, and a document in the destroyed_tombstone status is not a filed agreement, while legal_hold and superseded still hold the signed copy), and onboarding step 3 settles only on a governing BAA whose document verifies the same way. Go-live approval refuses the operator who UPLOADED the file as well as the one who recorded or last changed the register row (409 GO_LIVE_APPROVER_WROTE_BAA, compared by the document's creator membership; a document whose creator is not recorded cannot be judged). The register's create and update take no onboarding lock and no status gate (a live tenant's renewal is a register write): each voids a pending go-live attestation in its own transaction and approval settles that attestation only while it is still pending, so a register write either lands first and the approval is refused (409 GO_LIVE_NOT_ATTESTED) or lands after the approval, an ordering any later BAA change already has, and never approves on a BAA the write changed first. The platform audit row names the operator, the tenant, the reason, the document id and the digest (never the bytes), the document's own write-audit trigger attributes the insert to the operator, and a failure after the object was stored rolls the rows back and removes the object, except that after a COMMIT that failed without a refusal the database answered with a definite error class (a lost connection, or a connection-class or server-error SQLSTATE: 08xxx, 57P0x, 40003, 58xxx, XXxxx, so the commit may have landed) the object is kept and the failure logged with its objectKey (deleting the file of a document that exists would lose the agreement; if the commit did not land the object is an orphan, reconciled by objectKey); a commit the database refused with a definite error class (a serialization failure, a deferred constraint) is a rollback and the object is removed. The BAA register's executed-means-linked rule and the go-live guard both rest on the same document check, so an executed BAA whose link does not verify does not satisfy go-live; the check is a required dependency of the builders that judge go-live (the platform service and the wizard runner), and an input to the guard that does not say whether the document verifies is not an executed BAA (documentFiled is a required boolean and the guard requires true), and an onboarding advance wired without it settles step 3 on nothing, so no wiring can leave the guard resting on the status alone. Whether tenant destruction keeps tenant_baa documents for the six years 45 CFR 164.316(b)(2) asks is UNVERIFIED here: the agreement is filed with the compliance retention class, but no test in this repository proves the destruction path preserves it.
    hipaa: ["164.312(a)(1)", "164.312(b)", "164.308(a)(4)", "164.308(b)(1)"]
    soc2: ["CC6.1", "CC6.3", "CC9.2"]
    status: partial
