  - id: CW-AC-24
    title: >-
      New claims work follows the tenant's own clearinghouse: a tenant may START new claims and eligibility work only when its chosen Stedi or Claim.MD configuration is active and its ChartWarden subscription is not suspended, paused or canceled; otherwise the request is refused with 402 and the reason (clearinghouse_not_chosen, clearinghouse_outside, clearinghouse_not_active, clearinghouse_baa_revoked, subscription_suspended, subscription_paused, subscription_canceled) and a queued job is held, not failed. CMS-deadline NOE/NOTR and transfer notices, voids and in-flight work are exempt from this claims-billing gate only, not from the clearinghouse hold: a separate worker pre-flight HOLDS (moved back to delayed, no attempt spent, no DLQ) every claim job (a void included), NOE, NOTR and transfer-notice job of an organization whose clearinghouse is not live (nothing chosen and not named in CLEARINGHOUSE_ENV_FALLBACK_ORG_IDS, a draft or verified configuration including right after a credential rotation or a re-recorded BAA, or one whose BAA a platform operator revoked, or outside; for outside an NOE and NOTR are parked for the tenant to file, the transfer notice stays held), in every enforcement mode, shadow included, and its acknowledgment and 835 pulls are skipped (for a revoked BAA the held-work alert names the reason, and each pull raises a once-a-day alert per organization while production attempts are in flight or were sent in the response window). A held NOE, NOTR or transfer notice raises a critical alert (a held claim a warning), once per organization, reason and severity per six-hour window. The alert's dedupe key in the alert emitter carries its severity, queue, reason and window, so neither severity absorbs the other and each re-alerts when a window turns over, and the quiet window starts only after the emitter persisted the alert with at least one resolved recipient (persisted, not delivered, since out-of-band delivery follows each recipient's own preferences; an alert that resolved nobody is logged and retried, and reaches nobody until its window turns over). When enforced, a failed read of either decision fails closed (503 BILLING_ENTITLEMENT_UNAVAILABLE) and a new-work request with no organization context is refused. The claims-billing add-on remains platform-controlled though it no longer decides the gate: only platform operators (platform credential, subscription.admin.write, fresh step-up, a human (non-AI) actor, Idempotency-Key) can grant or cancel it, and a tenant can read but never write its own entitlement.
    hipaa: ["164.312(a)(1)", "164.312(b)", "164.308(a)(4)"]
    soc2: ["CC6.1", "CC6.3", "CC8.1"]
    status: partial
    evidence:
      - script: test:m23:tenant-clearinghouse:live
      - script: test:claims-billing:worker-hold:live
      - script: test:m35:claims-billing-addon:live
      - script: arch:tenancy
      - script: arch:migration-compat
      - ci: "M23 tenant clearinghouse"
      - ci: "M35 claims-billing add-on"
      - file: apps/backend/src/bootstrap/claims-billing-gate.ts
      - file: apps/backend/src/modules/23-billing-medicare/tenant-clearinghouse/resolver.ts
      - file: apps/backend/src/modules/23-billing-medicare/jobs/clearinghouse-unbound-hold.ts
      - file: apps/backend/src/modules/23-billing-medicare/jobs/m23-pre-run-hold.test.ts
      - file: apps/backend/src/modules/23-billing-medicare/jobs/clearinghouse-unbound-hold.test.ts
      - file: apps/backend/src/modules/41-billing-commercial/jobs/unbound-alert.test.ts
      - file: apps/backend/src/modules/36-messaging/cron-alert-correlation.ts
      - file: apps/backend/src/modules/36-messaging/cron-alert-correlation.test.ts
      - file: apps/backend/__tests__/clearinghouse-hold-alert-dedupe.test.ts
      - file: apps/backend/__tests__/claims-billing-route-classes.test.ts
      - file: docs/adr/ADR-0110-claims-billing-addon-entitlement.md
      - file: packages/db/migrations/1321_m35_claims_billing_addon.sql
      - file: apps/backend/src/modules/35-subscription/addon/addon-service.ts
    gap:
      reason: Enforcement ships in shadow mode (CLAIMS_BILLING_ENFORCEMENT defaults to shadow; a production boot in any other mode than enforce logs a warning), so a refusal is logged, not applied, until an operator sets enforce; shadow mode does not shield the clearinghouse hold above, which applies in every mode. Organizations named in CLEARINGHOUSE_ENV_FALLBACK_ORG_IDS with no configuration still use the platform's own vendor, so deploying with that list incomplete halts every other existing tenant's claims, notices and pulls at once (held, not failed; ops runbook 8.6 is the cutover). A credential rotation returns a live configuration to draft at once, so a NOE inside its 5-day window is held until it is re-verified and the tenant re-activates it (owner decision needed - keep the old credential live until the rotation is verified). The former add-on tables remain but no longer decide anything; the add-on grant audit row's actor is the system (the operator is recorded in granted_by_membership_id) and Stripe charging is deferred.
      owner: engineering
      review_by: 2027-01-31

  - id: CW-AC-25
    title: >-
      Vendor-reported state is advisory with ONE disclosed exception — Claim.MD enrollment reports never open the commercial send gate (it opens only after staff record the enrollment through the existing step-up-guarded routes), and Claim.MD appeal reports never decide, close or withdraw an appeal case. The exception: a signed Claim.MD `appeal` report with the word `created`, for an unbound vendor appeal (it carries a vendor appeal id) whose control number names exactly one non-closed denial, and only when that denial's remittance advice names a payer that is neither Medicare nor Medicaid and that resolves in the payer directory (a denial with no advice, an unresolved payer, no denial, several denials, any other vendor word, or an appeal already linked elsewhere is only recorded and alerted), and the denial has no in-flight appeal level, opens a draft appeal level (created_by_membership_id NULL, labelled unconfirmed, no derived deadline) AND, when that denial is `escalated`, moves denial_case.state from escalated to appealed on the system actor with no staff step (m23-appeal-reported.ts, DENIAL_TRANSITIONS allows only escalated to appealed; asserted in test:m25:appeal-reports:live); a denial in any other state keeps its state. A report that links an existing in-flight level or adds a timeline event changes no denial state, and every report is recorded and alerts billing staff
    hipaa: ["164.312(c)(1)", "164.308(a)(4)(ii)(B)"]
    soc2: ["CC5.2", "CC8.1", "PI1.3"]
    status: implemented
    evidence:
      - script: test:m41:enrollment-reports:live
      - script: test:m25:appeal-reports:live
      - ci: "M41 enrollment reports"
      - ci: "M25 Claim.MD appeal reports"
      - file: apps/backend/src/modules/41-billing-commercial/services/enrollment-report-service.ts
      - file: apps/backend/src/modules/25-remittance/outbox-consumers/m23-appeal-reported.ts

  - id: CW-AC-12
    title: >-
      Platform operators enter a tenant's onboarding data (provider entity and EIN, locations, MAC and state Medicaid credentials, the tenant's clearinghouse choice (tenant_clearinghouse.write_platform), and its connection verification (the same key; a connection test for Claim.MD, an attestation with an evidence note for Stedi, which has no safe probe); not its activation, which only the tenant's own billing administrator performs (CW-AC-17: the platform lane has no activate route and the service refuses it with 403 CLEARINGHOUSE_ACTIVATION_TENANT_ONLY)) only inside that tenant's own row-level-security scope (the NOBYPASSRLS app pool under the target organization's app.org_id, never a bypass write), behind a platform-ops role, the tenant_onboarding_data.write_platform key, a fresh step-up, a human (non-AI) actor, an Idempotency-Key and a recorded reason that is screened for SSN- and MBI-shaped identifiers only (422 EVIDENCE_LOOKS_LIKE_PHI; a name or a date of birth is not recognized); only while the tenant is provisioning or onboarding (409 TENANT_NOT_ONBOARDING once active; the status is checked under the shared onboarding advisory lock, so a go-live approval cannot overtake the check), with five named exceptions: the operator's clearinghouse switch out of `outside` that names a billing service mode (the one write on the clearinghouse PUT route accepted outside onboarding; it needs the pricing key subscription.onboard_platform as well, and it is accepted only in an explicit allowlist of statuses, provisioning, onboarding, active, at_risk and suspended, so a tenant that is offboarding, has its final export pending, is retained, is being destroyed, is destroyed or has only a sign-up intent is refused with 409; the status is read before the billing mode is written, where the refusal is audited as a write_refused row in its own short transaction and fails closed (a refusal that cannot be audited is 503 ONBOARDING_AUDIT_UNAVAILABLE, with the cause logged and nothing changed), and judged again under the lock, where the refusal is audited in the write's own transaction), the vendor-BAA verification, the withdrawal of a tenant's external-filing record and the release of the clearinghouse credentials a tenant still holds (`anyTenantStatus: true` in the service; refused while the tenant's vendor responses may still arrive; CW-AC-17), which a live tenant needs and which are not status-gated (each still takes the lock and leaves its audit row), and the operator's upload of the tenant's signed BAA (CW-AC-22), accepted in its own explicit allowlist of statuses (BAA_DOCUMENT_UPLOAD_STATUSES: provisioning, onboarding, active, at_risk and suspended) so a live tenant's renewed agreement is filed, under the same lock, with the refusal of any other status audited in the write's own transaction; every successful write, and every refusal because the tenant is no longer onboarding, leaves an audit row naming the operator, the target organization and the reason in the same transaction as the check or write (the one exception is the switch's early refusal above, audited in its own short transaction), and the same transaction revokes a pending go-live attestation that the write makes stale; a failed write (404, 409, 422, 5xx) rolls back and is audited afterwards as a denied write_failed row in a separate best-effort transaction whose failure is logged, except that a failure of the COMMIT itself with no definite answer from the database (a lost connection, or a connection-class or server-error SQLSTATE) may have landed: that row carries commitOutcomeUnknown: true, says the outcome is unknown rather than rolled back, and can sit beside the write's success row; every read is audited in its own transaction after the data is read and is withheld (the request fails) if that audit row cannot be written, and the reads under tenant_onboarding_data.read_platform include the tenant's active staff for assigning its compliance officer (membership id, display name, email and the role keys held, nothing more; capped at 500) but NOT the notices the tenant recorded as filed outside ChartWarden: that list is a PHI path (a notice id with its window and filing dates identifies a patient's record, 45 CFR 164.514(b)(2)), so it takes the notice-filing key tenant_notice_filing.withdraw_platform (the key family's only key, so whoever may withdraw a record may see the list it is withdrawn from) and no longer the generic onboarding read key, its audit row records the number of NOEs and NOTRs shown and never which records, and it shows notice kind and id, its state and dates, no patient, admission or control number, capped at 200; the EIN and credential secrets are sealed and never returned; after a write commits the onboarding advance runs best effort (a failure is warned with the error redacted); the advance pass itself does nothing for a tenant past provisioning and onboarding (it reads the status in its own transaction under the shared onboarding advisory lock, taken before the read, so a go-live approval, which holds the exclusive lock, cannot commit between that read and the pass's writes; every caller runs the pass after its own write has committed, and every caller, the BAA register's create and update included, goes through it), so a live tenant's write, such as a BAA renewal, settles no step and emits no onboarding event such as m34.tenant.onboarding_overdue
