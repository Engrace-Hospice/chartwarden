  - id: CW-AC-50
    title: >-
      A visit note is not signed against a draft the signer has not resolved (ADR-0114 VN-D4, VN-D10). While the tenant switch (CW-AC-49) is on and the encounter's template has a drafted section, decided by one predicate read off the corpus's phrase tags (templateHasDraftedSection) before any source is read, gate check draft_sections_resolved (the 13th check) and the sign itself recompute the draft for the signer (the one who confirmed, since the section PUT is the author's alone) as of the visit time, from the sources the signer is allowed to see, and compare each section with its stored confirmation. A section that is unresolved is refused with DRAFT_SECTION_UNRESOLVED; a section whose content hash or corpus version differs from its confirmation, a deselected one included, is DRAFT_SECTION_STALE; sign answers 409 DRAFT_SECTION_STALE with each section named, finalize answers the same condition as a 422 remediation list. A draft that cannot be computed, one whose source read does not answer within DRAFT_SOURCE_READ_TIMEOUT_MS (5 s), or a switch that cannot be read, is 503 COMPLIANCE_GATE_UNAVAILABLE and never a pass. Today the RN routine visit, the RN recertification visit, the RN admission visit, the face-to-face visit by a physician or nurse practitioner (since slice S5 also M8's recorded vitals and M12's orders in effect at the visit time, beside the decline evidence, never a reason for visit, assessment, plan, interventions or attestation), the social-work and chaplain visits (slice S4), the IDG follow-up visit of every discipline (rn, lpn, msw, chaplain, md and np, drafted as that discipline's own visit, slice S5; its own idg_followup section is drafted from the one M14 action item the author linked the visit to, slice S5b), the LPN visits (the vitals, interventions and plan, never the PPS or ESAS-r sections) and the aide visit (the activities of daily living, from the recorded ADLs and the care plan's active interventions for the aide, less those removed from the visit, slice S3) have a drafted section (slice S2: for the recertification and face-to-face visits the draft also reads the admission's benefit period and the patient's weights, and an outage of one of those reads blocks signing the same way; since slice S5 an outage of M8's vitals read or M12's order read blocks a face-to-face sign, and an outage of M15's plan read blocks an IDG social-work or chaplain sign, the same way; since slice S5b an outage of M14's read of the linked action item blocks the sign of an IDG note that is linked to one, for a signer holding idg.act, the same way, and a confirmed idg_followup section that the signer's recompute no longer drafts while they hold idg.act and a link stands is refused DRAFT_SECTION_STALE (sign 409, finalize a 422 remediation list) naming the section and nothing of the item, never dropped from the note unseen); the admission visit (slice S2b) also reads M12's orders as of the visit, M5's caregivers on the service date and M39's advance directive acknowledgment as it was in force at the visit instant, judged from the record's own end instant so that a revocation, a renewal or the patient's death after the visit does not remove it, and counted only if it had been entered by then (the later of its created_at and its signed_at, so a draft created before the visit and signed after it does not count; the effective date can be backdated), and an outage of one of those reads blocks signing the same way; every other template behaves as with the switch off: no draft read, no check 13, no sealed rows. The signer's draft asks the Part 2 verdict as caller module m8 and treats an M39 failure as a 503, never a denial (except for the IDG follow-up's linked action item, which M14 decides and an M39 outage denies; see CW-AC-49); a care plan that M7 withheld from a viewer the draft's own verdict entitles is a 503. An order is withheld from a viewer without Part 2 disclosure unless its flag is the literal false, and M12's seam hands that flag out as the stored value or the drug classifier's verdict, as M12's own sign path decides, so a legacy row cannot dodge the gate, the one-order link summary M36 reads included; the rule covers the face-to-face visit's med_reconciliation (slice S5), where an order with no flag is left out for a viewer without disclosure and a signed section holding one is withheld whole from that reader. The previous-visit window starts where the patient's last signed visit of the same discipline left off (that note's signing, capped at the end of its service date), so no change falls between two notes of that discipline. Sign, finalize, the care-plan picker, the selections save and the draft section PUT each take the encounter row FOR NO KEY UPDATE first, so sign recomputes its draft after any deselect that held the row and a concurrent second sign is a 409; vitals capture and edit take the same row lock, so a vitals write that races a sign ends in 409 IMMUTABLE_AFTER_SIGN; encounter_draft_confirmation is frozen once the encounter is signed, cosign_pending, cosigned or voided (migration 1525 refuses INSERT and UPDATE and checks the siting pair); the two draft GETs read their facts in a short transaction that closes before any source is asked; a deselect that empties a resolved section withdraws that resolution. Sign pins the signed narrative before the status flips, and migration 1521 then freezes layer1_cipher, layer2_cipher and final_cipher for signed, cosign_pending and cosigned encounters, refusing the application role and any non-sentinel write by the destruction role. With the switch on, an outage of a source (M5, M6, M7 as-of, M8's vitals, M9, M12, M15, M39) blocks signing of a drafted template: a deliberate fail-closed exception recorded in M8_DR_INT_INVENTORY.md. Nothing is cached between requests, so one author's Part 2 redaction cannot reach another. Check 9 (the attestation) is reclassified from deferred to elsewhere because SignEncounterSchema requires attestationConfirmed true, pinned by a test. Gate check 1 (required sections) counts a confirmed drafted section as populated; a deselected, unresolved or stale one does not. Sign with the switch off after a finalize that pinned Part 2 text is refused with 409 DRAFT_OFF_AFTER_FINALIZE before any write (the pin carries part2_derived, migration 1522), so a rollback of the switch cannot sign a note whose sealed rows would then be missing. Naming sections to amend on a new addendum is refused 403 FORBIDDEN unless the caller is the note's author or a supervisor, before any write. An addendum that names sections to amend (VN-D30) is signed by the same rule: sign recomputes the addendum owner's draft for each named section and answers 409 DRAFT_SECTION_UNRESOLVED or DRAFT_SECTION_STALE, 503 COMPLIANCE_GATE_UNAVAILABLE when the draft cannot be computed, and 409 DRAFT_OFF_AFTER_FINALIZE when the switch was turned off after finalize; a free addendum is not subject to it. An addendum is also judged by the addendum gate: it must carry a selection, a free-text annotation or at least one amended section that sign would seal (confirmed and still drafted), else 422 COMPLIANCE_GATE_FAILED with ADDENDUM_EMPTY. Finalize (the author's act) takes the encounter row FOR NO KEY UPDATE first, so a concurrent finalize waits and then answers 409 ILLEGAL_TRANSITION without reading or pinning, and an addendum no longer in draft is refused 409 before any gate. Saving an addendum's selections takes the same row first and refuses an addendum that is not in draft with 409 ILLEGAL_TRANSITION before any write, so the pin finalize writes reads the selections its gate judged and a finalized or signed addendum's selections cannot change. A selection or an annotation decides the gate with no draft read. Only when a confirmed amended section is the sole content does finalize read the draft, as the caller's own session viewer, in this order: the Part 2 refusal (422 AMENDMENT_PART2_NOT_ENTITLED), the draft read (503 COMPLIANCE_GATE_UNAVAILABLE when the verdict or a source cannot be read), the switch and template check (409 DRAFT_OFF_AFTER_FINALIZE), then the count of confirmed sections that are still drafted (none is ADDENDUM_EMPTY), without requiring the other named sections to be resolved. Sign, under the same lock, refuses in the order Part 2, switch off, every named section resolved, empty, and counts the same sections. The count is a bare number and the amended content is never read to a viewer. Sign takes the encounter row FOR NO KEY UPDATE first, flips the addendum status only against the status it loaded, and writes the amendment rows before the status flips. An addendum that needs a cosigner and has none is refused 422 NO_ELIGIBLE_COSIGNER before any write; the note's author is never the amendment's cosigner, so a lone RN who wrote the note counts as none. When the note holds Part 2 content anywhere (the pin's part2_derived flag, any original row or any amendment row), a signer without Part 2 disclosure is refused 422 AMENDMENT_PART2_NOT_ENTITLED for ANY section they name, whichever it is, at naming, at finalize when a confirmed section is the sole content, and again at sign before the draft is read or anything is written, so the answer cannot be used to find which sections hold Part 2 text; the error carries a generic message (this note cannot be amended by this signer), no section and no content; an unknown section id and a free addendum are unaffected; the verdict is the draft's own (caller module m8) and one that cannot be decided is 503 (DRAFT_UNAVAILABLE at naming, COMPLIANCE_GATE_UNAVAILABLE at sign), never a denial or a pass.
