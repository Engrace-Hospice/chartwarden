  - id: CW-AC-16
    title: >-
      A session on an organization that is not active (created, suspended, closed, or a status that cannot be read, which fails the request) is confined to an exact list of METHOD + route-template pairs, matched on the template Fastify resolved: sign-in, session and step-up plumbing; the M34 tenant wizard (onboarding steps, org profile, compliance officer, go-live attestation, account, BAA attestation); and the members, invitations, role-grant, provider-entity and location routes its staffing steps need. Every other route answers 403 ORGANIZATION_ONBOARDING, including the tenant DSAR and tenant export downloads, support-consent grants, care-team staff, member credentials and direct user provisioning, a request that matched no route, and every clinical, PHI, billing and messaging route. The realtime handshake is refused. The only wildcard admitted is Better Auth's /api/auth/* for a path that decodes cleanly under it. Go-live approval then activates the organization (a repeated approval or the daily sweep finishes it if that step failed), and the M2 organization status route refuses to activate an organization whose tenant is still onboarding (409 GO_LIVE_TWO_PARTY_REQUIRED). The authenticate hook cannot be built without the gate: the stage reader is a required dependency and boot fails if it is missing.
