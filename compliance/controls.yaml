      review_by: 2027-01-31

  - id: CW-PI-04
    title: >-
      A visit is scheduled only for a clinician discipline that has a legal M8 encounter pair: create, proposal publish, reschedule,
      edit and reassign refuse an unsupported one (422 VISIT_ENCOUNTER_TYPE_UNSUPPORTED, or the discipline gate when the clinician
      holds no discipline the purpose accepts), codes only, nothing written, no event. Every purpose has at least one schedulable
      discipline (recert and loc_change are RN visits, and the physician or NP encounter of a recertification is f2f), pinned by a
      ratchet in policy.test.ts. The clinician picker marks an unsupported discipline CLINICIAN_ENCOUNTER_TYPE_UNSUPPORTED. A
      recurring policy whose clinician holds no discipline the purpose accepts (403 PRE_SCHEDULE_GATE_FAILED) or none with a legal
      pair (422) is refused at creation, and if one already exists the nightly cron alerts the scheduling audience (ids and a count
      only; an alert that reaches nobody fails the job) instead of skipping it silently, and a policy that fails for any other reason
      no longer stops the rest of the org's pass (it is reported by id and error code in the failing job). The M8 visit-seed consumer
      refuses an illegal pair rather than minting a draft, so an event that carries one is retried and then parked as failed. The pair
      is enforced in application code only (no DB CHECK).
    hipaa: ["164.312(c)(1)"]
    soc2: ["PI1.2", "PI1.3"]
    status: partial
    evidence:
