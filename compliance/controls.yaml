  - id: CW-AC-05B
    title: >-
      Clearinghouse webhook payloads (which may carry provider tax ids and vendor free text) are AES-256-GCM encrypted at rest in a platform-only, RLS-forced table with no tenant grant, and the ciphertext of EVERY receipt, settled or not, is cleared 90 days after it was received (a receipt that never settled is first made terminal `failed` and alerted, so a stuck row cannot hold ciphertext for longer); tenants receive ids and one bounded status word only. Each row records the key id it was sealed under (payload_key_ref) and the sweep decrypts only rows sealed under the key id this process holds: a row under another id is refused before any decrypt (outcome payload_key_mismatch), a row that will not open under the right id is outcome payload_undecryptable, both spend no attempt and raise one ops alert per sweep, rows that already failed sort after fresh receipts so they cannot starve new ones, and a row still unreadable 7 days after receipt goes terminal `failed` with an ops alert. KEY ROTATION: CLAIMMD_WEBHOOK_KEY_ID is a code constant paired with the CLAIMMD_WEBHOOK_PAYLOAD_KEY secret and the process holds ONE key, so change both together only after every unsettled receipt has settled (no row with processed_at NULL and a cipher), because rows sealed under the old id are never decrypted again, and settled rows lose their ciphertext at 90 days regardless
    hipaa: ["164.312(a)(2)(iv)", "164.312(a)(1)", "164.502(b)"]
    soc2: ["CC6.1", "C1.1", "C1.2"]
    status: implemented
    evidence:
      - script: test:m23:claimmd-webhook:live
      - script: arch:tenancy
      - file: packages/db/migrations/1322_m23_claimmd_webhook_event.sql
      - file: apps/backend/src/modules/23-billing-medicare/claimmd-webhook/sweep.ts
      - file: packages/shared/src/crypto/webhook-payload-cipher.ts
      - ci: "M23 Claim.MD webhook"

  - id: CW-AC-07
    title: Bun-to-Rust trust boundary (CW-RUST-M02), as enforced in THIS repo — Bun signs an Ed25519 actor assertion only for a request that has already passed authentication and requireSession, or (class parity-sweep) for the daily parity sweep's audited comparison; a client-supplied assertion header is stripped in Bun and nginx; the Rust service is topology-limited to one instance on an internal network with postgres, reachable from api only through a shared socket; the bridge config and key fail closed
    hipaa: ["164.312(a)(1)", "164.312(d)", "164.312(e)(1)"]
    soc2: ["CC6.1", "CC6.6"]
    status: partial
    evidence:
      - script: arch:compose-policy
      - script: arch:request-header-auth
