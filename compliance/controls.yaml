      # is always recorded (a CMS verdict is final and nothing could lower the count afterwards); it is bounded by the
      # batch's finite items, each settled once, times 2000 rows. A batch's findings read returns its newest rows, at most
      # 20,000, oldest first, and reads only the columns it shows (raw_result only for assessmentId), with one lookup map and
