    gap:
      reason: Proved with synthetic 835s only; no live proof against a real payer's 835, and a payer that omits BPR16 on a non-zero payment is refused for the whole file with no accept path short of the payer reissuing it. Controlled Claim.MD posting stays disabled in production (the boot refusal), so its approval and execution are proved in non-production only; approval is recorded even while posting is disabled, and an approval does not expire. A quarantined file is released or dismissed only by admin SQL on the superuser connection (the runbook's single transaction, guarded by the file hash and the quarantined state; the dismiss, the guard and the carrier role's zero-row result are proved live). The row trigger records no actor there, so the audit row is attributed only by the correlation id the operator sets to the change ticket, and nothing in the database enforces that, a stated reason or the second reviewer the runbook asks for before a payment file is dismissed. An unresolved quarantine keeps the pull cron failing on each tick that completes a pull for the provider entity by design (an org with no live clearinghouse binding is not pulled, so its standing quarantine is not reported); there is no in-app list. The alert on that failure is the DLQ-promotion alert (a log line always, and a webhook only when OPS_ALERT_WEBHOOK_URL is set), fired when a job exhausts its attempts. It is not CW-MON-01, which is audit-event detection and a gap. A held file is reported once, on the tick that receives it (a retry that finds nothing new completes), so it relies on the held rows themselves (the staged ERA for CLAIMMD_ERA_STAGE_MATCH, the held advice row for LEGACY_IDENTITY_AMBIGUOUS) and not on the cron to stay visible. A file whose interchange mixes a non-HP functional group with an HP one is refused whole (X12_835_UNSUPPORTED_ROUTING), so a supported group sharing it is quarantined with it. The Claim.MD ownership-evidence gate rests on the resolver and the delivery-time revalidation (the delivery service writes the evidence codes), and executing a plan does not re-check the payee NPI/TIN the way receive does at post time.
