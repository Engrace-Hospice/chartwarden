    gap:
      reason: As of 2026-11-09 the executed-BAA document reference is UNVERIFIED. BAA_DOCUMENT_REQUIRED (baa-guards.ts, applied by the Drizzle service and the baa-record repository) only checks that documentId is non-null; nothing checks that the document exists, is the executed-BAA kind, belongs to this tenant, or matches a hash, so one operator can mark a BAA `executed` with an arbitrary UUID. The rule that the go-live approver did not write the BAA (409 GO_LIVE_APPROVER_WROTE_BAA) also cannot judge rows written before migration 1332, whose filer and last-writer columns are NULL. The full document check is built in a later slice of this stack (the onboarding-wizard slice), not on this branch; this row stays partial until that slice lands and a live assertion proves it.
