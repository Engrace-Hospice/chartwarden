  - id: CW-PI-01
    title: >-
      The financial records tenant pricing creates cannot be changed after the fact through the application or the platform credential: guard triggers refuse it, and the platform carrier's grants are narrower still. A superuser or table owner can disable a trigger or set session_replication_role, and this control makes no claim against one. A PUBLISHED plan version and its census bands are frozen (plan_census_guard, plan_census_band_guard: a published version never goes back to a draft, changes tier, or has a price or band edited, and is never deleted), which is what makes "a subscription keeps the price it signed" a database fact. A signed contract cannot be updated and must name a published census_banded plan that is the subscription's own plan in its own organisation (subscription_contract_guard). The billing-mode history is append-only, belongs to its contract's organisation, is never dated before a change already recorded, and can never take effect inside a month whose statement is final (subscription_contract_mode_guard); application writes for one tenant take a transaction-scoped advisory lock keyed by organization before reading history, explicitly timestamp each append after the history read under that lock, and use the immutable row id only as a final tie-breaker. Every statement must name its subscription's own organization and plan through a composite foreign key, and the trigger makes that ownership tuple immutable (subscription_statement_ownership_fk and subscription_statement_guard, migration 1466), including for the platform carrier that bypasses RLS. A FINAL statement is frozen and cannot be deleted, and its arithmetic is enforced by CHECK constraints (the greater-of platform fee, the proration, the minimum floor, the half-up billing fee, the prior-period lines, the total) (subscription_statement_guard); its Stripe push record can be written once, from NULL, and is never cleared or rewritten, so a posted statement cannot return to the unposted set (migration 1464). An operator's read of a tenant's contract and bills is audited fail-closed in the read's own transaction: it is on the record (operator and tenant, ids only) or the read does not happen. Each plan write's structured audit row names the operator and carries the figures set, with a SHA-256 of them (prices are not PHI), because the plan row trigger does not know the user. "Signed" means an operator's attestation plus a free-text order_form_ref (migration 1412), NOT a cryptographic signature: these records resist change through the application and platform credentials, they are not tamper-evident to a party that can alter the database or its audit trail. They are retained financial records (see CW-DS-01).
    hipaa: ["164.312(c)(1)"]
    soc2: ["PI1.2", "PI1.3"]
    status: implemented
    evidence:
