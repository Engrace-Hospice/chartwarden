      - file: apps/backend/src/modules/22-documents/routes/immutable-kinds.ts
      - file: apps/backend/src/modules/34-saas-tenant-platform/routes/platform/baa-guards.ts
      - file: apps/backend/src/modules/22-documents/routes/server-upload.ts
      - file: apps/backend/src/modules/22-documents/routes/server-upload.test.ts
      - script: test:m34:onboarding-wizard:live
      - file: deploy/production/nginx/chartwarden-platform.conf
      - file: deploy/production/nginx/chartwarden-platform-proxy.conf
      - file: deploy/production/nginx/chartwarden-platform-limits.conf
      - file: packages/db/migrations/1477_m34_platform_carrier_reads_document_creator.sql
      - file: scripts/__tests__/platform-nginx.test.ts
      - file: deploy/production/README.md
      - file: apps/backend/__tests__/m34-onboarding-baa-document.test.ts
    gap:
      reason: No malware scanner implementation exists in this repo, so the upload is content-verified (type, magic bytes, size, SHA-256) but not virus-scanned unless one is bound; with DOCUMENT_UPLOAD_SCAN_REQUIRED=true an unbound scanner refuses the upload (503) instead, and unset (the default) an unscanned file is stored. This is the posture of every other M22 upload; the BAA upload inherits it and adds no scanner of its own. Two further residuals the route does not close. (1) Exposure of the platform hostname, which is reachable by anyone who can reach it (no IP allowlist or mTLS is configured, an operator decision not made here), with only nginx's per-address request and connection limits in front of the pre-auth body buffering, which do not bound a slow sender in total time. (2) Operator identity, since the platform_ops role holds data entry, BAA upload, register write, go-live approval and pricing together (splitting it is an owner decision) and the checks that keep one operator from both writing and approving (the uploader, the register writer, the attester) compare accounts, so the operators are distinct by account, not by person.
      owner: engineering
      review_by: 2027-01-31

