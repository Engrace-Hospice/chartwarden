# ChartWarden — compliance control register (claim → evidence)
# -----------------------------------------------------------------------------------------------
# Each row ties a HIPAA Security Rule standard and/or SOC 2 Trust Services Criterion to the thing in
# THIS repo that proves it: a package.json script (a gate or live suite), a CI workflow string, or a
# file. `bun run arch:compliance` (part of arch:fitness) fails when:
#   - an evidence script/file/CI reference no longer exists (the claim outlived its proof);
#   - an `implemented` row has no AUTOMATED evidence (a script or CI reference) — a control proven
#     only by a document is a control on paper;
#   - a `partial`/`gap` row has no reason, or its review_by date is past or more than 180 days out;
#   - a required HIPAA standard or SOC 2 criterion has no row at all.
#
# This is engineering traceability for auditors and for the agent harness. It is NOT a legal opinion
# and does not by itself make ChartWarden "HIPAA compliant" or "SOC 2 certified": those need the
# administrative program (policies, training, risk analysis sign-off, BAAs) and, for SOC 2, an
# independent auditor's report over an observation window. Edits to this file ask for human approval
# (.claude/settings.json).
#
# status: implemented | partial | gap | not-applicable

controls:
  # ---------------------------------------------------------------- §164.312 technical safeguards
  - id: CW-AC-01
    title: Tenant isolation enforced in the database (RLS, FORCEd, NOBYPASSRLS app role)
    hipaa: ["164.312(a)(1)", "164.308(a)(4)(ii)(B)"]
    soc2: ["CC6.1", "C1.1"]
    status: implemented
    evidence:
      - script: arch:tenancy
      - script: test:rls:live
      - ci: "cross-tenant isolation proof"
      - file: apps/backend/__tests__/_live-app-role.ts
      # ADR-0050 D6 (2026-11-05) — the object store's tenant isolation: the api/worker key is bound to app-policy.json
      # (tenant-* / chartwarden-* only, no bucket delete or versioning change, proven against SeaweedFS and RustFS), and
      # a presigned URL rewritten to another tenant's bucket or key is refused.
      - script: test:object-store:conformance:live
      - script: test:object-store:resilience:live
      - file: deploy/production/object-store/app-policy.json
      # M10 defence in depth: the id-keyed HOPE reads and writes the pre-PR reviews named (submission cancel / advance /
      # download / skip / retry / mark-uploaded, result import (importSubmissionResult), the batch list and detail reads and
      # the reads in hope-submission-reads-db.ts, the status writers, the id-keyed loaders, recordTimepoint lookups, the
      # prefill UPDATE, the SFV FOR UPDATE and the validation-findings statements) carry an explicit organization_id
      # predicate on top of RLS, and so do the assemble item subquery and the submission list (its outer statement and its
      # subquery). The live cases act as ORG_B on ORG_A rows over a connection that BYPASSES RLS (they cover result import
      # and the batch list too) and find 404 or nothing. Not covered, by design: org-wide list reads with no id stay
      # RLS-only, and the hope_spec_* tables are global reference data with no org column.
      - file: apps/backend/__tests__/hope-f2-write-route-hardening.test.ts
      - file: apps/backend/__tests__/hope-w2b-tenant-predicates.test.ts
      - file: apps/backend/src/modules/10-hope/hope-submission-reads-db.ts
      - file: apps/backend/__tests__/hope-assemble-candidates.test.ts
      - file: apps/backend/__tests__/hope-submission-list-order.test.ts
      - script: test:m10:write:live
      # WF09 (migrations 1528-1532): five new PHI tables, `encounter_adl` and `encounter_nutrition` (M8, one row per visit), `wound` and
      # `wound_observation` (M9) and `care_plan_change_proposal` (M7). Each carries the three tenancy columns, RLS ENABLEd and FORCEd with an
      # app-role policy pinned to app.org_id (USING and WITH CHECK), column-limited UPDATE grants (the application role cannot rewrite what a
      # row IS: identity, tenant, siting, patient, creator) and a BEFORE UPDATE guard trigger on those identity columns, so a change is refused by
      # trigger for every role that cannot disable triggers. The same guards keep a closed wound closed, a recorded observation unedited (a
      # correction appends) and a decided or withdrawn proposal final. Known limit: they are ordinary triggers, which the table owner or a
      # superuser can disable or bypass (ALTER TABLE ... DISABLE TRIGGER, session_replication_role = replica), so they hold against the
      # application's own write paths, not against a database administrator. The application role has no DELETE; the destruction role has SELECT and DELETE behind its own org-pinned policy (CW-DS-01
      # says what is proven of that). arch:tenancy replays the migrations with the rest. Proven live as chartwarden_app: findings (each tenant
      # reads only its own ADL and nutrition rows and a session with no organisation reads none, with a superuser negative control; org B's
      # insert hits the WITH CHECK and its update touches nothing; the application role may update a value column but no identity column, and the
      # guard refuses an identity change from a superuser), wounds (RLS enabled and forced on both tables, another organisation's rows hidden and
      # a write into one refused, an observation can name only a wound of its own organisation and patient) and proposals (another organisation
      # sees, decides and writes nothing; the plan, patient, visit, proposer and organisation of a proposal cannot be rewritten by the application
      # role, and the guard trigger refuses it from a superuser connection too).
      - script: test:m8:findings:live
      - script: test:wounds:live
      - script: test:m7:change-proposals:live
      - file: packages/db/migrations/1528_m8_encounter_adl.sql
      - file: packages/db/migrations/1529_m8_encounter_nutrition.sql
      - file: packages/db/migrations/1530_m9_wound.sql
      - file: packages/db/migrations/1531_m9_wound_observation.sql
      - file: packages/db/migrations/1532_m7_care_plan_change_proposal.sql
      # M24-1075 (migrations 1535, 1538, 1539): payer program assignment and enrollment evidence (1535, mutable), payer authorization
      # events (1538) and payer rate policy (1539, both append-only) are org-scoped, with RLS ENABLEd and FORCEd on one app.org_id
      # policy. The live M24 suite runs as chartwarden_app and proves, per table, that a cross-tenant INSERT is refused by the WITH CHECK
      # alone (the provider-entity guard is switched off for that case, with an own-tenant control), that a provider entity of another
      # organization is refused by the guard, and that the catalog holds one org-keyed policy with RLS enabled and forced. 1538/1539
      # rows are immutable: the application role holds no UPDATE or DELETE grant, the append-only trigger refuses every role (proved on
      # a superuser connection), and an application insert cannot assert verification. 1535 rows are mutable by design and guarded: the
      # application role records a row only as candidate or pending (a BEFORE INSERT guard refuses an already verified or closed row on
      # both tables, proved per status against a superuser control, with verification by another member still working), UPDATE
      # is granted per column (exactly the columns the verify and revoke paths write, proved from the catalog), the verifier is never
      # the recorder (CHECK), a row's identity never changes, a closed row is final, a verified row can only be revoked or superseded
      # and its verification evidence cannot be rewritten (proved on a superuser connection, so only the trigger can answer). Known
      # limit: these are ordinary triggers, which the table owner or a superuser can disable, so they hold against the application's own
      # write paths, not against a database administrator. Second known limit: verification is not database-bound. The application
      # role can INSERT a pending row and UPDATE it to verified in a second statement, naming any membership id other than the recorder
      # (the membership columns carry no foreign key); the database guarantees the four-eyes arithmetic, the identity and evidence
      # freeze and the transition table, not who the verifier is. The M40 classification match, the source allow-list and step-up are
      # enforced by the verify service (runbook "Recording program assignments"). The guards also pin search_path with pg_temp last, so
      # a TEMP table named provider_entity cannot defeat the tenant check (proved live), refuse a location or predecessor row that is not
      # the record's own provider entity or organization, and freeze the 835 account, environment and freshness columns.
      - script: test:rls:live:m24
      - file: packages/db/migrations/1535_m24_payer_program_readiness.sql
      - file: packages/db/migrations/1538_m24_payer_authorization_evidence.sql
      - file: packages/db/migrations/1539_m24_payer_rate_policy_evidence.sql
      # M24-1075-L8A (migration 1551): medicaid_hospice_billing_evidence and medicaid_claim_line_pricing_snapshot are org-scoped with RLS
      # enabled and FORCEd; the live M24 suite proves the cross-tenant case on both, and that both are append-only (CW-PI-06).
      - file: packages/db/migrations/1551_m24_immutable_hospice_pricing_snapshots.sql
      - file: packages/db/migrations/__tests__/m24-rls-isolation.live.test.ts
      # M24-1075-L6A: M40 payer classification is global reference data: every tenant reads it, only mdm_canonical_writer inserts,
      # rows are append-only and RLS is enabled and FORCEd. The live M40 suite proves it on a row that satisfies every CHECK, so only
      # the layer under test can refuse: chartwarden_app has no INSERT grant, and with one forced on the policies still refuse it, the
      # canonical writer's insert of the same row succeeds, and UPDATE/DELETE are refused by the append-only trigger. M24 submission
      # provenance is nullable and unverified by default; the f172 live suite proves, on rows that satisfy every CHECK, that the
      # application role can neither insert a verified attempt, promote one, nor rewrite any column the verification stands on or that
      # says which attempt the row is on a verified attempt (organization, claim, provider entity, state, channel, MCO, control number,
      # attempt index, adapter vendor and version, and the provenance snapshot: one assertion per column, each against a superuser
      # control), while it keeps updating a verified attempt's result, error detail, polling schedule and terminal time. Fresh disposable
      # PostgreSQL suites apply the full migration chain and run as chartwarden_app/NOBYPASSRLS.
      - script: test:rls:live:m40
      - script: test:m24:remittance-feedback:live
      - file: packages/db/migrations/1541_m40_medicaid_payer_classification_and_m24_submission_provenance.sql
      - file: packages/db/migrations/__tests__/m40-rls-isolation.live.test.ts
      - file: apps/backend/__tests__/f172-m24-remittance-feedback.live.test.ts
      # M24-1075-L6B adds the nonposting Medicaid review tables; FORCE RLS and tenant/provider-scoped
      # workflow reads are exercised as chartwarden_app/NOBYPASSRLS, including the empty-source hold.
      - script: test:rls:live:m25
      - file: packages/db/migrations/1543_m25_medicaid_era_nonposting_reviews.sql
      # L6C: the general platform login has no table or column writes on Medicaid ERA assessment/history tables;
      # existing assessment rows remain legacy_unverified and tenant detail reads redact their financial summary.
      # L6C2 restores assessment/history writes only for the NOBYPASSRLS isolated evaluator login, scoped by
      # app.org_id and source-stage ownership; the shared platform login cannot write, read, or assume that role.
      # Migration 1548 adds a separate restricted source reader for staged Claim.MD artifacts and durable
      # idempotency reservations. The live suite runs the actual evaluator entrypoint in container mode, tests
      # the restricted writer/source reader, and verifies review persistence, replay, history, isolation and
      # direct-SQL refusal on disposable PostgreSQL.
      - file: packages/db/migrations/1544_m25_medicaid_era_assessment_writer_lockdown.sql
      - file: packages/db/migrations/1547_m25_isolated_medicaid_era_evaluator.sql
      - file: packages/db/migrations/1548_m25_medicaid_era_integrity_and_source_reader.sql
      # L6D adds a point-in-time evidence fingerprint (not current authorization) and runs the mounted Fastify API
