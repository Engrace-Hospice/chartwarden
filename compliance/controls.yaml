  - id: CW-AC-15
    title: >-
      Tenant onboarding steps are strictly ordered on the server (409 ONBOARDING_STEP_OUT_OF_ORDER on both the platform and tenant routes), and a human settles a step only with required evidence (a note, plus an optional reference) recorded on the task with the attester and time and audited by the row trigger; a tenant actor must hold the step's owner role; go-live cannot be skipped or attested as an ordinary step. An `either` step may be attested by its owner (the tenant's org_admin or platform ops) even when its automatic fact does not hold: the go-live approver reviews that evidence, and any later change to the onboarding data revokes a pending go-live attestation. Every free text the wizard stores (evidence, reasons, skip rationale, blocker reason, go-live note, the operator's onboarding-data reason) is cleaned and screened for patient identifiers.
