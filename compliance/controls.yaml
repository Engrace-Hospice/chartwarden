      - file: apps/backend/src/bootstrap/plugins/authenticate.ts
      - file: apps/backend/src/bootstrap/metrics.ts
      - file: apps/backend/src/modules/18-evv/routes/evv-routes.ts
      - file: apps/backend/src/modules/08-encounters/closure/closure-reader.ts
      - file: apps/backend/__tests__/note-closure-gate.test.ts
      - file: apps/backend/__tests__/note-closure-gate-routes.test.ts
      - file: apps/backend/__tests__/note-closure-gate-inject.test.ts
      - file: apps/backend/__tests__/note-closure-gate-wiring.test.ts
      - file: apps/backend/__tests__/note-closure-allowlist-mirror.test.ts
      - file: apps/backend/__tests__/evv-inject.test.ts
      - file: docs/adr/ADR-0113-visit-note-closure-clock.md
      - file: docs/runbooks/m8-note-closure-policy-reset.md
    gap:
      reason: >-
        Refusals are evidenced by a throttled log line and an unlabelled counter, not an audit event: one line per organization per 30 s, a tail below that is reported with the next refusal, and no refusal can be tied to a member from the audit trail. Caches are per replica: a block is never cached, but a pass is for up to 5 s, so an override revoke reaches a replica that cached the overridden clinician within 5 s, and a request that joins a single-flight evaluation can inherit a block computed just before a signature or grant committed; the budget is a fixed window (up to 2x at an edge) and a timed-out evaluation is not cancelled in the database. A failed policy refresh serves the last known off or warn policy for up to 55 s (60 s worst case), so a tenant that has just moved to block is not enforced during a database read failure in that window; nothing known, a last known block, or an older policy fails closed. A mixed offline batch (check_in and check_out) is refused as a whole, and how the offline client keeps that batch after the 403 is outside this repo and unverified. The clock is only as good as its start signal (the author's first authoring write on a seeded draft is theirs to delay; a late note created after its visit started is clocked at the visit's start, held to the creation instant because the visit row has no recorded-at instant), a legacy clockless draft never blocks (no backfill), and only visit_note is on the engine (HOPE windows, CTI and face-to-face are later slices). The allowlist also keeps WF09 chart writes reachable by a blocked clinician, on purpose (the comments in note-closure-allowlist.ts say the visit composer's wound step and plan-of-care step call them while the note is being written, so a blocked clinician must reach them to close the note). The wound routes are GET /api/v1/patients/:patientId/wounds and .../wounds/:woundId, and POST .../wounds (register), .../observations, .../observations/:observationId/corrections and .../resolve. The plan-change routes are GET /api/v1/patients/:patientId/care-plan-change-proposals, GET and POST /api/v1/care-plans/:planId/change-proposals, and PUT and DELETE on .../:proposalId (accept and dismiss are left off as a case manager's call that can wait). None of these is tied to the clinician's own blocked note by the gate. Registering a wound, resolving one and recording an observation without a visit tie need no visit at all (assessment.author and caseload_or_scope only), and a proposal or a tied observation needs only some open draft note of the clinician's own for that patient (the EncounterDraftReader check, CW-AC-54), not necessarily the note that is blocking them. So a blocked clinician can keep adding to a patient's wound record and plan-change list until the block lifts, which weakens the gate as a nudge to close the note first. Closing it would mean splitting the wound routes into a note-bound pair and the rest, or dropping the registration and resolve routes from the list.
      owner: clinical-platform
      review_by: 2027-04-30

  - id: CW-AC-48
    title: >-
      Lifting a clinician's closure block and setting the closure policy are two step-up-gated, audited acts held by different role sets (ADR-0113 D7). encounter.closure_override belongs to clinical_supervisor, director_of_nursing, don and clinical_lead only: it is in FULL_CATALOG_EXCLUDED_KEYS, so org_admin, administrator and superadmin never derive it, and anti-escalation stops a caller who does not hold it from granting it. A grant lifts one clinician's block for one obligation kind for 1 to 24 h, never for oneself, with a reason of 40 to 500 characters screened for SSN and MBI shapes. Grant and revoke share one per-actor rate limit (10 a minute per user, 100 per organization; it fails open) applied after the permission and AI-principal guards and before step-up, which also bounds the denied-attempt audit rows. It is refused when the grantor's own position, with overrides ignored, is blocked (403 NOTE_CLOSURE_GRANTOR_BLOCKED), and when there is nothing for the caller to lift: the clinician has no open note, is not blocked now, or has an oldest open note outside the grantor's sites, all one 409 NOTE_CLOSURE_SUBJECT_NOT_BLOCKED so a site-scoped supervisor learns nothing about a clinician elsewhere. A revoke is for the grantor or an org-wide caller (403 NOTE_CLOSURE_SUBJECT_OUT_OF_SCOPE otherwise). encounter.closure_policy_admin belongs to director_of_nursing, don, org_admin, administrator and superadmin (not clinical_supervisor or clinical_lead); the policy PUT needs a fresh step-up. AI principals are refused on both. The override table is append-only for the application role, and the database refuses an un-revoke, a subject or grantor from another organization, and a reason outside 40 to 500 characters. A grant, a revoke and a policy write each write a compliance-retention audit event beside the row trigger (m8.encounter.closure_override_granted with the screened reason as context.justification, m8.encounter.closure_override_revoked, m8.encounter.closure_policy_changed; actor, subject, grantor, expiry, previous and new mode), and a refused grant (grantor blocked) or refused revoke (out of scope) writes m8.encounter.closure_override_denied (ids only).
    hipaa: ["164.312(a)(1)", "164.312(b)", "164.308(a)(4)(ii)(B)"]
    soc2: ["CC6.1", "CC6.3", "CC7.2"]
