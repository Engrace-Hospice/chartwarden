  - id: CW-AC-19
    title: >-
      Auditors are never billed or provisioned as staff: the role key external_auditor is reserved for the system auditor role (a tenant role under that key is refused with 422 RESERVED_ROLE at the route and by a trigger in the database; because the application role can write every column the system row's facts rest on, the trigger also requires the transaction-local marker only the auditor grant sets before it writes that row, which stops other application code paths from writing it, not a session that can run arbitrary SQL as the application role), so a real auditor always lands on the system role. An organisation that still holds a legacy tenant-created external_auditor role is refused at auditor redemption (role_over_privileged, 403 AUDITOR_ROLE_MISCONFIGURED, fail-closed): an administrator must remove that role before an auditor can be onboarded (CW-AU-02). Family-portal, auditor magic-link and ChartWarden support sessions never enter the staff meter at all: its ledger is fed by m2.session.created, which fires only when a staff session binds to an organisation at select-organization, so those sessions write no ledger row. The meter excludes the system auditor role and platform-owned operator roles (non_staff_observed), decided when each sign-in is observed, not from today's grants; and a month that spans a pseudonym-key rotation counts its busiest single epoch and flags the statement needs_review.
