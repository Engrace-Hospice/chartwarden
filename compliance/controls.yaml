        placeholder). NOT proven in this repo — enforced and tested only in chartwarden-rust (cw-actor, cw-tenancy,
        cw-server; run 41263074320): Ed25519 signature verification and key rotation, single-use jti replay rejection,
        the parity-sweep class accepted on GET /api/v1/me/permissions only, READ ONLY transactions, NOBYPASSRLS
        chartwarden_app with RLS. Before P2 turns it on: cosign-sign the Rust image and verify/roll it in deploy.sh;
        provision the signing key as a compose secret on api only (assertProductionEnv refuses the inline variable;
        never .env.production, which reaches seven containers); set RUST_* on api only; recreate postgres once so it
