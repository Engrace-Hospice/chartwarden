  - id: CW-AC-49
    title: >-
      The per-tenant switch for the visit-note draft and its sign gate (ADR-0114 VN-D17) is a step-up-gated, audited act held by the tenant-level owners. PUT /api/v1/encounters/draft-policy requires encounter.draft_policy_admin (director_of_nursing, don, org_admin, administrator, and superadmin through the full catalog; never clinical_supervisor, clinical_lead or a field role), a fresh step-up and a human (non-AI) actor, and writes visit_note_draft_policy (one row per organization, RLS enabled and FORCEd, no DELETE for the application role) plus an explicit warn-severity m8.encounter.draft_policy_changed event with the previous and new value. An absent row is off, and enabling is refused 409 CORPUS_REVIEW_PENDING until the platform phrase corpus release now running has had its named clinical review (VN-D14; an approval names the release it covers and does not count for a later one, VN-D34); disabling is always allowed. The draft routes behind the switch carry their own controls: GET /api/v1/encounters/:encounterId/draft and PUT /api/v1/encounters/:encounterId/draft/sections/:sectionId answer 404 while the switch is off; the PUT is the encounter's author's alone (a supervisor is refused 403, so the signer is the one who confirmed), refuses an AI principal even one holding the key (an AI may not confirm what it drafted a note from, D13) and writes an explicit m8.encounter.draft_section_resolved audit event carrying ids, enums and counts only: no content hash, no source ids for a Part 2 derived section, and filed under compliance_42cfr_part2 when the section is Part 2 derived (the response carries source kinds only, never ids); the draft read is audited as encounter_draft.viewed, attributed to the patient. An amendment's draft (VN-D30) has its own pair behind the same switch: GET and PUT /api/v1/encounters/:encounterId/addenda/:addendumId/draft and /draft/sections/:sectionId answer 404 while the switch is off; both are the addendum's own author's view alone (403 for anyone else, a free addendum and an absent one included, so a reader cannot tell which addenda name sections, and the service checks it too); the PUT needs encounter.addendum_author, refuses an AI principal and writes the same m8.encounter.draft_section_resolved event with the addendumId (filed under compliance_42cfr_part2, with no source ids, when the section is Part 2 derived; a repeat writes nothing), and naming sections to amend on a new addendum needs the switch on (404 off). A resolution is stored in encounter_amendment (RLS enabled and FORCEd, SELECT and INSERT for the application role with UPDATE on the resolution columns only and no DELETE, a guard trigger freezing it once its addendum signs, the audit image scrubbed like encounter_draft_confirmation). The authoring menu returns the draft phrases only for a tenant whose switch is on. The draft read needs encounter.read and the section PUT encounter.author (the amendment draft pair needs encounter.read and encounter.addendum_author), and all four also need the read key of each source domain the template's draft is compiled from (M7's care plan: care_plan.read; M12's medication orders: prescribing.read; M9's scored scales: assessment.read_trend), because those seams apply no permission check of their own. Since slice S3 the service asks them by template, after the switch and the tenant are known and before any source is read, and the draft reads only the four S1 sources its template drafts from (M9's recorded wounds are read for every drafted template, through no key, and no drafted section states one): an aide visit's draft reads the care plan alone, an LPN visit's the care plan, the vitals and the medication changes, an RN routine, recertification or admission visit's every source, and the face-to-face visit's the scales and the weights; they were static route guards asking all three of every draft. Since slice S5 a physician's or nurse practitioner's face-to-face draft also reads M8's recorded vitals and M12's orders in effect at the visit time (so it needs prescribing.read beside election.read and the scale key), and the IDG follow-up of every discipline reads what that discipline's own visit reads: an rn's and an lpn's ask what their own visits ask, a social worker's and a chaplain's ask discipline_plan.read (M15's key), a physician's and a nurse practitioner's read M8's recorded vitals alone and ask no source key beside the one every IDG follow-up draft reads since slice S5b (the linked action item, asked for under idg.act for its own section alone, see the end of this claim). The draft of a recertification visit (slice S2) also states M6's facts through such seams, so the service refuses 403 a caller who lacks election.read, cti.read, f2f.read or loc.read (the face-to-face visit's draft needs election.read, and since slice S5 prescribing.read), after the switch and tenant checks and before any source is read; the check is by template, the same for every viewer, so a routine visit's draft needs no key it did not before. Finalize, sign and an addendum's finalize and sign recompute the draft for the caller and ask the same keys at the same point (a recompute names the sections it holds back, which says what the admission holds), resolved from the whole request context as the route guards resolve them. The recertification draft states the benefit period, level of care, face-to-face performer role and dates, certification signing date, and the weights and PPS readings of the patient's signed encounters, never the physician's attestation or certification narrative. The admission visit's draft (slice S2b) states M12's orders in effect, M5's caregivers and M39's advance directive acknowledgment, so it asks patient.read, consent.read and prescribing.read in the same way, by template and at the same places (the draft routes guard on prescribing.read already, with the other source domains' keys, but finalize, sign and an addendum's recompute ask only the template's own keys, so the admission template names it too: the orders are the one source it is first to state in a section of its own). It states the acknowledgment only as a fact that one was on file at the visit, never its content and never code status, and a caregiver by name and relationship, never by contact details. The audit read path (audit.read) is not Part 2 gated, so the row trigger on encounter_draft_confirmation scrubs content_hash, withholds source_refs for a Part 2 derived row and files it under compliance_42cfr_part2. Slice S4b adds GET /api/v1/encounters/:encounterId/discipline-plan-elements and PUT /api/v1/encounters/:encounterId/discipline-plan-elements/:elementId (which of a social-work or chaplain visit's plan goals and interventions the visit keeps, one at a time), behind the same switch (404 while it is off). The GET needs encounter.read and the caseload scope; the PUT needs encounter.author and the caseload scope, is the encounter's author's alone and refuses an AI principal. An element id is accepted only if the plan read handed it to that viewer, so a Part 2 item the viewer may not read answers the same 404 as an absent one. Both routes leave a read audit attributed to the patient (field names only, the plan wording is never copied into the trail), and a refused change carries no record content. The choices live in encounter_discipline_plan_link (migration 1540: organization, provider-entity and location columns, RLS enabled and FORCEd with an app.org_id policy, no DELETE for the application role, a row guard that freezes it once the note is signed, cosign-pending, cosigned or voided): its row trigger scrubs the element ids and files a Part 2 derived row, and every DELETE, under compliance_42cfr_part2; the store (not the database) caps the rows one encounter may hold, counting only a re-keep of an element that already has rows, so a script cannot grow the table or the audit trail without bound and a clinician can always leave an element out (409 DISCIPLINE_PLAN_LINK_LIMIT); the M8 eraser deletes its rows (CW-DS-01). Slice S5b adds GET /api/v1/encounters/:encounterId/idg-action-items and PUT /api/v1/encounters/:encounterId/idg-action-item (which ONE of the author's own M14 action items an IDG follow-up visit follows up, or none), behind the same switch (404 while it is off). The GET needs encounter.read and the caseload scope; the PUT needs encounter.author and the caseload scope, is the encounter's author's alone and refuses an AI principal. Both also need the M14 key idg.act and answer 403 with the typed code IDG_ACTION_PERMISSION_REQUIRED without it, except that clearing the link (actionItemId null) needs no idg.act and no M14 (encounter.author, the caseload scope and the template's source-domain read keys still apply). The candidates are the author's own open or in-progress items for the patient that M14 links to an encounter; an item id is accepted only if M14 handed it to that viewer (or it is the visit's own linked item, which stays nameable after M14 closed it), so an item of a patient with Part 2 content the viewer may not read answers the same 404 as an absent id. Both routes leave a read audit attributed to the patient (encounter_idg_action_items.viewed, field names only: the item's title, body and decision payload are never copied into the trail), and a refused link is audited as m8.encounter.idg_follow_up_link_refused (outcome denied, no item id, compliance retention); the PUT is rate limited to 10 requests a minute per user and 100 a minute per organization (a 60 second window, fail-open like CW-AC-02's limiter), counted after the permission, caseload and author checks so a caller they refuse spends nothing, and a link, a clear and a refused link each count (the GET is not limited), which bounds the refused-link events at 600 an hour per author. The choice lives in encounter_idg_action_item_link (migration 1545: organization, provider-entity and location columns, RLS enabled and FORCEd with an app.org_id policy, no DELETE for the application role, one live row per encounter, a row guard that freezes it once the note is signed, cosign-pending, cosigned or voided and that checks at INSERT that the action item exists for the same organization and patient): its row trigger never copies the action item id into an audit image (an insert, an update or a delete, Part 2 or not; the row itself keeps it under RLS) and files a Part 2 derived row, and every DELETE, under compliance_42cfr_part2; the Part 2 flag is raised whenever a section resolution, finalize or sign sees the section Part 2 derived, by the link route itself (it asks M14 again by id after the insert and raises the row in the same unit when the item now needs a release or M14 no longer hands it; a failed second ask is 503 and the link rolls back), and by a clear (which raises the row it removes whatever the patient's status, without asking M14), and is never lowered, so a later flag on the patient is picked up by the next section resolution, finalize or sign (the draft read itself writes nothing). The store (not the database) caps the link rows one encounter may hold at 100, live and removed, counting only a re-link of an item that already has rows (409 IDG_ACTION_ITEM_LINK_LIMIT; a clear is never refused). The idg_followup section is drafted from the linked item as one fixed sentence (meeting date, decision kind, due date), never its title, body or decision payload, and the draft asks idg.act for that section alone: a viewer without it gets the section as not drafted, never a 403 on the draft routes. M14's auto-close is unchanged and the link does not close the item; the draft reads the linked item by id in any status, so an item that closed after the link was confirmed still drafts the same sentence. A confirmed idg_followup section that a recompute can no longer draft while the signer holds idg.act (the item was reassigned, left the signer's reach or is no longer cleared for Part 2) is refused at finalize (a 422 remediation list) and at sign (409) with DRAFT_SECTION_STALE, naming the section and nothing of the item, so the sentence is not dropped from the signed note unseen; the author clears the link and signs again. A signer who has lost idg.act since confirming is refused nothing and the sentence is left out of the note (VN-D66; recorded as a limit below).
    hipaa: ["164.312(a)(1)", "164.312(b)", "164.308(a)(4)(ii)(B)"]
