  - id: CW-AC-23
    title: >-
      An e-prescription whose DoseSpot outcome is unknown is HELD for a person: the transmit worker does not fail it, retry it or send it
      again on an unreadable, missing or lost answer, and an organization administrator resolves the hold. When DoseSpot accepts a NewRx call (2xx)
      but its answer is unreadable or carries no prescription id, when it accepts the SEND but the answer does not echo the prescription id (an
      empty body included), when the send's answer is lost (a timeout, a connect timeout included, or a dropped connection: anything but a
      connection that was never made, which is a refused connection or a failed DNS lookup, recognised on Bun 1.3.5's error shape (code ConnectionRefused,
      for both) and undici's alike), when DoseSpot answers the send with any 5xx other than 503 (the send may have reached the pharmacy), or when a
      worker dies after the call began, the order stays in flight with its transmission row marked unconfirmed_outcome. The send is never re-sent
      after an ambiguous outcome (the one re-send inside a call follows a first 401, which re-mints the token). A send answered 429 or 503, or one
      that never connected, is treated as not accepted and is retried by the worker within its retry budget (five attempts, then the order is
      failed); any other 4xx, and a second 401, fails the order at once and is not retried. A send held on a lost answer or a 5xx counts as a
      failure on the organization's DoseSpot breaker (a NewRx create's success does not reset it ahead of its send); five such holds within 60 seconds,
      with no successful DoseSpot call for that organization in between, open it and the rest of the batch waits without spending retries; a half-open
      probe whose call ends in a lost answer, a 5xx or an unreadable 2xx re-opens it. The row is stamped just before the call, by a conditional update that only the worker that
      still owns the claim can pass (a worker whose claim was drained and taken over makes no call), and that update also restarts the stale
      clock at the call. No worker claims a held order (the claim takes only queued orders, and the stale-claim drain never re-queues a claim
      whose call began); it leaves the hold only through the resolve route or the original call's own late answer, as listed below. Every
      write a worker makes after its claim
      (the fence, recording the created prescription id, the check just before the send, and its settle) is conditional on the claim still being
      its own. Until the call begins the claim is the order's updated_at; once the call began it is a random nonce the fence wrote on the
      transmission row, so an unrelated write to the order (a coverage determination, a correction's version bump) does not cost the legitimate
      worker its claim, and two cycles that stamp the same instant are still told apart. A worker that lost the order, whether drained and taken
      over or resolved by an administrator, writes nothing to it and is stopped before it sends: before its call by the fence, and once its call
      began before the send, both after this call's create and when it resumes a persisted created prescription id. A create that was already
      made is not undone and a send already in flight is not stopped (see the gap). A replacement order, such as a retransmit or a refill, has
      its own transmission row and carries its own Idempotency-Key (the order is part of the key), so it is never queued without a row of its own
      and dedupe by Idempotency-Key cannot fold a retransmit into the failed attempt. The claim only considers orders that have a transmission
      row, so an order left queued without one cannot take a batch slot, and the queued-age alert also finds such an order (aged by its own
      updated_at) as well as any queued order whose row has waited over an hour.
      Apart from a claim that never reached DoseSpot, a prescription is sent again only by the ordinary retry of a failure or an outage, with
      the same Idempotency-Key and, when one was persisted, the created prescription id (a create that timed out retries with the key alone, and
      so does an onCreated that did not commit when the retry runs in another process, since within one process the adapter resumes from its own
      memory of the created id). The drain holds such a claim itself, up to 100 per pass (the rest wait
      unmoved, still in flight, for the next pass); only a stale claim whose call never began is released and re-sent. The two writers of a
      DoseSpot prescription id (the worker's success and the administrator's "sent") refuse to record an id another order of the organization
      already carries (webhooks bind an order by it), under a per-organization, per-id advisory lock; an order whose vendor-returned id is already
      on another order is held instead. That is an application rule, not a constraint: the column cannot be UNIQUE because the table is
      partitioned by created_at, so any new writer must follow it. A created-but-unsent prescription id is persisted so a retry on another
      replica re-runs only the send. The tenant's administrators are alerted when an order is held (one alert per held order: an outbox event
      written in the hold's own transaction, delivered at least once) and reminded after 24 hours. The reminder is one per episode, so while any
      order stays held past 24 hours the episode stays open and a second order that ages meanwhile is covered by it, not by a new reminder; it is
      shared by every replica through the Valkey episode store, each announcement a short-lived claim re-checked against its state and confirmed
      only after its event commits, so a crash delays it and never drops it. The order leaves the hold through
      POST /api/v1/medication-orders/:id/resolve-held-transmission or, when the original call was merely slow, by that call's own late answer.
      A late success clears the hold and records the order as sent. A late outage (nothing reached DoseSpot) puts the order back on the queue
      and clears the marker. A late definitive failure is settled as an ordinary failure and does not keep the order held: a retryable one puts
      it back on the queue with one retry spent and the marker replaced (the next attempt sends the same Idempotency-Key and, when one was
      persisted, the created prescription id), and a permanent one fails the order and alerts the administrators; an administrator who was
      mid-resolution is then refused with a 409. A late unreadable answer keeps it held and replaces the recorded cause. The route needs the
      org-level administrator key (prescribing.clinic.admin), a fresh step-up, a human (non-AI) actor, an Idempotency-Key and a recorded reason
      of at least 10 characters once trimmed: "sent" needs the
      DoseSpot prescription id (refused with a 409 when another order of the organization already carries it) and makes the order transmitted (the
      status poll then follows it); "not sent" makes it a failed transmission that the prescriber retransmits, never back on the queue. The held
      marker, not the failure timestamp, decides that an order is held, so a hold that followed an earlier retry resolves the same way. A
      resolution is accepted only while the hold marker is on the transmission row, under a row lock and a conditional update, so two resolutions,
      or a resolution racing the drain, cannot both win; an order of another organization is a 404; the audit entry carries ids and the outcome
      only, and the reason is kept on a column the write-audit trigger denylists. A transmission that exhausts its retries also alerts the
      administrators.
    hipaa: ["164.312(c)(1)", "164.312(b)", "164.312(a)(2)(i)"]
    soc2: ["CC7.2", "CC6.1"]
    status: partial
    evidence:
