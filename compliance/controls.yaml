  - id: CW-AC-41
    title: >-
      Help requests: any active member of a tenant organization, on a staff session and not ChartWarden staff, an auditor or family session or an AI principal, may ask ChartWarden for help, and the request is a signal that authorizes nothing. The service judges the member because a custom tenant role carries no permission key and row-level security cannot distinguish an operator, who is a member of every tenant, from a customer member. The message and operator note are cleaned of control and format characters, bounded by Unicode code points, and screened best-effort for SSN-, MBI-, labelled-MRN- and date-of-birth-shaped identifiers (422 EVIDENCE_LOOKS_LIKE_PHI); names and deliberately disguised identifiers are not recognized. Mutating help routes opt out of idempotency response capture, row-audit records the text as <changed>, and no outbox event, alert payload, log line or error carries it. Ninety days after close the platform sweep, wired independently of optional provisioning and object-storage integrations, nulls the message and note at rest and stamps message_purged_at; the database trigger and retention CHECK refuse null text on a live row, early deletion or broader rewrites, while API reads project a fixed retention placeholder. There is one live (open or approved) request per tenant account, held by a partial unique index (409 HELP_REQUEST_ALREADY_OPEN carrying the live request's id), and filing needs an Idempotency-Key and is limited to 3 an hour per member and 10 an hour per organization, failing closed although the explicitly warned in-memory rate-limit fallback is per replica when Valkey is absent. Filing publishes the ids-only m34.help_request.requested event and, after commit, best-effort calls M36's AlertEmitter with that same event type, which the tenant.help_requested operator rule matches. Consent is the organization's own: an org_admin or compliance officer is checked in the service and approves under fresh step-up as a human with an Idempotency-Key; the integrated support-grant operation creates only a non-PHI assist grant (CW-AC-40) on the same transaction as the request approval, and its alert is deferred until commit. Ending an approved request also contains any revoke-alert failure after the durable transaction. The request ends when the requester, an org_admin or compliance officer ends it without step-up, when a human operator resolves it with support_session.close and platform-ops ABAC, when its grant expires or is revoked, or when an unanswered request is 14 days old; the shared operation bundle revokes the grant, closes its sessions with grant_revoked and resolves the linked request in the same transaction. Concurrent approval and ending produce a retryable conflict for the losing caller when the request changes while it acquires the grant-before-request lock order. Every persisted state change is row-audited; the operators' inbox is an audited cross-tenant read defaulting to open and approved; the tenant is shown "ChartWarden operations" and never an operator. The database enforces forced RLS on app.org_id, active-member INSERT pins, approval and close column grants and policies, legal-transition CHECKs and guard triggers, immutable consent columns except on open-to-approved, a live same-tenant grant on approval, and one request per grant. While the organization is onboarding the four tenant routes are on the pre-activation allowlist (CW-AC-16). A help request, approval or ending help does not gate ChartWarden's own onboarding access, which CW-AC-12 governs.
    hipaa: ["164.312(a)(1)", "164.312(b)", "164.308(a)(4)(ii)(B)"]
