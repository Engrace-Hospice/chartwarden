    gap:
      reason: The Stedi connection check is one administrator's attestation, not a vendor-side proof (Stedi has no safe probe), and the order of recording the BAA, verifying it and checking the connection is not enforced. A BAA verification is a point in time with no expiry, termination or revoke, so a platform operator cannot stop PHI flowing under a vendor BAA that has ended (owner decision needed; no revoke is built). A credential rotation or a re-recorded BAA takes a live configuration out of service until it is re-verified and the tenant re-activates it, so a NOE inside its 5-day window is held meanwhile (owner decision needed - keep the old credential live until a rotation is verified; the demotion on a changed BAA is deliberate). The 90-day vendor and mode lock window is a policy choice made to match the credential release (owner decision needed). A NOE or NOTR on a tenant's own Claim.MD account needs M23_CLAIMMD_NOTICE_UPLOAD_ENABLED=true and nothing at activation says so beyond the one per-organization warning in the backend log. The BAA verification, credential release and notice-withdrawal keys are separate permission keys held by one role, so no second operator is required. Sealed credentials and held fingerprints have no purge path on tenant closure (CW-DS-01).
