    gap:
      reason: The refusal of a transfer notice for an outside tenant is proven only by the non-live m23-transfer-notice-outside.test.ts (the transfer-notice live suite does not cover it). A recorded filing is the tenant's own claim about the filed date; nothing reads back from CMS that the notice was accepted, and recording it takes the notice out of the window watch's scan, so a false or mistaken record is caught only by the late-record alert or a platform operator's withdrawal (tenant_notice_filing.withdraw_platform is a separate permission key held by the one platform_ops role). A recorded NOTR also clears the prior-election gate on the tenant's word alone.
