      reason: As of 2026-11-09 the executed-BAA document link is verified as a filed row, not as content. What the code enforces (the onboarding-wizard slice, live-asserted in test:m34:onboarding-wizard:live). BAA_DOCUMENT_REQUIRED (baa-guards.ts) checks only that documentId is non-null; the register then links only a document that is a tenant_baa row of the record's own organization that is not a destroyed tombstone (422 BAA_DOCUMENT_INVALID for another tenant's document, another kind, an unknown id or a tombstone), judged in the write's own transaction when a record is created with a link or an update changes the link or makes the record executed (an update that does neither, such as a new expiry on an executed legacy row, is not re-judged). Go-live approval, the status route's activation event and onboarding step 3 judge the governing record's document the same way (documentFiled is a required input of the activation guard, and an input that does not say is not an executed BAA), so an executed status over a link that does not verify, or over no link, does not satisfy go-live. Go-live approval also refuses the operator who uploaded that document, not only the one who wrote the register row (CW-AC-22). Still UNVERIFIED. (1) The document's content is not machine-checked; nothing confirms that the stored file is an executed agreement, names this tenant or matches an expected hash (the upload pipeline checks type, magic bytes, size and computes a SHA-256, and a platform operator chooses the file filed as the signed agreement), so the row proves that a file was filed for the tenant, not what it says. (2) The rule that the go-live approver did not write the BAA (409 GO_LIVE_APPROVER_WROTE_BAA) cannot judge by the register columns the rows written before migration 1332, whose filer and last-writer columns are NULL; the uploader comparison applies only where the document's creator membership is recorded. This row stays partial until the content can be checked and a live assertion proves it.
      owner: engineering
