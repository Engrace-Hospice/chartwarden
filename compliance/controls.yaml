  - id: CW-AC-17
    title: >-
      A tenant's clearinghouse credential is sealed per tenant (AES-256-GCM under a per-organization key derived from the custodied KEK, the envelope bound to its organization, vendor and mode) and never returned. A tenant-held Stedi or Claim.MD configuration goes live only when all of these hold: the tenant has recorded the vendor BAA (holder, date, document reference; by the tenant's own lane only, the service refuses the platform lane with 403 CLEARINGHOUSE_BAA_TENANT_ONLY); a platform operator has verified it (tenant_clearinghouse.verify_baa_platform, a fresh step-up, a human (non-AI) actor, If-Match pinned to the BAA record the operator read, an audit row; by the platform lane only, the service refuses the tenant lane with 403 FORBIDDEN); the connection has been checked (a connection test for Claim.MD, an attestation for Stedi, which has no safe probe, so for Stedi this is one administrator's own attestation with an evidence note, not a vendor-side proof); and the tenant billing admin activates it with a fresh step-up. The order of the first three is not enforced: activation needs only a verified connection and a verified BAA. Activation is the tenant's alone (the platform lane has no activate route, and the service refuses an activation by the platform lane with 403 CLEARINGHOUSE_ACTIVATION_TENANT_ONLY). A database CHECK ties a live configuration to a BAA recorded for its own vendor; a credential, vendor or mode change returns the configuration to draft at once until a fresh connection check re-verifies it and the tenant re-activates it, and its claims, NOE, NOTR and transfer notices are held meanwhile (CW-AC-24); re-recording a changed BAA (a document-reference typo fix included) voids its verification and takes a live configuration to verified, held the same way until an operator re-verifies the record and the tenant re-activates it; a rejected credential holds only that tenant's work. Vendor and mode cannot be changed while a production submission is in flight or was sent in the last 90 days (409 CLEARINGHOUSE_VENDOR_LOCKED). A BAA verification is a point in time: there is no expiry, termination or revoke, so if a vendor BAA ends a platform operator cannot stop the PHI flow (the operator's choice write is onboarding-only, so on a live tenant only the tenant can clear the BAA, by choosing another vendor or outside). The BAA verification and the credential release are their own permission keys, but one platform_ops role holds every platform clearinghouse key: the separation is of keys, not of roles. The free text a clearinghouse record carries (a BAA document reference, an attestation's evidence note) is screened for SSN- and MBI-shaped identifiers only and can still hold a name or a date of birth. One credential belongs to one organization: every credential a tenant seals is reserved to it by a keyed fingerprint (HMAC-SHA256 under a key derived from the KEK, never a plain hash, never returned or audited) that a database unique index holds across organizations, so a second organization saving the same key, or a tenant saving the platform's own key, is refused with 409 CLEARINGHOUSE_ACCOUNT_IN_USE that never names the holder, and the refused attempt is audited. The reservation stays through a key rotation and a switch to `outside`; only a platform operator releases it (tenant_clearinghouse.release_credential_platform, a fresh step-up, a human (non-AI) actor, a reason, an audit row), never the tenant's current credential, and not while the tenant has a production submission in flight or sent one in the last 90 days. A database trigger (migration 1437) refuses setting a reservation's release time unless the transaction carries a transaction-local setting that only that release path sets; it stops other application code paths from releasing one, not a session that can run arbitrary SQL as the application role. A save of a credential the organization holds under none of the configured fingerprint keys is refused (409 CLEARINGHOUSE_CREDENTIAL_LIMIT) once the organization already holds 20 × (the number of fingerprint keys configured at that save) unreleased reservation rows; re-reserving the organization's own current credential is never refused by this cap. The tenant credential PUT, and the platform operator's onboarding PUT (counted per operator and target tenant), are rate-limited per user and per organization, and refused with 503 when the limiter's store is unavailable. Each fingerprint records the public id of the key it was computed under; a row with no key id (recorded before migration 1436, or re-reserved when the credential could not be opened) cannot be attributed to a key. After a KEK change, a save also fingerprints under each retired fingerprint key an operator configures (M23_CLEARINGHOUSE_RETIRED_FINGERPRINT_KEYS: the old KEK's HKDF-derived fingerprint subkey, never a KEK; it computes fingerprints only and opens no credential), so a credential reserved under the old key stays refused. Any other write to a configuration whose credential opens re-reserves it under every configured key, repairing a missing reservation and refusing (409 CLEARINGHOUSE_ACCOUNT_IN_USE) when another organization holds it; when the credential does not open, its stored fingerprint alone is re-reserved, with no key id. A retired credential cannot be recomputed (its plaintext is no longer stored), so its reservation stops matching once its retired subkey is removed (ops runbook §8.3). When the platform database and the credential KEK are both configured (both required in production), an audited platform-context check (the platform role reads only the reservation's id, fingerprint, key id and release time) runs at boot and logs an error when a tenant holds the platform's own key, when a held reservation is under a key that is neither current nor retired, and with the count of held reservations that have no key id (these do not block saves); the failed-check log names only the error class and the redacted message, never the raw driver error (its bound parameters are credential fingerprints). Until that check has completed and found every held key id configured, and while it is failing, every save carrying a credential, on the tenant and the platform onboarding lanes, is refused with 503 CLEARINGHOUSE_FINGERPRINT_KEYS_INCOMPLETE; a refused save re-runs the check at most once a minute, and a clean result holds until restart. Where either is not configured the check does not run and saves are not gated by it. Acknowledgments and remittances for a tenant-held account are pulled only through that tenant's own binding, never through the platform account's Claim.MD capture (CW-AC-10). A NOE or NOTR on a tenant's own Claim.MD account is sent only while M23_CLAIMMD_NOTICE_UPLOAD_ENABLED=true, a deployment-wide switch that is off by default; otherwise it is refused NOT_WIRED and not filed, activation does not check the switch, and the backend logs one warning per organization the first time its own Claim.MD account is bound with it off. Every Claim.MD send on a tenant-held account (M23 claims and notices, M41 commercial claims) first commits the same immutable submission evidence the platform account does (the exact X12 identity, its hash and the sealed billing TIN), under that tenant's own organization and its own account reference (tenant:<organization id>, a namespace the platform's account reference is refused at boot), never the platform account's; a tenant send with no such store, or whose evidence cannot be written, is not sent.
    hipaa: ["164.312(a)(2)(iv)", "164.312(d)", "164.308(b)(1)", "164.314(a)(1)"]
    soc2: ["CC6.1", "CC6.7", "CC9.2"]
    status: partial
    evidence:
