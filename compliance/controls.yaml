    gap:
      reason: The Stedi connection check is one administrator's attestation, not a vendor-side proof (Stedi has no safe probe), and the order of recording the BAA, verifying it and checking the connection is not enforced. A platform operator can now revoke a tenant's vendor BAA, but only by hand, because a BAA verification is still a point in time, nothing expires or ends a BAA by itself and no vendor-side signal reaches ChartWarden, so PHI keeps flowing under a BAA the vendor has ended until an operator is told and revokes it. A credential rotation or a re-recorded BAA takes a live configuration out of service until it is re-verified and the tenant re-activates it, so a NOE inside its 5-day window is held meanwhile (owner decision needed - keep the old credential live until a rotation is verified; the demotion on a changed BAA is deliberate). The 90-day vendor and mode lock window is a policy choice made to match the credential release (owner decision needed), and a tenant that sends continuously is locked for as long as it does unless its BAA has been revoked, when only the tenant's lane may leave the vendor and the vendor it left no longer locks its next move (the operator's choice write stays onboarding-only). A revoke, and leaving the vendor after it, stop the pull of that vendor's late acknowledgments and remittances, so any remittance still owed must be fetched from the vendor by hand. Both pulls raise a once-a-day alert per organization while production attempts are in flight or were sent in the response window, but that count is a proxy because M23 records no per-claim adjudication state, so the alert cannot say which claims are owed. A second approver for a revoke is not built (owner decision needed), so one platform operator holding the key can take a tenant's claims out of service, bounded by the per-operator rate limit and visible at once to the tenant and to platform operations through the revoke alert. Re-recording the identical document after a revoke clears the revocation and goes back to the operator for verification (owner call). A NOE or NOTR on a tenant's own Claim.MD account needs M23_CLAIMMD_NOTICE_UPLOAD_ENABLED=true and nothing at activation says so beyond the one per-organization warning in the backend log. The BAA verification, BAA revocation, credential release and notice-withdrawal keys are separate permission keys held by one role, so no second operator is required. Sealed credentials and held fingerprints have no purge path on tenant closure (CW-DS-01).
