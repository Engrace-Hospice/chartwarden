d items) before the section drafts for them; no role template grants idg.act or idg.read, this slice grants none, and nothing checks the grant when the switch is enabled. The key is asked for that section alone, so a viewer without it is refused no draft: the section is simply not drafted for them, with no sign that a link stands, and a signer who lost the key after confirming it signs a note without the sentence, without a refusal (VN-D66). The key does not scope the items to the author (requirePermission never reads its is_assignee declaration): M14's reader selects only the viewer's own assigned items, and that selection is the check. M14's auto-close is unchanged and does not wait for the link: it closes an open encounter-kind item assigned to a signer when that signer signs ANY visit, so the item may close between the link and the sign; the draft reads the linked item by id in any status, so the sentence stays. The draft states a meeting date, a fixed decision-kind label and a due date, never the item's title, body or decision payload, and that fact is readable by every holder of encounter.read, only Part 2 being flagged. Part 2 is decided per viewer by M14 from the meeting packet's snapshot: a packet that reads activeSudFlag false is trusted without asking M39, so a patient flagged after the packet was built is not seen as Part 2 until a new packet is (a recorded limit, shared with M14's minutes rendering, not fixed here); M39 is a fake in the live suite. Finalize and sign of an IDG note apply idg.act to the signer as the draft does, so a signer WITH the key who is refused 409 or 422 DRAFT_SECTION_STALE for idg_followup learns that a link stands and its item no longer drafts for them (the section id, never the item); an addendum that names a confirmed idg_followup section the recompute no longer drafts is refused DRAFT_SECTION_STALE too. The link table's audit trigger never copies the action item id into an image, but the audit read path (audit.read) is not Part 2 gated, so the row-trigger rows and the refused-link event tell an audit reader that a visit was linked, cleared or had its link removed, as the other draft events do. A flip of the item's Part 2 status in the few milliseconds between M14's answer and the link's insert files the insert's audit row in the plain retention class (it names no item; the row is raised after the second ask and its later images are filed as Part 2; closing it fully needs a lock across M8 and M14, a recorded limit). The refused-link event is best effort: a failure to write it is reported by name and never replaces the refusal. An M39 outage for an item whose meeting needs a release is a denial, not a 503 (M14's disclosure helper denies on an outage, by decision VN-D67): M14 hands nothing, the picker is empty, and a signer holding idg.act with a confirmed idg_followup section is refused DRAFT_SECTION_STALE, which clears when M39 answers again; clearing the link drops the sentence, and so does withdrawing the section (an audited deselect of a confirmed section that no longer drafts, which is the only exit for an addendum, since the signed note's link row is frozen; confirming a section that does not draft stays refused). The same refusal is what a signer M39 does not clear gets after the patient is flagged, so it can tell them the item no longer drafts for them (reassigned, out of reach or Part 2, not told apart). The link service asks again that the caller authored the visit, before the note's state or anything of M14 (404 as an absent visit), so the route's author guard is not the only one; the discipline plan link service (S4b) still has only the route's guard. Naming the item a visit is already linked to again is an idempotent no-op, and the link row is frozen once the note is signed (the guard trigger).
