    gap:
      reason: >-
        An amendment that nobody cosigns stays in the current view while pending (cosignStatus pending). The one-signature-per-addendum rule rests on an advisory lock and a trigger, not a unique index (an index would read as a contract migration). A viewer without Part 2 disclosure is not told which sections an addendum names, so for an addendum that names only withheld sections the note view reports it as a free addendum (cosignStatus not_required) and the web offers a cosigner or supervisor without disclosure no cosign or release region for it, while the cosignature queue and the routes still list it; a user with disclosure can work it. A cosigner without disclosure can still sign an addendum's cosignature through the API, with the same attestation text and no record that the view they cosigned was redacted. There is no live suite of its own for the cosignature workflow or the SLA sweep: the cases sit in the draft-routes live suite. Billing is not re-opened by an amendment.
