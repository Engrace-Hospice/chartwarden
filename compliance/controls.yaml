  - id: CW-AC-18
    title: >-
      Tenant pricing is platform-controlled. Plans, contracts, billing-mode changes and the admin pause, resume and cancel of a subscription are written only through operator routes (platform credential, the M35 pricing keys, a fresh step-up, a human (non-AI) actor, an Idempotency-Key). There is one system exception and one operator-only switch. The exception: when a tenant bills outside ChartWarden (its own `outside` clearinghouse choice, or an operator's on its behalf) the billing mode is set to none as a system action on the platform credential, with no operator, dated like any mode change and idempotent; the platform audit row attributes it to the actor that triggered it (tenant, platform or system, by user id, membership id and the request's correlation id, never a name). The system's change and every operator mode change lock the subscription row and judge the mode history read after that lock, and the system's change asks again, inside the lock, whether the tenant still bills outside. The hourly pricing worker applies the same change again for every current, not-canceled contract, including onboarding, paused and live tenants that may have no statement run; it is bound with the pricing statement worker because it needs the pseudonym key ring, and changes nothing where the mode is already none or pending none. Outside means none is an invariant: an operator's mode write that sets any other mode on an outside tenant is a 409 (BILLING_MODE_REQUIRES_NONE_WHILE_OUTSIDE), so the sweep can never silently undo an operator, and a tenant's own switch away from outside while it has a contract that is not canceled (live or paused) is a 409 (CLEARINGHOUSE_OUTSIDE_SWITCH_REQUIRES_OPERATOR; 503 CLEARINGHOUSE_CONTRACT_UNAVAILABLE if the contract cannot be read, on the operator's route too, the cause logged). Only a platform operator makes that switch, and it is the one write on the clearinghouse PUT route accepted outside onboarding, and only in an explicit allowlist of statuses (provisioning, onboarding, active, at_risk and suspended; a tenant that is offboarding, has its final export pending, is retained, is being destroyed, is destroyed or has only a sign-up intent is refused with 409 TENANT_NOT_ONBOARDING before any mode is written, and that refusal is audited as a write_refused row, failing closed with 503 ONBOARDING_AUDIT_UNAVAILABLE when it cannot be audited): a live tenant that bills outside has no other way off outside, and every other write on that route stays onboarding-only. The same request names the billing mode (422 BILLING_SERVICE_MODE_REQUIRED) and needs the pricing key subscription.onboard_platform as well as the clearinghouse key (403 with the clearinghouse key alone). Every refusal that can be foreseen (the tenant's status, the plan, the body's rules, the If-Match, the switch's locks, a missing credential or encryption key) is made before the mode is written, so a plain input error writes no mode and is audited as a write_failed attempt (the status refusal is the write_refused row above), as is a refused mode write; then the mode is set first through the ordinary operator path (dated like any mode change: at once while the tenant is onboarding with nothing billed, otherwise the 1st of next month; audited as the operator) and then the vendor. If the vendor change fails with a certain rollback (a failure before its commit, or a refusal the database answered with a definite error class) the mode is put back to none, so a failure never leaves a vendor without its mode; if its COMMIT fails with no definite answer from the database (a lost connection, or a connection-class or server-error SQLSTATE) nothing is undone blindly: the vendor is read again, and the mode goes back to none only when the vendor did not land (when it did, the switch stands and the answer is the row as it is; when it cannot be read the mode is left as set and the answer is 503 CLEARINGHOUSE_SWITCH_OUTCOME_UNKNOWN, logged; one narrow residual cannot be closed from the server: a commit the client gave up on can still land after the read-back saw outside, leaving a vendor with the mode put back to none, so after any failed switch the operator reads the tenant's clearinghouse and contract and sets the mode); and once the vendor has committed the operator's mode is asked for again (idempotent), and once more if that fails, so a sync or sweep that set none in between is corrected. That confirmation is best effort: the vendor change stands, and a mode that still cannot be confirmed is reported in the answer (billingModeConfirmed: false) and logged, never a silent success. No other tenant path writes the billing mode. Statements, the daily census and statement reviews are NOT written through those routes: the hourly m35.pricing-statement worker and the 6-hourly m35.patient-census worker write them on the platform credential, under the registered platform job m35-subscription-admin, with none of those operator gates (no step-up, no human actor, no Idempotency-Key). What bounds those writes is the carrier's grants below, the final-statement freeze and its CHECKed arithmetic (CW-PI-01) and the audit rows; each platform call is an audited cross-tenant bypass, so a sweep reads every org's facts in one call and opens a write transaction only for an org with something to compute. The hourly m35.subscription-pause-resume worker is NOT one of those platform-credential workers: it resumes a lapsed pause on the tenant (chartwarden_app, org-scoped, RLS-checked) credential, one transaction per active organization, which reads the organization's newest subscription plainly and takes a row lock (re-judging the row after it, under a 5 second lock timeout) only when that subscription is a lapsed pause, then makes a guarded update, and none of the operator gates (it acts for no operator); it writes no platform audit row because there is no operator, and the list of active organizations it fans out over is one audited platform call per sweep, the same enumeration the other hourly M35 jobs use. Its writes are not unaudited: the M4 write-audit triggers on subscription and subscription_state_history (migration 0143) copy each subscription and subscription_state_history row it writes into the tenant's audit trail as the system, with no actor (the outbox row it also writes is not copied: the baseline trigger skips outbox_event, migration 0004). A lock held longer than the timeout fails that organization's run (SQLSTATE 55P03: the fan-out logs it with the organization id, the other organizations continue and the next hour retries). The organization's current subscription is the subscription newest by started_at, the higher id breaking a tie; subscription readers and writers use that ordering, while contract selection keeps its own created_at and id ordering. The worker, the org-lifecycle consumer and the tenant's own resume of a non-contracted subscription read the current subscription under a row lock, so a resume racing the worker or the consumer judges the status the other left. The platform carrier's grants are enumerated per table and column-level only where stated: INSERT on plan (UPDATE of its editable price and state columns only), INSERT and DELETE on plan_census_band (a draft's bands are replaced wholesale; never UPDATE), INSERT on subscription and subscription_state_history, INSERT only on the contract and the billing-mode history, SELECT and INSERT on statement review, table-wide INSERT and UPDATE on subscription_statement and patient_census_daily (a final statement is frozen by its trigger), and on `subscription` UPDATE of exactly status, paused_at, paused_until, canceled_at, cancel_at_period_end and updated_at (never organization, plan, period, trial, dunning or Stripe columns); among the pricing tables it holds no DELETE except on plan_census_band (it holds DELETE elsewhere, outside pricing: on the platform write tables revenue_recognition_snapshot, stripe_webhook_event, patient_pseudonym_key, stripe_api_call_audit and the platform-retained invoice tables, and on the tenant-offboarding erase tables, per scripts/db/provision-runtime-roles.ts). Admin pause, resume and cancel read the subscription FOR UPDATE in the write transaction and refuse a transition its status does not allow (409 SUBSCRIPTION_NOT_PAUSED, SUBSCRIPTION_CANCELED, SUBSCRIPTION_ALREADY_PAUSED, nothing written, audited or announced); admin resume also refuses a paused row that is not the organization's current subscription (409 SUBSCRIPTION_SUPERSEDED). The operator routes refuse to run without the audit writer (503 AUDIT_UNBOUND). A resume of a paused subscription whose organization already has another live subscription is refused too (409 SUBSCRIPTION_OTHER_LIVE_EXISTS) by the operator's resume and by the tenant's own resume of a non-contracted subscription. The partial unique index is registered as a database business rule and a race at the update is mapped to the same typed refusal; the tenant message directs the tenant to support, while the operator message directs the operator to cancel or pause the other row. Tenant resume also refuses a canceled subscription, even one still scheduled to cancel (409 SUBSCRIPTION_CANCELED), and one that is neither paused nor scheduled to cancel (409 SUBSCRIPTION_NOT_PAUSED). A pause may carry an end date: an ISO 8601 instant with an explicit offset (422 PAUSE_UNTIL_INVALID otherwise, so it means the same instant on any host) that must be in the future at the instant the pause is written, which is read after the row lock (422 PAUSE_UNTIL_NOT_FUTURE). When the date arrives the hourly m35.subscription-pause-resume worker resumes the subscription: status active, paused_at and paused_until cleared, a status-history row (paused to active, reason platform_ops_pause_lapsed, no actor) dated at the pause's own end date rather than the worker's instant, and the same m35.subscription.resumed event an operator's resume publishes. Until it runs (normally within the hour; longer if the worker is late or skips the row) billing still counts the pause as over at that date. The worker visits active organizations only (a suspended one is never visited) and acts on the organization's newest subscription only, the row every other lifecycle path reads (an older, superseded subscription is never resumed, even if its own pause has lapsed); it never touches an open-ended pause or one whose date is ahead. The worker and the organization-activation consumer both leave the current paused subscription alone when another subscription of the organization is live: the pause stays paused, and one shared once-per-day-per-subscription process gate raises a dedicated platform-ops notice (an error-level log, plus the webhook when OPS_ALERT_WEBHOOK_URL is set; organization id, blocked subscription id, other-live subscription id and trigger only). A restart repeats the notice. The activation event is consumed without retrying to a dead letter, and the next eligible resume after the other subscription is canceled or paused succeeds. An organization suspension arriving after the date starts a new pause (the consumer writes the lapse at the old date first); one arriving while a dated pause is still running makes that pause open-ended (the date is cleared and a paused-to-paused history row is written at the suspension), so a suspended organization stays unbilled past the old date until it is reactivated. The operator is named only in the platform audit row, never in tenant-readable subscription history. Tenants read their contract by column (signer, signing reason and order form withheld); contract and billing-mode history cannot be deleted; a billing-mode change takes effect immediately only while the tenant is not live and has no statement, otherwise on the 1st of the next month. A tenant cannot pick, move onto or off, cancel, resume or apply a promo to a contracted plan (403 PLAN_ASSIGNED_BY_OPERATIONS), and an operator cannot apply a promo to one either (409 PROMO_NOT_APPLICABLE_TO_CONTRACTED_PLAN): those refusals are application code (refuseContractedPlan in routes/service-drizzle.ts), not a database defence, because the application role keeps UPDATE on `subscription`; live cases cover the tenant's pick, move onto, cancel, resume and promo and the operator's promo. KNOWN GAP (owner decision pending): a final statement is frozen by trigger and no credit, reissue or correction path exists for it; a month that finalizes on a sparse census (under 80% of the days its census sweep could have observed, derived from the sweep schedule), with remittances not yet posted, or on an unfiltered staff count is flagged needs_review (a sparse census also in the review table with a reason code), but only a change made outside the application could correct it.
