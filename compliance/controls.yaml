  - id: CW-AC-36
    title: >-
      A failed request frees its Idempotency-Key for a retry only when it provably wrote nothing, and a duplicate of a request that is still running, or that never finished, is told so by its own code. A mutating request that carries the header and has an organization claims (organization, key) atomically in the Postgres idempotency_key table before its handler runs (a different body under the key is 409 IDEMPOTENCY_CONFLICT; a completed response is replayed; a route marked noIdempotencyCapture takes no claim). A 5xx or the deadlock/serialization 409 CONCURRENT_UPDATE RELEASES the claim only if the per-request commit tracker proves that nothing committed after the claim, and is otherwise cached and replayed like any other response. The tracker is fed by every query of the one pool builder, createDbClient (a test fails if a runtime source builds another pg Pool or Client), and counts a COMMIT of a transaction that ran a write, an autocommit write, a write transaction still open (its first write counts until its COMMIT or ROLLBACK) and a COMMIT or autocommit write the server has not answered yet; a server error with a 5-character SQLSTATE and severity ERROR (other than classes 08, 58 and XX) clears that count, a lost connection or a FATAL leaves it counted. It lexes the statement text (a string literal, a quoted identifier and a line comment are each one opaque token) and treats as a write any text with a block comment, any text with both a semicolon and a line comment, any text it cannot lex cleanly, any compound text with a statement that is not a SET/SHOW-style statement or a read, any SELECT, WITH, VALUES, TABLE or EXPLAIN that carries DML or calls anything but a short allowlist of read-only builtins (a user-defined function counts as a write, readers included), EXPLAIN ANALYZE of anything but a plain SELECT-style statement, DECLARE and FETCH. When the request's tracker is not the ambient one at the claim or at onSend, a retryable failure is cached (and a warning is logged with the key and no payload). A duplicate whose first request is still pending gets 409 IDEMPOTENCY_IN_FLIGHT (keep the key and retry), and once that claim has been pending for more than 15 minutes (the database's clock, from created_at) 409 IDEMPOTENCY_KEY_STUCK (the first request's outcome is unknown: do not retry with the key, read the resource); the stuck row is never reclaimed, released or re-run, and a row whose release or completion failed stays pending until its 24-hour expiry. The residuals are stated, not hidden: the lost-context check holds only at those two checkpoints and does not see a context lost inside a handler; a route that answers a 5xx while its handler keeps running and has not yet issued its first write can be released and still commit; a route that hijacks its reply (the M33 CSV exports) never completes its claim, so its duplicates are IN_FLIGHT and then STUCK; and an effect outside Postgres (an outbound call, a queue or object-store write made directly in a route) is not counted
    hipaa: ["164.312(c)(1)"]
    soc2: ["PI1.3", "PI1.4"]
    status: partial
    evidence:
      - script: test:gap007:idempotency-claim:live
      - script: test:f073:idempotency-bodiless:live
      - script: test:m36:idempotent-send:live
      - ci: "Unit + integration suite (bun run test)"
      - file: packages/db/src/commit-tracker.ts
      - file: apps/backend/src/bootstrap/plugins/idempotency.ts
      - file: apps/backend/src/bootstrap/plugins/idempotency-store-db.ts
      - file: packages/shared/src/idempotency/idempotency.ts
      - file: packages/db/__tests__/commit-tracker.test.ts
      - file: apps/backend/__tests__/idempotency-commit-tracker.test.ts
      - file: apps/backend/__tests__/idempotency-in-flight.test.ts
      - file: apps/backend/__tests__/idempotency-real-socket.test.ts
    gap:
      reason: The release rule cannot prove what it cannot see. The lost-context check runs only at the claim and at onSend, so a context lost inside a handler leaves a later write unattributed; a route that answers a 5xx while its handler keeps running (a Promise.race deadline or timeout wrapper) and has not yet written can be released and still commit afterwards (the routes in apps/backend/src that answer before their work ends were reviewed on 2026-11-09 and each writes its ledger or in-doubt row, which is tracked, before it answers, or only abandons an outbound call or a read); and an outbound call, a queue write or an object-store write made directly in a route is not counted (the platform's convention puts those behind the outbox, after the commit). A new route that answers early, or hijacks its reply, must be reviewed against this row.
      owner: engineering
      review_by: 2027-03-31

