  - id: CW-AC-47
    title: >-
      Visit-note closure gate (ADR-0113 D6): in a tenant whose closure policy is block (the default is warn; off and warn refuse nothing), a staff session whose oldest clocked open visit note is past its block instant is refused 403 NOTE_CLOSURE_REQUIRED on every route outside an exact METHOD + route-template allowlist (the note's own routes, the wound and plan-change routes its composer calls, the read-only chart, eMAR, orders, triage and on-call, field safety, emergency messaging, the alert inbox, and the duties that cannot wait for a note: incident report, death, code status, comfort kit, break-glass, EVV check-out and offline sync, IPU restraint release and reassess). Hospice election revocation, discharge, an allergy write, consent revocation, a new restraint and starting a visit stay refused, each pinned with its reason in a test. An EVV offline-sync batch that contains a check_in is refused through the same verdict (assertNotBlocked, a required dependency of the EVV routes injected by the composition root so M18 imports nothing from M1). The gate fails closed: a policy or evaluator failure answers 503 NOTE_CLOSURE_UNAVAILABLE, a policy read or an evaluation past 5 s fails the same way (an evaluation frees its single-flight key), and one organization and member may start at most 20 evaluations a second (429 RATE_LIMITED, Retry-After 1); only a last-known off or warn policy read under 55 s ago stands in for a failed policy refresh. A block is never cached; a clear, or a warn on a proven bound (an override's end or a block instant ahead), is cached at most 5 s, counted from the instant the evaluation is as of. A refusal leaves a per-organization log line (at most one per 30 s; organization id and count only) and the label-free counter chartwarden_note_closure_refusals_total.
    hipaa: ["164.312(a)(1)"]
    soc2: ["CC5.2", "CC6.1", "PI1.3"]
    status: partial
    evidence:
      - script: test:m8:note-closure:live
      - ci: "M8 note closure"
      - file: apps/backend/src/bootstrap/note-closure-gate.ts
