  - id: CW-AC-42
    title: >-
      The tenant's own skip of an onboarding step removes the operator's check on that step, so it is itself a control. POST /api/v1/tenant/onboarding/:taskId/skip requires onboarding.manage_own, the literal org_admin role (the ABAC predicate tenant_org_admin_role, and the service's owner rule), a fresh step-up, a human (non-AI) actor, an Idempotency-Key and a rationale of 8 to 2000 characters, cleaned and screened for patient identifiers (422 EVIDENCE_LOOKS_LIKE_PHI). It settles only MAC credentials, payer enrollment and DoseSpot kickoff, in the strict step order; any other step, sample data, go-live and a step an operator added included, is refused with 409 ONBOARDING_STEP_NOT_TENANT_SKIPPABLE before the step's owner rule and the order are judged. The skip is reversible by re-opening the step (refused while a go-live attestation is pending; the re-open keeps who skipped, when and the rationale in the task's history) and is recorded in the task's completion evidence with the actor kind tenant, the member, the user and the rationale. The tenant's skip revokes a pending go-live attestation in the same transaction; an operator's skip and the system's clearinghouse skip do not. The three steps are gating, so an open one already rules a pending attestation out and the revocation is a guarantee the wizard does not normally reach. The rationale is free text and is copied into the tenant's audit trail: the onboarding_task row-audit trigger (audit_phi_write_onboarding_task, migration 0053, audit_scrub with an empty denylist) copies the whole completion evidence into audit_event before and after, with retention class compliance, append-only, readable in that organization by holders of audit.read; for an operator's skip the same row also names the operator's user and membership. The text is screened for SSN and MBI shapes only, which is best effort; the same exposure already exists for evidence notes, blocker reasons and operator skips. The rationale is also held in the idempotency record's response body until it expires after 24 hours and is swept hourly and, after a re-open, in the task's re-open history; no log line, outbox event, error message or 422 carries it. The platform API's view of the tenant's wizard lists the skip (skippedBy tenant, with the rationale) and the admin console's step evidence card says who skipped the step (the organization, ChartWarden operations or the system), for the go-live approver, who still evaluates every go-live guard. Nothing machine-checks that a skip is true: the approver's review is the check. The route is on the not-yet-live organization's allowlist (CW-AC-16).
