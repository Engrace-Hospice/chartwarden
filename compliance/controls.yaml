  - id: CW-AC-16
    title: >-
      A session on an organization that is not active (created, suspended, closed, or a status that cannot be read, which fails the request) is confined to an exact list of METHOD + route-template pairs, matched on the template Fastify resolved: sign-in, session and step-up plumbing; the M34 tenant wizard (including the tenant org_admin's own skip of MAC credentials, payer enrollment or DoseSpot kickoff); the four tenant help-request routes that file, read, approve and end non-PHI help through an assist grant; the identity routes its staffing steps need; and four consented-support safety routes that list existing grants and sessions, read the tenant-scoped session ledger, or revoke an existing grant. Direct support-consent grant issuance remains denied before activation. Only while the organization is exactly created, the gate additionally admits the five tenant-clearinghouse pairs, the four MAC-credential pairs and GET /api/v1/subscription/pricing used by the billing steps. Every other route answers 403 ORGANIZATION_ONBOARDING, including tenant DSAR and export downloads, care-team staff, member credentials, direct user provisioning, every clinical, PHI and messaging route, and every other billing and subscription route. The realtime handshake is refused. The only wildcard admitted is Better Auth's /api/auth/* for a path that decodes cleanly under it. Every admitted route keeps its own permission, role, step-up, human-actor, idempotency and data-scope guards; the help approval service permits only the non-PHI assist scope while confined. Go-live approval then activates the organization (a repeated approval or the daily sweep finishes it if that step failed), and the M2 organization status route refuses to activate an organization whose tenant is still onboarding (409 GO_LIVE_TWO_PARTY_REQUIRED). The authenticate hook cannot be built without the gate: the stage reader is a required dependency and boot fails if it is missing.
