    gap:
      reason: The PreToolUse guard is a set of shell-text heuristics for a cooperative agent, not a sandbox (a determined process can read a file through a construct the rules do not anticipate), and the local ledger is an unkeyed hash chain that catches accidents, not tampering. Remote shells are an ask, not a deny (owner decision 2026-11-05) - .claude/settings.json no longer denies ssh/scp/rsync outright, so a non-local ssh/scp/sftp/rsync relies on the guard's per-host human confirmation and on the human authorizing one named host for one session (.claude/rules/phi-and-secrets.md). Codex runs the same guard through .codex/hooks.json (the --codex mode, because Codex cannot ask, so every ask becomes a deny, apply_patch is parsed file by file, PTY requests are denied, and write_stdin allows empty polling only), but that layer is weaker - Codex hooks are trust-gated per developer (/hooks), can be switched off ([features] hooks = false, or a fresh CODEX_HOME) or bypassed (--dangerously-bypass-hook-trust), OpenAI documents them as a guardrail rather than an enforcement boundary, an MCP tool is judged only by the strings in its input (the matcher is Bash|write_stdin|apply_patch|mcp__.*, and the guard reads every string and key as a secret path, as a protected path resolved from the session directory with symlinks followed, and as PHI or credential text), the shell layer is text heuristics that cannot read a script file, computed or encoded names, glob targets, symlinked shell targets inside command text (a path it reads in the text is not followed), a path piped into xargs, curl -O or a bare wget URL (both write the URL's file name into the current directory), or a recursive delete of an ancestor of the repo root, and Codex has no PostToolUse ledger or Stop gate yet (only the guard's own deny entries are recorded). The hook command is pinned (bun with --config=/dev/null --no-env-file --tsconfig-override=/dev/null so neither a bunfig.toml preload, a .env file nor a tsconfig.json paths map can run code before it (bun 1.3.3 or later, since earlier releases silently ignore --no-env-file, so package.json engines.bun is at least 1.3.3), an 8 s alarm, exit 2 when the guard cannot start or times out, and a hook timeout the gate requires to exceed the alarm), the Codex guard classifies a shell command from the call's workdir (the one Codex-only part; a workdir that is a symlink is resolved first), both guards judge paths with their real locations (the shared code judges a shell command as written and with the real paths of the root and of the directory it runs in, and resolves Read, Write and Edit paths through realpath), the Codex guard takes its repo root from the script's own location and never from CLAUDE_PROJECT_DIR, and the Codex workspace-write sandbox, not this hook, is the boundary. Claude's own guard, ledger and Stop-gate commands are pinned byte for byte in arch:compliance and run with the same three bun flags so a bunfig.toml preload, a .env file or a tsconfig.json paths map cannot run before them (no alarm or exit-2 wrapper there, because a missing perl would lock out every Claude tool call). The gate also refuses a .claude/settings.json that disables hooks, sets bypassPermissions, or sets a harness switch, a config redirect (CODEX_HOME, CLAUDE_CONFIG_DIR), a loader variable (LD_PRELOAD, DYLD_INSERT_LIBRARIES, BASH_ENV, ENV, PATH) or BUN_OPTIONS in env, checks the guard, ledger and Stop gate hook timeouts, and judges the .gitignore allow-list with git check-ignore itself (a git that hangs or cannot run is an error, never a pass). The shell classifier bounds its own work (a command over 64 KB is refused rather than asked about, so a shell heredoc patch that large must use the apply_patch tool, brace alternatives and path resolutions are budgeted per command, glob matching uses no regular expression, and substitutions are capped) because a guard that times out lets a Claude call through. Closes with a filesystem sandbox or secret