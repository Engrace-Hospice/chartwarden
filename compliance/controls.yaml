      - file: apps/backend/src/modules/25-remittance/outbox-consumers/m23-appeal-reported.ts

  - id: CW-AC-12
    title: >-
      Platform operators enter a tenant's onboarding data (provider entity and EIN, locations, MAC and state Medicaid credentials, the tenant's clearinghouse choice (tenant_clearinghouse.write_platform), its connection verification (the same key; a connection test for Claim.MD, an attestation with an evidence note for Stedi, which has no safe probe; not its activation, which only the tenant's own billing administrator performs: CW-AC-17, the platform lane has no activate route and the service refuses it with 403 CLEARINGHOUSE_ACTIVATION_TENANT_ONLY), and the tenant's DoseSpot clinic registration and connection test (tenant_dosespot.write_platform; not its activation, which only the tenant's own administrator performs: CW-AC-21, the platform lane has no activate route and the service refuses it with 403 DOSESPOT_ACTIVATION_TENANT_ONLY)) only inside that tenant's own row-level-security scope (the NOBYPASSRLS app pool under the target organization's app.org_id, never a bypass write), behind a platform-ops role, the tenant_onboarding_data.write_platform key, a fresh step-up, a human (non-AI) actor, an Idempotency-Key and a recorded reason that is screened for SSN- and MBI-shaped identifiers only (422 EVIDENCE_LOOKS_LIKE_PHI; a name or a date of birth is not recognized); only while the tenant is provisioning or onboarding (409 TENANT_NOT_ONBOARDING once active; the status is checked under the shared onboarding advisory lock, so a go-live approval cannot overtake the check); every successful write, and every refusal because the tenant is no longer onboarding, leaves an audit row naming the operator, the target organization and the reason in the same transaction as the check or write, and the same transaction revokes a pending go-live attestation that the write makes stale; a failed write (404, 409, 422, 5xx) rolls back and is audited afterwards as a denied write_failed row in a separate best-effort transaction whose failure is logged; every read is audited in its own transaction after the data is read and is withheld (the request fails) if that audit row cannot be written; the EIN and credential secrets are sealed and never returned; after a write commits the onboarding advance runs best effort (a failure is warned with the error redacted)
    hipaa: ["164.312(a)(1)", "164.312(b)", "164.308(a)(4)"]
    soc2: ["CC6.1", "CC6.3", "CC7.2"]
    status: implemented
    evidence:
      - script: test:m34:onboarding-data:live
      - script: test:m23:tenant-clearinghouse:live
      - script: test:m12:tenant-dosespot:live
      - ci: "M34 onboarding data"
      - file: packages/db/migrations/1330_m34_platform_onboarding_data_permissions.sql
      - file: apps/backend/src/modules/34-saas-tenant-platform/routes/platform/onboarding-data-routes.ts
      - file: apps/backend/src/modules/34-saas-tenant-platform/routes/platform/onboarding-data-service.ts
      - file: apps/backend/__tests__/m34-onboarding-data-routes.test.ts
      - file: apps/backend/src/modules/34-saas-tenant-platform/onboarding/go-live-void.ts
      - file: apps/backend/__tests__/m34-onboarding-reason.test.ts

  - id: CW-AC-13
    title: >-
      Tenant go-live is two-party: the tenant's compliance officer attests readiness (go_live.attest, a fresh step-up, a human (non-AI) actor), then a different human user, a platform operator, approves (go_live.approve_platform, a fresh step-up, a human actor, a written reason that the approval and the organization activation both record in the same cleaned form). The two sides are compared by user id as well as membership id (application check 409 GO_LIVE_SAME_PERSON, repeated by a database CHECK on the approved row). Neither the compliance officer nor the attester can be ChartWarden platform staff (the acting operator, a member bound to platform_alert_audience, or a live holder of any platform-owned role the platform-role reader reports, including ai_safety_owner): 422 COMPLIANCE_OFFICER_PLATFORM_STAFF on assignment, on the role bind and on attestation, and an attestation whose attester became staff is stale at approval. Approval takes the exclusive onboarding advisory lock as its first statement (data writers hold it shared, so approval and a writer cannot deadlock) and judges everything under that lock: the activation guards; that the attester is still an active member, still holds compliance_officer, is not platform staff and, when an officer is assigned, is still that officer (409 GO_LIVE_ATTESTATION_STALE, re-checked again inside the activation itself); and that the approver did not record or last change the governing BAA (409 GO_LIVE_APPROVER_WROTE_BAA). A deadlock or serialization failure that still occurs is a retryable 409 CONCURRENT_UPDATE. An attestation more than 14 days old can no longer be approved (409 GO_LIVE_ATTESTATION_EXPIRED) and platform operations must revoke it before the officer attests again. A pending attestation is revoked when the officer is reassigned (in the same transaction on the platform route; in a best-effort platform transaction after commit on the tenant route, the approval re-check being the guard that does not depend on it) and in the same transaction as any write to the onboarding data it attested: provider entities, locations, MAC and Medicaid credentials, the organization's names (the org profile and PATCH /orgs/:id), the platform BAA register and platform NPI verification (reason "onboarding data changed after attestation", recording the revoking user, and the revoking membership only when it is that user's own active membership of the organization). Neither the advance sweep nor either status route (the M34 tenant status route, the M2 organization status route) can open an onboarding tenant (409 GO_LIVE_TWO_PARTY_REQUIRED). The tenant role can insert a pending attestation through a column-level INSERT grant (attester identity and note only, so status, attested_at and the approve and revoke columns always take their defaults; the policy pins the attester to the session user and to an active membership of its own organization) and void its own pending attestation (a column-level UPDATE under a pending-to-revoked policy pinned to the session user, an optional own-organization active membership, and a reason of at least 8 characters), and can never approve it. Its only write on tenant_account is a column-level UPDATE of its own compliance officer, whom the application checks to be an active member holding compliance_officer. A platform officer assignment requires a reason and is audited with the operator; while the tenant is onboarding it also binds the compliance_officer role to the chosen active member on the tenant pool under the tenant's RLS scope, audited as m3.role.assigned with operator, organization and reason, and expires that grant again (m3.role.revoked) if the assignment then fails. The tenant's org_admin still cannot grant the role, and the tenant route still requires it. Go-live approval then activates the tenant's organization in a separate transaction; the organization stays `created` until then, and repeating the approval or the daily sweep finishes it if that step failed (503 ORGANIZATION_ACTIVATION_FAILED)
