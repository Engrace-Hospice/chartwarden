      - file: apps/backend/__tests__/m34-baa-document-upload.live.test.ts
      - file: apps/backend/src/modules/22-documents/routes/immutable-kinds.ts
      - file: apps/backend/src/modules/34-saas-tenant-platform/routes/platform/baa-guards.ts
      - file: apps/backend/src/modules/22-documents/routes/server-upload.ts
      - file: apps/backend/src/modules/22-documents/routes/server-upload.test.ts
      - file: apps/backend/src/modules/22-documents/routes/document-content-scanner.ts
      - file: apps/backend/src/modules/22-documents/routes/document-content-scanner.test.ts
      - file: apps/backend/src/modules/22-documents/routes/verified-upload.ts
      - file: apps/backend/src/modules/22-documents/routes/verified-upload.test.ts
      - script: test:intake:production-smoke
      - script: test:m34:onboarding-wizard:live
      - file: deploy/production/nginx/chartwarden-platform.conf
      - file: deploy/production/nginx/chartwarden-platform-proxy.conf
      - file: deploy/production/nginx/chartwarden-platform-limits.conf
      - file: packages/db/migrations/1477_m34_platform_carrier_reads_document_creator.sql
      - file: scripts/__tests__/platform-nginx.test.ts
      - file: deploy/production/README.md
      - file: apps/backend/__tests__/m34-onboarding-baa-document.test.ts
    gap:
      reason: Two further residuals the route does not close. (1) Exposure of the platform hostname, which is reachable by anyone who can reach it (no IP allowlist or mTLS is configured, an operator decision not made here), with only nginx's per-address request and connection limits in front of the pre-auth body buffering, which do not bound a slow sender in total time. (2) Operator identity, since the platform_ops role holds data entry, BAA upload, register write, go-live approval and pricing together (splitting it is an owner decision) and the checks that keep one operator from both writing and approving (the uploader, the register writer, the attester) compare accounts, so the operators are distinct by account, not by person.
