# docker-compose.yml — local dev/CI stack (TASK-040F, production-readiness audit 2026-08-03,
# OPS-002/OPS-003).
#
# SCAFFOLD, NOT A VALIDATED PRODUCTION TOPOLOGY — see Dockerfile's header for the same caveat. This
# proves a clean-clone `docker compose up` boots the real API + worker processes against real deps
# and that /health + /ready respond; it does not claim HA, backups, or a real deploy target (those
# are TASK-040G and TASK-040F's own deploy-pipeline half, `.github/workflows/deploy.yml`).
#
# All app-facing env vars here are LOCAL-ONLY DEV PLACEHOLDERS, not secrets — this file is
# committed. `NODE_ENV=development` throughout, so `bootstrap/env.ts`'s production requirement set
# (BETTER_AUTH_SECRET length, the base64 KEKs, INTERNAL_SERVICE_TOKEN, …) does not apply; only the
# handful of vars this repo's real local `.env` actually sets are wired here (DATABASE_URL,
# REDIS_URL, BETTER_AUTH_SECRET/URL, TRUSTED_ORIGINS, NODE_ENV, PORT/WORKER_PORT), plus the MINIO_*
# contract (`s3ObjectStoreConfigFromEnv`, apps/backend/src/modules/22-documents/seams/
# s3-object-store.ts) so M22's real S3 adapter binds instead of its refusing deny-stub.

# DEV-ONLY M34 provision gateway wiring, shared by `api` AND `worker`. The worker role runs the outbox dispatcher and
# the `tenant.provision` consumer, so an env set on only one of them leaves `m34.tenant.provision_started` with no live
# consumer (deferred 30 min, tenant stuck "Provisioning"). Points at the `provision-gateway` stub service below;
# production supplies the real gateway.
x-m34-provision-gateway-env: &m34-provision-gateway-env
  M34_PROVISION_GATEWAY_ENABLED: "true"
  M34_PROVISION_GATEWAY_URL: http://provision-gateway:8080
  M34_PROVISION_GATEWAY_TOKEN: chartwarden-local-provision-gateway-dev-token-not-for-production
  M34_INVITATION_ACCEPT_URL: http://localhost:5173/tenant-invite

services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ${CHARTWARDEN_DB_NAME:-chartwarden}
    ports:
      - "5432:5432"
    volumes:
      - chartwarden-compose-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d ${CHARTWARDEN_DB_NAME:-chartwarden}"]
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: valkey/valkey:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  # No healthcheck: the official image's minimal base has no confirmed curl/wget/mc available to
  # probe it with, and a wrong healthcheck command would block the whole stack on a false negative
  # (worse than no healthcheck at all). Not a boot-time dependency for api/worker either way — the
  # S3 adapter binds unconditionally when MINIO_* is set (s3ObjectStoreConfigFromEnv) and only
  # touches the network on an actual document read/write, not at process boot.
  minio:
    # Chainguard's build of MinIO: `minio/minio` is no longer published to Docker Hub.
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: chartwarden
      MINIO_ROOT_PASSWORD: chartwarden-minio-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - chartwarden-compose-minio:/data

  # M36 WP 1.5 — the attachment malware scanner (clamd over TCP INSTREAM). Reachable only on the compose network:
  # NO published host port. deploy/clamav/clamd.conf sets the alert-on-unscannable policy (encrypted, over-limit) and
  # StreamMaxLength >= the 25 MB upload cap. The signature DB is a named volume, so a restart does not re-download it;
  # the first boot downloads it (a minute or two), during which the healthcheck is "starting". api/worker only wait for
  # the container to START, never for it to be healthy: until clamd answers, attachments simply stay `pending`
  # (nothing is delivered), and unrelated boot paths never fail on a signature download. clamav/clamav-debian is
  # multi-arch (the alpine clamav/clamav image has no arm64 build).
  clamav:
    image: clamav/clamav-debian:1.4
    # clamd loads the whole signature set (a reload briefly doubles it): bound it so a scan flood or a bad update
    # cannot starve postgres/minio/api on the same host.
    mem_limit: 4g
    cpus: 2
    networks: [scan]
    volumes:
      - chartwarden-compose-clamav:/var/lib/clamav
      - ./deploy/clamav/clamd.conf:/etc/clamav/clamd.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 180s

  # One-shot: applies the full migration chain + bootstraps the runtime LOGIN roles (plain
  # `db:migrate`, not `db:migrate:deploy` — this is a fresh local/CI environment, not a per-deploy
  # re-run against an already-migrated prod DB; see TASK-040E). `restart: "no"` + api/worker
  # depending on `service_completed_successfully` means the stack genuinely waits for schema to
  # exist before serving traffic, rather than hoping nothing queries the DB before it's migrated.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      [
        "sh",
        "-c",
        # The bucket backfill is best-effort here (MinIO may still be starting): the attachment upload path also
        # creates a missing tenant bucket on demand, so a miss only costs the first upload a bucket-create round trip.
        "bun run scripts/db/migrate.ts && bun run scripts/db/provision-runtime-roles.ts && (bun run scripts/backfill-tenant-buckets.ts || echo 'tenant bucket backfill skipped (will be created on first use)')",
      ]
    environment:
      DATABASE_ADMIN_URL: postgres://postgres:postgres@postgres:5432/${CHARTWARDEN_DB_NAME:-chartwarden}
      PROVISION_DATABASE_URL: postgres://postgres:postgres@postgres:5432/${CHARTWARDEN_DB_NAME:-chartwarden}
      CHARTWARDEN_APP_PASSWORD: chartwarden-app-dev-password
      CHARTWARDEN_PLATFORM_PASSWORD: chartwarden-platform-dev-password
      CHARTWARDEN_DESTRUCTION_PASSWORD: chartwarden-destruction-dev-password
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: chartwarden
      MINIO_SECRET_KEY: chartwarden-minio-secret
      MINIO_REGION: us-east-1
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
      # The HOPE iQIES package header needs a product version: APP_VERSION, or GIT_SHA when APP_VERSION is
      # the "dev" default. Set APP_VERSION in .env, then rebuild (`docker compose up -d --build api`): build args
      # are baked at build time.
      args:
        APP_VERSION: ${APP_VERSION:-dev}
        GIT_SHA: ${GIT_SHA:-unknown}
    command: ["bun", "run", "apps/backend/src/index.ts"]
    environment:
      PROCESS_ROLE: api
      NODE_ENV: development
      MESSAGING_ENCRYPTION_KEY: ${MESSAGING_ENCRYPTION_KEY:-}
      # HOPE iQIES package header (ChartWarden as software vendor). Package generation 422s, naming each
      # missing key, until these are set in .env (see .env.example).
      CHARTWARDEN_SOFTWARE_VENDOR_ID: ${CHARTWARDEN_SOFTWARE_VENDOR_ID:-}
      CHARTWARDEN_SOFTWARE_VENDOR_NAME: ${CHARTWARDEN_SOFTWARE_VENDOR_NAME:-}
      CHARTWARDEN_SOFTWARE_VENDOR_EMAIL: ${CHARTWARDEN_SOFTWARE_VENDOR_EMAIL:-}
      PORT: "3000"
      LOG_LEVEL: info
      DATABASE_URL: postgres://chartwarden_app:chartwarden-app-dev-password@postgres:5432/${CHARTWARDEN_DB_NAME:-chartwarden}
      DATABASE_PLATFORM_URL: postgres://chartwarden_platform_login:chartwarden-platform-dev-password@postgres:5432/${CHARTWARDEN_DB_NAME:-chartwarden}
      DATABASE_DESTRUCTION_URL: postgres://chartwarden_destruction_login:chartwarden-destruction-dev-password@postgres:5432/${CHARTWARDEN_DB_NAME:-chartwarden}
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: chartwarden
      MINIO_SECRET_KEY: chartwarden-minio-secret
      MINIO_REGION: us-east-1
      # M36 attachment scanner: the ClamAV sidecar. The builtin scanner (EICAR + type check, NOT an antivirus) is
      # opt-in only: MESSAGING_ATTACHMENT_SCANNER=builtin ALLOW_BUILTIN_ATTACHMENT_SCANNER=1 in your .env.
      MESSAGING_ATTACHMENT_SCANNER: ${MESSAGING_ATTACHMENT_SCANNER:-clamd}
      ALLOW_BUILTIN_ATTACHMENT_SCANNER: ${ALLOW_BUILTIN_ATTACHMENT_SCANNER:-}
      CLAMD_HOST: clamav
      CLAMD_PORT: "3310"
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: chartwarden-local-compose-dev-secret-not-for-production-use
      TRUSTED_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost:5174,http://localhost:5175
      # Local-only KEK for the synthetic tenant's envelope-encrypted PHI. Production supplies its
      # own key from .env.production; this default exists so the documented Compose demo can finalize
      # encounters and seed DocLens/consent data instead of failing closed halfway through.
      M34_TENANT_KEK: ${M34_TENANT_KEK:-kek-local:Y2ktdGVuYW50LWtlay10ZXN0LTAxMjM0NTY3ODlhYmM=}
      <<: *m34-provision-gateway-env
      # F-236 (ADR-0048) — DocLens stage 2. A worker-specific dev placeholder secret, not INTERNAL_SERVICE_TOKEN.
      DOCLING_WORKER_URL: http://docling-worker:8000
      DOCLING_WORKER_TOKEN: chartwarden-local-docling-dev-token-not-for-production
      # Billing credential KEK (M24 trading-partner + M23 MAC-portal secrets), 32 bytes base64, from your .env. Unset =>
      # saving a MAC/trading-partner credential answers 503 (fail closed). Generate: openssl rand -base64 32.
      M24_CREDENTIAL_ENCRYPTION_KEY: ${M24_CREDENTIAL_ENCRYPTION_KEY:-}
      # Optional transactional email (M36 Postmark): unset = unbound, dev logs links via the console transport.
      POSTMARK_SERVER_TOKEN: ${POSTMARK_SERVER_TOKEN:-}
      POSTMARK_FROM_ADDRESS: ${POSTMARK_FROM_ADDRESS:-}
      POSTMARK_SENDER_VERIFIED: ${POSTMARK_SENDER_VERIFIED:-}
      # M36 out-of-band delivery (GAP-062): unset = that channel stays on the fail-closed deny transport.
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_SMS_FROM: ${TWILIO_SMS_FROM:-}
      TWILIO_MESSAGING_SERVICE_SID: ${TWILIO_MESSAGING_SERVICE_SID:-}
      TWILIO_VOICE_FROM: ${TWILIO_VOICE_FROM:-}
      MESSAGING_WEBHOOK_PUBLIC_BASE_URL: ${MESSAGING_WEBHOOK_PUBLIC_BASE_URL:-}
      POSTMARK_WEBHOOK_TOKEN: ${POSTMARK_WEBHOOK_TOKEN:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
    ports:
      - "3000:3000"
    # M36: clamd is reachable only over the dedicated `scan` network (joined by clamav, api and worker alone), so a
    # compromised sidecar (postgres, minio, docling, ...) cannot reach it and clamd cannot reach them.
    networks: [default, scan]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      clamav:
        condition: service_started
      provision-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "process.exit((await fetch('http://localhost:3000/health')).ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["bun", "run", "apps/backend/src/worker.ts"]
    environment:
      NODE_ENV: development
      MESSAGING_ENCRYPTION_KEY: ${MESSAGING_ENCRYPTION_KEY:-}
      WORKER_PORT: "3001"
      LOG_LEVEL: info
      DATABASE_URL: postgres://chartwarden_app:chartwarden-app-dev-password@postgres:5432/${CHARTWARDEN_DB_NAME:-chartwarden}
      DATABASE_PLATFORM_URL: postgres://chartwarden_platform_login:chartwarden-platform-dev-password@postgres:5432/${CHARTWARDEN_DB_NAME:-chartwarden}
      DATABASE_DESTRUCTION_URL: postgres://chartwarden_destruction_login:chartwarden-destruction-dev-password@postgres:5432/${CHARTWARDEN_DB_NAME:-chartwarden}
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: chartwarden
      MINIO_SECRET_KEY: chartwarden-minio-secret
      MINIO_REGION: us-east-1
      # M36 attachment scanner: the ClamAV sidecar. The builtin scanner (EICAR + type check, NOT an antivirus) is
      # opt-in only: MESSAGING_ATTACHMENT_SCANNER=builtin ALLOW_BUILTIN_ATTACHMENT_SCANNER=1 in your .env.
      MESSAGING_ATTACHMENT_SCANNER: ${MESSAGING_ATTACHMENT_SCANNER:-clamd}
      ALLOW_BUILTIN_ATTACHMENT_SCANNER: ${ALLOW_BUILTIN_ATTACHMENT_SCANNER:-}
      CLAMD_HOST: clamav
      CLAMD_PORT: "3310"
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: chartwarden-local-compose-dev-secret-not-for-production-use
      TRUSTED_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost:5174,http://localhost:5175
      M34_TENANT_KEK: ${M34_TENANT_KEK:-kek-local:Y2ktdGVuYW50LWtlay10ZXN0LTAxMjM0NTY3ODlhYmM=}
      <<: *m34-provision-gateway-env
      DOCLING_WORKER_URL: http://docling-worker:8000
      DOCLING_WORKER_TOKEN: chartwarden-local-docling-dev-token-not-for-production
    ports:
      - "3001:3001"
    # M36: clamd is reachable only over the dedicated `scan` network (joined by clamav, api and worker alone), so a
    # compromised sidecar (postgres, minio, docling, ...) cannot reach it and clamd cannot reach them.
    networks: [default, scan]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      clamav:
        condition: service_started
      provision-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "process.exit((await fetch('http://localhost:3001/health')).ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # F-236 (ADR-0048) — DocLens stage 2: OCR + layout with page coordinates. CPU-only; the models are baked
  # into the image (no runtime download). Only the backend calls it, with DOCLING_WORKER_TOKEN, handing it a
  # short-lived presigned MinIO URL — it holds no object-store credentials. Not published on the host.
  docling-worker:
    build:
      context: ./services/docling-worker
    environment:
      DOCLING_WORKER_TOKEN: chartwarden-local-docling-dev-token-not-for-production
      LOG_LEVEL: info
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # DEV-ONLY stand-in for the external M34 provision gateway (deploy/production/PROVISION_GATEWAY.md): acknowledges
  # tenant storage prefixes and logs first-admin invitation links (read them with `docker compose logs provision-gateway`).
  # Key custody and storage destruction answer 501 here. Same image as the api; not published on the host.
  provision-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["bun", "run", "scripts/dev/m34-provision-gateway.ts"]
    environment:
      M34_PROVISION_GATEWAY_TOKEN: chartwarden-local-provision-gateway-dev-token-not-for-production
    healthcheck:
      test: ["CMD", "bun", "-e", "process.exit((await fetch('http://localhost:8080/health')).ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

networks:
  # Dedicated clamd network (api, worker, clamav only). Not `internal`: freshclam must reach the signature mirrors.
  scan:

volumes:
  chartwarden-compose-pgdata:
  chartwarden-compose-minio:
  chartwarden-compose-clamav:
