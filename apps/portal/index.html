<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- PHI hygiene (GAP-080): record URLs carry patient identifiers (/patients/<id>), so this
         document must never hand its URL to another origin. The backend already sets
         Referrer-Policy: no-referrer on API responses; the SPA document is served by the static
         host, which those headers do not cover. -->
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/chartwarden-mark.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>ChartWarden Family Portal</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
