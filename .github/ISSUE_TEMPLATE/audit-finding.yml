name: Audit finding
description: A reproduced production-readiness finding (see docs/reviews/PROMPT_5_CHARTWARDEN_PRODUCTION_READINESS_AUDIT.md)
title: "F-NNN · <area> — <one-line defect>"
labels: ["audit", "status/available"]
body:
  - type: markdown
    attributes:
      value: |
        **A finding needs a reproduction** — a failing command, a failing test you wrote, a query
        result, or a cited `file:line` you traced end to end. A plausible reading of the code is a
        suspicion, not a finding; suspicions belong in the audit file, not here.

        **This issue will be read by someone who did not run the audit.** The last three fields are
        the handoff — *Where to start*, *How to verify*, *Watch out for*. They are what turn a
        finding into something another developer can pick up cold. They are not optional.

        **Do not assign this issue on filing.** It lands `status/available`; whoever takes it assigns
        themselves and swaps the label to `status/claimed`.

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: "P0 security/PHI/tenant-isolation/data-loss · P1 broken workflow · P2 correctness · P3 reliability · P4 accessibility · P5 operability · P6 performance · P7 maintainability"
      options: ["P0", "P1", "P2", "P3", "P4", "P5", "P6", "P7"]
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options: [frontend, ui, ux, backend, db, api, integration, infra, security, test]
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: file:line, command output, query result, or runtime trace. Paste it verbatim.
      render: text
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Copy-pasteable. Include the setup it depends on — containers up? migrations run? BYPASSRLS removed? A reproduction that only works in the state your shell happened to be in is not a reproduction.
      render: shell
    validations:
      required: true

  - type: textarea
    id: root-cause
    attributes:
      label: Root cause
      description: One paragraph. If you do not know, say so — do not guess in the voice of a fact.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior + acceptance criteria
      description: A checkable list that closes this issue. Whoever picks it up must be able to tell they are done without asking you.
    validations:
      required: true

  - type: textarea
    id: blast-radius
    attributes:
      label: Blast radius
      description: Is this live in production? Which tenants, roles, or data does it touch? What is the worst realistic outcome?
    validations:
      required: true

  - type: textarea
    id: where-to-start
    attributes:
      label: Where to start
      description: The files and functions you would open first, and why. Name the layers a complete fix has to touch (UI · frontend · API contract · backend · persistence · permissions · observability · docs). If you are unsure, say which you checked and which you did not.
    validations:
      required: true

  - type: textarea
    id: how-to-verify
    attributes:
      label: How to verify
      description: The exact gate, script, or test that proves this fixed, and the exact command. If no regression test exists yet, say what it must assert. Remember `arch:fitness` short-circuits — name the individual gate.
      render: shell
    validations:
      required: true

  - type: textarea
    id: watch-out
    attributes:
      label: Watch out for
      description: The trap next to this fix. The obvious fix that is wrong; the gate that goes green for the wrong reason; the neighbouring code that looks unrelated and is not.
    validations:
      required: true

  - type: input
    id: source
    attributes:
      label: Source
      description: 'Discovered (commit / CI run id) or ported (e.g. "Ported from fabwebdev/wardenx#141")'
    validations:
      required: true

  - type: checkboxes
    id: handoff
    attributes:
      label: Handoff
      options:
        - label: A developer who has not read the audit could start on this from the body alone
          required: true
        - label: Everything above separates what was verified from what was inferred
          required: true
