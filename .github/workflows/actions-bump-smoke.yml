# TEMPORARY — exercises the bumped actions on the self-hosted runner without pushing or deploying.
# Removed before the PR is opened.
name: actions-bump-smoke
on:
  push:
    branches: [ci/bump-node24-actions]
permissions:
  contents: read
  packages: read
jobs:
  smoke:
    runs-on: [self-hosted, Linux, X64, hostinger]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - run: git log -1 --format=%H && test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tiny build context
        run: |
          mkdir smoke && printf 'FROM alpine:3.20\nARG GIT_SHA\nRUN echo "$GIT_SHA" > /sha\n' > smoke/Dockerfile
      - name: Build (no push)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: smoke
          push: false
          load: true
          tags: smoke:test
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=actions-bump-smoke
          cache-to: type=gha,mode=max,scope=actions-bump-smoke
      - run: docker run --rm smoke:test cat /sha
      - run: echo '{"smoke":true}' > sbom-smoke.spdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: sbom-smoke
          path: sbom-*.spdx.json
          retention-days: 1
