name: Release and deploy

# A successful CI run on main is the only automatic release source. The release SHA is baked into
# both immutable GHCR tags, then the `deploy` job updates the VPS through SSH. Configure protection
# rules on the `production` GitHub Environment before enabling this workflow in a shared project.

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  release:
    name: Build and publish immutable images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      backend_image: ${{ steps.images.outputs.backend_image }}
      web_image: ${{ steps.images.outputs.web_image }}
    env:
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/wardenx:sha-${{ env.RELEASE_SHA }}
          # AD-05 — bake the identity the /version probe reports, so the runbook's post-deploy
          # "is the new build actually live?" check can pass. Without these, /version answers
          # {"version":"dev","gitSha":"unknown"} on every deploy.
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push staff web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/wardenx-web:sha-${{ env.RELEASE_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Publish image references
        id: images
        run: |
          echo "backend_image=ghcr.io/${{ github.repository_owner }}/wardenx:sha-${RELEASE_SHA}" >> "$GITHUB_OUTPUT"
          echo "web_image=ghcr.io/${{ github.repository_owner }}/wardenx-web:sha-${RELEASE_SHA}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to production VPS
    needs: release
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH host verification
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Upload and run deploy script
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          BACKEND_IMAGE: ${{ needs.release.outputs.backend_image }}
          WEB_IMAGE: ${{ needs.release.outputs.web_image }}
        run: |
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER"
          port="${DEPLOY_PORT:-22}"
          scp -P "$port" deploy/production/deploy.sh "$DEPLOY_USER@$DEPLOY_HOST:/opt/wardenx/deploy.sh"
          ssh -p "$port" "$DEPLOY_USER@$DEPLOY_HOST" \
            "chmod 700 /opt/wardenx/deploy.sh && /opt/wardenx/deploy.sh '$BACKEND_IMAGE' '$WEB_IMAGE'"
