name: Release and deploy

# A successful CI run is the only automatic release source — enforced by the `verify` job below,
# which CALLS ci.yml in full. This sentence described an intention rather than the configuration
# until #16: ci.yml had no `push: main` trigger, so nothing verified a push that LANDED on main, and
# a red SHA reached the VPS on 2026-08-25. The release SHA is baked into both immutable GHCR tags,
# then the `deploy` job updates the VPS through SSH.
#
# STILL OUTSTANDING (owner decision, #16): `main` has no branch protection and the `production`
# GitHub Environment has no protection rules — both need a paid plan. The gate below is a repo-level
# control, so it raises the floor but does not make the deploy path tamper-proof.

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  # ── The gate (#16) ──────────────────────────────────────────────────────────────────────────────
  # This workflow's own header has always said "a successful CI run on main is the only automatic
  # release source" — and that was not true of the configuration. `ci.yml` had no `push: main`
  # trigger, `main` carries no branch protection (the REST API answers 404), and the `production`
  # Environment has zero protection rules, so a push to `main` went straight to `release` and then
  # SSHed into the VPS with nothing having verified the code. That is not hypothetical: on
  # 2026-08-25 run 32874887216 deployed a SHA whose CI run on develop (32874842505) was RED on both
  # `build-and-verify` and `Better Auth live` — the latter on a cross-org RLS read (#15).
  #
  # This calls the WHOLE CI workflow rather than re-listing its steps, so the release gate and the
  # PR gate cannot drift apart, and the live-DB suites (which are what caught #15) gate the deploy
  # too. `release` and `deploy` both sit behind it, so a red gate publishes no image and touches no
  # host.
  #
  # This is a repo-level control and is therefore bypassable by someone with the rights to edit
  # workflows or re-run a job. It is not a substitute for branch protection on `main` plus required
  # reviewers on the `production` Environment; those need a paid plan and an owner decision, and
  # remain open in #16.
  verify:
    name: Verify (full CI)
    uses: ./.github/workflows/ci.yml

  release:
    name: Build and publish immutable images
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      backend_image: ${{ steps.images.outputs.backend_image }}
      web_image: ${{ steps.images.outputs.web_image }}
    env:
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/engrace-hospice/wardenx:sha-${{ env.RELEASE_SHA }}
          # AD-05 — bake the identity the /version probe reports, so the runbook's post-deploy
          # "is the new build actually live?" check can pass. Without these, /version answers
          # {"version":"dev","gitSha":"unknown"} on every deploy.
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push staff web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: ghcr.io/engrace-hospice/wardenx-web:sha-${{ env.RELEASE_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Publish image references
        id: images
        run: |
          echo "backend_image=ghcr.io/engrace-hospice/wardenx:sha-${RELEASE_SHA}" >> "$GITHUB_OUTPUT"
          echo "web_image=ghcr.io/engrace-hospice/wardenx-web:sha-${RELEASE_SHA}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to production VPS
    needs: release
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH host verification
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Upload and run deploy script
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          BACKEND_IMAGE: ${{ needs.release.outputs.backend_image }}
          WEB_IMAGE: ${{ needs.release.outputs.web_image }}
        run: |
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER"
          port="${DEPLOY_PORT:-22}"
          scp -P "$port" deploy/production/deploy.sh "$DEPLOY_USER@$DEPLOY_HOST:/opt/wardenx/deploy.sh"
          ssh -p "$port" "$DEPLOY_USER@$DEPLOY_HOST" \
            "chmod 700 /opt/wardenx/deploy.sh && /opt/wardenx/deploy.sh '$BACKEND_IMAGE' '$WEB_IMAGE'"
