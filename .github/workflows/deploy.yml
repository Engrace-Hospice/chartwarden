name: Deploy

# TASK-040F (production-readiness audit 2026-08-03, OPS-013) — deploy-pipeline SKELETON, not a
# validated deploy. `WARDENX_OPS_RUNBOOK_v0.1.md`'s blue-green + signed-image + SBOM description is
# the aspirational spec; this is scaffolding toward it. `build` runs on every push/PR (never pushes
# anywhere — proves the image builds, nothing more). `push` only runs on a manual
# `workflow_dispatch` with its `push` input explicitly set true — there is no real deploy target
# configured in this repo, so nothing here rolls out to any host; it only tags+pushes an image to
# GHCR (chosen because it needs zero new secrets/accounts beyond the built-in GITHUB_TOKEN). The
# `production` GitHub Environment referenced below has NO reviewer/branch protection rules
# configured yet — add those before this job is treated as a real release gate, not just an
# unprotected manual trigger.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      push:
        description: "Also tag + push the built image to GHCR (manual release gate)"
        type: boolean
        default: false

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build image (no push)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build (api + worker share this one image — see Dockerfile header)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: wardenx:ci-build
          cache-from: type=gha
          cache-to: type=gha,mode=max

  push:
    name: Tag + push to GHCR (manual release gate)
    if: github.event_name == 'workflow_dispatch' && inputs.push == true
    needs: build
    runs-on: ubuntu-latest
    # No reviewer/branch protection configured on this Environment yet (see file header) — today
    # this is only a `workflow_dispatch`-gated manual trigger, not a reviewed release gate.
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive image tags (sha + latest-on-default-branch)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/wardenx
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
