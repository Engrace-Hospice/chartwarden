            sleep 1
          done
          echo "Postgres did not become ready" >&2; docker logs chartwarden-ci-pg; exit 1
      # F-025 (#59): `packages/db/__tests__/client.live.test.ts` (AUTH-T01 / ADR-0033) had no script
      # and no runner. Its own header names this lane — "the dedicated auth/live CI lane that runs
