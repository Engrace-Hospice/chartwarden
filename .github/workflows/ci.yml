name: CI

on:
  push:
    branches: [main]
  pull_request:

# Phase 0 gate (PHASE_0_SCAFFOLD_PLAN.md PR-0.6): every PR must install from the committed
# lockfile, build the project-reference graph, pass all six fitness gates + scaffold parity,
# and pass the Vitest fitness-gate self-test (which proves each gate goes red on a violation).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Type-check / build project graph
        run: bun run build

      # Step names deliberately carry NO gate/test COUNT. "parity + 6 gates" was accurate when
      # arch:fitness chained 7 things; it now chains 17, so for ten of them the log said less had been
      # checked than actually was — and a CI log understating its own coverage is read by whoever is
      # deciding whether a change is safe to ship. Naming the script instead cannot go stale.
      - name: Architecture fitness gates (arch:fitness)
        # docs/plans/** is read-only to AUTOMATED runs (ADR-0030 / check-plan-integrity).
        # A human-authored PR that intentionally adds or edits a plan opts in by applying the
        # `allow-plan-edits` label, which sets ALLOW_PLAN_EDITS for THIS step only. Automated
        # (archon) PRs without the label stay blocked, so the guardrail keeps its teeth.
        env:
          ALLOW_PLAN_EDITS: ${{ contains(github.event.pull_request.labels.*.name, 'allow-plan-edits') && '1' || '' }}
        run: bun run arch:fitness

      # `bun run test` is `vitest run` — the WHOLE unit + integration corpus (6,000+ cases across
      # apps/ and packages/), not the narrow pair the old label named. The live-DB suites are the
      # ones excluded here; they run in the rls-live matrix and auth-live jobs below.
      - name: Unit + integration suite (bun run test)
        run: bun run test

      - name: Lint (non-blocking advisory)
        run: bun run lint
        continue-on-error: true

  rls-live:
    name: RLS isolation — ${{ matrix.suite.name }} (live Postgres)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite:
          - { name: "baseline M1-M14", script: "test:rls:live" }
          - { name: "M4 Audit", script: "test:rls:live:m4" }
          - { name: "M5 Patient", script: "test:rls:live:m5" }
          - { name: "M1 Foundation", script: "test:rls:live:m1" }
          - { name: "M2 Identity", script: "test:rls:live:m2" }
          - { name: "M3 Authorization", script: "test:rls:live:m3" }
          - { name: "M6 Admission", script: "test:rls:live:m6" }
          - { name: "M7 Care Plan", script: "test:rls:live:m7" }
          - { name: "M8 Encounters", script: "test:rls:live:m8" }
          - { name: "M9 Assessments", script: "test:rls:live:m9" }
          - { name: "M10 HOPE", script: "test:rls:live:m10" }
          - { name: "M11 Orders", script: "test:rls:live:m11" }
          - { name: "M12 DoseSpot", script: "test:rls:live:m12" }
          - { name: "M13 eMAR", script: "test:rls:live:m13" }
          - { name: "M14 IDG", script: "test:rls:live:m14" }
          - { name: "M17 Scheduling", script: "test:rls:live:m17" }
          - { name: "M18 EVV", script: "test:rls:live:m18" }
          - { name: "M22 Documents", script: "test:rls:live:m22" }
          - { name: "M27 Cost Report", script: "test:rls:live:m27" }
          - { name: "M36 Messaging", script: "test:rls:live:m36" }
          - { name: "M38 Terminology", script: "test:rls:live:m38" }
          - { name: "M39 Consent", script: "test:rls:live:m39" }
          - { name: "M40 MDM", script: "test:rls:live:m40" }
          - { name: "M15 Discipline Plans", script: "test:rls:live:m15" }
          - { name: "M16 Bereavement", script: "test:rls:live:m16" }
          - { name: "M19 On-Call Triage", script: "test:rls:live:m19" }
          - { name: "M20 Field Safety", script: "test:rls:live:m20" }
          - { name: "M21 Supplies/DME", script: "test:rls:live:m21" }
          - { name: "M23 Billing-Medicare", script: "test:rls:live:m23" }
          - { name: "M24 Billing-Medicaid", script: "test:rls:live:m24" }
          - { name: "M25 Remittance", script: "test:rls:live:m25" }
          - { name: "M26 Cap Management", script: "test:rls:live:m26" }
          - { name: "M30 HQRP & Quality", script: "test:rls:live:m30" }
          - { name: "M32 AI Platform", script: "test:rls:live:m32" }
          - { name: "M33 Reporting", script: "test:rls:live:m33" }
          - { name: "M34 SaaS Platform", script: "test:rls:live:m34" }
          - { name: "M28 FHIR Gateway", script: "test:rls:live:m28" }
          - { name: "M29 External Interfaces", script: "test:rls:live:m29" }
          - { name: "M31 Portal & Telehealth", script: "test:rls:live:m31" }
          - { name: "M35 Subscription Billing", script: "test:rls:live:m35" }
          - { name: "M37 IPU Management", script: "test:rls:live:m37" }
    env:
      WARDENX_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wardenx_test
    steps:
      - uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      # Started as an explicit `docker run`, NOT a `services:` block. A service container takes no
      # command arguments, and these suites replay all 117 migrations — including ~47 partitioned
      # parents — inside one transaction, which blows past the default max_locks_per_transaction=64
      # with `out of shared memory`. That GUC needs a RESTART, so ALTER SYSTEM + pg_reload_conf()
      # cannot fix it from a step. Verified locally: pg16 at the default fails the baseline, M25,
      # M26 and M30 suites; at 4096 all fifteen pass.
      - name: Start Postgres (pgvector image — M38 ships a `vector` column; raised lock limit)
        run: |
          docker run -d --name wardenx-ci-pg \
            -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=wardenx_test \
            -p 5432:5432 pgvector/pgvector:pg16 \
            -c max_locks_per_transaction=4096
          for i in $(seq 1 60); do
            docker exec wardenx-ci-pg pg_isready -U postgres -d wardenx_test && exit 0
            sleep 1
          done
          echo "Postgres did not become ready" >&2; docker logs wardenx-ci-pg; exit 1
      - name: ${{ matrix.suite.name }} — cross-tenant isolation proof (real Postgres + real RLS)
        run: bun run ${{ matrix.suite.script }}

  lifecycle-live:
    # GAP-086: the 25 per-module read/write LIFECYCLE suites had scripts in package.json and no runner
    # anywhere — no CI job, no git hook (.githooks/pre-push runs build/arch:fitness/test, and `bun run test`
    # never sets WARDENX_TEST_DATABASE_URL). They self-SKIP without that variable rather than failing, so
    # the corpus looked green while 205 assertions had never once executed outside their authors' laptops.
    #
    # These are a different proof from `rls-live` above, which asserts the POLICIES at the table level.
    # These drive the production Drizzle route services — the real write lifecycles, the real transactional
    # outbox publisher, the real seams — as the NOBYPASSRLS `wardenx_app` role. Turning them on found 23 of
    # 25 red, including a suite whose license assertion only held for two thirds of any given day.
    #
    # Grouped per MODULE (read + write in one runner) rather than one job per script: every suite resets the
    # schema and replays the migrations itself, so they compose sequentially, and 13 runners instead of 25
    # halves the per-job migration replay for identical coverage.
    name: Lifecycle — ${{ matrix.suite.name }} (live Postgres)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite:
          - { name: "M6 Admission", scripts: "test:m6:read:live test:m6:write:live" }
          - { name: "M7 Care Plan", scripts: "test:m7:read:live test:m7:write:live" }
          - { name: "M8 Encounters", scripts: "test:m8:read:live test:m8:write:live" }
          - { name: "M9 Assessments", scripts: "test:m9:read:live test:m9:write:live" }
          - { name: "M10 HOPE", scripts: "test:m10:read:live test:m10:write:live" }
          - { name: "M11 Orders", scripts: "test:m11:read:live test:m11:write:live" }
          - { name: "M12 DoseSpot", scripts: "test:m12:read:live test:m12:write:live" }
          - {
              name: "M13 eMAR",
              scripts: "test:m13:read:live test:m13:write:live test:m13:rn-case-manager:live",
            }
          - { name: "M14 IDG", scripts: "test:m14:read:live test:m14:write:live" }
          - { name: "M17 Scheduling", scripts: "test:m17:read:live test:m17:write:live" }
          - { name: "M18 EVV", scripts: "test:m18:read:live test:m18:write:live" }
          - { name: "M22 Documents", scripts: "test:m22:read:live test:m22:write:live" }
          - { name: "M23 remittance feedback", scripts: "test:m23:remittance-feedback:live" }
          - { name: "M24 NF facility snapshot", scripts: "test:m24:nf-facility-snapshot:live" }
          - { name: "M29 NPPES platform sync", scripts: "test:m29:nppes-sync:live" }
          - { name: "M29 unmatched-lab review", scripts: "test:m29:unmatched-lab-review:live" }
          # GAP-043: M27's approver gate over M2's real `membership_elevated_approval` designation —
          # the conjunct that was hardcoded false in the production resolver, blocking every cost-report
          # approve/submit/reopen in every tenant.
          - { name: "M27 elevated approval", scripts: "test:m27:elevated-approval:live" }
          # GAP-099: the M1 relay's PLATFORM (organization_id IS NULL) delivery path end-to-end — an
          # org-less event reaching a real consumer, its org-less §4.11 receipt, and M40's canonical
          # write path (which had no SECURITY DEFINER function at all until migration 0202).
          - { name: "M1 platform outbox delivery", scripts: "test:m1:platform-outbox:live" }
          - { name: "M37 IPU", scripts: "test:m37:write:live" }
          - { name: "M37 privacy gates", scripts: "test:m37:privacy-gates:live" }
          # GAP-079: M4's §2.5 read-audit EMISSION over the M26 Cap + M39 Consent read surfaces —
          # proves the events land in the partitioned audit_event table carrying the patient id the
          # §164.528 accounting query joins on, as the NOBYPASSRLS app role.
          - { name: "M4 read-audit", scripts: "test:m4:read-audit:live" }
          # GAP-023/024/038: M22's §4.11 render handshake end-to-end — a real signed order/med order
          # through the real outbox dispatcher into real `document`/`document_version` rows. Nothing in
          # this chain was executed before: the consumer did not exist and neither emitter fired.
          - { name: "M22 render handshake", scripts: "test:m22:render-handshake:live" }
          # GAP-050: M33 scheduled-report create/update/resume over the real `cron-parser` adapter —
          # all three compute `next_run_at` through a port that was a fail-closed stub, so no tenant
          # could create a schedule at all and the §4.8 scheduled-run cron had nothing to fire.
          - { name: "M33 schedule cron", scripts: "test:m33:schedule-cron:live" }
          # GAP-051: the M33 PDF/XLSX export → M22 render → back-ref chain end-to-end. Nothing in it
          # ran before: the export outbox was unbound, M22 consumed the request event nowhere, and the
          # request carried a SQL string M22 could never have executed.
          - { name: "M33 export render", scripts: "test:m33:export-render:live" }
    env:
      WARDENX_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wardenx_test
    steps:
      - uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      # Same explicit `docker run` + raised lock limit as rls-live, and for the same reason (see that job's
      # note): these suites replay the full migration set, partitioned parents included, in one transaction.
      - name: Start Postgres (pgvector image; raised lock limit)
        run: |
          docker run -d --name wardenx-ci-pg-lifecycle \
            -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=wardenx_test \
            -p 5432:5432 pgvector/pgvector:pg16 \
            -c max_locks_per_transaction=4096
          for i in $(seq 1 60); do
            docker exec wardenx-ci-pg-lifecycle pg_isready -U postgres -d wardenx_test && exit 0
            sleep 1
          done
          echo "Postgres did not become ready" >&2; docker logs wardenx-ci-pg-lifecycle; exit 1
      # A suite that self-skips is a FAILURE here, not a pass: skipping silently is exactly the state this
      # job exists to end. `--passWithNoTests=false` is vitest's default, but the describe-level
      # `skipIf(!DB_URL)` would still exit 0 with every case skipped, so assert the variable is set first.
      - name: ${{ matrix.suite.name }} — production write/read lifecycle over real Postgres + RLS
        run: |
          test -n "$WARDENX_TEST_DATABASE_URL" || { echo "WARDENX_TEST_DATABASE_URL unset — the suites would silently skip" >&2; exit 1; }
          for script in ${{ matrix.suite.scripts }}; do
            echo "::group::$script"
            bun run "$script"
            echo "::endgroup::"
          done

  migration-gate:
    # TASK-040E (OPS-016): scripts/db/migrate.ts is the real production migration path. This job
    # proves it against a disposable database — both the happy path (full chain applies cleanly)
    # and the failure path (a deliberately corrupted checksum on an already-applied file fails the
    # pipeline under --strict, not just a warning).
    name: Production migration path (scripts/db/migrate.ts)
    runs-on: ubuntu-latest
    env:
      WARDENX_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wardenx_migration_gate
      DATABASE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/wardenx_migration_gate
    steps:
      - uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      # Same pgvector image + raised lock limit as rls-live, and for the same reason: the full
      # migration chain includes ~47 partitioned parents and blows past the default
      # max_locks_per_transaction=64.
      - name: Start Postgres (pgvector image; raised lock limit)
        run: |
          docker run -d --name wardenx-ci-pg-migrate \
            -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=wardenx_migration_gate \
            -p 5432:5432 pgvector/pgvector:pg16 \
            -c max_locks_per_transaction=4096
          for i in $(seq 1 60); do
            docker exec wardenx-ci-pg-migrate pg_isready -U postgres -d wardenx_migration_gate && exit 0
            sleep 1
          done
          echo "Postgres did not become ready" >&2; docker logs wardenx-ci-pg-migrate; exit 1
      - name: scripts/db/migrate.ts — live proof (full apply, idempotent re-run, --strict drift gate)
        run: bun run test:db:migrate:live

      - name: Apply against a fresh disposable DB via the real CLI (pre-deploy simulation)
        run: bun run db:migrate
      - name: Verify --strict --schema-only fails the pipeline on checksum drift (not just warns)
        run: |
          docker exec wardenx-ci-pg-migrate psql -U postgres -d wardenx_migration_gate -c \
            "UPDATE _wardenx_migration SET checksum = 'deliberately-corrupted' WHERE filename = (SELECT filename FROM _wardenx_migration ORDER BY filename LIMIT 1);"
          if bun run db:migrate:deploy; then
            echo "expected --strict to fail on checksum drift, but it exited 0" >&2
            exit 1
          fi
          echo "✓ --strict correctly failed the pipeline on checksum drift"

  auth-live:
    name: Better Auth live (Postgres) — schema reconciliation + sign-in (AUTH-T06)
    runs-on: ubuntu-latest
    env:
      WARDENX_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wardenx_test
      BETTER_AUTH_SECRET: ci-test-secret-at-least-32-characters-long
      BETTER_AUTH_URL: http://localhost:3000
      # 32-byte base64 test key for the 2FA at-rest encryption (ADR-0034). Decodes to 32 bytes.
      TWO_FACTOR_ENCRYPTION_KEY: Y2ktMmZhLXRlc3Qta2V5LTAxMjM0NTY3ODlhYmNkZWY=
    steps:
      - uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      # Same explicit `docker run` as rls-live, and for the same reason: this suite applies the FULL
      # migration set, which exhausts the default max_locks_per_transaction=64. See the rls-live note.
      - name: Start Postgres (pgvector image — M38 ships a `vector` column; raised lock limit)
        run: |
          docker run -d --name wardenx-ci-pg \
            -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=wardenx_test \
            -p 5432:5432 pgvector/pgvector:pg16 \
            -c max_locks_per_transaction=4096
          for i in $(seq 1 60); do
            docker exec wardenx-ci-pg pg_isready -U postgres -d wardenx_test && exit 0
            sleep 1
          done
          echo "Postgres did not become ready" >&2; docker logs wardenx-ci-pg; exit 1
      - name: Better Auth sign-up/sign-in over the reconciled schema (real Postgres)
        run: bun run test:auth:live
