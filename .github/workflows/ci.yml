name: CI

on:
  push:
    branches: [main]
  pull_request:

# Phase 0 gate (PHASE_0_SCAFFOLD_PLAN.md PR-0.6): every PR must install from the committed
# lockfile, build the project-reference graph, pass all six fitness gates + scaffold parity,
# and pass the Vitest fitness-gate self-test (which proves each gate goes red on a violation).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Type-check / build project graph
        run: bun run build

      - name: Architecture fitness (parity + 6 gates)
        # docs/plans/** is read-only to AUTOMATED runs (ADR-0030 / check-plan-integrity).
        # A human-authored PR that intentionally adds or edits a plan opts in by applying the
        # `allow-plan-edits` label, which sets ALLOW_PLAN_EDITS for THIS step only. Automated
        # (archon) PRs without the label stay blocked, so the guardrail keeps its teeth.
        env:
          ALLOW_PLAN_EDITS: ${{ contains(github.event.pull_request.labels.*.name, 'allow-plan-edits') && '1' || '' }}
        run: bun run arch:fitness

      - name: Fitness-gate self-test + boot smoke test
        run: bun run test

      - name: Lint (non-blocking advisory)
        run: bun run lint
        continue-on-error: true

  rls-live:
    name: RLS cross-tenant isolation (live Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector image (superset of postgres:16) so the real migrations apply — M38
        # (Terminology) ships a pgvector `concept_embedding` table; stock postgres:16 lacks
        # the `vector` type. pg_trgm (M38) is standard contrib, already present.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wardenx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      WARDENX_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wardenx_test
    steps:
      - uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: RLS cross-tenant isolation proof (real Postgres + real RLS)
        run: bun run test:rls:live

  rls-live-m34:
    name: M34 RLS cross-tenant isolation (live Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        # Own fresh Postgres service: the M34 §9.3 suite applies the full migration set + resets
        # cluster-global roles, so it must run against a clean cluster (NOT shared with rls-live —
        # two migration-applying suites can't share one cluster: roles are global but DROP OWNED BY
        # only cleans the current database, and a DROP SCHEMA CASCADE over a populated schema blows
        # max_locks_per_transaction).
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wardenx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      WARDENX_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wardenx_test
    steps:
      - uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: M34 RLS cross-tenant denial proof (real Postgres + real RLS, §9.3)
        run: bun run test:rls:live:m34

  rls-live-m33:
    name: M33 RLS cross-tenant isolation (live Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        # Own fresh Postgres service: the M33 §3.5 suite applies the full migration set + resets
        # cluster-global roles, so it must run against a clean cluster (NOT shared with rls-live or
        # rls-live-m34 — two migration-applying suites can't share one cluster: roles are global but
        # DROP OWNED BY only cleans the current database, and a DROP SCHEMA CASCADE over a populated
        # schema blows max_locks_per_transaction).
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wardenx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      WARDENX_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wardenx_test
    steps:
      - uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: M33 RLS cross-tenant denial proof (real Postgres + real RLS, §3.5)
        run: bun run test:rls:live:m33

  auth-live:
    name: Better Auth live (Postgres) — schema reconciliation + sign-in (AUTH-T06)
    runs-on: ubuntu-latest
    services:
      postgres:
        # Same pgvector image as rls-live (the auth live test applies the full migration set, which
        # includes M38's pgvector `concept_embedding` table).
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wardenx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      WARDENX_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wardenx_test
      BETTER_AUTH_SECRET: ci-test-secret-at-least-32-characters-long
      BETTER_AUTH_URL: http://localhost:3000
      # 32-byte base64 test key for the 2FA at-rest encryption (ADR-0034). Decodes to 32 bytes.
      TWO_FACTOR_ENCRYPTION_KEY: Y2ktMmZhLXRlc3Qta2V5LTAxMjM0NTY3ODlhYmNkZWY=
    steps:
      - uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Better Auth sign-up/sign-in over the reconciled schema (real Postgres)
        run: bun run test:auth:live
