          # M23 and M27 once shared a BullMQ queue named `validation-run` (an M27 worker failed M23 jobs into the DLQ). Real
          # producers, one consumer per module: a job reaches only its own module; stranded legacy jobs are moved, not dropped.
          - { name: "M23/M27 validation queue isolation", scripts: "test:m23:validation-queue-isolation:live" }
    services:
      # F-025 (#59): four of the newly-wired suites gate on `CHARTWARDEN_TEST_REDIS_URL` as well as the
      # database — `test:m30:scheduled-jobs:live`, `test:m33:scheduled-jobs:live`,
      # `test:m27:workflow-slice:live` and `test:m30:cost-report-filing-measure:live` all drive a real
      # BullMQ queue. `describe.skipIf(!DB_URL || !REDIS_URL)` means a job without this service would
      # run them and report SKIPPED, which is precisely the silence this job exists to end.
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      CHARTWARDEN_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/chartwarden_test
      CHARTWARDEN_TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v7
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      # Same explicit `docker run` + raised lock limit as rls-live, and for the same reason (see that job's
      # note): these suites replay the full migration set, partitioned parents included, in one transaction.
      - name: Start Postgres (pgvector image; raised lock limit)
        run: |
          docker run -d --name chartwarden-ci-pg-lifecycle \
            -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=chartwarden_test \
            -p 5432:5432 pgvector/pgvector:pg18 \
            -c max_locks_per_transaction=4096
          for i in $(seq 1 60); do
            docker exec chartwarden-ci-pg-lifecycle pg_isready -h 127.0.0.1 -U postgres -d chartwarden_test && exit 0
            sleep 1
          done
          echo "Postgres did not become ready" >&2; docker logs chartwarden-ci-pg-lifecycle; exit 1
      # A suite that self-skips is a FAILURE here, not a pass: skipping silently is exactly the state this
      # job exists to end. `--passWithNoTests=false` is vitest's default, but the describe-level
      # `skipIf(!DB_URL)` would still exit 0 with every case skipped, so assert the variable is set first.
      - name: ${{ matrix.suite.name }} — production write/read lifecycle over real Postgres + RLS
        run: |
          test -n "$CHARTWARDEN_TEST_DATABASE_URL" || { echo "CHARTWARDEN_TEST_DATABASE_URL unset — the suites would silently skip" >&2; exit 1; }
          test -n "$CHARTWARDEN_TEST_REDIS_URL" || { echo "CHARTWARDEN_TEST_REDIS_URL unset — the four BullMQ suites would silently skip" >&2; exit 1; }
          for script in ${{ matrix.suite.scripts }}; do
            echo "::group::$script"
            bun run "$script"
            echo "::endgroup::"
          done

      - name: Cleanup lifecycle containers
        if: always()
        run: |
          docker rm -f chartwarden-ci-pg-lifecycle 2>/dev/null || true

  migration-gate:
    # TASK-040E (OPS-016): scripts/db/migrate.ts is the real production migration path. This job
    # proves it against a disposable database — both the happy path (full chain applies cleanly)
    # and the failure path (a deliberately corrupted checksum on an already-applied file fails the
    # pipeline under --strict, not just a warning).
    name: Production migration path (scripts/db/migrate.ts)
    runs-on: [self-hosted, Linux, X64, hostinger]
    env:
      CHARTWARDEN_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/chartwarden_migration_gate
      DATABASE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/chartwarden_migration_gate
    steps:
      - uses: actions/checkout@v7
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      # Same pgvector image + raised lock limit as rls-live, and for the same reason: the full
      # migration chain includes ~47 partitioned parents and blows past the default
      # max_locks_per_transaction=64.
      - name: Start Postgres (pgvector image; raised lock limit)
        run: |
          docker run -d --name chartwarden-ci-pg-migrate \
            -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=chartwarden_migration_gate \
            -p 5432:5432 pgvector/pgvector:pg18 \
            -c max_locks_per_transaction=4096
          for i in $(seq 1 60); do
            docker exec chartwarden-ci-pg-migrate pg_isready -h 127.0.0.1 -U postgres -d chartwarden_migration_gate && exit 0
            sleep 1
          done
          echo "Postgres did not become ready" >&2; docker logs chartwarden-ci-pg-migrate; exit 1
      - name: scripts/db/migrate.ts — live proof (full apply, idempotent re-run, --strict drift gate)
        run: bun run test:db:migrate:live

      - name: Apply against a fresh disposable DB via the real CLI (pre-deploy simulation)
        run: bun run db:migrate

      # F-033/#93 — partition rotation runs HERE rather than in a job of its own because this is the
      # only job that already holds a fully migrated database, and rotation is a property of the
      # migrated schema: the suite asserts that every time-RANGE partitioned table the migrations
      # create has a creator function the catalog scan can find. A migration that adds a partitioned
      # table without one fails this step, which is the check `arch:fitness` cannot make — it runs
      # with no database, so it would have to parse migration text, and that approach demonstrably
      # missed 3 of the 43 tables.
      - name: Partition rotation — live proof (idempotency, DEFAULT-trap detection, creator coverage)
        run: bun run test:partition-rotation:live

      - name: Verify --strict --schema-only fails the pipeline on checksum drift (not just warns)
        run: |
          docker exec chartwarden-ci-pg-migrate psql -U postgres -d chartwarden_migration_gate -c \
            "UPDATE _chartwarden_migration SET checksum = 'deliberately-corrupted' WHERE filename = (SELECT filename FROM _chartwarden_migration ORDER BY filename LIMIT 1);"
          if bun run db:migrate:deploy; then
            echo "expected --strict to fail on checksum drift, but it exited 0" >&2
            exit 1
          fi
          echo "✓ --strict correctly failed the pipeline on checksum drift"

      - name: Cleanup migration Postgres
        if: always()
        run: |
          docker rm -f chartwarden-ci-pg-migrate 2>/dev/null || true

  auth-live:
    name: Better Auth live (Postgres) — schema reconciliation + sign-in (AUTH-T06)
    runs-on: [self-hosted, Linux, X64, hostinger]
    env:
      CHARTWARDEN_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/chartwarden_test
      BETTER_AUTH_SECRET: ci-test-secret-at-least-32-characters-long
