          - { name: "M23 late-check resolved", scripts: "test:m23:late-check-resolved:live" }
          # #248 — M23's last remaining `handlers-unbound` pair, m25.taxonomy.unmapped_code_observed
          # (D13): a new `unmapped_taxonomy_occurrence` occurrence tracker + a 30-day/50-occurrence
          # threshold alert through the existing WorkerAlertPort — not the revalidate.consumer queue.
          - { name: "M23 taxonomy occurrence", scripts: "test:m23:taxonomy-occurrence:live" }
          # F-162 (#248) — M35's first outbox consumer: the §4.12 org-lifecycle-handler over M2's
          # organization activate/suspend/close triggers.
          - { name: "M35 org-lifecycle consumer", scripts: "test:m35:org-lifecycle-consumer:live" }
          # F-172 (#248) — the real PseudonymKeyProvider (KEK envelope over the platform-singleton
          # patient_pseudonym_key) + the 3 remaining D21 consumers it unblocks.
          - { name: "M35 pseudonym-key provider", scripts: "test:m35:pseudonym-key-provider:live" }
          # GAP-050: M33 scheduled-report create/update/resume over the real `cron-parser` adapter —
          # all three compute `next_run_at` through a port that was a fail-closed stub, so no tenant
          # could create a schedule at all and the §4.8 scheduled-run cron had nothing to fire.
          - { name: "M33 schedule cron", scripts: "test:m33:schedule-cron:live" }
          # GAP-051: the M33 PDF/XLSX export → M22 render → back-ref chain end-to-end. Nothing in it
          # ran before: the export outbox was unbound, M22 consumed the request event nowhere, and the
          # request carried a SQL string M22 could never have executed.
          - {
              name: "M33 export render",
              scripts: "test:m33:export-render:live test:m33:scheduled-jobs:live",
            }
          # F-044 / F-059: the dashboard READ path (catalog → dashboard → tile manifest → tile → metric
          # seam) and the D8 `reportable_scope` narrowing. Five of its eight assertions fail on the
          # pre-fix tree, and the scope ones fail SILENTLY there — a self-scoped clinician reading the
          # whole organization's per-clinician productivity looks exactly like a working tile.
          - { name: "M33 read path", scripts: "test:m33:read-path:live" }
          # #138/F-060/F-116: the M33 "day-one dashboards" seed — a fresh org gets one system-authored,
          # org-shared dashboard per currently-active report base at invitation accept, with no human
          # authoring a report. Proves RLS isolation and the concurrent-accept idempotency guard
          # (report_definition_system_org_base_uq, migration 0248).
          - { name: "M33 system dashboards", scripts: "test:m33:system-dashboards:live" }
    services:
      # F-025 (#59): four of the newly-wired suites gate on `WARDENX_TEST_REDIS_URL` as well as the
      # database — `test:m30:scheduled-jobs:live`, `test:m33:scheduled-jobs:live`,
      # `test:m27:workflow-slice:live` and `test:m30:cost-report-filing-measure:live` all drive a real
      # BullMQ queue. `describe.skipIf(!DB_URL || !REDIS_URL)` means a job without this service would
      # run them and report SKIPPED, which is precisely the silence this job exists to end.
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      WARDENX_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wardenx_test
      WARDENX_TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      # Same explicit `docker run` + raised lock limit as rls-live, and for the same reason (see that job's
      # note): these suites replay the full migration set, partitioned parents included, in one transaction.
      - name: Start Postgres (pgvector image; raised lock limit)
        run: |
          docker run -d --name wardenx-ci-pg-lifecycle \
            -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=wardenx_test \
            -p 5432:5432 pgvector/pgvector:pg16 \
            -c max_locks_per_transaction=4096
          for i in $(seq 1 60); do
            docker exec wardenx-ci-pg-lifecycle pg_isready -h 127.0.0.1 -U postgres -d wardenx_test && exit 0
            sleep 1
          done
          echo "Postgres did not become ready" >&2; docker logs wardenx-ci-pg-lifecycle; exit 1
      # A suite that self-skips is a FAILURE here, not a pass: skipping silently is exactly the state this
      # job exists to end. `--passWithNoTests=false` is vitest's default, but the describe-level
      # `skipIf(!DB_URL)` would still exit 0 with every case skipped, so assert the variable is set first.
      - name: ${{ matrix.suite.name }} — production write/read lifecycle over real Postgres + RLS
        run: |
          test -n "$WARDENX_TEST_DATABASE_URL" || { echo "WARDENX_TEST_DATABASE_URL unset — the suites would silently skip" >&2; exit 1; }
          test -n "$WARDENX_TEST_REDIS_URL" || { echo "WARDENX_TEST_REDIS_URL unset — the four BullMQ suites would silently skip" >&2; exit 1; }
          for script in ${{ matrix.suite.scripts }}; do
            echo "::group::$script"
            bun run "$script"
            echo "::endgroup::"
          done

      - name: Cleanup lifecycle containers
        if: always()
        run: |
          docker rm -f wardenx-ci-pg-lifecycle 2>/dev/null || true

  migration-gate:
    # TASK-040E (OPS-016): scripts/db/migrate.ts is the real production migration path. This job
    # proves it against a disposable database — both the happy path (full chain applies cleanly)
    # and the failure path (a deliberately corrupted checksum on an already-applied file fails the
    # pipeline under --strict, not just a warning).
    name: Production migration path (scripts/db/migrate.ts)
    runs-on: [self-hosted, Linux, X64, hostinger]
    env:
      WARDENX_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wardenx_migration_gate
      DATABASE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/wardenx_migration_gate
    steps:
      - uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      # Same pgvector image + raised lock limit as rls-live, and for the same reason: the full
      # migration chain includes ~47 partitioned parents and blows past the default
      # max_locks_per_transaction=64.
      - name: Start Postgres (pgvector image; raised lock limit)
        run: |
          docker run -d --name wardenx-ci-pg-migrate \
            -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=wardenx_migration_gate \
            -p 5432:5432 pgvector/pgvector:pg16 \
            -c max_locks_per_transaction=4096
          for i in $(seq 1 60); do
            docker exec wardenx-ci-pg-migrate pg_isready -h 127.0.0.1 -U postgres -d wardenx_migration_gate && exit 0
            sleep 1
          done
          echo "Postgres did not become ready" >&2; docker logs wardenx-ci-pg-migrate; exit 1
      - name: scripts/db/migrate.ts — live proof (full apply, idempotent re-run, --strict drift gate)
        run: bun run test:db:migrate:live

      - name: Apply against a fresh disposable DB via the real CLI (pre-deploy simulation)
        run: bun run db:migrate

      # F-033/#93 — partition rotation runs HERE rather than in a job of its own because this is the
      # only job that already holds a fully migrated database, and rotation is a property of the
      # migrated schema: the suite asserts that every time-RANGE partitioned table the migrations
      # create has a creator function the catalog scan can find. A migration that adds a partitioned
      # table without one fails this step, which is the check `arch:fitness` cannot make — it runs
      # with no database, so it would have to parse migration text, and that approach demonstrably
      # missed 3 of the 43 tables.
      - name: Partition rotation — live proof (idempotency, DEFAULT-trap detection, creator coverage)
        run: bun run test:partition-rotation:live

      - name: Verify --strict --schema-only fails the pipeline on checksum drift (not just warns)
        run: |
          docker exec wardenx-ci-pg-migrate psql -U postgres -d wardenx_migration_gate -c \
            "UPDATE _wardenx_migration SET checksum = 'deliberately-corrupted' WHERE filename = (SELECT filename FROM _wardenx_migration ORDER BY filename LIMIT 1);"
          if bun run db:migrate:deploy; then
            echo "expected --strict to fail on checksum drift, but it exited 0" >&2
            exit 1
          fi
          echo "✓ --strict correctly failed the pipeline on checksum drift"

      - name: Cleanup migration Postgres
        if: always()
        run: |
          docker rm -f wardenx-ci-pg-migrate 2>/dev/null || true

  auth-live:
    name: Better Auth live (Postgres) — schema reconciliation + sign-in (AUTH-T06)
    runs-on: [self-hosted, Linux, X64, hostinger]
    env:
      WARDENX_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wardenx_test
      BETTER_AUTH_SECRET: ci-test-secret-at-least-32-characters-long
      BETTER_AUTH_URL: http://localhost:3000
      # 32-byte base64 test key for the 2FA at-rest encryption (ADR-0034). Decodes to 32 bytes.
      TWO_FACTOR_ENCRYPTION_KEY: Y2ktMmZhLXRlc3Qta2V5LTAxMjM0NTY3ODlhYmNkZWY=
    steps:
      - uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      # Same explicit `docker run` as rls-live, and for the same reason: this suite applies the FULL
      # migration set, which exhausts the default max_locks_per_transaction=64. See the rls-live note.
      - name: Start Postgres (pgvector image — M38 ships a `vector` column; raised lock limit)
        run: |
          docker run -d --name wardenx-ci-pg \
            -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=wardenx_test \
            -p 5432:5432 pgvector/pgvector:pg16 \
            -c max_locks_per_transaction=4096
          for i in $(seq 1 60); do
            docker exec wardenx-ci-pg pg_isready -h 127.0.0.1 -U postgres -d wardenx_test && exit 0
            sleep 1
          done
          echo "Postgres did not become ready" >&2; docker logs wardenx-ci-pg; exit 1
      # F-025 (#59): `packages/db/__tests__/client.live.test.ts` (AUTH-T01 / ADR-0033) had no script
      # and no runner. Its own header names this lane — "the dedicated auth/live CI lane that runs
      # this end-to-end lands at AUTH-T06" — so it goes here rather than into a Postgres matrix row.
      - name: createDbClient opens a real pooled connection (AUTH-T01)
        run: bun run test:db:client:live
      - name: Better Auth sign-up/sign-in over the reconciled schema (real Postgres)
        run: bun run test:auth:live
      - name: device_attestation RLS survives a reused pooled connection (empty-GUC regression)
        run: bun run test:device-attestation-guc:live

      - name: Cleanup auth Postgres
        if: always()
        run: |
          docker rm -f wardenx-ci-pg 2>/dev/null || true

  outbox-boot:
    # F-020 (issue #49): the backend refused to START in the documented production configuration —
    # `DATABASE_PLATFORM_URL` set — because the outbox dispatcher's catalog validation throws before
    # `server.listen()` and two catalog/binding mismatches had accumulated. Nothing caught it because
    # the dispatcher is only CONSTRUCTED on that branch, and no job here had ever taken it: every
    # test, every local run and every other CI job configures a tenant credential only.
    #
    # `arch:outbox-bindings` (build-and-verify) catches that specific class at build time. This job
    # covers the rest of the branch — the platform pool, the audited active-org enumerator, the relay
    # start — by doing the one thing a gate cannot do: running the process the way production runs it.
    name: Production-configuration boot (DATABASE_PLATFORM_URL + outbox relay)
    runs-on: [self-hosted, Linux, X64, hostinger]
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wardenx_boot
      DATABASE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/wardenx_boot
      PROVISION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wardenx_boot
      DATABASE_PLATFORM_URL: postgresql://wardenx_platform_login:ci-platform-password-0123456789@localhost:5432/wardenx_boot
      WARDENX_PLATFORM_PASSWORD: ci-platform-password-0123456789
      BETTER_AUTH_SECRET: ci-test-secret-at-least-32-characters-long
      BETTER_AUTH_URL: http://localhost:3999
      TWO_FACTOR_ENCRYPTION_KEY: Y2ktMmZhLXRlc3Qta2V5LTAxMjM0NTY3ODlhYmNkZWY=
    steps:
      - uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      # Same pgvector image + raised lock limit as rls-live: booting applies the full migration set.
      - name: Start Postgres (pgvector image; raised lock limit)
        run: |
          docker run -d --name wardenx-ci-pg-boot \
            -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=wardenx_boot \
            -p 5432:5432 pgvector/pgvector:pg16 \
            -c max_locks_per_transaction=4096
          for i in $(seq 1 60); do
            docker exec wardenx-ci-pg-boot pg_isready -h 127.0.0.1 -U postgres -d wardenx_boot && exit 0
            sleep 1
          done
          echo "Postgres did not become ready" >&2; docker logs wardenx-ci-pg-boot; exit 1
      - name: Migrate
        run: bun run db:migrate
      # The platform login is a REAL provisioned role (carrier + BYPASSRLS), not a superuser alias —
      # booting against a superuser would prove nothing about the grants production actually has.
      - name: Provision the platform login role
        run: bun run db:provision-roles
      - name: Boot with the platform credential and prove the relay starts
        run: bun run check:boot:platform

      - name: Cleanup outbox Postgres
        if: always()
        run: |
          docker rm -f wardenx-ci-pg-boot 2>/dev/null || true

  # #41 — the ONLY live suite gated on WARDENX_TEST_REDIS_URL rather than WARDENX_TEST_DATABASE_URL,
  # which is a second reason it went unnoticed: it needs no Postgres at all, so it fitted none of the
  # existing live jobs and nothing ran it. It proves the cluster-wide rate limiter — that two backend
  # replicas sharing one Redis enforce ONE combined limit rather than one each, the exact gap the
  # in-memory Map store has (WX-PR-017, SD-055). A `services:` block is fine here: unlike the Postgres
  # jobs this needs no command arguments and replays no migrations.
  rate-limit-store-live:
    name: Rate-limit store live (Valkey) — cluster-wide counter (WX-PR-017)
    runs-on: [self-hosted, Linux, X64, hostinger]
    services:
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      WARDENX_TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Shared fixed-window counter across two clients (real Valkey)
        run: bun run test:rate-limit-store:live

  e2e:
    # F-024 (#41, second half): the 18-test Playwright suite — and the SIX axe-core WCAG 2A/AA scans it
    # carries, the repo's ENTIRE automated accessibility coverage — ran in no CI job. `test:e2e` was
    # invisible to `arch:live-suites` until #41 widened its detection, and was then explicitly DEFERRED
    # rather than wired, because the suite could not be run at all: `bun run db:reset` aborted partway
    # through its seed chain (#39), and 10 of the 18 specs were red against selectors and a screen that
    # had since been redesigned (#56). Both are fixed and the suite is 18/18, so the deferral is retired
    # and this job replaces it.
    #
    # This is the ONLY job that exercises the product the way a person uses it: a real Chromium against
    # the real Vite app, proxied to a real Fastify backend, over a real migrated and seeded Postgres.
    # Every other job here proves one layer in isolation — a route service, a policy, a boot path.
    #
    # It doubles as the only CI coverage `bun run db:reset` has ever had. That command is the documented
    # way to get a working local stack and it was broken for months with nothing to report it (#39); the
    # seed chain runs here through the very `db:seed:all` script `db:reset` composes, so the two cannot
    # drift apart.
    name: Critical-workflow E2E + accessibility (Playwright, full stack)
    runs-on: [self-hosted, Linux, X64, hostinger]
    services:
      # `db:seed:scenario-billing` drives M27 `refresh-inputs`, which enqueues a trial-balance pull —
      # with no queue connection that port is unbound and the step fails (docs/DEVELOPMENT.md). A
      # `services:` block is enough here: unlike the Postgres jobs this needs no command arguments.
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wardenx_e2e
      DATABASE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/wardenx_e2e
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_SECRET: ci-test-secret-at-least-32-characters-long
      BETTER_AUTH_URL: http://localhost:3000
      TWO_FACTOR_ENCRYPTION_KEY: Y2ktMmZhLXRlc3Qta2V5LTAxMjM0NTY3ODlhYmNkZWY=
      # The target is the DEV stack the suite was written against (Vite dev server + its /api proxy),
      # not a production build: `NODE_ENV=production` would demand the full production secret set and
      # https origins, and prove nothing more about these workflows. The production-configuration boot
      # is a different question and has its own job (`outbox-boot`).
      NODE_ENV: development
      PORT: "3000"
      E2E_BASE_URL: http://localhost:5173
      # MEASURED, not assumed. Without this the run is RED: a serial Playwright pass plus the seed
      # chain's ~30 sign-ins all share one `ip:` bucket in SD-055's unauthenticated tier (the sign-in
      # call is inherently pre-auth, so it has nowhere else to bucket), and the suite self-DoSes
      # against its own rate limiter — a clean local reproduction at the shipped 30/min default gave
      # `2 failed / 16 passed`, both failures a sign-in that never left /login, plus a 61-second
      # retry stall inside `db:seed:staff`. Raising the LOCAL tier is the mechanism `.env.example`
      # and `e2e/playwright.config.ts` both already document for exactly this; the shipped production
      # default is untouched, and the limiter itself is proven by `rate-limit-store-live` and by the
      # SD-055 unit tests, not by this job.
      RATE_LIMIT_UNAUTHENTICATED_PER_MINUTE: "300"
      # The AUTHENTICATED tier, for the same reason and now for the same measured cause. This job was
      # never set, so it ran on the shipped 600/min default — fine when the suite was 24 tests, and not
      # once #91's per-module E2E specs took it to 33: one full serial pass now issues 805 requests in
      # 43 seconds (measured, `grep -c responseTime` over the backend log across one run), i.e. ~1113/min
      # sustained against a 600/min ceiling, all in ONE `ip:` bucket because the whole suite drives one
      # loopback client. The failure it produces is worth naming, because it does not look like a rate
      # limit: the census read 429s, `openPatientChartByLastName` polls an empty table until it times
      # out, and the run goes red in whichever spec happened to be next — a DIFFERENT one each time. It
      # reads as missing seed data. 3000 is ~2.7x the measured peak, so the remaining eight modules can
      # land their specs without re-tripping it. Production default untouched.
      RATE_LIMIT_AUTHENTICATED_PER_MINUTE: "3000"
      # F-082 — the four vars M8's finalize (and M27's, M29's, M31's and M39's payload ciphers) need.
      #
      # `POST /encounters/:id/finalize` seals the assembled narrative under the tenant DEK, which needs
      # BOTH halves of M34's key envelope: the platform KEK that wraps it (`M34_TENANT_KEK`) and a
      # credential that may SELECT `tenant_key_ring` — migration 0052 §5 REVOKES that from `wardenx_app`
      # by design, so the request path physically cannot read a wrapped DEK and the platform login is
      # what resolves it. Without them the finalize is a 503 `HEARTHNOTE_CIPHER_UNBOUND`, which is the
      # fail-closed answer working correctly and which no spec could get past.
      #
      # This makes the e2e job the SECOND to boot in the documented production configuration. That is a
      # gain, not a cost: `outbox-boot` proves the platform-credential branch STARTS, and this now runs
      # the product across it — the relay, the audited active-org enumerator and the platform crons are
      # live for the whole suite rather than a branch nothing but a boot check has taken.
      PROVISION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wardenx_e2e
      WARDENX_PLATFORM_PASSWORD: ci-platform-password-0123456789
      DATABASE_PLATFORM_URL: postgresql://wardenx_platform_login:ci-platform-password-0123456789@localhost:5432/wardenx_e2e
      # A throwaway 32-byte test KEK. It wraps DEKs minted by this run's seed and nothing else; a real
      # deployment's lives in its secret manager (ADR-0045).
      M34_TENANT_KEK: kek-1:Y2ktdGVuYW50LWtlay10ZXN0LTAxMjM0NTY3ODlhYmM=
      # Document upload (documents.spec) needs the MinIO/S3 adapter: without MINIO_* the upload route answers
      # 503 DEGRADED and the SPA drops to its maintenance page. The adapter creates its own buckets.
      MINIO_ENDPOINT: http://localhost:9000
      MINIO_ACCESS_KEY: wardenx
      MINIO_SECRET_KEY: wardenx-minio-ci-secret
      MINIO_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      # Same explicit `docker run` + raised lock limit as rls-live, and for the same reason (see that
      # job's note): booting replays the full migration set, ~47 partitioned parents included.
      - name: Start Postgres (pgvector image; raised lock limit)
        run: |
          docker run -d --name wardenx-ci-pg-e2e \
            -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=wardenx_e2e \
            -p 5432:5432 pgvector/pgvector:pg16 \
            -c max_locks_per_transaction=4096
          for i in $(seq 1 60); do
            docker exec wardenx-ci-pg-e2e pg_isready -h 127.0.0.1 -U postgres -d wardenx_e2e && exit 0
            sleep 1
          done
          echo "Postgres did not become ready" >&2; docker logs wardenx-ci-pg-e2e; exit 1
      # `docker run`, not a `services:` container: MinIO needs its `server /data` argument, which a service
      # container cannot take.
      # Chainguard's build of the same MinIO server: MinIO no longer publishes `minio/minio` to Docker Hub
      # (`docker pull` is denied).
      - name: Start MinIO (document storage)
        run: |
          docker run -d --name wardenx-ci-minio-e2e \
            -e MINIO_ROOT_USER=wardenx -e MINIO_ROOT_PASSWORD=wardenx-minio-ci-secret \
            -p 9000:9000 cgr.dev/chainguard/minio:latest server /data
          for i in $(seq 1 60); do
            curl -sf http://localhost:9000/minio/health/live > /dev/null && exit 0
            sleep 1
          done
          echo "MinIO did not become ready" >&2; docker logs wardenx-ci-minio-e2e; exit 1
      - name: Install the Chromium build this Playwright version pins
        run: bunx playwright install --with-deps chromium
      - name: Migrate
        run: bun run db:migrate
      # A REAL provisioned role (carrier + BYPASSRLS), not a superuser alias — same as `outbox-boot`.
      # Booting against a superuser would prove nothing about the grants production actually has, and
      # the key-ring read is exactly a grant question.
      - name: Provision the platform login role
        run: bun run db:provision-roles
      # Backgrounded because the suite needs the stack UP for its whole run — unlike `check:boot:platform`,
      # which boots, asserts and kills. The log is captured to a file so a failure shows the backend's own
      # output (see the artifact step) instead of an unexplained browser timeout.
      - name: Boot the backend and wait for /health
        run: |
          mkdir -p "$RUNNER_TEMP/e2e-logs"
          (cd apps/backend && nohup bun src/index.ts > "$RUNNER_TEMP/e2e-logs/backend.log" 2>&1 &)
          for i in $(seq 1 120); do
            if curl -sf http://localhost:3000/health > /dev/null; then
              echo "backend healthy after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "backend did not answer /health within 120s" >&2
          cat "$RUNNER_TEMP/e2e-logs/backend.log" >&2; exit 1
      # The same fourteen steps `bun run db:reset` runs, through the same script, against this database.
      # Most of them drive the real REST API as signed-in demo personas rather than writing rows directly, so
      # this exercises RLS, ABAC and the state machines on the way to the fixtures the specs need.
      - name: Seed the demo tenant (the `db:reset` chain)
        run: bun run db:seed:all
      # The seeded demo org is created by SQL, not through M34 provisioning, so its `tenant-<orgId>` bucket
      # does not exist and document uploads 404 (NoSuchBucket) at the presigned PUT. The operator reconcile
      # creates the bucket for every tenant missing one.
      - name: Create the demo tenant's storage bucket
        run: bun run storage:reconcile-tenants
      - name: Start the web app and wait for it to serve
        run: |
          (cd apps/web && nohup bun run dev > "$RUNNER_TEMP/e2e-logs/web.log" 2>&1 &)
          for i in $(seq 1 90); do
            if curl -sf http://localhost:5173 > /dev/null; then
              echo "web up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "the web dev server did not serve within 90s" >&2
          cat "$RUNNER_TEMP/e2e-logs/web.log" >&2; exit 1
      # `forbidOnly` is already on under CI (playwright.config.ts), so a stray `.only` fails the job
      # rather than silently shrinking the suite to one test — the browser-side version of the
      # self-skip this workflow's live jobs guard against.
      - name: 20 browser specs — 13 critical-workflow + 7 axe-core WCAG 2A/AA scans (real stack)
        run: bun run test:e2e
      - name: Upload the Playwright report, traces and stack logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-artifacts
          path: |
            e2e/playwright-report/
            e2e/test-results/
            ${{ runner.temp }}/e2e-logs/
          retention-days: 7
      
      - name: Cleanup E2E containers
        if: always()
        run: |
          docker rm -f wardenx-ci-pg-e2e 2>/dev/null || true
          docker rm -f wardenx-ci-minio-e2e 2>/dev/null || true
