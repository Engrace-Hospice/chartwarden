name: CI

on:
  # push:
  #   branches:
  #     - develop

  pull_request:
    branches:
      # - develop
      # - main
      - fix/admission

  # Callable as a reusable workflow so `deploy.yml` can require THIS ENTIRE workflow — every job
  # below, live-DB suites included — before it publishes an image or touches the production VPS
  # (#16). Expressing the deploy gate as a call rather than a copy of `build-and-verify` means the
  # two can never drift: whatever CI checks on a PR is exactly what a release must satisfy.
  workflow_call:
# Phase 0 gate (PHASE_0_SCAFFOLD_PLAN.md PR-0.6): every PR must install from the committed
# lockfile, build the project-reference graph, pass all six fitness gates + scaffold parity,
# and pass the Vitest fitness-gate self-test (which proves each gate goes red on a violation).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    runs-on: [self-hosted, Linux, X64, hostinger]
    # `tsc -b` over the full project graph outgrew Node's default heap on the runner (~2 GB, sized
    # from runner RAM): it died with "Reached heap limit … JavaScript heap out of memory" (SIGABRT,
    # exit 134) before arch:fitness, the unit suite or the dependency audit ever ran.
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Type-check / build project graph
        run: bun run build

      # EXPLICIT, not implied. Type safety was enforced only as a side effect of `bun run build`
      # above, and `scripts/` — 71 files that decide whether the architecture gates pass, plus the
      # file that defines every request/response contract in openapi.json — was in no tsconfig
      # project, so `tsc -b` never compiled it (#34). It is a referenced project now, and naming the
      # step means the coverage is visible in the log rather than inferred.
      #
      # F-098 — `bun run typecheck` is now `tsc -b` PLUS the two test programs. Every workspace
      # tsconfig is `"include": ["src"]` and a suite lives in a sibling `__tests__/`, so 631 files
      # vitest runs were compiled by nothing at all and a signature change made its own callers
      # silently WRONG rather than broken. `arch:test-typecheck` (in the gate chain below) is what
      # keeps the two programs resolving to the same file set the runner does.
      - name: Type-check (explicit — src + the test tree)
        run: bun run typecheck

      # Step names deliberately carry NO gate/test COUNT. "parity + 6 gates" was accurate when
      # arch:fitness chained 7 things; it now chains 17, so for ten of them the log said less had been
      # checked than actually was — and a CI log understating its own coverage is read by whoever is
      # deciding whether a change is safe to ship. Naming the script instead cannot go stale.
      - name: Architecture fitness gates (arch:fitness)
        # docs/plans/** is read-only to AUTOMATED runs (ADR-0030 / check-plan-integrity).
        # A human-authored PR that intentionally adds or edits a plan opts in by applying the
        # `allow-plan-edits` label, which sets ALLOW_PLAN_EDITS for THIS step only. Automated
        # (archon) PRs without the label stay blocked, so the guardrail keeps its teeth.
        env:
          ALLOW_PLAN_EDITS: ${{ contains(github.event.pull_request.labels.*.name, 'allow-plan-edits') && '1' || '' }}
        run: bun run arch:fitness

      # `bun run test` is `vitest run` — the WHOLE unit + integration corpus (6,000+ cases across
      # apps/ and packages/), not the narrow pair the old label named. The live-DB suites are the
      # ones excluded here; they run in the rls-live matrix and auth-live jobs below.
      - name: Unit + integration suite (bun run test)
        run: bun run test

      # GAP-087: `bun audit` was cited twice as a control and invoked by nothing — not here, not in
      # deploy.yml, not in the pre-push hook, not anywhere in the `arch:fitness` chain. It is a real
      # step now, and BLOCKING at high/critical: a dependency does not have to change to become
      # vulnerable, so a one-time manual sweep can never be the control. Deliberately NOT inside
      # `arch:fitness` — that chain is hermetic, and this one calls the advisory registry.
      - name: Dependency vulnerability audit (audit:deps)
        run: bun run audit:deps

      # BLOCKING as of #33. It ran `continue-on-error: true` from the day it was added, so the gate
      # executed, failed, and was discarded on every commit — 187 diagnostics on `main`, and the two
      # real defects buried in them (#31, a cross-tenant ops route publishing the wrong response
      # contract; #32, four drawers unreachable by keyboard) were found by THIS check with nobody
      # having to look. It is also the repo's only automated a11y enforcement outside the E2E axe
      # scans. `scripts/__tests__/lint-gate.test.ts` asserts this step stays blocking.
      - name: Lint
        run: bun run lint

  rls-live:
    name: RLS isolation — ${{ matrix.suite.name }} (live Postgres)
    runs-on: [self-hosted, Linux, X64, hostinger]
    strategy:
      fail-fast: false
      matrix:
        suite:
          - { name: "baseline M1-M14", script: "test:rls:live" }
          - { name: "M4 Audit", script: "test:rls:live:m4" }
          - { name: "M5 Patient", script: "test:rls:live:m5" }
          - { name: "M1 Foundation", script: "test:rls:live:m1" }
          - { name: "M1 slug aliases", script: "test:m1:slug-alias:live" }
          - { name: "M1 tenant host", script: "test:m1:tenant-host:live" }
          - { name: "M2 Identity", script: "test:rls:live:m2" }
          - { name: "M3 Authorization", script: "test:rls:live:m3" }
          - { name: "M6 Admission", script: "test:rls:live:m6" }
          - { name: "M7 Care Plan", script: "test:rls:live:m7" }
          - { name: "M8 Encounters", script: "test:rls:live:m8" }
          - { name: "M9 Assessments", script: "test:rls:live:m9" }
          - { name: "M10 HOPE", script: "test:rls:live:m10" }
          - { name: "FK index coverage", script: "test:fk-indexes:live" }
          - { name: "M11 Orders", script: "test:rls:live:m11" }
          - { name: "M12 DoseSpot", script: "test:rls:live:m12" }
          - { name: "M13 eMAR", script: "test:rls:live:m13" }
          - { name: "M14 IDG", script: "test:rls:live:m14" }
          - { name: "M17 Scheduling", script: "test:rls:live:m17" }
          - { name: "M18 EVV", script: "test:rls:live:m18" }
          - { name: "M22 Documents", script: "test:rls:live:m22" }
          - { name: "M27 Cost Report", script: "test:rls:live:m27" }
          - { name: "M36 Messaging", script: "test:rls:live:m36" }
          - { name: "M38 Terminology", script: "test:rls:live:m38" }
          - { name: "M39 Consent", script: "test:rls:live:m39" }
          - { name: "M40 MDM", script: "test:rls:live:m40" }
          - { name: "M15 Discipline Plans", script: "test:rls:live:m15" }
          - { name: "M16 Bereavement", script: "test:rls:live:m16" }
          - { name: "M19 On-Call Triage", script: "test:rls:live:m19" }
          - { name: "M20 Field Safety", script: "test:rls:live:m20" }
          - { name: "M21 Supplies/DME", script: "test:rls:live:m21" }
          - { name: "M23 Billing-Medicare", script: "test:rls:live:m23" }
          - { name: "M23 per-diem-rate rename (1069)", script: "test:m23:per-diem-rate-rename:live" }
          - { name: "Role rename (1139)", script: "test:roles-rename:live" }
          - { name: "Alias drop (1142)", script: "test:alias-drop:live" }
          - { name: "Function rename (1143)", script: "test:function-rename:live" }
          - { name: "Reserved username (1146)", script: "test:reserved-username:live" }
          - { name: "Stored identifiers (1151)", script: "test:stored-identifiers:live" }
          - { name: "M24 Billing-Medicaid", script: "test:rls:live:m24" }
          - { name: "M25 Remittance", script: "test:rls:live:m25" }
          - { name: "M26 Cap Management", script: "test:rls:live:m26" }
          - { name: "M30 HQRP & Quality", script: "test:rls:live:m30" }
          - { name: "M32 AI Platform", script: "test:rls:live:m32" }
          - { name: "M33 Reporting", script: "test:rls:live:m33" }
          - { name: "M34 SaaS Platform", script: "test:rls:live:m34" }
          - { name: "M28 FHIR Gateway", script: "test:rls:live:m28" }
          - { name: "M29 External Interfaces", script: "test:rls:live:m29" }
          - { name: "M31 Portal & Telehealth", script: "test:rls:live:m31" }
          - { name: "M35 Subscription Billing", script: "test:rls:live:m35" }
          - { name: "M37 IPU Management", script: "test:rls:live:m37" }
          # #41 — not an RLS-isolation suite, but the same shape: a migrations live suite needing the
          # full replay + raised lock limit this job already provides. Had no runner.
          - { name: "M4 nested audit redaction", script: "test:audit:nested-redaction:live" }
    env:
      CHARTWARDEN_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/chartwarden_test
    steps:
      - uses: actions/checkout@v7
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      # Started as an explicit `docker run`, NOT a `services:` block. A service container takes no
      # command arguments, and these suites replay all 117 migrations — including ~47 partitioned
      # parents — inside one transaction, which blows past the default max_locks_per_transaction=64
      # with `out of shared memory`. That GUC needs a RESTART, so ALTER SYSTEM + pg_reload_conf()
      # cannot fix it from a step. Verified locally: Postgres at the default fails the baseline, M25,
      # M26 and M30 suites; at 4096 all fifteen pass.
      - name: Start Postgres (pgvector image — M38 ships a `vector` column; raised lock limit)
        run: |
          docker run -d --name chartwarden-ci-pg \
            -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=chartwarden_test \
            -p 5432:5432 pgvector/pgvector:pg18 \
            -c max_locks_per_transaction=4096
          for i in $(seq 1 60); do
            docker exec chartwarden-ci-pg pg_isready -h 127.0.0.1 -U postgres -d chartwarden_test && exit 0
            sleep 1
          done
          echo "Postgres did not become ready" >&2; docker logs chartwarden-ci-pg; exit 1
      - name: ${{ matrix.suite.name }} — cross-tenant isolation proof (real Postgres + real RLS)
        run: bun run ${{ matrix.suite.script }}

      - name: Cleanup Postgres container
        if: always()
        run: |
          docker rm -f chartwarden-ci-pg 2>/dev/null || true

  lifecycle-live:
    # GAP-086: the 25 per-module read/write LIFECYCLE suites had scripts in package.json and no runner
    # anywhere — no CI job, no git hook (.githooks/pre-push runs build/arch:fitness/test, and `bun run test`
    # never sets CHARTWARDEN_TEST_DATABASE_URL). They self-SKIP without that variable rather than failing, so
    # the corpus looked green while 205 assertions had never once executed outside their authors' laptops.
    #
    # These are a different proof from `rls-live` above, which asserts the POLICIES at the table level.
    # These drive the production Drizzle route services — the real write lifecycles, the real transactional
    # outbox publisher, the real seams — as the NOBYPASSRLS `chartwarden_app` role. Turning them on found 23 of
    # 25 red, including a suite whose license assertion only held for two thirds of any given day.
    #
    # Grouped per MODULE (read + write in one runner) rather than one job per script: every suite resets the
    # schema and replays the migrations itself, so they compose sequentially, and 13 runners instead of 25
    # halves the per-job migration replay for identical coverage.
    name: Lifecycle — ${{ matrix.suite.name }} (live Postgres)
    runs-on: [self-hosted, Linux, X64, hostinger]
    strategy:
      fail-fast: false
      matrix:
        suite:
          # #41 — t3/t4/t5 were invisible to the coverage gate (its pattern allowed hyphens but not
          # colons in the middle segment, and `t3:write` is two segments), so 24 tests / 97 assertions
          # over the election-CTI, discharge/F2F/LOC and compliance-window write lifecycles had no
          # runner. They pass; the gap was the runner, not the code.
          # `test:m6:abac-scope:live` (GAP-011) is here for a reason worth reading: it is the ONE
          # of the 23 `*.live.test.ts` files with no package.json script that turned out to be RED.
          # Green on `main`, red on this stack — F-017's new fail-closed provider-entity org check
          # broke its setup helper, and with no script and no job, nothing said so for a whole
          # branch. The other 22 pass and stay unwired for now; this one earned a runner.
          - {
              name: "M6 Admission",
              scripts:
                "test:m6:read:live test:m6:write:live test:m6:t3:write:live test:m6:t4:write:live
                test:m6:t5:write:live test:m6:t5:counts:live test:m6:abac-scope:live
                test:m6:election-guards:live test:m6:claim-discharge-seam:live test:m6:physician-authority:live
                test:m6:create-patient:live",
            }
          - {
              name: "M7 Care Plan",
              scripts:
                "test:m7:read:live test:m7:write:live test:m7:conformance:live
                test:m7:consent-wiring:live",
            }
          - { name: "M8 Encounters", scripts: "test:m8:read:live test:m8:write:live" }
          # GAP-027 — GET /encounters/:id `addenda[]` through the real route + Drizzle service + RLS.
          - { name: "M8 addenda read", scripts: "test:m8:addenda-read:live" }
          - { name: "M9 Assessments", scripts: "test:m9:read:live test:m9:write:live" }
          # M36 WP 3.2 - LatestAssessmentProvider.linkSummary, as the NOBYPASSRLS app role.
          - { name: "M9 link summary seam", scripts: "test:m9:link-summary:live" }
          - { name: "M10 HOPE", scripts: "test:m10:read:live test:m10:write:live" }
          # The HOPE spec registry / CMS spec import / answer engine suites landed on main after the
          # 2026-09-17 force-push with no runner; the restored live-suite gate caught them.
          - { name: "M10 HOPE spec registry", scripts: "test:m10:spec:live" }
          - { name: "M10 HOPE answer engine", scripts: "test:m10:answer-engine:live" }
          # GAP-181 — the monthly `hope-retention-scan` (flags only; destruction stays on M4) + the M9 cadence ledger.
          - { name: "M10 HOPE retention scan", scripts: "test:m10:retention:live" }
          - { name: "M10 HOPE submission result", scripts: "test:m10:submission-result:live" }
          - { name: "M11 Orders", scripts: "test:m11:read:live test:m11:write:live" }
          - { name: "M11 downstream signed fan-out", scripts: "test:m11:downstream-signed:live" }
          # F-152 (#248) — the §2.7 D7 order-suggestion banner (Valkey) + the D8 one-shot auto-complete.
          - { name: "M11 M9/M21 outbox consumers", scripts: "test:m11:m9-m21-consumers:live" }
          # F-166 (#248) — `m21.supply_request.cancelled`: releases the still-in-flight M11 order on the
          # staff-initiated M21 cancel route; a true no-op on the M11-cascade-reply producer.
          - { name: "M11 supply-cancelled consumer", scripts: "test:m11:supply-cancelled:live" }
          # F-177 (#248) — `LabTransmissionApplier`: M29's real outbound HL7 lifecycle events drive
          # order_record.transmission_status and re-publish M11's own D16-decisive events.
          - { name: "M11 lab-transmission applier", scripts: "test:m11:lab-transmission-applier:live" }
          - { name: "M11 lab-results applier", scripts: "test:m11:lab-results-applier:live" }
          - { name: "M11 lab ORM producer (F-181)", scripts: "test:m11:orm-requested:live" }
          - { name: "M11 lab ORM resend (F-182)", scripts: "test:m11:orm-resend:live" }
          - { name: "M11 lab ORM attested recovery + never-pending (F-187)", scripts: "test:m11:orm-recovery:live" }
          - { name: "M11 stuck lab-order auto-retry + held worklist/aging (F-201)", scripts: "test:m11:stuck-recovery:live" }
          - { name: "M11 lab-order supersession alert (F-187)", scripts: "test:m11:lab-cancellation:live" }
          - { name: "M29 outbound alerts reach a person (F-188)", scripts: "test:m29:alert-routing:live" }
          - { name: "M11 lab ORM duplicate windows (F-183)", scripts: "test:m11:orm-duplicate-windows:live" }
          # F-164 (#248) — M11's hourly orders.verbal_timer fan-out + the M12 medication-order verbal
          # target-kind discrimination it drives.
          - { name: "M11 verbal-order expiry", scripts: "test:m11:verbal-order-expiry:live" }
          - { name: "M11/M12 verbal expiry handshake", scripts: "test:m11:m12-verbal-expiry:live" }
          - { name: "M12 DoseSpot", scripts: "test:m12:read:live test:m12:write:live" }
          # F-161 (#248) — the §2.8 D17 reconciliation-discontinue handshake.
          - {
              name: "M12 reconciliation discontinue",
              scripts: "test:m12:reconciliation-discontinue:live",
            }
          # F-164 (#248) — the §2.6 D4 / §2.8 D10 patient-sync + MedHx-fetch job-queue tier
          # (dosespot_sync_queue) draining the six m5.patient.*/m6.{admission.activated,cti.signed}
          # triggers.
          - { name: "M12 sync triggers", scripts: "test:m12:sync-triggers:live" }
          # F-230 (#248) — OUR side of the DoseSpot vendor boundary (MedHx ingest + `POST /webhooks/dosespot`
          # dispense path + the M14 slot's seam), against a clearly-labelled vendor TEST DOUBLE.
          - { name: "M12 vendor boundary", scripts: "test:m12:vendor-boundary:live" }
          # GAP-037 — the seven §4.8 M12 crons (transmit_newrx, recovery drain, status sweep + the refill-SLA / IAL2 /
          # EPCS-expiry / RxBenefit-prewarm passes) and the ack / nack / refill / prescriber webhook handlers.
          - {
              name: "M12 DoseSpot crons",
              scripts: "test:m12:crons-transmit:live test:m12:crons-housekeeping:live",
            }
          - {
              name: "M13 eMAR",
              scripts: "test:m13:read:live test:m13:write:live test:m13:rn-case-manager:live",
            }
          # F-152 (#248) — the §2.8 D17 medication-reconciliation worksheet, opened from all four M6
          # trigger events.
          - { name: "M13 reconciliation triggers", scripts: "test:m13:reconciliation-triggers:live" }
          # F-155 (#248) — the §2.5/§2.7 D14 admission-discharge cascade (cancel future doses, flag
          # comfort kits for return).
          - {
              name: "M13 admission-discharged cascade",
              scripts: "test:m13:admission-discharged-cascade:live",
            }
          # F-164 (#248) — the §2.8 D17 reconciliation draft-order-requested handshake (a real drug
          # content payload, minting a real draft medication_order).
          - {
              name: "M13/M12 draft-order-requested",
              scripts: "test:m13:m12-draft-order-requested:live",
            }
          # F-166 (#248) — the §2.3 D2 scheduled-dose materializer + order-discontinue cascade
          # (m12.medication_order.active/.discontinued).
          - {
              name: "M13 scheduled-dose materialization",
              scripts: "test:m13:scheduled-dose-materialization:live",
            }
          # F-166 (#248) — the §2.5/§2.7 D5 comfort-kit deployment/replenishment/return chain
          # (m21.comfort_kit.deployed_at_patient/.replenished/.returned/.return_reconciliation).
          - {
              name: "M13 comfort-kit deployment",
              scripts: "test:m13:comfort-kit-deployment:live",
            }
          # GAP-038/039/040 — the §4.8 eMAR crons (extend-schedule, missed-dose-sweep, reconciliation-due-warning,
          # kit-return-overdue, prn-reassessment-overdue). Live: the FOR UPDATE SKIP LOCKED claim, the unique
          # indexes that make a re-tick a no-op and the NOT EXISTS over the partitioned administration_record.
          - { name: "M13 eMAR crons", scripts: "test:m13:emar-crons:live" }
          - {
              name: "M14 IDG",
              scripts:
                "test:m14:read:live test:m14:write:live test:m14:clinical-event-consumers:live
                test:m14:enrichment:live test:m14:last-meeting:live",
            }
          - {
              name: "M17 Scheduling",
              scripts:
                "test:m17:read:live test:m17:write:live test:m17:visit-create-abac:live
                test:m17:membership-credential:live test:m17:oncall-roster:live",
            }
          # F-152 (#248) — the D14 EVV-authoritative visit advances + the §7.5 SOS-resolution cancellation.
          - { name: "M17 EVV/SOS outbox consumers", scripts: "test:m17:evv-sos-consumers:live" }
          # F-196 (#248) — the §4.10 missing-EVV resolution stamp.
          - { name: "M17 EVV late-check-resolved", scripts: "test:m17:evv-late-check-resolved:live" }
          # F-158 (#248) — the §3.3 EVV checkout/correction provenance-pointer consumers.
          - { name: "M17 EVV checkout/corrected consumers", scripts: "test:m17:evv-checkout-corrected:live" }
          # F-166 (#248) — the §7.5 volunteer-gate scheduler warning + the §2.2.4 D5 after-hours triage proposal.
          - {
              name: "M17 volunteer/triage consumers",
              scripts: "test:m17:volunteer-triage-consumers:live",
            }
          # GAP-052 — the §4.8 PTO reassignment scan + caregiver-reminder cron.
          - {
              name: "M17 reassignment scan / caregiver reminder",
              scripts: "test:m17:reassignment-reminder:live",
            }
          # M36 WP 3.1 — the VisitReader.nextScheduledVisitForPatient read seam, as the NOBYPASSRLS app role.
          - { name: "M17 next scheduled visit seam", scripts: "test:m17:next-visit:live" }
          # M36 WP 3.2 - the CarePlanReader.linkSummary clinical-link read seam, as the NOBYPASSRLS app role.
          - { name: "M7 care plan link summary seam", scripts: "test:m7:link-summary:live" }
          # M36 WP 3.2 — OrderProvider.linkSummary, as the NOBYPASSRLS app role.
          - { name: "M11 link summary seam", scripts: "test:m11:link-summary:live" }
          # M36 WP 3.2 — MedicationOrderProvider.linkSummary (ids + status only), as the NOBYPASSRLS app role.
          - { name: "M12 link summary seam", scripts: "test:m12:link-summary:live" }
          # M36 WP 3.2 — the DocumentReader.linkSummary clinical-link read seam, as the NOBYPASSRLS app role.
          - { name: "M22 document link summary seam", scripts: "test:m22:link-summary:live" }
          - { name: "M18 EVV", scripts: "test:m18:read:live test:m18:write:live test:m18:workers:live" }
          # F-153 (#248) — the D14 `m17.visit.cancelled` bracket close + the D6/§2.2.4
          # `m8.encounter.signed` missing-EVV auto-resolution.
          - {
              name: "M18 visit-cancelled/encounter-signed consumers",
              scripts: "test:m18:visit-cancelled-encounter-signed:live",
            }
          # §4.8 `m18.dek-rotation` — coordinate re-seal under the current M34 DEK through migration 0494's
          # SECURITY DEFINER (append-only trigger + RLS proven as the NOBYPASSRLS app role).
          - { name: "M18 DEK-rotation re-seal", scripts: "test:m18:dek-rotation:live" }
          # F-043/#103: M20's field-safety visit consumers — the first producer `safety_check_in_schedule`
          # has ever had. Live because the materializer's idempotence, the `mark_overdue` stamp constraint
          # and the policy-version FK are all statements about Postgres, and because `readAnchors` reaches
          # M17's seam under the ambient scope each binding establishes.
          # F-043/#103: M19's two D10 inbound triggers — the first proactive triage call the platform can
          # open. Live because the D10 redelivery guard is a partial unique index, the coalesce grain is a
          # predicate over `state`, `on_call_shift_id` is NOT NULL (which is why `no_coverage` exists as an
