  e2e:
    # F-024 (#41, second half): the 18-test Playwright suite — and the SIX axe-core WCAG 2A/AA scans it
    # carries, the repo's ENTIRE automated accessibility coverage — ran in no CI job. `test:e2e` was
    # invisible to `arch:live-suites` until #41 widened its detection, and was then explicitly DEFERRED
    # rather than wired, because the suite could not be run at all: `bun run db:reset` aborted partway
    # through its seed chain (#39), and 10 of the 18 specs were red against selectors and a screen that
    # had since been redesigned (#56). Both are fixed and the suite is 18/18, so the deferral is retired
    # and this job replaces it.
    #
    # This is the ONLY job that exercises the product the way a person uses it: a real Chromium against
    # the real Vite app, proxied to a real Fastify backend, over a real migrated and seeded Postgres.
    # Every other job here proves one layer in isolation — a route service, a policy, a boot path.
    #
    # It doubles as the only CI coverage `bun run db:reset` has ever had. That command is the documented
    # way to get a working local stack and it was broken for months with nothing to report it (#39); the
    # seed chain runs here through the very `db:seed:all` script `db:reset` composes, so the two cannot
    # drift apart.
    name: Critical-workflow E2E + accessibility (Playwright, full stack)
    runs-on: [self-hosted, Linux, X64, hostinger]
    services:
      # `db:seed:scenario-billing` drives M27 `refresh-inputs`, which enqueues a trial-balance pull —
      # with no queue connection that port is unbound and the step fails (docs/DEVELOPMENT.md). A
      # `services:` block is enough here: unlike the Postgres jobs this needs no command arguments.
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/chartwarden_e2e
      DATABASE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/chartwarden_e2e
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_SECRET: ci-test-secret-at-least-32-characters-long
      BETTER_AUTH_URL: http://localhost:3000
      TWO_FACTOR_ENCRYPTION_KEY: Y2ktMmZhLXRlc3Qta2V5LTAxMjM0NTY3ODlhYmNkZWY=
      # The target is the DEV stack the suite was written against (Vite dev server + its /api proxy),
      # not a production build: `NODE_ENV=production` would demand the full production secret set and
      # https origins, and prove nothing more about these workflows. The production-configuration boot
      # is a different question and has its own job (`outbox-boot`).
      NODE_ENV: development
      PORT: "3000"
      E2E_BASE_URL: http://localhost:5173
      # MEASURED, not assumed. Without this the run is RED: a serial Playwright pass plus the seed
      # chain's ~30 sign-ins all share one `ip:` bucket in SD-055's unauthenticated tier (the sign-in
      # call is inherently pre-auth, so it has nowhere else to bucket), and the suite self-DoSes
      # against its own rate limiter — a clean local reproduction at the shipped 30/min default gave
      # `2 failed / 16 passed`, both failures a sign-in that never left /login, plus a 61-second
      # retry stall inside `db:seed:staff`. Raising the LOCAL tier is the mechanism `.env.example`
      # and `e2e/playwright.config.ts` both already document for exactly this; the shipped production
      # default is untouched, and the limiter itself is proven by `rate-limit-store-live` and by the
      # SD-055 unit tests, not by this job.
      #
      # 300 → 1000 alongside the authenticated raise below: with the route walk running to completion, the
      # `/api/v1/auth/*` calls peak at ~230/minute against a 300 ceiling and a handful answered 429
      # (`/auth/context` on the first spec after the walk), which is what made billing's first spec flaky.
      RATE_LIMIT_UNAUTHENTICATED_PER_MINUTE: "1000"
      # The AUTHENTICATED tier, for the same reason and now for the same measured cause. This job was
      # never set, so it ran on the shipped 600/min default — fine when the suite was 24 tests, and not
      # once #91's per-module E2E specs took it to 33: one full serial pass now issues 805 requests in
      # 43 seconds (measured, `grep -c responseTime` over the backend log across one run), i.e. ~1113/min
      # sustained against a 600/min ceiling, all in ONE `ip:` bucket because the whole suite drives one
      # loopback client. The failure it produces is worth naming, because it does not look like a rate
      # limit: the census read 429s, `openPatientChartByLastName` polls an empty table until it times
      # out, and the run goes red in whichever spec happened to be next — a DIFFERENT one each time. It
      # reads as missing seed data. 3000 is ~2.7x the measured peak, so the remaining eight modules can
      # land their specs without re-tripping it. Production default untouched.
      #
      # RAISED 3000 → 20000 for the axe route walk (#106). It scans 146 screens in ~3 minutes from the same
      # loopback client and peaks at ~8100 requests/minute (measured the same way, over one clean full-suite
      # run) — 2.7x the old ceiling — so it answered 166 requests with 429 and the specs queued right behind
      # it (billing's Claim Workbench / AR dashboard) read RATE_LIMITED as an empty page. It stayed hidden
      # while the walk itself timed out at 10 minutes and never reached its steady request rate. 20000 is
      # ~2.5x that peak, the same headroom as before.
      RATE_LIMIT_AUTHENTICATED_PER_MINUTE: "20000"
      # F-082 — the four vars M8's finalize (and M27's, M29's, M31's and M39's payload ciphers) need.
      #
      # `POST /encounters/:id/finalize` seals the assembled narrative under the tenant DEK, which needs
      # BOTH halves of M34's key envelope: the platform KEK that wraps it (`M34_TENANT_KEK`) and a
      # credential that may SELECT `tenant_key_ring` — migration 0052 §5 REVOKES that from `chartwarden_app`
      # by design, so the request path physically cannot read a wrapped DEK and the platform login is
      # what resolves it. Without them the finalize is a 503 `HEARTHNOTE_CIPHER_UNBOUND`, which is the
      # fail-closed answer working correctly and which no spec could get past.
      #
      # This makes the e2e job the SECOND to boot in the documented production configuration. That is a
      # gain, not a cost: `outbox-boot` proves the platform-credential branch STARTS, and this now runs
      # the product across it — the relay, the audited active-org enumerator and the platform crons are
      # live for the whole suite rather than a branch nothing but a boot check has taken.
      PROVISION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/chartwarden_e2e
      CHARTWARDEN_PLATFORM_PASSWORD: ci-platform-password-0123456789
      DATABASE_PLATFORM_URL: postgresql://chartwarden_platform_login:ci-platform-password-0123456789@localhost:5432/chartwarden_e2e
      # A throwaway 32-byte test KEK. It wraps DEKs minted by this run's seed and nothing else; a real
      # deployment's lives in its secret manager (ADR-0045).
      M34_TENANT_KEK: kek-1:Y2ktdGVuYW50LWtlay10ZXN0LTAxMjM0NTY3ODlhYmM=
      # The billing demo seed (`db:seed:scenario-billing`, #823) seals a MAC submitter secret through
      # `POST /billing/mac-credentials`, which needs the shared billing KEK (M23 + M24), and submits an Oregon
      # Medicaid claim, which the route refuses with MEDICAID_STATE_NO_ELECTRONIC_GATEWAY unless the M24 launch
      # gateway capability gate is on (outside production an unset gate is OFF). Throwaway key, this run only.
      M24_CREDENTIAL_ENCRYPTION_KEY: Y2ktbTI0LWNyZWRlbnRpYWwta2VrLTAxMjM0NTY3ODk=
      M24_LAUNCH_GATEWAY_ENABLED: "true"
      # Document upload (documents.spec) needs the MinIO/S3 adapter: without MINIO_* the upload route answers
      # 503 DEGRADED and the SPA drops to its maintenance page. The adapter creates its own buckets.
      MINIO_ENDPOINT: http://localhost:9000
      MINIO_ACCESS_KEY: chartwarden
      MINIO_SECRET_KEY: chartwarden-minio-ci-secret
      MINIO_REGION: us-east-1
    steps:
      - uses: actions/checkout@v7
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      # Same explicit `docker run` + raised lock limit as rls-live, and for the same reason (see that
      # job's note): booting replays the full migration set, ~47 partitioned parents included.
      - name: Start Postgres (pgvector image; raised lock limit)
        run: |
          docker run -d --name chartwarden-ci-pg-e2e \
            -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=chartwarden_e2e \
            -p 5432:5432 pgvector/pgvector:pg18 \
            -c max_locks_per_transaction=4096
          for i in $(seq 1 60); do
            docker exec chartwarden-ci-pg-e2e pg_isready -h 127.0.0.1 -U postgres -d chartwarden_e2e && exit 0
            sleep 1
          done
          echo "Postgres did not become ready" >&2; docker logs chartwarden-ci-pg-e2e; exit 1
      # `docker run`, not a `services:` container: MinIO needs its `server /data` argument, which a service
      # container cannot take.
      # Chainguard's build of the same MinIO server: MinIO no longer publishes `minio/minio` to Docker Hub
      # (`docker pull` is denied).
      - name: Start MinIO (document storage)
        run: |
          docker run -d --name chartwarden-ci-minio-e2e \
            -e MINIO_ROOT_USER=chartwarden -e MINIO_ROOT_PASSWORD=chartwarden-minio-ci-secret \
            -p 9000:9000 cgr.dev/chainguard/minio:latest server /data
          for i in $(seq 1 60); do
            curl -sf http://localhost:9000/minio/health/live > /dev/null && exit 0
            sleep 1
          done
          echo "MinIO did not become ready" >&2; docker logs chartwarden-ci-minio-e2e; exit 1
      # No `--with-deps`: it shells out to `sudo apt-get`, and the self-hosted runner user has no
      # passwordless sudo, so the job used to die here in ~20s ("sudo: a password is required") before a
      # single spec ran. The browser download itself needs no root.
      - name: Install the Chromium build this Playwright version pins
        run: bunx playwright install chromium
      # The system libraries Chromium links against are a one-time runner setup. Install them here only
      # when passwordless sudo exists; otherwise say so and rely on what the runner already has (a launch
      # failure in the specs then names the missing library, instead of the install step hiding it).
      - name: Install Chromium system libraries when sudo allows
        run: |
          if sudo -n true 2>/dev/null; then
            bunx playwright install-deps chromium
          else
            echo "no passwordless sudo: relying on the runner's preinstalled Chromium libraries"
          fi
      - name: Migrate
        run: bun run db:migrate
      # A REAL provisioned role (carrier + BYPASSRLS), not a superuser alias — same as `outbox-boot`.
      # Booting against a superuser would prove nothing about the grants production actually has, and
      # the key-ring read is exactly a grant question.
      - name: Provision the platform login role
        run: bun run db:provision-roles
      # Backgrounded because the suite needs the stack UP for its whole run — unlike `check:boot:platform`,
      # which boots, asserts and kills. The log is captured to a file so a failure shows the backend's own
      # output (see the artifact step) instead of an unexplained browser timeout.
      - name: Boot the backend and wait for /health
        run: |
          mkdir -p "$RUNNER_TEMP/e2e-logs"
          (cd apps/backend && nohup bun src/index.ts > "$RUNNER_TEMP/e2e-logs/backend.log" 2>&1 &)
          for i in $(seq 1 120); do
            if curl -sf http://localhost:3000/health > /dev/null; then
              echo "backend healthy after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "backend did not answer /health within 120s" >&2
          cat "$RUNNER_TEMP/e2e-logs/backend.log" >&2; exit 1
      # The same fourteen steps `bun run db:reset` runs, through the same script, against this database.
      # Most of them drive the real REST API as signed-in demo personas rather than writing rows directly, so
      # this exercises RLS, ABAC and the state machines on the way to the fixtures the specs need.
      - name: Seed the demo tenant (the `db:reset` chain)
        run: bun run db:seed:all
      # The seeded demo org is created by SQL, not through M34 provisioning, so its `tenant-<orgId>` bucket
      # does not exist and document uploads 404 (NoSuchBucket) at the presigned PUT. The operator reconcile
      # creates the bucket for every tenant missing one.
      - name: Create the demo tenant's storage bucket
        run: bun run storage:reconcile-tenants
      - name: Start the web app and wait for it to serve
        run: |
          (cd apps/web && nohup bun run dev > "$RUNNER_TEMP/e2e-logs/web.log" 2>&1 &)
          for i in $(seq 1 90); do
            if curl -sf http://localhost:5173 > /dev/null; then
              echo "web up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "the web dev server did not serve within 90s" >&2
          cat "$RUNNER_TEMP/e2e-logs/web.log" >&2; exit 1
      # `forbidOnly` is already on under CI (playwright.config.ts), so a stray `.only` fails the job
      # rather than silently shrinking the suite to one test — the browser-side version of the
      # self-skip this workflow's live jobs guard against.
      - name: 20 browser specs — 13 critical-workflow + 7 axe-core WCAG 2A/AA scans (real stack)
        run: bun run test:e2e
      - name: Upload the Playwright report, traces and stack logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failure-artifacts
          path: |
            e2e/playwright-report/
            e2e/test-results/
            ${{ runner.temp }}/e2e-logs/
          retention-days: 7
      
      - name: Cleanup E2E containers
        if: always()
        run: |
          docker rm -f chartwarden-ci-pg-e2e 2>/dev/null || true
          docker rm -f chartwarden-ci-minio-e2e 2>/dev/null || true
