name: Publish Postgres image

# Builds deploy/production/postgres (Wolfi + PG18 + pgvector), fails on any HIGH/CRITICAL, pushes it to GHCR, signs it
# keyless and attests its SBOM, the same chain deploy.yml runs for the app images. Manual only: production pins the
# digest this prints in deploy/production/compose.yml (and backup/Dockerfile, once it is ported to Wolfi) by hand, because a new digest can mean a new
# glibc, and that is a planned REINDEX (cw-refresh-collation; deploy/production/README.md), never an automatic roll.
on:
  workflow_dispatch: {}

concurrency:
  group: postgres-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/engrace-hospice/chartwarden-postgres

jobs:
  publish:
    name: Build, scan, sign and publish
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: [self-hosted, Linux, X64, hostinger]
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless (F-040/#100)
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: deploy/production/postgres
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:18-sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Scan (HIGH/CRITICAL fail the publish)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          trivyignores: .trivyignore.yaml
      - uses: sigstore/cosign-installer@v3
      - uses: anchore/sbom-action/download-syft@v0
      - name: Sign, attest SBOM, verify
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          COSIGN_YES: "true"
        run: |
          test -n "$DIGEST" || { echo "build reported no digest" >&2; exit 1; }
          ref="${IMAGE}@${DIGEST}"
          syft "$ref" -o spdx-json=sbom-postgres.spdx.json
          packages=$(python3 -c "import json,sys; print(len(json.load(open(sys.argv[1])).get('packages',[])))" sbom-postgres.spdx.json)
          test "$packages" -gt 0 || { echo "SBOM describes no packages" >&2; exit 1; }
          cosign sign "$ref"
          cosign attest --predicate sbom-postgres.spdx.json --type spdxjson "$ref"
          id="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/postgres-image.yml@${GITHUB_REF}"
          cosign verify "$ref" --certificate-identity "$id" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null
          cosign verify-attestation "$ref" --type spdxjson --certificate-identity "$id" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null
          {
            echo "### Published"
            echo '```'
            echo "${IMAGE}:18-sha-${GITHUB_SHA}@${DIGEST}"
            echo '```'
            echo "Pin it in deploy/production/compose.yml (and backup/Dockerfile once ported to Wolfi); read the README's Postgres image section first."
          } >> "$GITHUB_STEP_SUMMARY"
