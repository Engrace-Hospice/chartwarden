name: Reseed production demo

# MANUAL ONLY. Never add a push/schedule trigger here: `mode: reseed` deletes the `chartwarden-demo`
# organization (and the legacy `wardenx-demo` one if still present) on the production VPS and every identity whose only membership is that tenant, then
# rebuilds the Engrace Hospice synthetic dataset (deploy/production/reseed-demo.sh). The deploy
# workflow does not seed; this is the only path that does.
#
#   mode: inventory   read-only listing of organizations/users — run this first
#   mode: reseed      pg_dump backup on the VPS, then the full seed; needs `confirm` below
#
# Generated passwords stay on the VPS (/opt/wardenx/CREDENTIALS.production.md, mode 600) — they are
# never printed to the run log. Fetch the file over SSH.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "inventory = read-only; reseed = destructive (backup first)"
        type: choice
        options: [inventory, reseed]
        default: inventory
      confirm:
        description: "For mode=reseed only: type exactly `reseed-engrace-demo`"
        type: string
        required: false
        default: ""

concurrency:
  group: production-reseed
  cancel-in-progress: false

jobs:
  reseed:
    name: ${{ inputs.mode }} on the production VPS
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, hostinger]
    environment: production
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Require the confirmation phrase for a reseed
        if: inputs.mode == 'reseed' && inputs.confirm != 'reseed-engrace-demo'
        run: |
          echo "mode=reseed needs confirm=reseed-engrace-demo" >&2
          exit 1
      - uses: actions/checkout@v7
      - name: Configure SSH host verification
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Upload and run reseed-demo.sh
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          RESEED_MODE: ${{ inputs.mode }}
        run: |
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER"
          port="${DEPLOY_PORT:-22}"
          # compose.yml carries the `seed` profile services the script starts; upload it first.
          scp -P "$port" \
            deploy/production/reseed-demo.sh \
            deploy/production/compose.yml \
            "$DEPLOY_USER@$DEPLOY_HOST:/opt/wardenx/"
          ssh -p "$port" "$DEPLOY_USER@$DEPLOY_HOST" \
            "chmod 700 /opt/wardenx/reseed-demo.sh && /opt/wardenx/reseed-demo.sh '$RESEED_MODE'"
