server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # §9.6 security headers (CSP, frame-ancestors, HSTS, nosniff, Referrer-Policy). Re-included in every
    # location that declares its own add_header, because nginx does not inherit across levels then.
    include /etc/nginx/snippets/security-headers.conf;

    # React Router is client-side: unresolved paths must fall back to the SPA entrypoint.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    # ADR-0049 Phase 5: the portal SPA lives under /portal/ with its OWN index fallback, so a deep-link reload
    # (/portal/p/<id>/care-plan) or the magic-link return (/portal/signed-in) never gets the staff document.
    # A missing hashed asset below /portal/assets/ is a real 404 (the extension location further down), not HTML.
    location = /portal {
        absolute_redirect off;
        return 308 /portal/;
    }

    location /portal/ {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /portal/index.html;
    }

    location = /portal/index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 1y;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
