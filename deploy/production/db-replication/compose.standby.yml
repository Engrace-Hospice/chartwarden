# The database STANDBY host (CW-CP-01; DR/BCP 5.1, 6.1): a hot standby of the primary, on a machine separate from it, fed
# over TLS by the primary's replication slot and configured to catch up from the off-site WAL archive. It holds a FULL COPY
# OF THE PHI DATABASE plus the off-site cipher passphrase and the read-only off-site key: before it is brought up, the host's
# provider must have a signed BAA and the data volume must be encrypted at rest (README, "Database standby", step 5). Its own compose project,
# like deploy/production/replica/ is for the object-store second copy. Not deployed by deploy.yml: an operator brings it
# up once (deploy/production/README.md, "Database standby"), after the primary side (compose.replication.yml) is
# running and `provision-primary.sh` has run:
#
#   mkdir -p /opt/chartwarden-standby/secrets && cp standby-bootstrap.sh /opt/chartwarden-standby/
#   cp compose.standby.yml /opt/chartwarden-standby/compose.yml   # renamed: a bare `docker compose` only finds compose.yml
#   # secrets/ (0400, owner uid 999): replication_ca, replication_client_cert, replication_client_key (make-certs.sh),
#   #   backup_pg_offsite_cipher_pass, backup_offsite_restore_secret_key (the READ-ONLY restore key's secret)
#   # .env (0600): CHARTWARDEN_BACKUP_IMAGE, STANDBY_PRIMARY_HOST, BACKUP_OFFSITE_S3_ENDPOINT / _BUCKET / _REGION,
#   #   BACKUP_OFFSITE_RESTORE_ACCESS_KEY (the restore key's id), optionally STANDBY_PRIMARY_PORT, CHARTWARDEN_DB_NAME
#   docker compose up -d
#
# The standby has no listening port (nobody should read a copy of the PHI database): look at it with
# `docker compose exec standby psql -U postgres`. It NEVER archives WAL (archive_mode=off): after a promotion it would
# write a new timeline into the production stanza. Promotion is DR/BCP 6.1, a decision, not an automatic failover.
#
# A hot standby refuses to start recovery when max_locks_per_transaction, max_wal_senders (and max_connections,
# max_worker_processes, max_prepared_transactions) are lower than the primary's: the two numbers below equal the primary's in
# compose.replication.yml (scripts/__tests__/replication-compose.test.ts keeps them equal).
name: ${STANDBY_COMPOSE_PROJECT:-chartwarden-standby}

x-standby-env: &standby-env
  CHARTWARDEN_DB_NAME: ${CHARTWARDEN_DB_NAME:-chartwarden}
  BACKUP_PG_LOCAL_REPO: none
  BACKUP_OFFSITE_S3_ENDPOINT: ${BACKUP_OFFSITE_S3_ENDPOINT:?set in .env (https://...)}
  BACKUP_OFFSITE_S3_BUCKET: ${BACKUP_OFFSITE_S3_BUCKET:?set in .env}
  BACKUP_OFFSITE_S3_REGION: ${BACKUP_OFFSITE_S3_REGION:?set in .env}
  BACKUP_OFFSITE_S3_URI_STYLE: ${BACKUP_OFFSITE_S3_URI_STYLE:-path}
  BACKUP_OFFSITE_S3_ACCESS_KEY: ${BACKUP_OFFSITE_RESTORE_ACCESS_KEY:?set in .env (the READ-ONLY restore key id)}
  BACKUP_OFFSITE_S3_SECRET_KEY_FILE: /run/secrets/backup_offsite_restore_secret_key
  BACKUP_PG_OFFSITE_CIPHER_PASS_FILE: /run/secrets/backup_pg_offsite_cipher_pass
  REPLICATION_ROLE: cw_replicator
  REPLICATION_SLOT: cw_standby

x-standby-secrets: &standby-secrets
  - replication_ca
  - replication_client_cert
  - replication_client_key
  - backup_pg_offsite_cipher_pass
  - backup_offsite_restore_secret_key

services:
  # One shot: restores the latest base backup as a standby unless the data directory already holds a cluster.
  standby-bootstrap:
    image: "${CHARTWARDEN_BACKUP_IMAGE:?set-digest-pinned-GHCR-reference}"
    mem_limit: 1g
    cpus: 2
    restart: "no"
    user: postgres
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp
      - /etc/pgbackrest:uid=999,gid=999,mode=0700
      - /var/spool/pgbackrest:uid=999,gid=999,mode=0700
      - /var/run/postgresql:uid=999,gid=999,mode=0700 # pgBackRest's lock path (render-conf)
    command: ["bash", "/usr/local/share/cw-replication/standby-bootstrap.sh"]
    environment:
      <<: *standby-env
      STANDBY_PRIMARY_HOST: ${STANDBY_PRIMARY_HOST:?set in .env (the name or address in the primary server certificate)}
      STANDBY_PRIMARY_PORT: ${STANDBY_PRIMARY_PORT:-5432}
    secrets: *standby-secrets
    volumes:
      - standby-data:/var/lib/postgresql
      - ./standby-bootstrap.sh:/usr/local/share/cw-replication/standby-bootstrap.sh:ro

  standby:
    image: "${CHARTWARDEN_BACKUP_IMAGE:?set-digest-pinned-GHCR-reference}"
    # As much as the primary has (postgres in compose.yml): this is the machine that takes over.
    mem_limit: 4g
    cpus: 4
    mem_reservation: 2g
    # An init process as PID 1: pgBackRest's async archive-get worker is orphaned onto it (see compose.backup.yml).
    init: true
    restart: unless-stopped
    environment: *standby-env
    secrets: *standby-secrets
    volumes:
      - standby-data:/var/lib/postgresql
    command:
      - postgres
      - -c
      - max_locks_per_transaction=4096
      - -c
      - max_wal_senders=4
      - -c
      - hot_standby=on
      - -c
      - archive_mode=off
      # The standby is a readable full copy of the PHI database and nothing else records who looks at it: log every
      # connection and disconnection (there are no application clients here, only an operator's `psql`).
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
    healthcheck:
      # Recovery mode AND a connected WAL receiver: a standby that fell back to the archive alone is not streaming.
      test:
        - CMD-SHELL
        - >-
          [ "$$(psql -X -At -h /var/run/postgresql -U postgres -d postgres -c
          "SELECT pg_is_in_recovery() AND EXISTS (SELECT 1 FROM pg_stat_wal_receiver WHERE status = 'streaming')")" = t ]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 10m
    depends_on:
      standby-bootstrap:
        condition: service_completed_successfully

secrets:
  replication_ca:
    file: ./secrets/replication_ca
  replication_client_cert:
    file: ./secrets/replication_client_cert
  replication_client_key:
    file: ./secrets/replication_client_key
  backup_pg_offsite_cipher_pass:
    file: ./secrets/backup_pg_offsite_cipher_pass
  backup_offsite_restore_secret_key:
    file: ./secrets/backup_offsite_restore_secret_key

volumes:
  standby-data:
