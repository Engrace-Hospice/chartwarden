server {
    listen 80;
    listen [::]:80;
    server_name storage.wardenx.chartwarden.cloud;

    # Object keys and presigned-URL signatures live in the query string and path: no access log at all.
    access_log off;

    # Documents are uploaded directly with S3 presigned URLs. Do not buffer their bodies to disk
    # in Nginx, and preserve the public Host header because it participates in the SigV4 signature.
    client_max_body_size 100m;
    proxy_request_buffering off;
    proxy_buffering off;

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
