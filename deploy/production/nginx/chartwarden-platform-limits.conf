# http-context limit zones for the Platform Ops vhost's signed-BAA upload (chartwarden-platform.conf). Installed to
# /etc/nginx/conf.d/chartwarden-platform-limits.conf by bootstrap-vps.sh: conf.d is included in the http block (before sites-enabled),
# like chartwarden-log-format.conf. A zone must exist before a vhost names it, so on a live host install THIS file first
# (see deploy/production/README.md), or `nginx -t` fails on the vhost.
#
# Why: the upload is a ~14 MB base64 JSON body that nginx buffers BEFORE the API runs its guards and its own limiter, and the global
# unauthenticated limiter counts requests, not bytes. These bound how many of those bodies one address can have in flight or start.
# They do not bound the total time of a slow sender (client_body_timeout is per read), nor restrict who may reach the host: that is
# an operator decision (an IP allowlist or mTLS on this hostname), not made here.
#
# The key is the connecting address. If a TLS terminator or proxy fronts this host, every client shares ITS address until the real
# client address is restored (ngx_http_realip_module: set_real_ip_from + real_ip_header); do that first or one bucket serves everyone.
limit_req_zone $binary_remote_addr zone=chartwarden_platform_baa_req:1m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=chartwarden_platform_baa_conn:1m;
