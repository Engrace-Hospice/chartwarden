# LEGACY-HOST REDIRECTS (infra rename wardenx -> chartwarden). NOT installed by bootstrap-vps.sh and NOT part of a
# stock install: the operator swaps the three old vhosts for this file at the redirect step of the cutover
# (INFRA_RENAME_RUNBOOK.md, "Phase 5"), after the new hosts serve traffic and the env points at them.
#
# 308 (not 301) so a redirected POST/PUT (API clients, FHIR/HL7 partners) keeps its method and body. Presigned storage
# URLs minted for the old host cannot follow a redirect (the host is part of the SigV4 signature); they expire on their
# own within minutes. The TLS certificate is the ORIGINAL one (SANs for the three legacy names); keep it until the
# redirects are retired (renewal is certbot's `wardenx.chartwarden.cloud` lineage; do not delete it earlier).

server {
    listen 80;
    listen [::]:80;
    server_name wardenx.chartwarden.cloud;
    return 308 https://app.chartwarden.cloud$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name wardenx.chartwarden.cloud;
    ssl_certificate /etc/letsencrypt/live/wardenx.chartwarden.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wardenx.chartwarden.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 308 https://app.chartwarden.cloud$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name be082026.wardenx.chartwarden.cloud;
    return 308 https://api.chartwarden.cloud$request_uri;
