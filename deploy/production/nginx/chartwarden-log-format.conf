# http-context file (installed to /etc/nginx/conf.d/ by bootstrap-vps.sh — conf.d is included before
# sites-enabled, so the format exists when the vhosts name it).
#
# PHI-safe access log. The stock `combined` format logs "$request" = method + FULL request URI, which
# carries patient search terms (?q=Smith), cursors, ids in query strings and S3 presigned signatures
# (X-Amz-Signature / X-Amz-Credential). This format logs `$uri` (the normalised path, no query string)
# and omits the Referer (a browser sends the previous page's full URL, query string included).
#
# NB: `error_log` can still echo the request line on upstream errors ("request: GET /x?q=..."); keep it
# at `warn` or above and treat it as PHI-bearing (see README, "Nginx logging").
log_format chartwarden_phi_safe '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                            '$status $body_bytes_sent "$http_user_agent" rt=$request_time';
