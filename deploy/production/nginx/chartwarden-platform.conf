# Platform Ops console — dedicated hostname, same web and API containers as the staff app.
# TLS is added by Certbot or the host's TLS terminator after DNS points here.
server {
    listen 80;
    listen [::]:80;
    server_name platform112026.chartwarden.cloud;

    access_log /var/log/nginx/chartwarden-platform.access.log chartwarden_phi_safe;

    # The signed-BAA upload carries the file base64-encoded in JSON: a 10 MiB agreement is ~14 MB on the wire, over nginx's default
    # 1 MiB body cap. Only this route gets the larger cap (the API's own bodyLimit, BAA_UPLOAD_BODY_LIMIT_BYTES, still bounds it).
    # Regex locations match in file order, so it must stay above the general /api/ block.
    location ~ ^/api/v1/platform/tenants/[^/]+/baa-document$ {
        client_max_body_size 16m;
        # A ~14 MB body on a slow uplink: allow 30s between body reads and 90s for the API to scan and store it.
        # The API's m34-baa-upload limiter runs only after nginx has buffered the body, so it does not bound pre-auth buffering. These
        # do, per client address (the zones are in chartwarden-platform-limits.conf, http context): at most 6 uploads a minute with a
        # burst of 3, and 2 connections at once, refused with 429. client_body_timeout limits only the gap between two reads, so a
        # slow sender that keeps trickling bytes is still not bounded in total time, only in how many it may hold open.
        limit_req zone=chartwarden_platform_baa_req burst=3 nodelay;
        limit_conn chartwarden_platform_baa_conn 2;
        limit_req_status 429;
        limit_conn_status 429;
        client_body_timeout 30s;
        proxy_read_timeout 90s;
        include /etc/nginx/snippets/chartwarden-platform-proxy.conf;
    }

    location ~ ^/(api/|webhooks/) {
        include /etc/nginx/snippets/chartwarden-platform-proxy.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
