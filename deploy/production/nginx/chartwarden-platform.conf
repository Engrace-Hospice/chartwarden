# Platform Ops console — dedicated hostname, same web and API containers as the staff app.
# TLS is added by Certbot or the host's TLS terminator after DNS points here.
server {
    listen 80;
    listen [::]:80;
    server_name platform112026.chartwarden.cloud;

    access_log /var/log/nginx/chartwarden-platform.access.log chartwarden_phi_safe;

    # The signed-BAA upload carries the file base64-encoded in JSON: a 10 MiB agreement is ~14 MB on the wire, over nginx's default
    # 1 MiB body cap. Only this route gets the larger cap (the API's own bodyLimit, BAA_UPLOAD_BODY_LIMIT_BYTES, still bounds it).
    # Regex locations match in file order, so it must stay above the general /api/ block.
    location ~ ^/api/v1/platform/tenants/[^/]+/baa-document$ {
        client_max_body_size 16m;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header X-CW-Actor-Assertion "";
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(api/|webhooks/) {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header X-CW-Actor-Assertion "";
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
