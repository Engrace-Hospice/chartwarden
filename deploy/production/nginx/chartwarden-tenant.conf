# ADR-0049 — the real (tenant-data) environment: one vhost answers the apex, app.<base> and EVERY <slug>.<base>.
# `chartwarden.com` below is the TENANT_BASE_DOMAIN; bootstrap-vps.sh rewrites it when TENANT_BASE_DOMAIN is set.
# Which hosts are real tenants is decided by the API (404 unknown / 410 closed / 403 suspended), so there is no
# per-tenant nginx config. TLS (wildcard certificate, DNS-01) is terminated in front of this vhost (Pangolin) or
# added with certbot; see TENANT_EDGE.md.
#
# The Host header is passed through unchanged: the API reads the tenant from it. X-Forwarded-Host is REPLACED with
# $host (never forwarded from the client) because the API trusts it from this peer (TRUSTED_PROXY_CIDRS).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name chartwarden.com *.chartwarden.com;

    access_log /var/log/nginx/chartwarden-tenant.access.log chartwarden_phi_safe;

    location = /metrics { return 404; }

    location ~ ^/(api/|webhooks/|socket\.io/|fhir/|ready$) {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Realtime (Socket.IO) upgrades.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # Staff SPA at / and the portal SPA at /portal/ (both are in the web image; web-nginx.conf routes between them).
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
