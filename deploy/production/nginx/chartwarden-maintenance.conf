# Host-level maintenance switch (#865). Installed to /etc/nginx/snippets/chartwarden-maintenance.conf by bootstrap-vps.sh
# and included at the TOP of each app server block (frontend, backend, tenant). While the flag file exists every
# request gets a static 503 with Retry-After, except the health probes below; removing the flag restores service on the
# next request (no nginx reload: `-f` is evaluated per request). Toggle with deploy/production/maintenance.sh.
#
# `if` is only used with `set` and `return`, the two uses nginx documents as safe. The two-step flag/exempt dance is the
# supported way to express "flag AND NOT health path" because `if` cannot be combined or nested.
set $cw_maintenance "";
if (-f /etc/nginx/chartwarden-maintenance.on) { set $cw_maintenance 1; }
# Health probes stay reachable so monitoring and deploy tiers keep an honest view of the stack behind the page.
if ($uri ~ "^/(ready|api/health)$") { set $cw_maintenance ""; }
if ($cw_maintenance) { return 503; }

error_page 503 @cw_maintenance;
location @cw_maintenance {
    root /var/www/chartwarden-maintenance;
    rewrite ^ /maintenance.html break;
    add_header Retry-After "600" always;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}
