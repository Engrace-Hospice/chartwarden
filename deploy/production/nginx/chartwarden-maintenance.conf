# Host-level maintenance switch (#865). Installed to /etc/nginx/snippets/chartwarden-maintenance.conf by bootstrap-vps.sh
# and included at the TOP of each app server block (frontend, backend, tenant). While the flag file exists every
# request gets a 503 with Retry-After and a static page, whatever its method, except the two api probes below.
# Removing the flag restores service on the next request (no nginx reload: `-f` is evaluated per request).
# Toggle with deploy/production/maintenance.sh.
#
# Scope: this gates the plain-HTTP (port 80) vhosts. A TLS terminator or certbot's HTTP->HTTPS redirect, if one sits
# in front, is not gated: a client is redirected first and then receives this 503 on the HTTPS side. Webhook senders
# (Twilio, Postmark, ...) get the 503 and must retry; they are not queued.
#
# Probes: the api answers `/ready` and `/health` at its root. They stay proxied only where the vhost proxies them to the
# api: the backend vhost (`location /`) and, for `/ready` only, the tenant vhost. On the frontend vhost `/ready` and
# `/health` fall through to the web container, not the api. `\z` (not `$`) anchors the match, so `/ready%0a` (a decoded
# trailing newline, which PCRE `$` would accept) is NOT exempt.
#
# `if` is only used with `set` and `return`, the two uses nginx documents as safe. The two-step flag/exempt dance is the
# supported way to express "flag AND NOT probe" because `if` cannot be combined or nested.
set $cw_maintenance "";
if (-f /etc/nginx/chartwarden-maintenance.on) { set $cw_maintenance 1; }
if ($uri ~ "^/(ready|health)\z") { set $cw_maintenance ""; }
if ($cw_maintenance) { return 503; }

# The page is inline, not a static file: the static handler answers 405 to any method but GET/HEAD, and a PUT, PATCH,
# DELETE, OPTIONS or POST must get the same 503 + Retry-After. No scripts, no external assets, no PHI.
error_page 503 @cw_maintenance;
location @cw_maintenance {
    default_type text/html;
    add_header Retry-After "600" always;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    return 503 '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>ChartWarden is briefly unavailable</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;font:16px/1.5 system-ui,sans-serif;background:#f6f8fb;color:#16202e}main{max-width:34rem;margin:1rem;padding:2rem;background:#fff;border:1px solid #d5dce6;border-radius:8px}h1{margin:0 0 .5rem;font-size:1.4rem}p{margin:.5rem 0}</style></head><body><main><h1>ChartWarden is briefly unavailable</h1><p>We are performing maintenance. Nothing you have already saved has been lost.</p><p>Please try again in a few minutes. If you need urgent access to a patient record, follow your organization downtime procedure.</p></main></body></html>';
}
