# TLS policy for every `listen ... ssl` server on the host nginx (CW-TX-01; SECURITY_HARDENING §4.3 "Internet -> Edge" row and
# its "Cipher suite restrictions (TLS 1.2 fallback)" list). Include it in the server block, in place of certbot's
# /etc/letsencrypt/options-ssl-nginx.conf (nginx refuses a second ssl_protocols / ssl_ciphers in one block):
#     include /etc/nginx/snippets/chartwarden-tls.conf;
# bootstrap-vps.sh installs it to /etc/nginx/snippets/. `bun run arch:tls-policy` keeps this file equal to the documented
# policy and fails a committed TLS server that does not include it; `bun run test:tls-edge:live` handshakes against a real
# nginx running exactly these lines.
#
# - TLS 1.3 is offered; TLS 1.2 stays as the documented fallback and is limited to the four ECDHE + AEAD suites below.
#   TLS 1.1 and earlier are refused. (`ssl_ciphers` does not govern TLS 1.3, whose three suites are all AEAD.)
# - ssl_session_tickets off, ssl_session_cache and ssl_session_timeout are carried over from the certbot options file this
#   replaces (tickets protected by a long-lived key would undo forward secrecy; the server-side cache keeps resumption).
# - A change here is a change to the documented policy: update SECURITY_HARDENING §4.3 in the same commit, or the gate fails.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_session_tickets off;
ssl_session_cache shared:cw_tls:10m;
ssl_session_timeout 1d;
