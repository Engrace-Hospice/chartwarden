# Shared proxy directives for the Platform Ops vhost's API locations (chartwarden-platform.conf). Installed to
# /etc/nginx/snippets/chartwarden-platform-proxy.conf by bootstrap-vps.sh; both the signed-BAA upload location and the
# general /api/ location include it, so a header change is made once. The empty X-CW-Actor-Assertion strips any
# client-supplied value before the request reaches the API.
proxy_pass http://127.0.0.1:3000;
proxy_set_header X-CW-Actor-Assertion "";
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
