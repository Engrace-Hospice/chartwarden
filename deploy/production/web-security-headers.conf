# SPA security headers (SECURITY_HARDENING §9.6 / GAP-185). Included by web-nginx.conf in the server
# block AND in every location that sets its own add_header: nginx does NOT inherit add_header from an
# outer level once a location declares any, so a header listed only at server level silently vanishes
# on exactly the responses (index.html, hashed assets) that matter. `scripts/__tests__/web-nginx-headers.test.ts`
# enforces that rule.
#
# CSP notes (specifics of THIS deployment, not the §9.6.1 illustration):
#   - The SPA and the API share an origin: host Nginx proxies /api/ and /webhooks/ to the API, so
#     `connect-src 'self'` covers every fetch; `wss:` is explicit for the realtime channel.
#   - `style-src 'unsafe-inline'`: React/Radix set inline style attributes. Scripts stay `'self'` only
#     (no inline script, no eval); `'wasm-unsafe-eval'` is for the PDF/ONNX WASM modules.
#   - `img-src`/`frame-src` allow `blob:`/`https:` for presigned object-storage previews (document
#     viewer iframe, patient/staff photos); `object-src 'none'` forbids plugin content.
#   - HSTS omits `preload` (§9.6.2 lists it): preload submission is a one-way, domain-wide commitment that
#     belongs to a deliberate domain decision, not to a template; max-age/includeSubDomains match §9.6.2.
#   - `frame-ancestors 'none'` + X-Frame-Options DENY: the SPA must never be framed (clickjacking).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' wss:; frame-src 'self' blob: https:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
