# Production topology for a single VPS.  It intentionally binds every application service to
# loopback only: host Nginx is the sole public ingress and owns TLS.
#
# First deploy: `docker compose --env-file .env.production run --rm migrate`, then `provision`,
# then `docker compose --env-file .env.production up -d`.
# Subsequent deploys use the strict schema-only migration command (see deploy.sh, to be added with
# the CI/CD wiring) before recreating api/worker/web.
#
# INFRA RENAME (wardenx -> chartwarden), see INFRA_RENAME_RUNBOOK.md. The project name drives the container
# (`<project>-<service>-1`) and network (`<project>_default`, `<project>_scan`) names and defaults to `chartwarden`.
# The live host was cut over first (Step C) and keeps CHARTWARDEN_VOLUME_PREFIX=wardenx in .env.production until the
# volume copy (Runbook, Window 2), so its data volumes (named at the bottom) keep their old names until then. preflight.sh refuses to deploy to a host whose configured
# volumes/database are missing while old-named ones exist, so a stale host fails safe instead of starting empty state.
name: ${CHARTWARDEN_COMPOSE_PROJECT:-chartwarden}

# #855/#856 policy (enforced by `bun run arch:compose-policy`): every literal third-party image is pinned
# `repo:tag@sha256:<digest>` (the GHCR app images are digest-pinned by deploy.sh via env), and every service
# sets `mem_limit` and `cpus` (plain `docker compose up` honours both; reservations are `mem_reservation`).
# The numbers are single-host defaults (16 GiB / 8 vCPU), not load-tested: see README "Resource budget".

services:
  postgres:
    image: pgvector/pgvector:pg18@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
    mem_limit: 4g
    cpus: 4
    mem_reservation: 2g
    cpu_shares: 2048
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env.production}
      POSTGRES_DB: ${CHARTWARDEN_DB_NAME:-chartwarden}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${CHARTWARDEN_DB_NAME:-chartwarden}"]
      interval: 10s
      timeout: 5s
      retries: 12
    # The migration chain has many partitioned tables and needs more than PostgreSQL's default
    # max_locks_per_transaction (the same setting is proven in CI).
    command: ["postgres", "-c", "max_locks_per_transaction=4096"]

  valkey:
    image: valkey/valkey:8-alpine@sha256:2602ace2be6569bc2bbb06f873776516ab9089821525be34f4305c67eb9db02a
    mem_limit: 1g
    cpus: 1
    mem_reservation: 128m
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  minio:
    image: cgr.dev/chainguard/minio:latest@sha256:e70b2b1e74d79457f808710483bd726ff364529ca30736eaa15a6ab547d3a5a7
    mem_limit: 1g
    cpus: 2
    mem_reservation: 256m
    restart: unless-stopped
    command: server /data --console-address ":9001"
    # #855: MinIO no longer publishes minio/minio to Docker Hub, so this is Chainguard's build (nonroot uid 65532 by
    # default). The existing minio-data volume was written by the old image as root, so keep root to avoid a chown
    # migration on the live host; move to 65532 only together with a chown of the volume (see README, image updates).
    user: "0:0"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set in .env.production}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set in .env.production}
      # GAP-141 — download CONFIRMATION for signed URLs. MinIO's audit webhook posts one record per S3 API call to
      # the api over the compose network (cluster-wide: no per-bucket notification to configure for the dynamic
      # `tenant-*` buckets); the api keeps only successful GetObject calls on tenant buckets and records them as
      # `signed_url_consumed` in document_access_log. Delivery is best-effort (an audit gap is accepted for this
      # stream); the endpoint answers 503 until MINIO_ACCESS_LOG_WEBHOOK_TOKEN is set (deploy.sh generates it).
      MINIO_AUDIT_WEBHOOK_ENABLE_chartwarden: "on"
      MINIO_AUDIT_WEBHOOK_ENDPOINT_chartwarden: http://api:3000/api/v1/webhooks/minio/access-log
      MINIO_AUDIT_WEBHOOK_AUTH_TOKEN_chartwarden: ${MINIO_ACCESS_LOG_WEBHOOK_TOKEN:?set in .env.production}
    volumes:
      - minio-data:/data
    # Port 9000 is reachable only by host Nginx. Do not publish 9001: the admin console is not
    # part of the public application surface.
    ports:
      - "127.0.0.1:9000:9000"
    healthcheck:
      # The Chainguard image has bash but no curl/wget: probe /minio/health/ready over bash's /dev/tcp.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /minio/health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && read -r status <&3 && case \"$$status\" in *' 200 '*) exit 0;; esac; exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  # GAP-139 — the api and worker used to authenticate to the object store AS THE MINIO ROOT ACCOUNT, so a
  # compromised app process held full administrative control of every tenant bucket, the policy store and
  # the IAM store. This one-shot creates a scoped service account instead: object + bucket operations on
  # the per-tenant `tenant-*` buckets and the `chartwarden-*` platform/readiness buckets (the legacy `wardenx-*` prefix was dropped in bucket rename step 3), and NOTHING administrative. Never name a backup or audit bucket `chartwarden-*`: the app account can delete there. Do not recreate a `wardenx-*` bucket: the app account has no access to that prefix.
  # The action list is the audited set of S3 calls the object-store adapter makes (HEAD/PUT bucket, HEAD/PUT/GET
  # object, presigned GET, `?versions` list + versioned DELETE for the D12 shred, the readiness HEAD). The adapter
  # uses no multipart upload, lifecycle, retention, legal-hold or versioning-configuration call, so none is granted;
  # a new call needs its action added here deliberately. It is
  # idempotent (policy create overwrites, user add re-sets the secret) and reruns on every deploy, so
  # rotating MINIO_APP_SECRET_KEY in .env.production is one deploy.
  minio-provision:
    # Reuse the running server's image; the Chainguard build includes /usr/bin/mc and /bin/sh.
    image: cgr.dev/chainguard/minio:latest@sha256:e70b2b1e74d79457f808710483bd726ff364529ca30736eaa15a6ab547d3a5a7
    mem_limit: 128m
    cpus: 0.5
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_APP_ACCESS_KEY: ${MINIO_APP_ACCESS_KEY:?set in .env.production}
      MINIO_APP_SECRET_KEY: ${MINIO_APP_SECRET_KEY:?set in .env.production}
      # Name of the IAM policy. The old `wardenx-app` policy stays attached to its account until the late cleanup
      # step (Step F), so a rollback keeps working.
      CHARTWARDEN_MINIO_POLICY: ${CHARTWARDEN_MINIO_POLICY:-chartwarden-app}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null
        cat > /tmp/app-policy.json <<'POLICY'
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Action": ["s3:CreateBucket", "s3:ListBucket", "s3:GetBucketLocation", "s3:ListBucketVersions"],
              "Resource": ["arn:aws:s3:::tenant-*", "arn:aws:s3:::chartwarden-*"]
            },
            {
              "Effect": "Allow",
              "Action": ["s3:GetObject", "s3:PutObject", "s3:DeleteObject", "s3:GetObjectVersion", "s3:DeleteObjectVersion"],
              "Resource": ["arn:aws:s3:::tenant-*/*", "arn:aws:s3:::chartwarden-*/*"]
            }
          ]
        }
        POLICY
        mc admin policy create local "$${CHARTWARDEN_MINIO_POLICY}" /tmp/app-policy.json
        mc admin user add local "$$MINIO_APP_ACCESS_KEY" "$$MINIO_APP_SECRET_KEY"
        mc admin policy attach local "$${CHARTWARDEN_MINIO_POLICY}" --user "$$MINIO_APP_ACCESS_KEY"
    depends_on:
      minio:
        condition: service_healthy

  # GAP-138 — DocLens stage 2 (OCR + layout). Without this service DOCLING_WORKER_URL was unset in
  # production, the backend bound `createUnboundDoclingClient`, and every DocLens parse answered 503.
  # CPU-only, models baked into the image (no egress needed), reachable only on the compose network by
  # the api/worker with the DOCLING_WORKER_TOKEN bearer; it holds no object-store credentials (the
  # backend hands it a short-lived presigned URL) and publishes no host port. The image is built, signed
  # and passed to deploy.sh by deploy.yml. api/worker deliberately do NOT `depends_on` it: a down worker
  # degrades DocLens to a typed 503, it must never block the rest of the EHR from starting or rolling back.
  docling-worker:
    image: ${CHARTWARDEN_DOCLING_IMAGE:-ghcr.io/engrace-hospice/chartwarden-docling-worker:unset}
    pull_policy: always
    mem_limit: 2g
    cpus: 2
    mem_reservation: 512m
    restart: unless-stopped
    environment:
      DOCLING_WORKER_TOKEN: ${DOCLING_WORKER_TOKEN:?set in .env.production}
      LOG_LEVEL: info
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s

  migrate:
    image: ${CHARTWARDEN_IMAGE:?set immutable GHCR image in .env.production}
    pull_policy: always
    mem_limit: 1g
    cpus: 2
    env_file: .env.production
    command: ["bun", "run", "scripts/db/migrate.ts", "--strict"]
    environment:
      NODE_ENV: production
      DATABASE_ADMIN_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/${CHARTWARDEN_DB_NAME:-chartwarden}
      CHARTWARDEN_APP_PASSWORD: ${CHARTWARDEN_APP_PASSWORD:?set in .env.production}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  provision:
    image: ${CHARTWARDEN_IMAGE:?set immutable GHCR image in .env.production}
    pull_policy: always
    mem_limit: 256m
    cpus: 1
    env_file: .env.production
    command: ["bun", "run", "scripts/db/provision-runtime-roles.ts"]
    environment:
      PROVISION_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/${CHARTWARDEN_DB_NAME:-chartwarden}
      CHARTWARDEN_PLATFORM_PASSWORD: ${CHARTWARDEN_PLATFORM_PASSWORD:?set in .env.production}
      CHARTWARDEN_DESTRUCTION_PASSWORD: ${CHARTWARDEN_DESTRUCTION_PASSWORD:?set in .env.production}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  # M36 WP 1.5 — the attachment malware scanner (clamd over TCP INSTREAM). Compose-network only: NO published port.
  # deploy/clamav/clamd.conf (mounted read-only; deploy.sh ships it next to this file) alerts on encrypted/over-limit
  # content and sets StreamMaxLength >= the 25 MB upload cap. The signature DB persists in `clamav-data` and
  # freshclam refreshes it in-container (CLAMAV_NO_FRESHCLAMD unset). api/worker do NOT `depends_on` it: a down or
  # still-updating scanner leaves attachments `pending` (nothing is delivered), it must never block the EHR.
  # Alert on a stuck scanner: old `pending` rows / `deferred` scans (docs/architecture/CHARTWARDEN_OPS_RUNBOOK_v0.1.md).
  clamav:
    image: clamav/clamav-debian:1.4@sha256:03a2f641117f0a8c908bac65a63c5e1e4695badc52a340c9d30397d7cebb9154
    restart: unless-stopped
    # clamd loads the whole signature set (a reload briefly doubles it): bound it so a scan flood or a bad update
    # cannot starve postgres/minio/api on the same host.
    mem_limit: 4g
    mem_reservation: 1g
    cpus: 2
    networks: [scan]
    volumes:
      - clamav-data:/var/lib/clamav
      - ./clamav/clamd.conf:/etc/clamav/clamd.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 300s

  # M36 WP 1.5 — idempotent one-shot: create `tenant-<orgId>` for every org that lacks the bucket (orgs onboarded
  # before bucket provisioning). Safe to re-run; deploy.sh runs it after `provision` and treats a failure as a warning,
  # because the attachment upload path also creates a missing bucket on demand.
  tenant-buckets:
    image: ${CHARTWARDEN_IMAGE:?set immutable GHCR image in .env.production}
    pull_policy: always
    mem_limit: 256m
    cpus: 1
    env_file: .env.production
    command: ["bun", "run", "scripts/backfill-tenant-buckets.ts"]
    environment:
      DATABASE_ADMIN_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/${CHARTWARDEN_DB_NAME:-chartwarden}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_APP_ACCESS_KEY:?set in .env.production}
      MINIO_SECRET_KEY: ${MINIO_APP_SECRET_KEY:?set in .env.production}
      MINIO_REGION: us-east-1
    restart: "no"

  api:
    image: ${CHARTWARDEN_IMAGE:?set immutable GHCR image in .env.production}
    pull_policy: always
    mem_limit: 1536m
    cpus: 2
    mem_reservation: 512m
    restart: unless-stopped
    env_file: .env.production
    command: ["bun", "run", "apps/backend/src/index.ts"]
    environment:
      PROCESS_ROLE: api
      PORT: "3000"
      DATABASE_URL: postgresql://chartwarden_app:${CHARTWARDEN_APP_PASSWORD}@postgres:5432/${CHARTWARDEN_DB_NAME:-chartwarden}
      DATABASE_PLATFORM_URL: postgresql://chartwarden_platform_login:${CHARTWARDEN_PLATFORM_PASSWORD}@postgres:5432/${CHARTWARDEN_DB_NAME:-chartwarden}
      DATABASE_DESTRUCTION_URL: postgresql://chartwarden_destruction_login:${CHARTWARDEN_DESTRUCTION_PASSWORD}@postgres:5432/${CHARTWARDEN_DB_NAME:-chartwarden}
      # GAP-141 — the bearer MinIO's audit webhook presents to /api/v1/webhooks/minio/access-log.
      MINIO_ACCESS_LOG_WEBHOOK_TOKEN: ${MINIO_ACCESS_LOG_WEBHOOK_TOKEN:?set in .env.production}
      # M36 WP 1.5 — the ClamAV sidecar above. The builtin scanner is refused unless ALLOW_BUILTIN_ATTACHMENT_SCANNER=1.
      MESSAGING_ATTACHMENT_SCANNER: clamd
      CLAMD_HOST: clamav
      CLAMD_PORT: "3310"
      REDIS_URL: redis://valkey:6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ORIGIN:?set in .env.production}
      # GAP-139 — the scoped service account `minio-provision` creates, NOT the MinIO root account.
      MINIO_ACCESS_KEY: ${MINIO_APP_ACCESS_KEY:?set in .env.production}
      MINIO_SECRET_KEY: ${MINIO_APP_SECRET_KEY:?set in .env.production}
      MINIO_REGION: us-east-1
      # GAP-138 — DocLens parse worker (compose-network only).
      DOCLING_WORKER_URL: http://docling-worker:8000
      DOCLING_WORKER_TOKEN: ${DOCLING_WORKER_TOKEN:?set in .env.production}
    ports:
      - "127.0.0.1:3000:3000"
    # M36: clamd is reachable only over the dedicated `scan` network (joined by clamav, api and worker alone), so a
    # compromised sidecar (postgres, minio, docling, ...) cannot reach it and clamd cannot reach them.
    networks: [default, scan]
    depends_on:
      provision:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-provision:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "bun", "-e", "process.exit((await fetch('http://localhost:3000/ready')).ok ? 0 : 1)"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  worker:
    image: ${CHARTWARDEN_IMAGE:?set immutable GHCR image in .env.production}
    pull_policy: always
    mem_limit: 1536m
    cpus: 2
    mem_reservation: 512m
    restart: unless-stopped
    env_file: .env.production
    command: ["bun", "run", "apps/backend/src/worker.ts"]
    environment:
      WORKER_PORT: "3001"
      # GAP-043 / M29 §4.11.5 — the listener-health WATCHER (decides listener_down / listener_recovered from the listener's
      # heartbeat + a TCP probe + the newest frame, so a DEAD listener still pages). Read from the SAME variable as the
      # `hl7-listener` service, which stops paging when it is on: turn it on only where the listener runs. The probe host is
      # where the listener's feed ports are reachable from this container (the compose service name by default).
      M29_LISTENER_WATCH_ENABLED: ${M29_LISTENER_WATCH_ENABLED:-false}
      M29_LISTENER_PROBE_HOST: ${M29_LISTENER_PROBE_HOST:-hl7-listener}
      DATABASE_URL: postgresql://chartwarden_app:${CHARTWARDEN_APP_PASSWORD}@postgres:5432/${CHARTWARDEN_DB_NAME:-chartwarden}
      DATABASE_PLATFORM_URL: postgresql://chartwarden_platform_login:${CHARTWARDEN_PLATFORM_PASSWORD}@postgres:5432/${CHARTWARDEN_DB_NAME:-chartwarden}
      DATABASE_DESTRUCTION_URL: postgresql://chartwarden_destruction_login:${CHARTWARDEN_DESTRUCTION_PASSWORD}@postgres:5432/${CHARTWARDEN_DB_NAME:-chartwarden}
      # M36 WP 1.5 — the ClamAV sidecar above. The builtin scanner is refused unless ALLOW_BUILTIN_ATTACHMENT_SCANNER=1.
      MESSAGING_ATTACHMENT_SCANNER: clamd
      CLAMD_HOST: clamav
      CLAMD_PORT: "3310"
      REDIS_URL: redis://valkey:6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ORIGIN:?set in .env.production}
      # GAP-139 — the scoped service account `minio-provision` creates, NOT the MinIO root account.
      MINIO_ACCESS_KEY: ${MINIO_APP_ACCESS_KEY:?set in .env.production}
      MINIO_SECRET_KEY: ${MINIO_APP_SECRET_KEY:?set in .env.production}
      MINIO_REGION: us-east-1
      # GAP-138 — DocLens parse worker (compose-network only).
      DOCLING_WORKER_URL: http://docling-worker:8000
      DOCLING_WORKER_TOKEN: ${DOCLING_WORKER_TOKEN:?set in .env.production}
    # M36: clamd is reachable only over the dedicated `scan` network (joined by clamav, api and worker alone), so a
    # compromised sidecar (postgres, minio, docling, ...) cannot reach it and clamd cannot reach them.
    networks: [default, scan]
    depends_on:
      provision:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-provision:
        condition: service_completed_successfully
    # F-038/#98 — the worker had no healthcheck, so `docker compose ps` reported it "running" the instant
    # the process started and a worker that booted then died left the deploy green while every background
    # job silently stopped. It publishes no port (it serves no public traffic), so the check runs inside
    # the container against its own WORKER_PORT /ready — the same real probe the api uses, covering the
    # database, Valkey and the object store from the container that would actually use them.
    # The `$$` is a Compose escape, not a typo: Compose interpolates `${...}` in healthcheck.test before
    # the container ever sees it, and an unescaped `$` here fails `docker compose config` outright.
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "process.exit((await fetch(`http://localhost:$${process.env.WORKER_PORT ?? 3001}/ready`)).ok ? 0 : 1)",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  # GAP-086 / M29 §4.11 — the MLLP LISTENER, a SIBLING process to `api` (crash isolation: a route crash never drops a
  # listener, a listener crash never drops the API). OFF by default on two independent levers: the compose PROFILE
  # (`docker compose --profile hl7-listener up -d hl7-listener`) and `M29_MLLP_LISTENER_ENABLED=true`. It runs no workers and
  # serves only /health + /ready on LISTENER_HEALTH_PORT. Feed ports come from `external_feed.port` (the reserved 11000-11999
  # range, D3); publish only the ports your partners use, on a PRIVATE address (never the public ingress) — widen the mapping
  # below in a compose override. deploy.sh does not roll this service: recreate it explicitly after a release.
  hl7-listener:
    profiles: ["hl7-listener"]
    image: ${CHARTWARDEN_IMAGE:?set immutable GHCR image in .env.production}
    pull_policy: always
    mem_limit: 1g
    cpus: 1
    restart: unless-stopped
    env_file: .env.production
    command: ["bun", "run", "apps/backend/src/index.ts"]
    environment:
      PROCESS_ROLE: listener
      LISTENER_HEALTH_PORT: "3002"
      M29_MLLP_LISTENER_ENABLED: ${M29_MLLP_LISTENER_ENABLED:-false}
      # GAP-043 — when on, the worker-role watcher pages listener_down; this process then only leaves its heartbeat.
      M29_LISTENER_WATCH_ENABLED: ${M29_LISTENER_WATCH_ENABLED:-false}
      DATABASE_URL: postgresql://chartwarden_app:${CHARTWARDEN_APP_PASSWORD}@postgres:5432/${CHARTWARDEN_DB_NAME:-chartwarden}
      DATABASE_PLATFORM_URL: postgresql://chartwarden_platform_login:${CHARTWARDEN_PLATFORM_PASSWORD}@postgres:5432/${CHARTWARDEN_DB_NAME:-chartwarden}
      DATABASE_DESTRUCTION_URL: postgresql://chartwarden_destruction_login:${CHARTWARDEN_DESTRUCTION_PASSWORD}@postgres:5432/${CHARTWARDEN_DB_NAME:-chartwarden}
      REDIS_URL: redis://valkey:6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ORIGIN:?set in .env.production}
      MINIO_ACCESS_KEY: ${MINIO_APP_ACCESS_KEY:?set in .env.production}
      MINIO_SECRET_KEY: ${MINIO_APP_SECRET_KEY:?set in .env.production}
      MINIO_REGION: us-east-1
    ports:
      - "${M29_MLLP_BIND_ADDRESS:-127.0.0.1}:11000-11019:11000-11019"
    depends_on:
      provision:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "process.exit((await fetch(`http://localhost:$${process.env.LISTENER_HEALTH_PORT ?? 3002}/ready`)).ok ? 0 : 1)",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  web:
    image: ${CHARTWARDEN_WEB_IMAGE:?set immutable GHCR image in .env.production}
    pull_policy: always
    mem_limit: 128m
    cpus: 0.5
    mem_reservation: 32m
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    # F-038/#98 — likewise unchecked before. This is the static-asset tier, so the check is that nginx
    # answers for the SPA document itself; a container that starts with an empty or mis-built web root
    # is otherwise indistinguishable from a working one.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s

  # Demo reseed (reseed-demo.sh, driven by .github/workflows/reseed-production.yml). Both services sit
  # behind the `seed` profile, so `up -d` never starts them. The seeds create users through Better
  # Auth's email sign-up, which production closes (invite-only); `seed-api` is a throwaway copy of the
  # api with sign-up open and NO published port, and `seed-runner` shares its network namespace so the
  # seed scripts reach it as http://localhost:3000. reseed-demo.sh removes both when it finishes.
  seed-api:
    profiles: ["seed"]
    extends:
      service: api
    container_name: chartwarden-seed-api
    restart: "no"
    ports: !reset []
    environment:
      # BETTER_AUTH_URL is deliberately NOT overridden: it stays the https origin from .env.production,
      # because production boot (assertProductionEnv) refuses any other value. Only the seed client
      # (seed-runner below) addresses this api as http://localhost:3000.
      CHARTWARDEN_SIGNUP_REQUIRES_INVITE: "false"

  seed-runner:
    profiles: ["seed"]
    image: ${CHARTWARDEN_IMAGE:?set immutable GHCR image in .env.production}
    pull_policy: always
    mem_limit: 1g
    cpus: 1
    env_file: .env.production
    network_mode: "service:seed-api"
    command: ["bun", "run", "db:seed:all"]
    environment:
      BETTER_AUTH_URL: http://localhost:3000
      DATABASE_ADMIN_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/${CHARTWARDEN_DB_NAME:-chartwarden}
      DATABASE_URL: postgresql://chartwarden_app:${CHARTWARDEN_APP_PASSWORD}@postgres:5432/${CHARTWARDEN_DB_NAME:-chartwarden}
      DATABASE_PLATFORM_URL: postgresql://chartwarden_platform_login:${CHARTWARDEN_PLATFORM_PASSWORD}@postgres:5432/${CHARTWARDEN_DB_NAME:-chartwarden}
      REDIS_URL: redis://valkey:6379
      CHARTWARDEN_SEED_CREDENTIALS_FILE: /tmp/CREDENTIALS.production.md
      CHARTWARDEN_SEED_ALLOW_PRODUCTION: "yes-reseed-demo"
    depends_on:
      seed-api:
        condition: service_healthy
    restart: "no"

networks:
  # Dedicated clamd network (api, worker, clamav only). Not `internal`: freshclam must reach the signature mirrors.
  scan:

# Volume names are explicit (not derived from `name:` above) so the project rename keeps the live data. The prefix
# defaults to the project name, which on a fresh install gives `<project>_postgres-data` etc.; the production
# host keeps CHARTWARDEN_VOLUME_PREFIX=wardenx in .env.production so it keeps its existing `wardenx_*` volumes
# under the renamed `chartwarden` project until Window 2 copies them (volumes-copy.sh) and drops the pin.
volumes:
  postgres-data:
    name: ${CHARTWARDEN_VOLUME_PREFIX:-${CHARTWARDEN_COMPOSE_PROJECT:-chartwarden}}_postgres-data
  valkey-data:
    name: ${CHARTWARDEN_VOLUME_PREFIX:-${CHARTWARDEN_COMPOSE_PROJECT:-chartwarden}}_valkey-data
  minio-data:
    name: ${CHARTWARDEN_VOLUME_PREFIX:-${CHARTWARDEN_COMPOSE_PROJECT:-chartwarden}}_minio-data
  clamav-data:
    name: ${CHARTWARDEN_VOLUME_PREFIX:-${CHARTWARDEN_COMPOSE_PROJECT:-chartwarden}}_clamav-data
