# clamd for the M36 attachment scanner (WP 1.5). Mounted read-only over /etc/clamav/clamd.conf in the
# `clamav` sidecar (docker-compose.yml and deploy/production/compose.yml). Reachable ONLY on the compose network:
# the service publishes no host port, so 0.0.0.0 here means "the container's network", not the internet.
#
# The attachment contract is "nothing is delivered unless the scanner said clean", so every way a file can slip
# past inspection is configured to ALERT (surface as a detection -> quarantine), never to be skipped silently:
#   AlertEncrypted / AlertEncryptedArchive / AlertEncryptedDoc  password-protected content cannot be inspected
#   AlertExceedsMax                                              a file over a scan limit is flagged, not passed
#   StreamMaxLength >= 25000000                                  the upload cap (byteSize 1..25000000); the scanner
#                                                                port streams the whole object via INSTREAM
# MaxFileSize/MaxScanSize/MaxRecursion keep archive-bomb cost bounded; they must stay >= StreamMaxLength.
Foreground yes
# The image entrypoint waits for this socket before it declares clamd started.
LocalSocket /tmp/clamd.sock
TCPSocket 3310
TCPAddr 0.0.0.0
LogTime yes
LogClean no

StreamMaxLength 26M
MaxFileSize 26M
MaxScanSize 100M
MaxRecursion 16
MaxFiles 10000
MaxThreads 12
ReadTimeout 120
CommandReadTimeout 30
SendBufTimeout 200

AlertEncrypted yes
AlertEncryptedArchive yes
AlertEncryptedDoc yes
AlertExceedsMax yes
AlertOLE2Macros no
DetectPUA no
ScanPDF yes
ScanOLE2 yes
ScanArchive yes
ScanHTML yes
