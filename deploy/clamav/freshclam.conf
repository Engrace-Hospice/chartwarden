# freshclam for the ClamAV image (deploy/clamav/Dockerfile). Everything goes to stdout: `docker compose logs clamav`.
DatabaseDirectory /var/lib/clamav
DatabaseMirror database.clamav.net
DatabaseOwner clamav
ScriptedUpdates yes
LogTime yes
# clamd reloads on its own (SelfCheck, 600 s), but telling it makes a new signature live at once.
NotifyClamd /etc/clamav/clamd.conf
