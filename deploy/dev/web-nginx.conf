# DEV-ONLY nginx for the `web` service of docker-compose.yml. It serves the SPAs that Dockerfile.web builds (the
# production web image's recipe) and reverse-proxies same-origin /api, /version, /webhooks and /socket.io to `api`,
# mirroring the dev proxy in apps/web/vite.config.ts, so the browser keeps calling same-origin /api/....
# Mounted over /etc/nginx/conf.d/default.conf; edit it, then `docker compose restart web`.
#
# Deliberately not production's web-nginx.conf: no security-headers snippet (its CSP would block the http://localhost:9000
# presigned object-store previews), no per-host admin root, no 1-year asset caching.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # The container listens on 8080 but is published elsewhere; a directory redirect must not name :8080.
    absolute_redirect off;

    # Re-resolve `api` through Docker's DNS instead of once at startup, so `docker compose up -d --build api` (a new
    # container IP) needs no web restart. The variable makes nginx resolve per request and forward the URI untouched.
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $api_upstream http://api:3000;

    # Vite's proxy has no body cap or response buffering; match it (uploads, streamed AI responses).
    client_max_body_size 0;
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    location ^~ /api/ { proxy_pass $api_upstream; }
    location ^~ /webhooks/ { proxy_pass $api_upstream; }
    location = /version { proxy_pass $api_upstream; }
    # ADR-0054 realtime hints; the backend serves it only when REALTIME_ENABLED is set.
    location ^~ /socket.io/ {
        proxy_pass $api_upstream;
        proxy_read_timeout 1h;
    }

    # React Router is client-side: unresolved paths fall back to the SPA entrypoint.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The portal SPA lives under /portal/ with its own index fallback (as in production).
    location = /portal {
        return 308 /portal/;
    }

    location /portal/ {
        try_files $uri $uri/ /portal/index.html;
    }

    # A missing hashed asset (a stale tab after a rebuild) or static file is a real 404, not the HTML document
    # (production's rule, minus its caching and headers).
    location ~ ^(/portal)?/assets/ {
        try_files $uri =404;
    }

    location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        try_files $uri =404;
    }

    location ~ ^(/portal)?/index\.html$ {
        add_header Cache-Control "no-cache" always;
    }
}
